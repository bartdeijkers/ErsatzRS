[package]
name = "ersatzrs-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dunce = "1"
ersatzrs-core = { path = "../ersatzrs-core", version = "0.1.0" }
ersatzrs-domain = { path = "../ersatzrs-domain", version = "0.1.0" }
thiserror = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
