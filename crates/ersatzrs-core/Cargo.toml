[package]
name = "ersatzrs-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
jiff = "=0.2.38"
icu_collator = "=2.2.1"
icu_casemap = { version = "=2.2.0", default-features = false, features = ["compiled_data"] }
pest = "=2.9.3"
pest_derive = "=2.9.3"
regex = "1"
uuid = "1"
mlua = { version = "0.12", features = ["lua54", "vendored"] }
ersatzrs-domain = { path = "../ersatzrs-domain", version = "1.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
