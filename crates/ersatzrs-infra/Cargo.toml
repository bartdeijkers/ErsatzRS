[package]
name = "ersatzrs-infra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
base64 = "0.23"
blurhash = { version = "=0.2.3", default-features = false }
bytes = "1"
chardetng = "0.1.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
directories = "6"
dunce = "1"
ed25519-dalek = "3"
encoding_rs = "0.8.35"
ersatzrs-addon-contract = { path = "../ersatzrs-addon-contract", version = "0.4.0" }
ersatzrs-core = { path = "../ersatzrs-core", version = "1.2.0" }
ersatzrs-domain = { path = "../ersatzrs-domain", version = "1.2.0" }
ersatzrs-ffmpeg = { path = "../ersatzrs-ffmpeg", version = "1.2.0" }
flate2 = "1"
futures-util = "0.3"
getrandom = "0.4"
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
md-5 = "0.11"
minijinja = { version = "3", features = ["serde"] }
process-wrap = { version = "10.0", features = ["tokio1"] }
percent-encoding = "2"
quick-xml = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
same-file = "=1.0.6"
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
semver = "1"
sha1 = "0.11"
sha2 = "0.11"
sqlx = { workspace = true }
subtle = "2.6"
thiserror = "2"
tempfile = "3"
tar = "0.4"
tokio = { version = "1", features = ["fs", "macros", "process", "rt", "sync", "time"] }
toml = "1"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.31", default-features = false, features = ["signal"] }
rustix = { version = "=1.1.6", features = ["process"] }

[target.'cfg(windows)'.dependencies]
win32job = "=2.0.3"

[dev-dependencies]
httpmock = "0.8"
insta = { version = "1", features = ["json", "redactions"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[lints]
workspace = true
