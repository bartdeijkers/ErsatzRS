[package]
name = "ersatzrs-infra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
directories = "6"
dunce = "1"
ed25519-dalek = "3"
ersatzrs-addon-contract = { path = "../ersatzrs-addon-contract", version = "0.3.0" }
ersatzrs-core = { path = "../ersatzrs-core", version = "0.1.0" }
ersatzrs-domain = { path = "../ersatzrs-domain", version = "0.1.0" }
ersatzrs-ffmpeg = { path = "../ersatzrs-ffmpeg", version = "0.1.0" }
futures-util = "0.3"
md-5 = "0.11"
minijinja = "2"
process-wrap = { version = "9.1", features = ["tokio1"] }
percent-encoding = "2"
quick-xml = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
semver = "1"
sha2 = "0.11"
sqlx = { workspace = true }
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "process", "rt", "sync", "time"] }
toml = "1"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
httpmock = "0.8"
insta = { version = "1", features = ["json", "redactions"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
