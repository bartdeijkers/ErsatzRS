[package]
name = "ersatzrs-infra"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
mysql = ["sqlx/any", "sqlx/mysql"]
mysql-integration = ["mysql"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
directories = "6"
ersatzrs-core = { path = "../ersatzrs-core", version = "0.1.0" }
ersatzrs-domain = { path = "../ersatzrs-domain", version = "0.1.0" }
ersatzrs-ffmpeg = { path = "../ersatzrs-ffmpeg", version = "0.1.0" }
md-5 = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { workspace = true }
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "process", "rt", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
httpmock = "0.8"
insta = { version = "1", features = ["json", "redactions"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
