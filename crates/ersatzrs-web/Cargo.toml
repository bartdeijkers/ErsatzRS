[package]
name = "ersatzrs-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ersatzrs-web"
path = "src/main.rs"
required-features = ["ssr"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dunce = "1"
thiserror = "2"
tracing = "0.1"
leptos = { version = "0.8", features = ["islands"] }
leptos_router = "0.8"
leptos_meta = "0.8"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
gloo-timers = { version = "0.4", features = ["futures"] }
stylance = "0.8"
ersatzrs-domain = { path = "../ersatzrs-domain", version = "0.1.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-trait = "0.1"
ersatzrs-core = { path = "../ersatzrs-core", version = "0.1.0" }
ersatzrs-ffmpeg = { path = "../ersatzrs-ffmpeg", version = "0.1.0" }
ersatzrs-infra = { path = "../ersatzrs-infra", version = "0.1.0" }
ersatzrs-scanner = { path = "../ersatzrs-scanner", version = "0.1.0" }
ersatzrs-scheduler = { path = "../ersatzrs-scheduler", version = "0.1.0" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
# Keep axum aligned with leptos_axum and enable Multipart extraction for image upload routes.
axum = { version = "0.8", features = ["multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "fs"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
leptos_axum = "0.8"
sqlx = { workspace = true }
uuid = { version = "1", features = ["v4"] }
quick-xml = "0.40"
base64 = "0.22.1"
tempfile = "3.27.0"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
jsonschema = { version = "0.46.5", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
serde_yaml = "0.9.34"

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["macros", "sync", "time"] }
# WASM-only: file upload in islands. Feature-gated; never compiled for the SSR binary.
web-sys = { version = "0.3", features = ["Blob", "Clipboard", "DomRect", "Element", "File", "FileList", "FormData", "History", "HtmlInputElement", "Location", "Navigator", "Window"] }
gloo-net = { version = "0.7", features = ["http"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[package.metadata.stylance]
output_file = "public/bundle.css"
folders = ["./src/"]

[package.metadata.leptos]
output-name = "ersatzrs-web"
site-root = "target/site"
site-pkg-dir = "pkg"
assets-dir = "public"
site-addr = "0.0.0.0:8409"
reload-port = 3001
browserquery = "defaults"
watch = true
env = "DEV"
lib-features = ["hydrate"]
lib-default-features = false
bin-features = ["ssr"]
bin-default-features = false

[dev-dependencies]
insta = "1"
serde_urlencoded = "0.7"

[features]
default = ["ssr"]
hydrate = ["leptos/hydrate"]
ssr = ["leptos/ssr", "leptos_router/ssr", "leptos_meta/ssr"]
mysql = [
    "ersatzrs-infra/mysql",
    "ersatzrs-scanner/mysql",
    "ersatzrs-scheduler/mysql",
]
mysql-integration = [
    "mysql",
    "ersatzrs-infra/mysql-integration",
    "ersatzrs-scanner/mysql-integration",
    "ersatzrs-scheduler/mysql-integration",
]

[lints]
workspace = true
