[package]
name = "ersatzrs-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ersatzrs-web"
path = "src/main.rs"

[dependencies]
ersatzrs-ffmpeg = { path = "../ersatzrs-ffmpeg", version = "0.1.0" }
ersatzrs-infra = { path = "../ersatzrs-infra", version = "0.1.0" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
# Pinned to 0.7: leptos_axum 0.7 requires axum 0.7. Do not bump until leptos_axum is updated.
axum = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
leptos = { version = "0.7", features = ["ssr"] }
leptos_axum = "0.7"
leptos_router = { version = "0.7", features = ["ssr"] }
leptos_meta = { version = "0.7", features = ["ssr"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }

[lints]
workspace = true
