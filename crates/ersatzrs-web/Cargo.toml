[package]
name = "ersatzrs-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ersatzrs-web"
path = "src/main.rs"
required-features = ["ssr"]
# The composition-root binary has no tests; behavior is covered by the library
# and integration targets. Disabling its empty test harness also avoids MSVC
# linking the same-name rlib twice when server_fn inventory constructors exist.
test = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dunce = "1"
thiserror = "2"
tracing = "0.1"
leptos = { version = "0.8", features = ["islands"] }
leptos_router = "0.8"
leptos_meta = "0.8"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.11"
urlencoding = "2"
gloo-timers = { version = "0.4", features = ["futures"] }
stylance = "0.8"
ersatzrs-addon-contract = { path = "../ersatzrs-addon-contract", version = "0.4.0" }
ersatzrs-domain = { path = "../ersatzrs-domain", version = "1.2.0" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
icu_casemap = { version = "=2.2.0", default-features = false, features = ["compiled_data"] }
serde_urlencoded = "0.7"
async-trait = "0.1"
ersatzrs-app = { path = "../ersatzrs-app", version = "1.2.0" }
ersatzrs-core = { path = "../ersatzrs-core", version = "1.2.0" }
ersatzrs-ffmpeg = { path = "../ersatzrs-ffmpeg", version = "1.2.0" }
ersatzrs-infra = { path = "../ersatzrs-infra", version = "1.2.0" }
ersatzrs-platform = { path = "../ersatzrs-platform", version = "1.2.0" }
ersatzrs-scanner = { path = "../ersatzrs-scanner", version = "1.2.0" }
ersatzrs-scheduler = { path = "../ersatzrs-scheduler", version = "1.2.0" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
# Keep axum aligned with leptos_axum and enable Multipart extraction for image upload routes.
axum = { version = "0.8", features = ["multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "fs"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
leptos_axum = "0.8"
sqlx = { workspace = true }
uuid = { version = "1", features = ["v4"] }
quick-xml = "0.42"
# Strict XMLTV validation: quick-xml tokenization alone accepts malformed XML.
roxmltree = "0.21.1"
base64 = "0.23.0"
tempfile = "3.27.0"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
jsonschema = { version = "0.60.2", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
pulldown-cmark = "0.13.6"
ammonia = "4.2.4"
zip = { version = "9", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["macros", "sync", "time"] }
# WASM-only: file upload in islands. Feature-gated; never compiled for the SSR binary.
web-sys = { version = "0.3", features = ["Blob", "Clipboard", "Document", "DomRect", "Element", "File", "FileList", "FormData", "History", "HtmlElement", "HtmlInputElement", "HtmlVideoElement", "Location", "Navigator", "NodeList", "PointerEvent", "Storage", "Window"] }
gloo-net = { version = "0.7", features = ["http"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[package.metadata.stylance]
output_file = "public/bundle.css"
folders = ["./src/"]

[package.metadata.leptos]
output-name = "ersatzrs-web"
site-root = "target/site"
site-pkg-dir = "pkg"
# Pin content-hashing OFF deterministically. cargo-leptos can hash the wasm/js
# filenames (writing `site/pkg/hash.txt`); when the WASM build and the running
# SSR binary disagree about hashing, the server emits `/pkg/ersatzrs-web.<hash>.js`
# URLs the bundle doesn't contain (or panics reading a missing hash.txt), and the
# admin UI silently fails to hydrate. This has broken several releases. Pinning it
# here (not just via the env var in release.yml) keeps the build and the runtime
# default in agreement. The release gate `scripts/release/verify-web-bundle.sh`
# boots the assembled bundle and fails if any /pkg asset 404s.
hash-files = false
assets-dir = "public"
site-addr = "0.0.0.0:8409"
reload-port = 3001
browserquery = "defaults"
lib-features = ["hydrate"]
lib-default-features = false
bin-features = ["ssr"]
bin-default-features = false

[dev-dependencies]
insta = "1"
serde_urlencoded = "0.7"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Virtual deadline regressions are native tests, not hydration runtime features.
tokio = { version = "1", features = ["test-util"] }
# Independently validate generated troubleshooting ZIP directories and contents.
zip = { version = "9", default-features = false }

[features]
default = ["ssr"]
hydrate = ["leptos/hydrate"]
ssr = ["leptos/ssr", "leptos_router/ssr", "leptos_meta/ssr"]
# Development-only component and sample-stream routes. Compiling this feature
# is not sufficient to expose them; the runtime opt-in documented in
# `docs/reference/configuration.md` is required as well.
development-routes = []

[lints]
workspace = true
