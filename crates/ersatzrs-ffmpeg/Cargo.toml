[package]
name = "ersatzrs-ffmpeg"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ersatzrs-domain = { path = "../ersatzrs-domain", version = "0.1.0" }
ersatzrs-hwprobe = { path = "../ersatzrs-hwprobe", version = "0.1.0" }
mlua = { version = "0.11", features = ["lua54", "vendored"] }
thiserror = "2"
tokio = { version = "1", features = ["process"] }

[dev-dependencies]
insta = "1"
tokio = { version = "1", features = ["macros", "process", "rt"] }

[lints]
workspace = true
