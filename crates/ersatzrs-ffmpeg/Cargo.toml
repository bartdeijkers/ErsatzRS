[package]
name = "ersatzrs-ffmpeg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
ersatzrs-domain = { path = "../ersatzrs-domain", version = "1.2.0" }
ersatzrs-hwprobe = { path = "../ersatzrs-hwprobe", version = "1.2.0" }
flate2 = "1"
mlua = { version = "0.12", features = ["lua54", "vendored"] }
mpeg2ts-reader = "0.18.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "process", "macros", "time"] }
unicode-normalization = "0.1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
insta = "1"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "process", "rt", "sync"] }

[lints]
workspace = true
