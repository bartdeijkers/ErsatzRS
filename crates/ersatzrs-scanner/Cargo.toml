[package]
name = "ersatzrs-scanner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
ersatzrs-addon-contract = { path = "../ersatzrs-addon-contract", version = "0.2.0" }
ersatzrs-core = { path = "../ersatzrs-core", version = "0.1.0" }
ersatzrs-domain = { path = "../ersatzrs-domain", version = "0.1.0" }
ersatzrs-ffmpeg = { path = "../ersatzrs-ffmpeg", version = "0.1.0" }
ersatzrs-infra = { path = "../ersatzrs-infra", version = "0.1.0" }
futures-util = "0.3"
md-5 = "0.11"
quick-xml = { workspace = true }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
sqlx = { workspace = true }
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
httpmock = "0.8"

[features]
default = []
mysql = ["ersatzrs-infra/mysql"]
mysql-integration = ["mysql", "ersatzrs-infra/mysql-integration"]

[lib]
name = "ersatzrs_scanner"
path = "src/lib.rs"

[[bin]]
name = "ersatzrs-scanner"
path = "src/main.rs"

[lints]
workspace = true
