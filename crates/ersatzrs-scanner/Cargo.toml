[package]
name = "ersatzrs-scanner"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
ersatzrs-core = { path = "../ersatzrs-core", version = "0.1.0" }
ersatzrs-domain = { path = "../ersatzrs-domain", version = "0.1.0" }
ersatzrs-infra = { path = "../ersatzrs-infra", version = "0.1.0" }
sha2 = "0.10"
sqlx = { workspace = true }
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
httpmock = "0.8"
serde_json = "1"

[features]
default = []
mysql = ["ersatzrs-infra/mysql"]
mysql-integration = ["mysql", "ersatzrs-infra/mysql-integration"]

[lib]
name = "ersatzrs_scanner"
path = "src/lib.rs"

[[bin]]
name = "ersatzrs-scanner"
path = "src/main.rs"

[lints]
workspace = true
