[package]
name = "ersatzrs-addon-contract"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Versioned out-of-process add-on contracts for ErsatzRS"
repository = "https://github.com/bartdeijkers/ErsatzRS"
readme = "README.md"
keywords = ["ersatzrs", "addon", "media-server"]
categories = ["api-bindings"]
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.1"
url = "2"

[[bin]]
name = "ersatzrs-addon-validator"
path = "src/bin/ersatzrs-addon-validator.rs"

[lints]
workspace = true
