[package]
name = "ersatzrs-scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ersatzrs-core = { path = "../ersatzrs-core", version = "0.1.0" }
ersatzrs-ffmpeg = { path = "../ersatzrs-ffmpeg", version = "0.1.0" }
ersatzrs-infra = { path = "../ersatzrs-infra", version = "0.1.0" }
sqlx = { workspace = true }
tokio = { version = "1", features = ["signal", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[features]
default = []
mysql = ["ersatzrs-infra/mysql"]
mysql-integration = ["mysql", "ersatzrs-infra/mysql-integration"]

[lib]
name = "ersatzrs_scheduler"
path = "src/lib.rs"

[lints]
workspace = true
