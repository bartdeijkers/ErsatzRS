summary = '''
Phases 0–6 are complete: the Cargo workspace, FFmpeg pipeline, playout
scheduling engines (Block/YAML/Classic/Scripted), media-source scanning,
IPTV/HDHomeRun endpoints, and the admin UI through Trakt list integration are
in place. Phase 7 hardening adds shared database URL resolution, explicit
mediaserver bootstrap, startup readiness/downgrade/schema health reporting, and
the non-web health-check engine in ersatzrs-core::health / ersatzrs-infra::health.
'''

next_steps = '''
Broaden health / troubleshooting coverage and remaining Phase 7 hardening
items. Support pages (health/logs/troubleshooting) closed to `Ported`
2026-06-17, and the multi-collections / rerun collections / playlists /
filler presets route family closed to `Ported` 2026-06-19. FFmpeg command
generation closed to `Ported` 2026-06-20 after the encoder-only NVENC
filter-gate proof passed. HLS variant playlists / segmenter closed to `Ported`
2026-06-21 after ADR 0016's hard capacity ceiling, live readout, shared HLS /
MPEG-TS transcode counting, and playable all-streams-in-use slate were
implemented. The 2026-06-22 regression pass fixed managed FFmpeg Windows path
surfacing, fresh-database channel branding, serialized library scan queueing,
schedule item add-button hydration, and remote-stream zero-duration health
noise. HLS segmenter playback stutter around the first normalized append is
open again until live playback/TSDuck proof verifies the no-discontinuity
MPEG-TS append fix. After that proof, the next hardening candidate is ADR 0008
runtime acquisition from first-party `ErsatzRS-ffmpeg` releases (ship without
FFmpeg, download/update at startup, surface update availability on
`/system/health`). ADR 0018 (Proposed / Not implemented)
records a planned new capability — special features/extras, alternate versions,
and stream roles — whose parity slug `content-variants` will be created at its
first implementation slice (see plans/extras-alternate-versions-and-stream-roles.md).
'''

