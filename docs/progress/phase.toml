summary = '''
Phases 0–7 are complete: the workspace, baseline FFmpeg pipeline, scheduling
engines, media-source scanning, IPTV/HDHomeRun endpoints, main admin UI route
families, hardening, application-boundary extraction, stopgap closeout, and
large-module splits are in place. Phase 8 now owns the FFmpeg 9 HDR, Dolby
Vision, Vulkan/libplacebo, performance, and media-input hardening program.
