resolved    = true
resolution  = '''Locked decision: split a module only when an enumerable growth axis can sit behind thin dispatch and an exhaustive completeness gate. File size is evidence of pressure, never a selection rule by itself, and a large but cohesive state machine stays intact.

All five conditions must hold: variation follows an enumerable dimension; that dimension grows as parity expands; each variant carries a similar responsibility; a thin dispatcher or registry is natural; and compiler exhaustiveness or a registry test can prove completeness.

The reference pattern is admin localization: `admin/i18n.rs` owns `UiLanguage`, `TextKey`, registry metadata, and dispatch; `admin/languages/*.rs` owns per-language values; and `all_languages_translate_each_key` proves every language covers every key. A structural split must never move orchestration or SQL back into `ersatzrs-web`.'''

