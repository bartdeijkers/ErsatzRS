adr        = ['0018']

summary    = '''
Phase 0 foundation, Phase 1 media UI surfacing, Phase 2 local scanner extra
import/classification, and Phase 3 alternate-version linking are implemented.
`MediaItem` now has additive `ContentKind`, `SubKind`, and
`ParentMediaItemId` columns (SQLite and MySQL migrations) so scanner/provider
slices can represent primary items, extras, and alternate versions without
changing existing rows. The domain model has a closed `ContentKind` enum plus
an open subtype normalizer that canonicalizes the ErsatzTV extra
suffix/directory vocabulary and common alternate-version tokens.

The SQL-backed search contract now understands `content_kind`, `sub_kind`,
`parent_title`, `audio_title`, `subtitle_title`, and the derived
`has_commentary` predicate. Search evaluation implicitly adds
`content_kind:primary` unless a query explicitly references `content_kind`,
`sub_kind`, or `parent_title`, preserving ErsatzTV's default-invisible behavior
for extras and versions. Scheduling search projection populates the new fields
from `MediaItem`, parent metadata titles, `MediaStream.Title`, and
`Subtitle.Title`; commentary classification is deliberately conservative and
matches titles containing `commentary`, mirroring ErsatzTV's stream-selector
substring behavior. `/system/health` now includes a Search Projection readiness
row that fails if the database/build cannot support the variant and stream-role
fields.

The admin media UI now preserves the default-invisible behavior while allowing
operators to opt into variants: `/media/*` browse pages have a persisted "Show
special features / versions" toggle, variant cards render localized badges, and
movie/show/season detail pages expose linked Extras / Special Features while
artist detail pages expose linked Versions. Search and smart-collection editing
surface the new variant tokens. Server-function coverage and seeded Playwright
coverage prove hidden-by-default browse behavior, opt-in listing, detail
sections, localized badges, search help, mobile layout, and SSR/no-JS rendering.

The local scanner now imports ErsatzTV-classified extra suffixes and directories
for movie/show libraries instead of treating them as primary movies/episodes:
movie sibling suffixes such as `-trailer` and extra directories such as
`Featurettes/` become `OtherVideo` rows with `ContentKind=Extra`, normalized
`SubKind`, and folder/stem-derived `ParentMediaItemId` when a single owner is
known. Show-level extras link to the show, season-level extras link to the
season, and ambiguous/library-level extras stay typed but orphaned with
`ParentMediaItemId = NULL`.

The local scanner now also detects alternate-version title and folder tokens
for music videos, songs, and movies, including live, MTV Unplugged, acoustic,
remix, remaster, extended, director's cut, and official/studio canonical
markers. Same-work renditions are grouped by normalized base title and artist
where available; an unmarked or official/studio row remains the canonical
primary, other renditions are written as `ContentKind=AlternateVersion` with
normalized `SubKind` and `ParentMediaItemId`, and lone alternates stay typed but
unlinked instead of guessing a parent. Default-exclusion search still keeps
alternate versions hidden unless a query opts into variant fields.
'''

