summary    = '''
ADR 0018's local/provider search/UI/playback/scheduling scope is implemented
through Phase 5 plus the provider import follow-up. `MediaItem` has additive
`ContentKind`, `SubKind`, and
`ParentMediaItemId` columns (SQLite and MySQL), a closed `ContentKind` enum,
and normalized subtype tokens for ErsatzTV extras plus common alternate-version
markers.

Search and scheduling projection understand `content_kind`, `sub_kind`,
`parent_title`, `audio_title`, `subtitle_title`, and `has_commentary`, with an
implicit `content_kind:primary` filter unless a query opts into variant fields.
The health engine reports Search Projection readiness for these fields.

The admin media UI always shows variants in media browse pages, renders
localized variant badges, renders TV show/season specials as episode-style
rows, links Extras / Special Features or Versions sections from detail pages,
and surfaces the search tokens. The local scanner imports movie/show extras as
typed `OtherVideo` rows, links owner folders/stems when unambiguous, and
classifies local music-video, song, and movie alternates such as unplugged,
live, acoustic, remix, remaster, extended, and director-cut renditions while
keeping canonical primaries unchanged.

Commentary-bearing smart collections now feed channels whose preferred audio
title or custom stream selector pins commentary audio/subtitles in direct
IPTV/MPEG-TS and HLS segmenter playback. Phase 5 adds repo-owned examples and
docs for unplugged renditions, commentary movie channels, featurette pre-roll
filler, and primary movie schedule items; focused repository coverage proves
the examples resolve the intended rows, keep primaries/extras separated by
default, persist pre-roll filler wiring, and feed Classic playout inputs without
changing normal schedules. Plex/Jellyfin/Emby movie-library sync now reuses the
same classifier after each provider page, including ETag-skipped rows, so
server-reported extras from title/path/tag signals are imported as hidden
`ContentKind=Extra` rows and provider alternate versions are linked back to
their canonical primary through `ParentMediaItemId`.

The provider ETag path now matches ErsatzTV's media-server scanner state
contract: unchanged `Normal` and `RemoteOnly` items skip metadata refresh while
still contributing page data to content-variant classification;
`FileNotFound` and `Unavailable` items rescan so they can recover.

Dogfood on 2026-06-27 found and resolved the live-admin path for the documented
Unplugged smart-collection example: Music Videos library scans launched from the
admin UI now retry per-row SQLite busy/locked write contention long enough to
complete classification/linking, the exact ADR 0018 selector
`type:"music_video" AND content_kind:alternate_version AND sub_kind:unplugged`
returns the expected 38 rows in the admin UI, and an admin-UI-created MTV
Unplugged channel now runs from that smart collection with an MTV Bumpers item
after every three unplugged videos.

Closed 2026-07-01: `/media/movies/:id` now surfaces alternate movie editions
as actionable version cards and commentary audio/subtitle options as playable
troubleshooting-preview cards. The commentary links preserve
`preferredAudioTitle` and commentary `subtitleId` selections so playback uses
the intended stream role instead of only showing a cosmetic label.

ADR 0048 extends that surface with persisted collection/playlist item playback
overrides: movie-detail audio cards can open the Add To Collection/Add To
Playlist dialogs with the selected audio title/language plus matched commentary
subtitle language/mode, and scheduling copies those item preferences into
generated `PlayoutItem` rows.

ADR 0056 adds exact movie media-version and stream-index selection for schedule
and playlist entries. Dependent choices rebuild on version changes; persistence,
editors, and playout preserve the tuple; playback fails closed on stale
references; and health reports invalid pins.
'''

