summary    = '''
ADR 0018's local/provider search/UI/playback/scheduling scope is implemented
through Phase 5 plus the provider import follow-up. `MediaItem` has additive
`ContentKind`, `SubKind`, and
`ParentMediaItemId` columns (SQLite and MySQL), a closed `ContentKind` enum,
and normalized subtype tokens for ErsatzTV extras plus common alternate-version
markers.

Search and scheduling projection understand `content_kind`, `sub_kind`,
`parent_title`, `audio_title`, `subtitle_title`, and `has_commentary`, with an
implicit `content_kind:primary` filter unless a query opts into variant fields.
The health engine reports Search Projection readiness for these fields.

The admin media UI preserves hidden-by-default behavior behind a persisted
"Show special features / versions" toggle, renders localized variant badges,
links Extras / Special Features or Versions sections from detail pages, and
surfaces the search tokens. The local scanner imports movie/show extras as
typed `OtherVideo` rows, links owner folders/stems when unambiguous, and
classifies local music-video, song, and movie alternates such as unplugged,
live, acoustic, remix, remaster, extended, and director-cut renditions while
keeping canonical primaries unchanged.

Commentary-bearing smart collections now feed channels whose preferred audio
title or custom stream selector pins commentary audio/subtitles in direct
IPTV/MPEG-TS and HLS segmenter playback. Phase 5 adds repo-owned examples and
docs for unplugged renditions, commentary movie channels, featurette pre-roll
filler, and primary movie schedule items; focused repository coverage proves
the examples resolve the intended rows, keep primaries/extras separated by
default, persist pre-roll filler wiring, and feed Classic playout inputs without
changing normal schedules. Plex/Jellyfin/Emby movie-library sync now reuses the
same classifier after each provider page, including ETag-skipped rows, so
server-reported extras from title/path/tag signals are imported as hidden
`ContentKind=Extra` rows and provider alternate versions are linked back to
their canonical primary through `ParentMediaItemId`.
'''

