summary    = '''
In progress for i18n: `/settings/{ffmpeg,logging,hdhr,scanner,playout,ui,xmltv}` remain routed with ErsatzTV-shaped forms and raw HTML POST fallbacks backed by `ConfigElement`. The UI covers FFmpeg paths/default profile/language/subtitle/report/global watermark/fallback filler/HLS/custom-resolution dialog, logging subsystem levels, HDHR UUID/tuner count, scanner refresh interval, playout build options, UI theme/language, and XMLTV days/time-zone/block behavior. The persisted `pages.language` value now drives the SSR shell language and typed translations for the shell/navigation/home/not-found, settings including optional `(none)` choices and logging level option labels, `/ffmpeg`, `/search`, `/media/libraries`, `/media/sources/{local,jellyfin,emby,plex}`, shared media-source path editor, `/watermarks`, `/system/{health,logs,troubleshooting}` including log-level table labels, `/channels` including streaming-mode and preferred-audio language display labels, `/schedules` including optional language `(none)` choices and fallback collection labels, `/blocks` including the search-query placeholder and duration hour adornment, `/templates`, `/decos`, `/deco-templates`, `/playouts`, `/media/rerun-collections`, `/media/smart-collections`, and `/media/filler/presets` route families plus media season display names in search/browser/detail surfaces, with culture strings split into one translation module per language. ErsatzRS intentionally extends ErsatzTV's English, Polski, and Português (Brasil) cultures with `nl` / Nederlands; see ADR 0012. Mediaserver bootstrap seeds upstream default settings rows, and settings saves perform the ported side effects: live logging filter reload, FFmpeg runtime/capability refresh, report-folder creation, embedded-subtitle extraction queueing, playout rebuild queueing, and XMLTV refresh queueing. Full admin-route text coverage and four-language browser proof remain active i18n `ParityDebt`; see `plans/settings-parity-slice.md`.
'''
