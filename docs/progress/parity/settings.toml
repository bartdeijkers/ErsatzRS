summary    = '''
Ported: `/settings/{ffmpeg,logging,hdhr,scanner,playout,ui,xmltv}` provides ErsatzTV-shaped forms and raw HTML POST fallbacks. The ErsatzRS-only `/settings/addons` manager provides Installed, Browse, Updates, and Sources views for local Git checkouts, complete offline repository bundles, individual add-on ZIPs, package lifecycle, permissions, readiness, and optional icons. It displays the fixed checkout directory and manually rescans it; remote repository editing and catalog refresh controls no longer exist under ADR 0081. Every offered or installed add-on has a canonical `/settings/addons/{addon_id}` detail route for metadata, configuration, source offers, health, declarative panels, and explicit legacy-source adoption. Database-backed fields cover FFmpeg, logging, HDHR, scanner, playout, UI, XMLTV, and add-on behavior. On Windows, `/settings/ui` also mirrors ErsatzTV's opt-in per-user login startup: a raw POST delegates through the application runtime port to the live HKCU Run registration for packaged `ErsatzRS.exe`, distinguishes enabled/disabled/repair/unavailable states, and never stores a machine-local boolean in `ConfigElement`. Non-Windows SSR omits the control; ADR 0059 keeps Linux startup under systemd ownership.

The primary drawer exposes one Settings destination. A shared localized route-tab
component owns navigation between all settings pages and keeps add-on details
associated with Add-ons. Regular settings forms use responsive section cards
and one sticky save action without changing their raw POST contracts.

The persisted `pages.language` value drives SSR translations for every settings route in `en-us`, `pl`, `pt-br`, `nl`, `fr-fr`, `it-it`, `es-419`, and `es-es`, with one generated-registry language module per completed culture. Incomplete language drafts remain outside the registry until their file-local translation guard is removed. Mediaserver bootstrap seeds upstream defaults and prepares and, when allowed, scans the local add-on checkout directory. Saves preserve runtime side effects: logging reload, FFmpeg capability refresh, report-directory creation, embedded-subtitle extraction, playout rebuilds, XMLTV refreshes, and add-on trust/configuration changes.

Configured FFmpeg/ffprobe paths flow through the shared locator used by web and scanner execution and refresh without restart. Empty path fields mean auto-detect and show the resolved tool. The settings loader uses the correct `ChannelWatermark` table. HLS segmenter limits and MPEG-TS settings are consumed by their runtime paths. IPTV response disposal reaps add-on and FFmpeg processes after disconnect; transport proof remains in the HLS and MPEG-TS parity entries. `tests/e2e/settings-i18n.spec.ts` proves all eight settings pages in every supported culture.
ADR 0052 adds Kodi-style selectors. Contextual `und` matches null metadata and
suffixless sidecars (ErsatzTV `32e5482`).

AMM-G completes the Add-ons settings slice. `/settings/addons` exposes global
minimum and maximum waits for randomized item-detail enrichment. The positive
whole-second values default to 2 and 16, require minimum no greater than
maximum, persist across restart, and apply without restart while the
provider-host limiter continues to govern automatic and manual requests.
'''
