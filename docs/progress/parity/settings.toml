summary    = '''
Ported: `/settings/{ffmpeg,logging,hdhr,scanner,playout,ui,xmltv}` are routed with ErsatzTV-shaped forms and raw HTML POST fallbacks backed by `ConfigElement`. The UI covers FFmpeg paths/default profile/language/subtitle/report/global watermark/fallback filler/HLS/custom-resolution dialog, logging subsystem levels, HDHR UUID/tuner count, scanner refresh interval with its localized hours adornment, playout build options, UI theme/language, and XMLTV days/time-zone/block behavior. The persisted `pages.language` value drives the SSR shell language and typed translations for the settings route family in all supported cultures (`en-us`, `pl`, `pt-br`, `nl` per ADR 0012, `fr-fr` per ADR 0021), with one translation module per language. Adding a language is file-driven: its module declares metadata and `LanguageStrings`; `build.rs` generates the registry and selector. Mediaserver bootstrap seeds upstream default settings rows, and settings saves perform the ported side effects: live logging filter reload, FFmpeg runtime/capability refresh, report-folder creation, embedded-subtitle extraction queueing, playout rebuild queueing, and XMLTV refresh queueing. The configured FFmpeg/ffprobe paths are honored at execution time through the ported `FFmpegLocator` (`crates/ersatzrs-ffmpeg/src/locator.rs`), resolved and persisted at startup (`crates/ersatzrs-web/src/host/bootstrap.rs`), published into a process-wide holder every spawn site reads, and refreshed on settings save so a path change takes effect without a restart; the scanner shares the same resolver. This fixes both the previously env-only resolution (a bare `ffmpeg` never searched next to the executable, so `ffmpeg.exe` beside `ErsatzRS.exe` was not found) and the cosmetic-only DB path setting. Closed 2026-06-12: the FFmpeg path inputs no longer carry `required` — empty saves and means auto-detect, with the locator-resolved path shown as placeholder plus a localized "Leave empty to auto-detect" help line in all four cultures (SSR render regression test). The same slice fixed the silent loader failure that compounded the 2026-06-10 report: `load_ffmpeg_settings_with_pool` queried a non-existent `"Watermark"` table (the ErsatzTV schema name is `ChannelWatermark`), so the whole `/settings/ffmpeg` form silently rendered defaults — persisted paths showed as empty and the global-watermark select was always empty (regression test added). Also closed 2026-06-12: the "3 concurrent transcode sessions" observation was root-caused — ErsatzTV at the pin has no session-limit `ConfigElement` ("2 by default" matches only the advertised-only `hdhr.tuner_count` default), and its structural per-channel cap was already ported; the real divergence was response disposal (`IptvController` `RegisterForDispose`): ErsatzRS leaked the wrapped-`.ts` remux on viewer disconnect because killing the MPEG-TS-script shell orphaned its FFmpeg grandchild while an unbounded stderr-tail wait kept the pipes open. Now ported in `crates/ersatzrs-web/src/transport/iptv/stream.rs` via a response-body dispose guard plus a bounded stderr-tail wait so dropped pipe ends reap grandchildren; regression-tested and live-proven (1 transcode + 1 remux per viewer, ~3 s teardown on FIN and RST disconnects, segmenter idle-out after). The HLS segmenter idle timeout, work-ahead limit, initial segment count, and default MPEG-TS script are consumed by streaming runtime paths; transport runtime proof is tracked in `hls-variant-playlists-segmenter.toml` and `mpeg-ts-channel-streaming.toml`. Closed 2026-06-15: `tests/e2e/settings-i18n.spec.ts` switches `pages.language` through every supported culture and proves all seven settings routes render translated headings, labels, save actions, and no alert or hydration errors without English fallback leakage outside intentional technical values, including the scanner interval unit.
ADR 0052 adds Kodi-style selectors. Contextual `und` matches null metadata and
suffixless sidecars (ErsatzTV `32e5482`).
'''

