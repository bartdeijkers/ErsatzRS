description = 'P1: Reject a playout build when filtering unknown or durationless finite Remote Streams leaves any required scheduling source empty; otherwise Reset or accepted Refresh can clear the existing timeline without replacement.'
discovered  = '2026-08-30'
evidence    = 'Resolved on 2026-08-30: `PlayoutBuilder::build` snapshots populated primary Classic schedule sources before `drop_unschedulable_remote_streams` and refuses the build if filtering empties one, matching ErsatzTV `CheckForEmptyCollections` while leaving pre-existing empty sources and optional filler/fallback behavior unchanged. Core regressions cover Reset, Refresh, and non-fatal optional filler; infra regression `reset_and_refresh_preserve_timeline_when_filter_empties_required_source` exercises the production maintenance path and proves both destructive modes preserve the exact existing `PlayoutItem` rows while recording a failed build status.'
resolved    = true

