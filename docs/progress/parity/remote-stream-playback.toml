feature    = 'Remote Stream playback'
etv_source = '`$ERSATZTV_SRC/ErsatzTV/Controllers/InternalController.cs`; `$ERSATZTV_SRC/ErsatzTV.Core/Scheduling/PlayoutModeSchedulerFlood.cs`'
rs_target  = '`crates/ersatzrs-infra/src/remote_stream.rs`; `crates/ersatzrs-web/src/transport/iptv/stream.rs`; `crates/ersatzrs-infra/src/hls_worker.rs`'
status     = 'Ported'
adr        = ['0057', '0063', '0066']

summary    = '''
Remote Stream playout resolves a persisted direct URL or an enabled installed
add-on instead of opening its YAML `MediaFile`. URL input uses bounded network
reads and HTTP reconnect options. Add-on commands come only from an
integrity-checked signed package, receive declared settings and managed
FFmpeg/ffprobe paths through a host-owned environment, and pipe media stdout
directly into the managed consumer process. FFmpeg and ffprobe detect the
producer container from its bytes, matching ErsatzTV's format-agnostic loopback
endpoint while retaining MPEG-TS producer support. Windows batch entrypoints use
an exact raw `cmd.exe` command line so quoted package paths survive the platform
process boundary. The standalone Beeld & Geluid package implementations follow
fresh Server Action and CloudFront-cookie discovery, then select one HLS
video/audio rendition pair so MPEG-TS output has stable video-then-audio order.
The yt-dlp add-on keeps yt-dlp an operator-supplied tool while requiring the
ErsatzRS-managed FFmpeg runtime and preserving provider-specific request
headers.
IPTV and HLS share this resolver and cancellation ownership. Producer failures
log safe surface/channel/seek context and a sanitized 2 KiB stderr tail; URLs,
credentials, cookies, control characters, and local paths are removed. Consumer
exit and ffprobe timeouts reap stalled producers; cancellation and consumer pipe
closure remain debug events. Diagnostics and health never run or retry the
producer.

Live and finite sources have distinct timing behavior. RTSP is forced live,
live inputs start at zero without read-rate pacing, and current live Remote
Streams force HLS realtime admission instead of work-ahead. Liveness is
evaluated at the actual HLS transcode cursor so a future live item is not
captured before its scheduled start. Finite add-on playback receives the source
offset through `ERSATZRS_REMOTE_STREAM_SEEK`; the consumer removes its duplicate
post-input seek while the producer owns source-side seeking. Configured or
probed duration feeds scheduling.
Classic Flood expands a zero-duration Remote Stream to the next fixed boundary
or hard stop and persists the expanded duration on the PlayoutItem.

The Remote Stream health check is side-effect-free: it validates persisted
definitions without contacting URLs or executing add-ons, fails malformed or
legacy script state, reports missing/disabled/incompatible packages, and warns
when a finite source has no usable duration.

Evidence:
- Resolver/parser/reconnect/redaction/direct-pipe, transcode-cursor liveness,
  producer-container auto-detection, installed-content verification, Windows
  batch quoting, single-pair Beeld & Geluid mapping, managed-FFmpeg yt-dlp
  extraction, producer-side seeking, stalled-producer cancellation, structured
  context, secret/path sanitation, and bounded UTF-8 stderr-tail tests:
  `./run.sh test -p ersatzrs-infra remote_stream`.
- Existing Windows runtime proof for the same yt-dlp/FFmpeg producer path tuned
  a finite video at its midpoint in under four seconds, and the actual HLS
  channel returned a 12-second H.264/AC-3 sample with valid video and six-channel
  audio. Package-level Windows rich-metadata proof remains tracked in the
  playlist parity record.
- ADR 0063 FFmpeg 9 compatibility: Beeld & Geluid remains a stream-copy
  producer and the shared consumer pipeline emits `-fps_mode` rather than the
  removed `-vsync` option.
- ffprobe timeout cancellation:
  `./run.sh test -p ersatzrs-infra remote_probe_timeout_cancels_stalled_producer`.
- Scanner persistence and invalid-sibling isolation: `./run.sh test -p ersatzrs-scanner remote_stream_scan_persists_definition_metadata_and_continues_after_invalid_yaml`.
- Flood duration regression: `./run.sh test -p ersatzrs-core classic_flood_expands_zero_duration_remote_stream_to_hard_stop`.
- Playlist type and UI proof are tracked by `remote-streams-browser.toml`.
'''
