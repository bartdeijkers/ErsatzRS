id          = 'unschedulable-remote-stream-fails-whole-build'
description = 'A Remote Stream with unknown playback behavior, or a finite one without a positive duration, aborted the entire playout build instead of being dropped from its collection, so one unusable item left its channel with no playout items and nothing to stream.'
discovered  = '2026-08-28'
evidence    = 'Found in a live database: one Beeld & Geluid episode out of 83 resolved with `Liveness = 0` and no duration, and its channel failed every build with "Remote Stream 4395 has unknown playback behavior". ErsatzTV `PlayoutBuilder.CheckForEmptyCollections` instead logs and removes each zero-duration item (the `isZero` arm covers `RemoteStream` when both the media version duration and `rs.Duration` are absent or zero) and keeps scheduling; only a collection left with no items at all stops the build. Resolved by `drop_unschedulable_remote_streams` in `crates/ersatzrs-core/src/playout_builder.rs`, which removes those items from every reference-data collection and reports each removal as a playout build warning. Regression `one_unschedulable_remote_stream_does_not_block_its_collection` proves a mixed collection still schedules its healthy items.'
resolved    = true

