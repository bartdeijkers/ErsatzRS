summary    = '''
Ported (Phase 7): `/playouts` `#[island]` with right-aligned action bar (Add Playout dropdown → Classic/Block/Sequential/Scripted/JSON add routes + Reset All Playouts), searchable paged playouts table ordered by `Channel.SortNumber` with per-kind row actions (Edit links, Refresh|Reset build dispatch, Schedule Reset dialog, Delete confirm, Edit External Json dialog), per-row build spinner driven by a shared `EntityLocker` poll, build-failure row highlighting + alert, and a paged playout-detail table (items + gaps, `Finish >= now`, Show Filler toggle persisted to `pages.playouts.detail_show_filler`, `GetDisplayTitle`-parity titles, `GetDisplayDuration` formatting, per-item Troubleshoot dialog enriching Classic/Block scheduling context). `/playouts/add[/{Kind}]` ports `PlayoutEditor.razor` with channel disabling for existing playouts, Classic program schedule selection, Block caption, file-backed ExternalJson/Sequential/Scripted schedule fields, HTML POST fallback, create-handler validation, insert, and initial reset-build enqueue. `/playouts/{classic,block,scripted}/:id` ports the top-level editor shells. `/playouts/{id}/alternate-schedules` and `/playouts/{id}/templates` port the nested Classic/Block editors with ErsatzTV-shaped desktop and mobile action bars, icon-only row actions, localized day/month summaries and selectors, Weekdays/Weekends helpers, disabled date fields when range filtering is off, and the Block Preview Calendar branch. Classic saves the final row as the default `ProgramScheduleId`, while Block replaces `PlayoutTemplate` rows and stamps `DateUpdated`. Reset/Reset-All enqueue `PlayoutBuildRequest`s consumed by the shared scheduler (Classic → Refresh, Block/Sequential/Scripted → Reset). The earlier ErsatzRS-only SVG timeline was removed in favour of the ErsatzTV detail table. Visible labels, actions, dialogs, add/editor fields, nested filters, and empty states use the persisted-language i18n layer across four cultures.
'''
