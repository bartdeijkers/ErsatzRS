id          = 'addon-list-media-kind-is-list-wide'
description = 'The per-item media kind is stored and supplied by the add-ons but never surfaced: administration exposes only the list-wide override, and that override wins where the item value should. The item must own its classification, with the list-wide value retained only as an explicit bulk default.'
discovered  = '2026-08-19'
evidence    = '`AddonMediaListItem.ContentKind` exists since migration 202608151200 and `save_list_items` already persists the value each add-on enumerates, but `list_items` never read it, the add dialog and list editor only exposed `AddonMediaList.ContentKindOverride`, and `save_item_nfo` chose the NFO root from the list-wide value, so a mixed list wrote every entry under one root. The item value is now read, wins for its own NFO root, and is editable per row; the list-wide control became an explicit Apply to all items bulk default. `AddonMediaListContentKind` gained Song and Image, which the frozen add-on wire contract cannot express and therefore sends as Auto.'
resolved    = true
adr         = '0073'
resolution  = 'Each entry owns its classification in storage, in the NFO root it writes, and in administration; the list-wide value is only a bulk default.'

