summary = '''
Completed in Phase 8D/8E through milestones P8D-01 through P8E-03. ADR 0065
owns playlist identity, bounded enumeration, atomic sidecars, managed-file
ownership, playout invalidation, health, localized administration, and optional
sync-owned ordered playlists. ADR 0066 now owns execution: manifests select an
installed, enabled add-on with `remote-stream.list.v1` and
`remote-stream.play.v1`; raw commands and the named extractor setting are
rejected.

The host validates local offers, immutable packages, capabilities, settings,
compatibility, and hashes before bounded invocation. ADR 0081 makes repository
acquisition an operator-owned Git checkout or offline bundle with no host
catalog request. A network-free scanner regression proves definitions, tag
facets, and upstream order. The separate official repository packages POSIX
and Windows entrypoints for the operator-supplied yt-dlp adapter. Beeld &
Geluid is retired under ADR 0092. Its implementation and proof described below
are historical; provider-neutral behavior remains active.
ADR 0068 keeps provider and language knowledge in add-ons while the host
generically projects v2 metadata to managed NFO sidecars and supports exact
Local replacements for explicitly unavailable list items. Historical Beeld &
Geluid enumeration supplied rich metadata; scanner and XMLTV regressions
prove persistence, search facets, and compatible Kodi/EPG projection. Version
0.5.0 of the official Beeld & Geluid add-on recognizes public personal lists,
series and programme pages, individual episodes, and filtered searches. It
follows every result page without a fixed page ceiling, preserves first-seen
provider order, imports series introductions and artwork, and deduplicates by
stable episode ID. ADR 0070 adds atomically validated operator chapters: the
full episode and structured child fragments remain independently selectable,
with exact whole-second playback bounds and duplicate-free refresh.
ADR 0071 adds a reversible television-show presentation over the same scanned
Remote Stream versions, disk-authoritative show/item NFO editing, dedicated
per-item administration, and item-scoped chapter refresh. Projected episodes
remain normal scheduling identities while add-on playback stays operational.
Beeld & Geluid and yt-dlp media-list items can now carry Remote Stream URLs;
the host materializes one managed playlist manifest and Local library per
saved list below the add-on's profile-relative storage root, without requiring
Python or permanently downloading the media. Provider classification keywords,
localized package text, icons, and fixtures remain in the separate add-on
repository. The scanner materializes the first declared item image beside its
generated definition as a bounded, manifest-host-validated JPEG, PNG, or WebP
file. Its sidecar hash preserves operator replacements, skips unchanged artwork
on refresh, and lets one failed image leave the rest of the list intact. Every
library projection now replaces the NFO's supported facet, credit, identifier,
and thumbnail rows on its distinct metadata record; Remote Stream metadata
continues to be scanner-owned.
ADR 0078 now carries explicit Unknown, Finite, or Live behavior through reviewed
add-on-list publication, generated definitions, scanner persistence, managed
playlist membership, schedule validation, IPTV, and HLS. Unknown is refused;
live items use zero-seek realtime handling and only Classic/Flood schedules
that provide a deterministic boundary.

Milestone crf-02 closes the Windows scan-impact defect. Stable and effective
metadata deltas resolve current dependencies; reorders stay playlist-scoped
and durable intents survive restart. A marker spans generated-file mutation,
database commit, and sidecar publication. SQLite and MySQL host-path proofs
preserve shuffled Classic continuity and unrelated state; aggregate health
reports stale or failed work.
'''

