feature    = 'Remote Stream playlists'
etv_source = '`$ERSATZTV_SRC/ErsatzTV.Core/Streaming/YamlRemoteStreamDefinition.cs` has no playlist-ingestion equivalent; this is an ErsatzRS extension'
rs_target  = '`crates/ersatzrs-addon-contract`, `crates/ersatzrs-infra/src/{addons,remote_stream}.rs`, `crates/ersatzrs-scanner`, `crates/ersatzrs-web`, and the separate official add-ons repository'
status     = 'In progress'
adr        = ['0065', '0066', '0068']

summary = '''
Completed in Phase 8D/8E through milestones P8D-01 through P8E-03. ADR 0065
owns playlist identity, bounded enumeration, atomic sidecars, managed-file
ownership, playout invalidation, health, localized administration, and optional
sync-owned ordered playlists. ADR 0066 now owns execution: manifests select an
installed, enabled add-on with `remote-stream.list.v1` and
`remote-stream.play.v1`; raw commands and the named extractor setting are
rejected.

The host verifies signed catalogs, immutable packages, declared capabilities,
settings, host/RID compatibility, and installed-content hashes before bounded
out-of-process invocation. A network-free scanner regression proves generated
definitions, tag facets, and upstream order through the real scheduling
repository. The separate official repository packages standalone POSIX and
Windows Beeld & Geluid implementations plus an operator-supplied yt-dlp adapter.
ADR 0068 keeps provider and language knowledge in add-ons while the host
generically projects v2 metadata to managed NFO sidecars and supports exact
Local replacements for explicitly unavailable list items. Beeld & Geluid
enumeration preserves plot, full original broadcast timestamp,
Kijkwijzer advice, distinct genre/subject labels, collection, role-aware people,
producer, and original/current broadcasters. Scanner and XMLTV regressions
prove persistence, search facets, and compatible Kodi/EPG projection. Version
0.4.0 of the official Beeld &
Geluid add-on also accepts public user-made Schatkamer lists, preserving their
item order while retaining unavailable entries for local replacement.
Beeld & Geluid and yt-dlp media-list items can now carry Remote Stream URLs;
the host materializes one managed playlist manifest and Local library per
saved list below the add-on's profile-relative storage root, without requiring
Python or permanently downloading the media. Provider classification keywords,
localized package text, icons, and fixtures remain in the separate add-on
repository.
'''

