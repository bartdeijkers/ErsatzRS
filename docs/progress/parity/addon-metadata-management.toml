evidence    = 'Redacted Windows dogfood left a 165-item list in Publishing with an intact journal and previous-revision backup, no failed-publication intermediate directory, and no persisted ReviewError. The publication overlapped a scheduled scan, and the beta could not distinguish request cancellation from a Windows sharing violation. AMM-J-01 now persists exact-revision publication/recovery jobs, coordinates all current managed-library scan origins through one lease, fences expired workers, resumes child scans, retries recovery indefinitely with capped backoff, and adopts legacy stranded journals on upgrade. AMM-J-02 implements operation-owned revision markers, byte-isolated backups, resumable partial swaps, dropped-process cleanup, bounded Windows sharing retry, pre-sealed full-tree fingerprints, a persisted post-swap verification scan, exact logical SQLite/filesystem convergence, active-journal writer fencing, and cleanup-before-terminal-state finalization; POSIX fault injection, legacy restart states, and a file-backed SQLite restart pass. Native Windows x64 Nextest run d2dd956d-3d6e-4fb0-abaa-76929c31d72b passed the held-handle retry-loop regression at exact commit 9196c4f831ce68ddcc6a7784bfff746a3040f6a5. AMM-J-03 adds media-list.list.v6 typed authentication/restriction outcomes in the official yt-dlp add-on, excludes only inaccessible items without valid replacements from the attempted revision, preserves the prior published snapshot until explicit Publish, exposes generation-fenced Retry/Restore actions and the same redacted durable state in Health, and locks edits only under an owner-matched live lease. Focused Rust tests and six Chromium/Firefox scenarios pass, including no-JavaScript restore and restricted-item publication. AMM-J-03 is complete; AMM-N-03 retains the integrated packaged Windows restart proof, and AMM-J-04 owns the bounded redacted causal event stream. Tracked by AMM-J and plans/addon-list-publication-recovery.md.'
resolved    = true
resolution  = 'AMM-J-01 through AMM-J-04 make publication durable, restart-safe, recoverable, item-scoped for provider restrictions, and observable through one bounded redacted causal history. The integrated packaged Windows restart repetition remains an AMM-N-03 closeout gate rather than unresolved implementation debt.'

