[[debt]]
id          = 'addon-preparation-readmission-context'
description = 'UX follow-up W31: when provider details change review-gated availability after successful publication, the new saved revision asks for Prepare again without explaining the changed draft or possible reuse of existing prepared media.'
discovered  = '2026-09-12'
resolved    = false
adr         = '0091'
evidence    = 'Independent real walkthrough: publication revision1 completes from saved draft6; included-item details then change Availability and create draft7. A single Prepare completes a revision7 receipt in about1.1s using the SAME artifact, with one file and unchanged size/hash/mtime/inode. Exact-revision selection and current runtime/tool validation are intentional; no duplicate transfer occurred. Both reviewers withdrew the incidental-Publish-bump and duplicate-download defect hypotheses. Suggested improvement: explain the changed draft and revalidation step using existing state; do not promise cached reuse before admission or bypass exact-revision safety. Milestone amm-m-01b records the proof.'

[[debt]]
id          = 'retained-option-schema-evolution'
description = 'P2: an add-on update changing its options declaration conflicts with the immutable schema registered for the same capability; options saves and preparation cannot adopt the changed schema.'
discovered  = '2026-09-12'
resolved    = false
adr         = '0085'
evidence    = 'Cross-review traced register_option_schema_in_tx and the unique AddonId/CapabilityId constraint. A01 preserves existing list creation on this mismatch without replacing retained defaults. Schema evolution is outside A01-A05; do not silently reinterpret published options.'

[[debt]]
id          = 'retained-input-preparation-failure-stage'
description = 'Identify the failing retained-input startup stage without exposing provider URLs, headers or raw diagnostics.'
discovered  = '2026-09-06'
resolved    = false
adr         = '0087'
evidence    = 'Historical adapter HLS and the first native real-host probe expose only a generic item-operation failure. PublishedIntervalSource and package error mapping still collapse distinct startup stages. A bounded native-only diagnostic identifies the new native failure as the 4 MiB output limit rejecting valid 7.1 MB metadata; the focused limit/codec-label fix allows the actual native baseline to pass. That diagnosis does not establish the old adapter cause or implement safe stage reporting. Preserve a minimal static stage/outcome without raw provider fields when closing this debt.'

[[debt]]
id          = 'provider-lease-release-retains-unstarted-operation-delay'
description = 'A queued caption operation can retain the former provider lease deadline after early release, delaying publication readiness beyond the actual provider cooldown.'
discovered  = '2026-09-11'
adr         = '0085'
resolved    = false
evidence    = '''
AMM-N-03 owns the retained subtitle-probe evidence and its synchronization fix.
Interval metadata completed while the unattempted caption operation remained
queued until the original 90-second provider lease deadline; the released
provider-host cooldown was only six seconds. Source review confirms that
defer_unstarted persists the admission deadline and early provider release does
not shorten it. This is bounded, user-visible preparation latency, not a failed
operation or a playback interruption. Record it as non-blocking follow-up rather
than claiming the longer test wait removes the delay. Any correction must retain
actual provider cooldowns, Retry-After deadlines and execution fencing; it must
not indiscriminately reset deferred work to run immediately. No production
scheduling change is included in the N-03 acceptance-probe correction.
'''
