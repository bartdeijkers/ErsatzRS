summary = '''
ADR 0075 adds provider-neutral drafts with NFOs, frozen contracts,
provider/override snapshots, durable inclusion, atomic publication, localization,
artwork and health. ADR 0092 retired Beeld & Geluid; prior results are historical.
yt-dlp remains the updateable extraction engine; its mapper translates full
yt-dlp JSON. Saved drafts can be republished across supported library types
without provider reruns; projection changes preserve snapshots, order,
inclusion and overrides.
Television drafts provide row editing, atomic provider-order numbering and
bounded/date-gap assignments; bulk media-kind/playback edits share one-step undo.
AMM-F implements ADR 0078: Remote Stream remains the live-or-on-demand type and
one provider-neutral unknown/finite/live value now crosses the frozen add-on
contract, provider and operator snapshots, Publish, refresh, generated
definitions, scanner persistence, editor, scheduling, health, IPTV/HLS, and the
cross-platform yt-dlp package. Unknown is never guessed as finite and live
items are admitted only where a deterministic live boundary is available.
AMM-G (ADR 0079): paginated discovery precedes publication; durable optional
details share a randomized provider-host limiter. Localized 2–16 second defaults
apply without restart and preserve cooldowns. The editor supports manual imports,
detail jobs and accessible numbering. Historical G-06/G-07 evidence covers retained
unavailable items, the seven-URL matrix, provider order/identity, live/finite
behavior and invalid-output rejection. Retry preserves operator state and replaces
only an incomplete generation. NSF live acceptance covers publication, scheduling,
playout, MPEG-TS and HLS.
AMM-H closes Windows television-cardinality regressions with canonical artwork,
deterministic reads, restart-safe exact-duplicate repairs and aggregate health.
AMM-I closes the import/review UX gaps under `amm-i-01`.
After Windows dogfood exposed a stranded journal, AMM-J-01 adds restart-safe
exact-revision jobs, shared managed-library leases, and legacy-journal adoption.
AMM-J-02 completes atomic recovery, including native Windows held-handle proof
at exact commit `9196c4f`. AMM-J-03 implements typed
provider-neutral access restrictions, item-scoped publication exclusion,
redacted durable status, and guarded localized Retry/Restore actions for the
hydrated and no-JavaScript editor. Focused acceptance is complete; AMM-N-03
retains the integrated packaged Windows restart proof.
AMM-J-04 and AMM-K close recovery and lifecycle. AMM-L completes cadences,
transactional skip-known discovery, omission-safe rich headers, non-destructive
reconciliation, and scheduler-only validated-additions publication with exact
revision fences, retry-safe preparation, and localized Activity/Health holds.
AMM-M-01A is Complete under ADRs 0087/0088; its milestone owns the options,
real MPEG-TS/HLS cut and cancellation evidence. Native yt-dlp replaces the
Range adapter and remains preferred in later slices. HDR/unmapped-subtitle refusals
remain explicit; static startup-stage diagnostics remain non-blocking debt.
M-01B delivers the native Stream/Download ahead/New videos only select, with a
visible UTC cutoff renewed on re-enabling. Published playback stays frozen;
existing videos stream and enabled SponsorBlock applies in every mode.
M-02 completes ADR 0052 manual primary/fallback captions, revision-pinned files
and aligned MPEG-TS/transcoded HLS captions in both delivery modes. Its milestone
owns evidence. M-03 is complete; N-01 is pushed with green CI (see milestone):
permission-reviewed yt-dlp -U, playback-first deferral and offline crash recovery.
A01-A10 and the confirmed walkthrough publication/setup defects are fixed locally;
M-01B is complete. N-01B retains broader responsive/accessibility closeout.
N-02 evidence is retained; N-01B blocks closeout. N-03 owns native ZIP/playback proof;
Packaged browser-profile and release gates are open.
'''

