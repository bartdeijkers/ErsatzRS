feature    = 'Reviewable add-on metadata management'
etv_source = 'ErsatzRS product extension; ErsatzTV has no repository-installed add-on draft equivalent'
rs_target  = '`ersatzrs-addon-contract`, add-on list application/repository boundaries, the shared admin metadata editor, scanner publication, health, and the official add-ons repository'
status     = 'In progress'
adr        = ['0068', '0073', '0075', '0078', '0079', '0085']

summary = '''
ADR 0075 implements a provider-neutral metadata draft with generated parent
NFOs, frozen contracts, provider/override snapshots, durable
inclusion, atomic publication, the localized editor, artwork materialization,
health, and both official providers. yt-dlp remains the updateable extraction
engine; its mapper only translates full yt-dlp JSON. Existing imports can be
republished as any supported library type
without rerunning the provider; the snapshot, order, inclusion, and overrides
remain the control plane while only the projection changes.
Television drafts provide direct row editing plus atomic, provider-order
numbering from any included item. Bounded or date-gap-detected assignments and
responsive bulk media-kind/playback edits share one-step undo.
AMM-F implements ADR 0078: Remote Stream remains the live-or-on-demand type and
one provider-neutral unknown/finite/live value now crosses the frozen add-on
contract, provider and operator snapshots, Publish, refresh, generated
definitions, scanner persistence, editor, scheduling, health, IPTV/HLS, and the
cross-platform yt-dlp package. Unknown is never guessed as finite and live
items are admitted only where a deterministic live boundary is available.
AMM-G implements ADR 0079: bounded paginated overview discovery persists and
resumes before a complete draft may publish, retaining title, first-air date,
thumbnail, descriptions, and provider order without item-detail calls. Details
then use durable post-publication one-item jobs and one shared randomized
provider-host limiter across automatic and manual requests. Its global positive
whole-second minimum and maximum are localized settings that default to 2 and
16, apply to later samples without restart, and never shorten a persisted
cooldown. Manual-only imports, per-item fetch actions, durable progress, stable
number/date/season-episode columns, and exact accessible bulk-numbering cues are
implemented for the shared editor and both official providers. AMM-G-06 retains
explicitly unavailable Beeld & Geluid episodes without detail requests, and
AMM-G-07 closes the official seven-URL matrix. Direct yt-dlp objects become
one-item lists with Live/Finite behavior intact; aggregate provider order,
identity, and query parameters survive pagination; invalid output cannot become
a successful empty draft. Localized Retry replaces only an incomplete provider
generation while retaining operator state, and the NSF live browser acceptance
proves publication, scheduling, playout, MPEG-TS, and HLS delivery.
AMM-H closed the Windows dogfood television-cardinality regression. Artwork
candidates are canonicalized before replacement, television and admin reads
select one deterministic non-empty artwork winner, and narrow restart-safe
SQLite/MySQL repairs remove only safe exact duplicates. Aggregate health and
runtime-audit diagnostics plus a 27-episode browser proof keep the invariant
visible without exposing media paths.
AMM-I closes the import/review UX gaps under `amm-i-01`.
After Windows dogfood exposed a stranded journal, AMM-J-01 adds restart-safe
exact-revision jobs, shared managed-library leases, and legacy-journal adoption.
AMM-J-02 completes atomic recovery, including native Windows held-handle proof
at exact commit `9196c4f`. AMM-J-03 implements typed
provider-neutral access restrictions, item-scoped publication exclusion,
redacted durable status, and guarded localized Retry/Restore actions for the
hydrated and no-JavaScript editor. Focused acceptance is complete; AMM-N-03
retains the integrated packaged Windows restart proof.
AMM-J-04 and AMM-K close recovery and lifecycle. AMM-L completes cadences,
transactional skip-known discovery, omission-safe rich headers, non-destructive
reconciliation, and scheduler-only validated-additions publication with exact
revision fences, retry-safe preparation, and localized Activity/Health holds.
AMM-M-01 access/artifact work is in progress; preparation/playback and AMM-N remain.
'''

