discovered  = '2026-09-23'
adr         = '0098'
evidence    = 'Exact NCalcSync 5.12.0 probes across invariant/en-US/nl-NL/tr-TR demonstrate deployment-sensitive string comparisons and numeric/date conversions. The maintainer accepted ADR 0098 on 2026-09-23; 238 focused core/SQL tests passed, followed by 19 expression/atomic-failure tests after eager literal validation was added. Eight profile regressions passed in each of four separate language-environment processes. Dependency audit passed. Native MPEG-TS/HLS smoke and decoded Unicode-selected chapter playback pass, including persisted fractional fallback intervals. On 2026-10-01 the maintainer approved outstanding ARM/macOS application proof as explicit unverified acceptance debt under UCU-09; Linux x64 and Windows x64 checks remain required. See ADR 0098, UCU-09 and ucu-arm-macos-application-acceptance in the catch-up parity record.'
