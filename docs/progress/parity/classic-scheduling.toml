feature    = 'Classic scheduling'
etv_source = '`$ERSATZTV_SRC/ErsatzTV.Core/Scheduling/`'
rs_target  = '`crates/ersatzrs-core`, `crates/ersatzrs-infra`'
status     = 'In progress'
adr        = ['0010', '0020']

summary    = '''
The Classic baseline covers engine dispatch, SQL loading, typed items,
collections, filler, anchors, fill groups, and scheduling-context persistence.
Regressions cover filler placement and whole-item advancement.

Continue-build continuation fixes (2026-06-08): `apply_build_result` now persists `result.anchor` (the post-build anchor) instead of the stale input `playout.anchor`; previously the anchor row was deleted on every build, so each periodic Continue build restarted from `now` and stacked overlapping `PlayoutItem` rows over the live window. Mirrored ErsatzTV `PlayoutBuilder.BuildPlayoutItems` `trimBefore = playoutStart.AddHours(-4)`: the Classic engine's `remove_before` is now `request.start - 4h` rather than `state.current_time`, which (once the anchor persists) would have deleted the entire scheduled timeline on the next Continue build.

Continue-build seam fix (2026-06-14): the Classic engine now clamps the persisted continue anchor to the finish of the last generated item when an item overshoots a build hard-stop boundary. This preserves ErsatzTV's accepted future overshoot item while preventing the next Continue build from re-adding the same item at the boundary.

Shuffled collection fix (2026-06-14): Classic shuffled media collections now mirror `ShuffledMediaCollectionEnumerator.MoveNext` by remembering the previous cycle's tail item and advancing the reshuffle seed until the next cycle starts with a different media item. Runtime localization with a direct cyclic calibration playout showed HLS Segmenter and the modern MPEG-TS wrapper can advance a 1->2->3 persisted timeline correctly; a separate fresh-HOME Classic HLS startup replay was tracked and fixed under `hls-variant-playlists-segmenter`.

Reopened 2026-06-27 from MTV channel dogfood: Classic can build and serve the channel, but the dogfood schedule exposed three remaining scheduling-quality gaps. Resolved 2026-06-28: Duration items with post-roll filler now advance through the full filler block, shuffled music-video output spreads repeated artist IDs when possible, and dynamic programming before a daily fixed block now starts before the fixed anchor.

Verified 2026-07-19 from Windows MTV dogfood: Classic already preserves the intended semantics of two ordered schedule items, `Multiple (3)` followed by `One`. Regression `classic_multiple_then_one_repeats_three_to_one_sequence_on_refresh` proves a Refresh rebuild emits three primary items followed by one bumper and repeats that sequence without producing filler rows; the live regression was schedule topology, not a Classic scheduler semantic defect.

Frozen-shuffle fix (2026-07-27): Reset now regenerates and persists `Playout.seed`, mirroring `ResetPlayout()`. Refresh rejects end-of-horizon playout state and undated Continue anchors, accepting only dated checkpoints aligned with the rebuild day. Random draws with replacement; RandomRotation uses scalable grouped ordering and persists cycle-predecessor state across Continue seams; the other randomized orders are distinct; and `RandomStartPoint` matches upstream scope. See the playback-order debt and ADR 0010.

Cross-playout fix (2026-08-02): SQLite/MySQL assign new Classic state IDs, matching upstream EF. Strict inserts cannot replace another playout's state; duplicate sources share one enumerator. Startup Refreshes invalid playouts, Continue rechecks, health reports failures, and tests cover both backends.

Resolved 2026-08-24: Classic persists complete versioned initial/day
checkpoints plus undated Continue state. Restarted Refresh restores schedule,
source, fill-group, Smart Shuffle, Random, and Random Rotation state, while
stable playback identity prevents consumed replay after membership changes.
Preflight refuses incomplete or legacy state before clearing, reports it in
build/health status, and requires Reset. SQLite/MySQL replacement is atomic.
'''

[[debt]]
id          = 'classic-refresh-has-no-production-checkpoint-anchor'
description = 'Generate and restore dated Classic day checkpoints in real builds so Refresh cannot restart shuffled or enumerated media from the beginning.'
discovered  = '2026-08-23'
adr         = '0020'
evidence    = 'Resolved by `PlayoutClassicCheckpoint`, chunked initial/day-seam generation, exact full-set preflight, stable source-order reconciliation, startup refusal, and Classic Playout State health reporting. Regressions cover fresh multi-day generation, duplicate sources, shuffled schedule order, membership add/remove, Shuffle/Random/RandomRotation restart equivalence with mutable setting re-stamping, continuation-only refusal without row deletion, safe startup repair, SQLite idempotency, and the paired MySQL migration/repository path.'
resolved    = true

[[debt]]
id          = 'playout-local-runtime-state-primary-keys'
description = 'Classic generated anchor and fill-group IDs from playout-local maxima and persisted them with REPLACE, allowing a later playout to delete another playout state on a global primary-key collision.'
discovered  = '2026-08-02'
evidence    = 'Resolved by database-assigned identities, strict transactional inserts, source-key deduplication, startup and Continue audits, the Classic Playout State health check, and multi-playout SQLite/MySQL regressions. Live diagnosis showed earlier channels losing all anchors while later channels owned the colliding low IDs; the affected channel then restarted shuffled collection state and scheduled repeated movies.'
resolved    = true

[[debt]]
id          = 'continue-build-seam-overlap'
description = 'Continue builds can re-add one future item at a daily hard-stop boundary because anchor.next_start tracks the boundary instead of the prior item finish.'
discovered  = '2026-06-08'
evidence    = 'classic-scheduling summary: one stray item per build around the future seam until ErsatzTV multi-day build loop with continue-anchors is ported.'
resolved    = true

