[[debt]]
id          = 'checkpoint-date-loses-sub-tick-precision'
description = 'Classic checkpoints were captured at full nanosecond precision, but `PlayoutClassicCheckpoint."CheckpointDate"` is stored at .NET tick precision while the same instant inside `"Context"` is serialized by serde at nanosecond precision, so the two disagreed after a database round trip and every Refresh following a Reset was refused.'
discovered  = '2026-08-28'
adr         = '0020'
evidence    = 'Found in a live database: the persisted column read `2026-08-28 07:39:57.8810339` while the checkpoint context carried `2026-08-28T07:39:57.881033940Z`, so `audit_classic_refresh_checkpoint` failed its `context.anchor.next_start == checkpoint.checkpoint_date` equality check and refused with "checkpoint date and scheduler continuation time do not match". Every channel stopped streaming once its built window elapsed, because the playout could only ever be built once per Reset. Resolved by flooring the captured checkpoint instant to tick precision in `capture_checkpoint`, so the column and the context describe the same instant. Regression `classic_refresh_survives_checkpoint_round_trip_at_sub_tick_precision` (ersatzrs-infra/tests/scan_refresh_continuity.rs) drives two consecutive persisted builds from a sub-tick timestamp; the existing Classic checkpoint tests all use whole-second fixtures, where the truncation is lossless, and could not catch this.'
resolved    = true

