summary    = '''
The Classic baseline covers engine dispatch, SQL loading, typed items,
collections, filler, anchors, fill groups, and scheduling-context persistence.
Regressions cover filler placement and whole-item advancement.
UCU-16 is accepted on 2026-11-13: discard, real groups/resume, immutable
chapters, persisted Random Count and ADR0098 fallback. Milestone ucu-16 owns
required proof/delivery; separate deterministic-profile debt is unchanged.

Continue-build fix (2026-06-08): persist the post-build anchor and trim only
before `request.start - 4h`, preserving future items without overlap.

Continue-build seam fix (2026-06-14): clamp continuation to the last emitted
finish, preserving the accepted overshoot item without repeating it on Continue.

Shuffled collection fix (2026-06-14): Classic shuffled media collections now mirror `ShuffledMediaCollectionEnumerator.MoveNext` by remembering the previous cycle's tail item and advancing the reshuffle seed until the next cycle starts with a different media item. Runtime localization with a direct cyclic calibration playout showed HLS Segmenter and the modern MPEG-TS wrapper can advance a 1->2->3 persisted timeline correctly; a separate fresh-HOME Classic HLS startup replay was tracked and fixed under `hls-variant-playlists-segmenter`.

Reopened 2026-06-27 from MTV channel dogfood: Classic can build and serve the channel, but the dogfood schedule exposed three remaining scheduling-quality gaps. Resolved 2026-06-28: Duration items with post-roll filler now advance through the full filler block, shuffled music-video output spreads repeated artist IDs when possible, and dynamic programming before a daily fixed block now starts before the fixed anchor.

Windows dogfood (2026-07-19): the regression proves Multiple (3) then One
keeps the intended three-primary/one-bumper sequence across Refresh.

Frozen-shuffle fix (2026-07-27): Reset regenerates the seed; Refresh accepts
only aligned dated checkpoints. Random draws with replacement, RandomRotation
persists cycle predecessors, and Continue preserves both. ADR 0010 owns the
adaptation and Random Start Point semantics.

Upstream rows 69-71 (2026-09-25): Classic playlist children honor Random Start
Point, and explicit Started state distinguishes unplayed anchored sources from
played sources whose index wrapped to zero. All three SQLite enumerator state
tables persist the flag; legacy rows default false. Rebuilding a started
playlist reproduces seeded child offsets and replays its saved index.
Row 85 completes collection-key identity with RerunCollectionId; distinct rerun
sources no longer share progress. Same-day earliest complete checkpoints already
preserve playlist and synthetic keys. Three-week playlist restart/Refresh and
separate rerun sources have production SQLite proof; ambiguous legacy state
fails preflight without clearing rows. UCU-05 owns acceptance evidence.

Row 77: the flat enumerator accepts saved indices through the full item count.
Continue retains inactive alternate anchors; the active-state audit permits
them. Core and SQLite regressions pass. Multipart grouping remains open below.

Cross-playout fix (2026-08-02): SQLite/MySQL assign new Classic state IDs, matching upstream EF. Strict inserts cannot replace another playout's state; duplicate sources share one enumerator. Startup Refreshes invalid playouts, Continue rechecks, health reports failures, and tests cover both backends.

Resolved 2026-08-24: Classic persists complete versioned initial/day
checkpoints plus undated Continue state. Restarted Refresh restores schedule,
source, fill-group, Smart Shuffle, Random, and Random Rotation state, while
stable playback identity prevents consumed replay after membership changes.
Preflight refuses incomplete or legacy state before clearing, reports it in
build/health status, and requires Reset. SQLite/MySQL replacement is atomic.
Row 57 aligns the chapter oracle and NaN/signed-zero behavior with NCalcSync 6.2.0.
'''

