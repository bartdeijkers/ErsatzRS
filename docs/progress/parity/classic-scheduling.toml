evidence    = 'Resolved for Shuffle/ShuffleInOrder/Random/RandomRotation: Shuffle is a flat exhaustive permutation; ShuffleInOrder/MultiEpisodeShuffle keep show/artist distance; Random performs deterministic draws with replacement; and RandomRotation randomizes within groups while preserving group separation across cycles and persisted Continue seams. Regressions include classic_shuffle_in_order_and_shuffle_produce_different_orders, classic_random_draws_with_replacement_and_differs_from_shuffle, classic_random_continue_matches_uninterrupted_draws, and the classic_random_rotation_* family (classic/mod.rs). Remaining: Marathon stays aliased to its existing seeded order pending marathon_group_by/marathon_shuffle_items wiring; MultiEpisodeShuffle awaits part-number metadata; and persisted schedule flags keep_multi_part_episodes_together/treat_collections_as_shows still do not reach SchedulingReferenceData.'
resolved    = true

