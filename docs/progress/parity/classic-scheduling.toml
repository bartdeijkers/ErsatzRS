evidence    = 'Resolved 2026-06-28: Duration scheduling now advances `CurrentTime` to the end of the full scheduled block, including post-roll filler, mirroring ErsatzTV `PlayoutModeSchedulerDuration` using `itemEndTimeWithFiller`. Regression `classic_duration_post_roll_advances_before_next_primary` proves a 30-minute duration block schedules 10-minute content + 5-minute post-roll filler, then starts the next primary after the filler instead of at the same timestamp.'
resolved    = true

[[debt]]
id          = 'music-video-shuffle-artist-distance'
description = 'Classic shuffled multi-collection scheduling does not prevent music videos from the same artist from being scheduled adjacent or too close together.'
discovered  = '2026-06-27'
evidence    = 'Resolved 2026-06-28: `SchedulingMediaItem` now carries `artist_id` from `MusicVideo.ArtistId`, and Classic shuffled enumerator preparation spreads repeated artist groups when possible after the deterministic seed shuffle. Regression `classic_shuffle_spreads_same_artist_music_videos` uses the old seed-2 order that placed artist 1 adjacent and proves a six-item shuffled Multiple block has no adjacent equal artist IDs when enough other artists exist.'
resolved    = true

[[debt]]
id          = 'fixed-anchor-before-dynamic-gap'
description = 'Classic schedules that mix dynamic all-day programming before a daily fixed item can start generated playout rows at the fixed item, leaving no active item before the anchor.'
discovered  = '2026-06-27'
evidence    = 'Resolved 2026-06-28: Classic start-state bootstrapping now mirrors ErsatzTV `FindStartAnchor` by starting from the first ordered schedule item instead of pre-seeking to the first fixed item. Regression `classic_dynamic_item_before_fixed_anchor_fills_pre_anchor_window` proves a dynamic Flood item before a strict 22:00 fixed item fills a pre-anchor build window instead of generating no rows until the fixed block.'
resolved    = true

