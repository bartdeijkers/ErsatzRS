summary    = '''
Ported for the non-web parity target: scheduling has a core-owned Lucene-like parser/evaluator and SQL-backed search documents for title/sort/original title, year/release date, added date, genre/tag/studio/actor/director/writer, media kind, show fields, season/episode numbers, metadata kind, provider GUID source fields, languages, codecs, dimensions, video bit depth/dynamic range, chapter counts, duration seconds/minutes, `addon_list`, library name/folder id, collection, content rating, network/show network, show content rating, style/mood, album, artist, and album artist. The evaluator now lowercases and accent-folds text, consumes Lucene boost syntax, handles fuzzy terms, phrase slop, numeric exact/range queries, wildcards, relative date helpers (`released_onthisday`, `released_inthelast`, `released_notinthelast`, `added_inthelast`, `added_notinthelast`), nested `smart_collection:"name"` expansion with cycle guards, and jump-letter page maps for pageable results. Show, season, and artist hits expand to playable children. `/search?query=...` resolves the same scheduling search source used by add-on list and smart-collection Search actions. Elasticsearch is deliberately dropped; future Tantivy-style indexing is an optional internal optimization, not a parity requirement.

Closed 2026-06-13: the documented ErsatzTV smart-collection search contract at `https://ersatztv.org/docs/search/`, as implemented by `$ERSATZTV_SRC/ErsatzTV.Infrastructure/Search/{LuceneSearchIndex.cs,SearchQueryParser.cs,CustomMultiFieldQueryParser.cs}`, is covered for the fields and helpers used by smart collections. Focused parser/evaluator and repository tests cover the newly hydrated fields, relative date helpers, and nested smart-collection expansion/cycle behavior. Profile-copy proof for the maintainer `Music Videos` smart collection now matches the direct-SQL expected count: 377 pruned library-3 music videos, with excluded artists omitted. Chromium and Firefox browser proof followed the `/media/smart-collections` Search action to `/search?query=...` and rendered `377 Music Videos`.

ADR 0062 makes content rating, studio, music label, explicit/stream language,
genre, and tag uniform across every media document. `music_label:` is public;
`language_tag:` uses canonical codes while `language:` exposes names.

ADR 0083 keeps `/search` results-first: common media-kind, genre, and year
filters project through the same typed search AST, while the exact canonical
query can be handed to the dedicated smart-collection composer. The core AST
owns canonical formatting and boolean precedence; the web UI does not persist
a second filter representation. Canonical formatting now preserves Text,
Phrase, Wildcard, and Fuzzy value kinds across structured edits, while initial
projection and durable saves reject incomplete branches. Named reusable queries
store that same canonical string as authoring drafts separate from smart
collections.

Historical production visual review, 2026-08-30 (consolidated 2026-09-19):
Chromium/Firefox search at 1280x720 and 390x844 and composer at 1280x720 and
320x800 covered mobile drawer closure/inertness, distinct localized Add All
collection/playlist names, visible query fields, count chips, header reflow and
saved-query labels. Dark-theme helper contrast measured about 6.49:1 and primary
button text 4.82:1. collections.spec.ts and search-see-all.spec.ts retain the
executable query handoff, save and hydrated/no-JS regressions. No deceptive
patterns were found in that review. Limits: screenshots were English/dark-theme
with synthetic artwork; light contrast was source-reviewed only, and no
all-culture image/real-library cropping acceptance was claimed.
'''

