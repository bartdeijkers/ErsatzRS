summary    = '''
Ported for the non-web parity target: scheduling has a core-owned Lucene-like parser/evaluator and SQL-backed search documents for title/sort/original title, year/release date, added date, genre/tag/studio/actor/director/writer, media kind, show fields, season/episode numbers, metadata kind, provider GUID source fields, languages, codecs, dimensions, video bit depth/dynamic range, chapter counts, duration seconds/minutes, `trakt_list`, library name/folder id, collection, content rating, network/show network, show content rating, style/mood, album, artist, and album artist. The evaluator now lowercases and accent-folds text, consumes Lucene boost syntax, handles fuzzy terms, phrase slop, numeric exact/range queries, wildcards, relative date helpers (`released_onthisday`, `released_inthelast`, `released_notinthelast`, `added_inthelast`, `added_notinthelast`), nested `smart_collection:"name"` expansion with cycle guards, and jump-letter page maps for pageable results. Show, season, and artist hits expand to playable children. `/search?query=...` resolves the same scheduling search source used by Trakt list and smart-collection Search actions. Elasticsearch is deliberately dropped; future Tantivy-style indexing is an optional internal optimization, not a parity requirement.

Closed 2026-06-13: the documented ErsatzTV smart-collection search contract at `https://ersatztv.org/docs/search/`, as implemented by `$ERSATZTV_SRC/ErsatzTV.Infrastructure/Search/{LuceneSearchIndex.cs,SearchQueryParser.cs,CustomMultiFieldQueryParser.cs}`, is covered for the fields and helpers used by smart collections. Focused parser/evaluator and repository tests cover the newly hydrated fields, relative date helpers, and nested smart-collection expansion/cycle behavior. Profile-copy proof for the maintainer `Music Videos` smart collection now matches the direct-SQL expected count: 377 pruned library-3 music videos, with excluded artists omitted. Chromium and Firefox browser proof followed the `/media/smart-collections` Search action to `/search?query=...` and rendered `377 Music Videos`.

ADR 0062 makes content rating, studio, music label, explicit/stream language,
genre, and tag uniform across every media document. `music_label:` is public;
`language_tag:` uses canonical codes while `language:` exposes names.
'''
