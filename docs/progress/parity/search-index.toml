summary    = '''
Ported for the non-web parity target: scheduling has a core-owned Lucene-like parser/evaluator and SQL-backed search documents for title/sort/original title, year/release date, genre/tag/studio/actor/director/writer, media kind, show fields, season/episode numbers, metadata kind, provider GUID source fields, languages, codecs, dimensions, chapter counts, duration seconds/minutes, and `trakt_list`. The evaluator now lowercases and accent-folds text, consumes Lucene boost syntax, handles fuzzy terms, phrase slop, numeric exact/range queries, wildcards, and jump-letter page maps for pageable results. Show, season, and artist hits expand to playable children. `/search?query=...` resolves the same scheduling search source used by Trakt list Search actions. Elasticsearch is deliberately dropped; future Tantivy-style indexing is an optional internal optimization, not a parity requirement.

Remaining `ParityDebt` (expanded 2026-06-13): full Lucene smart-collection parity is the next search goal after the smart-collection admin UI is fixed. ErsatzRS does not yet implement the full ErsatzTV search contract documented at `https://ersatztv.org/docs/search/` and defined by `$ERSATZTV_SRC/ErsatzTV.Infrastructure/Search/{LuceneSearchIndex.cs,SearchQueryParser.cs,CustomMultiFieldQueryParser.cs}`. Missing or incomplete coverage includes documented field hydration for `library_name`, `library_folder_id`, `collection`, `content_rating`, `network`, `show_network`, `show_content_rating`, `style`, `mood`, `album`, `artist`, `album_artist`, `video_bit_depth`, `video_dynamic_range`, `added_date`, relative date helpers (`released_onthisday`, `released_inthelast`, `released_notinthelast`, `added_inthelast`, `added_notinthelast`), and nested `smart_collection:"name"` expansion/cycle handling. Live profile proof on 2026-06-13: the `Music Videos` smart collection query should return 377 pruned library-3 music videos by direct SQL, but `/search` returned 699 and included excluded artists such as Alice in Chains.
'''

[[debt]]
id          = 'lucene-smart-collection-query-language'
description = 'Search does not yet support the full documented ErsatzTV Lucene field/query contract used by smart collections.'
discovered  = '2026-06-13'
evidence    = 'Official docs at https://ersatztv.org/docs/search/ and ErsatzTV SearchQueryParser/LuceneSearchIndex list fields and smart_collection expansion that are not fully implemented in ErsatzRS. Live profile copy: Music Videos query with NOT artist clauses should return 377 but /search returned 699 and included excluded artists.'
