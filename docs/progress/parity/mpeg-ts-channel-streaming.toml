summary    = '''
Ported: `/iptv/channel/{number}.ts` resolves the active PlayoutItem through
`MediaVersion`/`MediaFile`, applies provider path replacements, selects
persisted subtitles with playout-item overrides falling back to channel
language/mode preferences, expands ISO aliases (`nl`/`nld`/`dut`, etc.),
honors `ffmpeg.use_embedded_subtitles`, requires extracted text embedded
subtitles outside HLS-direct, and streams MPEG-TS from FFmpeg with
`kill_on_drop` cleanup. Text subtitles burn through FFmpeg `subtitles=` with
the extracted font cache; image subtitles are scaled/padded and centered.

Both ErsatzTV `.ts` behaviors are ported. Empty/mixed `.ts` mode resolves the
channel streaming setting, HLS-configured channels redirect to `.m3u8`,
`mode=ts` selects the modern hybrid wrapper, and `mode=ts-legacy` selects the
legacy concat branch. The modern wrapper starts/touches the HLS segmenter,
reads `/iptv/channel/{n}.m3u8?mode=segmenter[&access_token=...]`, emits the
upstream copy-all/readrate/mpegts stdout shape with ErsatzRS CBR mux-rate and
20 ms PCR-period hardening so FFmpeg emits regular PCR, and selects the AAC-LATM decoder when
the profile requires it. The legacy branch ports ErsatzTV's
`ConcatChannel` model with a realtime concat-demuxer command over internal
`/ffmpeg/concat/{n}` and `/ffmpeg/stream/{n}` routes, preserving the upstream
initial-discontinuity output shape while applying the same mux-rate/PCR-period
hardening. Direct transcode-to-MPEG-TS output shares that muxing helper, so the
`.ts` routes do not rely on HLS-specific stabilization. Command snapshots prove
the wrapper and legacy concat paths stay observably different.

The MPEG-TS script hook mirrors ErsatzTV for the modern wrapper path. Packaged
`assets/Scripts/MpegTs/{mpegts.yml,run.sh,run.bat}` resources seed the default
script without overwriting user edits; custom script YAML uses the ErsatzTV
field names and renders `HlsUrl`, `ChannelName`, `FFmpegPath`, `MuxRate`, and
`PcrPeriod`. Configured script IDs match folder names without regard to case,
including Unicode one-character case mappings. Invalid scripts warn and fall
back to the built-in wrapper. Row 91 supplies the upstream ETV_HLS_URL,
ETV_CHANNEL_NAME and ETV_FFMPEG_PATH environment contract to avoid Windows
batch-file Unicode decoding failures. Unmodified packaged scripts upgrade;
custom template variables and edited scripts remain supported. UCU-06 owns
the focused script, upgrade and Windows/Unix playback evidence.

Mirror channels resolve active media from their generated source at
`wall clock - PlayoutOffset`, then project item times back onto the target
timeline. FFmpeg profile, branding, selectors, watermarks, and language choices
continue to come from the requested target channel.

Runtime proof: The 2026-06-29 TSDuck gate passed all 86 checks across direct,
legacy, HLS-direct and hybrid paths after mux timing was unified, with zero
continuity-counter/PTS/DTS/PCR-leap faults. Legacy, hybrid and HLS-direct
`pcrverify` checks reported zero jitter faults. HLS Segmenter stitched jitter
remains informational because of real discontinuity markers.

Live add-on proof: On 2026-08-17, the transport-mode resolver was corrected so
channels configured for Transport Stream Hybrid and explicit `mode=ts`
requests select the documented HLS segmenter wrapper instead of legacy concat.
A 45-second TSDuck capture of the Teleac user-profile channel crossed two
adjacent Beeld & Geluid Remote Stream items and reported 307,772 packets, 2,241
PCR samples, and zero continuity-counter, PTS, DTS, PCR-leap, sync, or
transport errors.

ParityDebt:
- FFmpeg 9's single-request HTTP reader mishandles chunked EOF in legacy concat.
  Per-entry multiple_requests=1 fixes the synthetic handoff: five HTTP requests
  and 20.497 seconds of real-server calibration playback without transport faults.
  The original provider case remains unconfirmed; hybrid routing is unchanged.
'''

