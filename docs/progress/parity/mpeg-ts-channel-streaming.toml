summary    = '''
Ported: `/iptv/channel/{number}.ts` resolves the active PlayoutItem through
`MediaVersion`/`MediaFile`, applies provider path replacements, selects
persisted subtitles with playout-item overrides falling back to channel
language/mode preferences, expands ISO aliases (`nl`/`nld`/`dut`, etc.),
honors `ffmpeg.use_embedded_subtitles`, requires extracted text embedded
subtitles outside HLS-direct, and streams MPEG-TS from FFmpeg with
`kill_on_drop` cleanup. Text subtitles burn through FFmpeg `subtitles=` with
the extracted font cache; image subtitles are scaled/padded and centered.

Both ErsatzTV `.ts` behaviors are ported. Empty/mixed `.ts` mode resolves the
channel streaming setting, HLS-configured channels redirect to `.m3u8`,
`mode=ts` selects the modern hybrid wrapper, and `mode=ts-legacy` selects the
legacy concat branch. The modern wrapper starts/touches the HLS segmenter,
reads `/iptv/channel/{n}.m3u8?mode=segmenter[&access_token=...]`, emits the
upstream copy-all/readrate/mpegts stdout shape with an ErsatzRS CBR mux-rate
hardening so FFmpeg emits regular PCR, and selects the AAC-LATM decoder when
the profile requires it. The legacy branch ports ErsatzTV's
`ConcatChannel` model with a realtime concat-demuxer command over internal
`/ffmpeg/concat/{n}` and `/ffmpeg/stream/{n}` routes, preserving the upstream
initial-discontinuity output shape. Command snapshots prove the wrapper and
legacy concat paths stay observably different.

The MPEG-TS script hook mirrors ErsatzTV for the modern wrapper path. Packaged
`assets/Scripts/MpegTs/{mpegts.yml,run.sh,run.bat}` resources seed
`<AppDataFolder>/scripts/mpegts/default` without overwriting user edits;
`ffmpeg.default_mpegts_script` resolves
`<AppDataFolder>/scripts/mpegts/{id}/mpegts.yml`; the ErsatzTV YAML shape is
parsed with `serde_yaml`; `HlsUrl`, `ChannelName`, `FFmpegPath`, and `MuxRate`
render into the platform script; Unix executes through `bash`; Windows executes
the rendered `.bat`; invalid scripts warn and fall back to the default wrapper.
Startup upgrades only byte-for-byte unchanged legacy default `run.sh`/`run.bat`
files to the mux-rate-aware script, preserving user edits.

Runtime proof: 2026-06-08 bounded 65-second captures of channel 1 modern
wrapper (`mode=ts`) and legacy concat (`mode=ts-legacy`) each produced readable
HEVC video plus AAC audio under ffprobe. 2026-06-15 TSDuck proof verified the
legacy concat/internal stream bounds `StreamingMode.TransportStream` FFmpeg
processes to the selected `PlayoutItem` remaining duration, capped by persisted
`Finish` and `OutPoint`: `scripts/e2e/tsduck-playback-gate.sh --seconds 24
--item-seconds 6 --frames --keep gate` passed all 85 TSDuck/container checks
across `mode=ts-legacy`, `mode=ts`, HLS Segmenter, and HLS Direct, with kept
legacy frames advancing from clip 1 to clips 2 and 3 at 6-second boundaries.
On 2026-06-24, after adding the profile-derived default wrapper mux rate,
`scripts/e2e/tsduck-playback-gate.sh gate` passed all 86 checks: the hybrid
wrapper reported zero continuity-counter/PTS/DTS/PCR faults and `pcrverify`
reported 1,030 PCR OK / 0 jitter faults.
'''
