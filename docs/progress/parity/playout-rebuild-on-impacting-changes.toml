[[debt]]
id          = 'classic-refresh-appends-instead-of-rebuilding'
adr         = '0020'
description = 'The scheduler core now consumes `request.mode` for classic playouts and treats `Refresh` as a clear-and-rebuild request for classic, YAML, and scripted engines. Classic `Refresh` ignores the stale main anchor, retains same-day checkpoint anchors by content key, and uses those anchors to preserve enumerator/shuffle continuity while re-stamping generated items.'
discovered  = '2026-07-01'
evidence    = 'Source review against pinned `PlayoutBuilder.cs`: `RefreshPlayout` sets `ClearItems=true`, nulls the main anchor, and retains checkpoint anchors; `ResetPlayout` clears anchors. ErsatzRS mirrors this in `classic/mod.rs` with mode-aware state selection, retained checkpoint-anchor persistence, and a regression asserting checkpoint media order plus re-stamped subtitle mode. `yaml.rs` and `scripted.rs` now also set `clear_items` for `Refresh`. Verification commands are intentionally deferred until after gap 3 per the sequential goal.'
resolved    = true

[[debt]]
id          = 'reset-playout-must-rewrite-near-term-items'
adr         = '0020'
description = 'Clicking "Reset Playout" rewrites all items in the build window, including near-term/already-scheduled items, instead of only appending future ones. For classic playouts the button maps to `Refresh` (`server_fns/playouts.rs`, mirroring `Playouts.razor`), and classic `Refresh` now clears/rebuilds the generated window so operators can force current settings onto content already on the timeline (only the on-air segment itself may legitimately wait for its next item boundary). Reset Playout and Reset All Playouts now clear and rebuild the whole window so the change is visible on the next item.'
discovered  = '2026-07-01'
evidence    = 'Source review against pinned `Playouts.razor`: ErsatzTV maps classic Reset Playout to `PlayoutBuildMode.Refresh` and all other per-row resets to `Reset`; ErsatzRS now centralizes and tests the same mapping, and Reset All skips ExternalJson/None while mapping classic to `Refresh` and block/sequential/scripted to `Reset`. The maintenance regression `requested_classic_refresh_rewrites_near_term_playout_items` proves the queued classic Refresh clears stale near-term rows and rebuilds them with updated item-level playback data. Verification commands are intentionally deferred until after gap 3 per the sequential goal.'
resolved    = true
