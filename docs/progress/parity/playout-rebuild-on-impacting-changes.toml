feature    = 'Playout rebuild on impacting changes'
etv_source = '`ErsatzTV.Core/Scheduling/PlayoutBuilder.cs` (RefreshPlayout/ResetPlayout), `ErsatzTV.Application/ProgramSchedules/Commands/*Handler.cs` (BuildPlayout Refresh), `ErsatzTV.Application/Channels/Commands/UpdateChannelHandler.cs`, `ErsatzTV/Pages/Playouts.razor`'
rs_target  = '`crates/ersatzrs-core/src/scheduling/classic/mod.rs`, `crates/ersatzrs-core/src/scheduling/{yaml.rs,scripted.rs}`, `crates/ersatzrs-infra/src/maintenance.rs`, `crates/ersatzrs-web/src/admin/server_fns/{channels.rs,schedules.rs,playouts.rs,media_browser.rs}`'
status     = 'In progress'
adr        = ['0020']
summary    = '''
Proposed by ADR 0020: rebuild the impacted playouts whenever a change can alter
what a playout's items should contain, so already-scheduled `PlayoutItem` rows
pick up new settings instead of only being appended past. Playout items bake a
snapshot of settings at build time (subtitle mode, preferred subtitle/audio
language and title, watermark/graphics/deco, filler, resolved media), and stream
generation reads item overrides before falling back to channel settings.
Channel edits enqueue no playout build, matching ErsatzTV's
`UpdateChannelHandler`; explicit per-playout and Reset All requests are queued
reliably and expose queued/building activity to the admin UI. The classic engine now consumes
`request.mode`, so classic `Refresh` clears and rebuilds the window the way
ErsatzTV `RefreshPlayout` does.

Reopened 2026-08-23; Classic continuity was completed by crf-01 on 2026-08-24.
Content-triggered Refresh now requires and restores a complete production
checkpoint, so it cannot silently rewind deterministic scheduling, and unsafe
legacy state is refused before rows are cleared. Remote Stream scan impact is
still selected globally instead of from actual schedule/library dependencies,
so crf-02 remains open to prevent unrelated rebuild requests.
'''

[[debt]]
id          = 'scan-triggered-classic-refresh-can-replay-aired-media'
adr         = '0020'
description = 'Make a content-triggered Classic Refresh reproduce uninterrupted scheduling state instead of clearing the window and replaying media that has already aired.'
discovered  = '2026-08-23'
evidence    = 'The replay half is resolved by crf-01: production-generated complete checkpoints survive repository restart, match uninterrupted Shuffle/Random/RandomRotation identities and contexts, re-stamp settings, reconcile membership, and refuse unsafe legacy state without deleting the window. Dependency over-selection remains recorded separately in remote-stream-playlists and milestone crf-02.'
resolved    = true

