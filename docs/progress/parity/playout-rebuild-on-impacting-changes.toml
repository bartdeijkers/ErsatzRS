summary    = '''
Row292 accepts scan-triggered Next refresh and missing-caption AV continuity
under ADR0136. Milestone ucu-16-continuation owns the runtime proof.

ADR0020 rebuilds impacted playouts for changed tracks, watermarks and graphics,
filler and media. Playback prefers captured item settings. Channel edits do not
enqueue a build, matching ErsatzTV. Per-playout and Reset All requests queue with
progress visible in the admin UI. Classic `Refresh` clears and rebuilds its
window through `request.mode`.

Classic continuity was completed by crf-01 on 2026-08-24.
Content-triggered Refresh now requires and restores a complete production
checkpoint, so it cannot silently rewind deterministic scheduling, and unsafe
legacy state is refused before rows are cleared. Remote Stream scan impact is
still selected globally instead of from actual schedule/library dependencies,
so crf-02 remains open to prevent unrelated rebuild requests.

Finding 06 also corrects Next refresh-failure handling: retain the running
producer and retry its snapshot publication with bounded attempts and backoff.
Fresh snapshot acknowledgements now gate build success and durable Refresh completion;
publication readers share the committed build phase without admitting another
builder. All four internal schedulers now retain complete programmes beyond a
conservative prefetch horizon, including configured leading mirrors, and use an
earlier publication deadline. Decoded native/Next handover now passes for Classic
Scripted, Block and YAML synthetic programmes, including full openings and
old/new audio. Accepted local evidence and platform limits live in v111-findings-06.
Internal schedulers expose localized explicit Continue/Refresh/Reset controls
with preservation enabled by default. Matched Chromium/Firefox checks cover exact
requests, cancellation and responsive English/Dutch rendering, plus existing
status polling, no-JS status and list/detail workflows.
Explicit Classic Continue refuses incomplete saved state instead of silently
promoting to Refresh; admission, preservation and translation checks pass.
External JSON candidate reconciliation now preserves absolute programme clocks
and validates append-only or programme-preserving changes against an accepted
baseline. Snapshot persistence and playback/guide consumption have migration,
restart, source-loss, revision/deadline and invalid-document proof. Worker
adoption covers append-only continuation, leading mirrors and retry notification.
Operator controls and localized Health recovery are implemented;
19 focused checks, strict infra/web all-target Clippy and 14 matched
Chromium/Firefox cases pass. Native External JSON handover also passes decoded
opening and audio checks without retiming or materialized rows. Source-read cancellation has lookup and whole-worker proof.
Cancelled Next writes now recheck ownership after serialization and flush;
15 focused checks retain the old manifest and admission through cleanup.
Scheduler deadlines now reach the final replacement check; 41 focused checks
cover expiry during projection/serialization, earliest-deadline coalescing and
fresh-request recovery. SQL preparation now keeps candidates private until commit,
with rollback/reopen proof. Next staging has source/mirror and timeout proof.
Candidate overlays preserve variables/template precedence. Shared full-host
preparation has selected audio/subtitle/canvas proof and coalesces live/preview
owners with mirror/timeout coverage. Reversible finalization before SQL commit
has partial-file, cancellation and storage-failure proof. Next Scripted recovery
passes decoded opening/audio proof after cancellation and retry; Block/YAML
recovery also passes. Workspace closeout, strict lint, HTTP smokes, TSDuck,
dependency audit and matched bundle verification pass. The broader feature
remains in progress only for the existing crf-02 dependency-selection scope.
'''
