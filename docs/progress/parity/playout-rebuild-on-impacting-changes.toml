feature    = 'Playout rebuild on impacting changes'
etv_source = '`ErsatzTV.Core/Scheduling/PlayoutBuilder.cs` (RefreshPlayout/ResetPlayout), `ErsatzTV.Application/ProgramSchedules/Commands/*Handler.cs` (BuildPlayout Refresh), `ErsatzTV.Application/Channels/Commands/UpdateChannelHandler.cs`, `ErsatzTV/Pages/Playouts.razor`'
rs_target  = '`crates/ersatzrs-core/src/scheduling/classic/mod.rs`, `crates/ersatzrs-core/src/scheduling/{yaml.rs,scripted.rs}`, `crates/ersatzrs-infra/src/maintenance.rs`, `crates/ersatzrs-web/src/admin/server_fns/{channels.rs,schedules.rs,playouts.rs,media_browser.rs}`'
status     = 'Not started'
adr        = ['0020']
summary    = '''
Proposed by ADR 0020: rebuild the impacted playouts whenever a change can alter
what a playout's items should contain, so already-scheduled `PlayoutItem` rows
pick up new settings instead of only being appended past. Playout items bake a
snapshot of settings at build time (subtitle mode, preferred subtitle/audio
language and title, watermark/graphics/deco, filler, resolved media), and stream
generation reads the baked snapshot (`playout_item.subtitle_mode ?? channel`),
so a settings change is invisible until the affected items are rewritten. Today
channel edits enqueue no rebuild at all, and the classic engine ignores
`request.mode` (keying off anchor presence), so classic `Refresh` appends rather
than clearing and rebuilding the window the way ErsatzTV `RefreshPlayout` does.
'''

[[debt]]
id          = 'channel-edit-triggers-no-playout-rebuild'
adr         = '0020'
description = 'Saving a channel enqueues no playout build (`server_fns/channels.rs`), so changes to subtitle mode, preferred subtitle/audio language and title, watermark, streaming mode, FFmpeg profile, or playout offset never reach already-scheduled items. Channel edits that affect playback selection or stream shape must enqueue a Refresh for every playout on that channel.'
discovered  = '2026-07-01'
evidence    = 'Reported: channel Subtitle Mode changed Forced -> Any but a Dutch sidecar still did not burn because scheduled items kept the old mode and no rebuild was requested on channel save. Reclose only after channel save enqueues coalesced Refresh builds for impacted playouts and a test proves an upcoming item reflects the new setting.'
resolved    = false

[[debt]]
id          = 'classic-refresh-appends-instead-of-rebuilding'
adr         = '0020'
description = 'The classic scheduling engine ignores `request.mode` and branches only on `request.playout.anchor` presence, trimming items older than `now - 4h` and appending from the anchor next_start; `clear_items` is set only for Reset in yaml/scripted and never in classic. Classic `Refresh` therefore behaves like ErsatzTV `Continue` (append-only) instead of ErsatzTV `RefreshPlayout` (ClearItems=true + null main anchor + retained checkpoint anchors), so a schedule/library/channel change does not re-stamp existing classic items. Port ErsatzTV Refresh/Reset semantics to every engine, preserving enumerator/shuffle continuity across the rebuild.'
discovered  = '2026-07-01'
evidence    = 'Comparison: `PlayoutBuilder.cs` RefreshPlayout sets ClearItems=true and nulls the anchor; `scheduling/classic/mod.rs` has no `request.mode` use and `clear_items` is only `mode == Reset` in yaml.rs/scripted.rs. Reclose only after classic consumes `request.mode`, Refresh clears and rebuilds the window while preserving checkpoint anchors, and scheduler tests assert identical media order from the checkpoint with re-stamped per-item settings.'
resolved    = false

[[debt]]
id          = 'reset-playout-must-rewrite-near-term-items'
adr         = '0020'
description = 'Clicking "Reset Playout" must rewrite ALL items in the build window, including near-term/already-scheduled items, not just append future ones. For classic playouts the button maps to `Refresh` (`server_fns/playouts.rs`, mirroring `Playouts.razor`), which today does not clear near-term items, so operators cannot force current settings onto content already on the timeline (only the on-air segment itself may legitimately wait for its next item boundary). Reset Playout (and Reset All Playouts) must clear and rebuild the whole window so the change is visible on the next item.'
discovered  = '2026-07-01'
evidence    = 'Maintainer request on 2026-07-01: "clicking Reset Playout must rewrite all items, including near-term items." Reclose only after Reset Playout on a classic playout rewrites every future item in the window (not just the tail) and a browser/scheduler test proves a settings change applied via Reset appears on the next scheduled item.'
resolved    = false
