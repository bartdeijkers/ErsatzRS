ADR 0056 replaces Play links with linked
Version/Video/Audio/Subtitle selectors. Exact combinations remain pinned from
schedule/playlist insertion through editing and playback; subtitles default
to Off.

Closed 2026-07-03: collection/playlist dialogs keep the current browsing
context after success and provide a localized toast link to the destination.
Focused E2E covers single, bulk, and artist-detail add flows.

Closed 2026-07-03 for artist-detail music-video multi-select:
`/media/music/artists/:id` music-video rows (including alternate-version
rows) carry selection checkboxes feeding the shared media-browser
`SelectionToolbar` (extracted from the multi-select browser shell) with bulk
Add To Collection and Add To Playlist dialogs stamping the MusicVideo
