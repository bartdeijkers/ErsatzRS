summary    = '''
Ported for the listed types: `/media/movies`, `/media/tv/shows`, `/media/images`, `/media/music/artists`, `/media/music/songs`, `/media/other/videos`. Shared `MediaBrowserPage` with search input, `LetterBar` quick-nav, and `MediaCardPager`. Simple song/image browser titles, search placeholders, loading, and empty states now use the persisted-language i18n layer, and multi-select browser route titles/search/select aria labels use typed translations instead of English literals. Trash view at `/media/trash` covers movies/shows/artists/other-videos/songs/images, and its visible headings, actions, section links, confirmation copy, and toasts now use the persisted-language i18n layer with per-culture translation modules. The TV show detail page now includes the ErsatzTV Languages fact row by resolving distinct episode audio streams through the `GetLanguagesForShow` join and the vendored ISO-639-2 table; Add-to-Schedule enqueues the same `BuildPlayout(Refresh)` side effect ErsatzTV sends for playouts using that schedule; and visible loading/not-found/action/scan/file-state/fact/season/actor labels now use the persisted-language i18n layer with per-culture translation modules. The TV season detail page now routes `/media/tv/seasons/:id` and `/media/seasons/:id` through `SeasonPage`, backed by the infra `TelevisionRepository` for season/episode card reads, season Add-to-Collection/Playlist/Schedule actions, per-episode Add-to-Collection/Playlist, Show Media Info, and Troubleshoot Playback; the media-info JSON path now supports episodes, and the visible season/episode loading, not-found, action, file-state, and metadata labels now use the persisted-language i18n layer with per-culture translation modules. The movie detail page now localizes loading/not-found, action/menu/modal, media-info, file-state, linked fact-row, and actor section labels, and the shared media browser selection/action/modal/pager labels now use the same per-culture translation modules instead of English literals or CSS pseudo-content. The artist detail page now routes `/media/music/artists/:id` through `ArtistPage`, backed by artist metadata/artwork, linked Languages/Genres/Styles/Moods, Add To Collection/Schedule, and the first 100 sorted music-video cards with per-video Add To Collection; visible loading/not-found/action/fact-row/music-video labels and thumbnail alt suffixes now use the persisted-language i18n layer with per-culture translation modules. The other-video detail page now routes `/media/other/videos/:id` through `OtherVideoPage`, using ErsatzTV `OtherVideoCardViewModel` metadata/artwork parity (thumbnail then poster, original title subtitle, state) plus Add To Collection, Show Media Info, Troubleshoot Playback, linked facts, actors, and `GetMediaItemInfoHandler`-style JSON for `OtherVideo` streams/subtitles/chapters; visible loading/not-found/action/media-info/file-state/fact-row/actor labels now use the persisted-language i18n layer with per-culture translation modules. Phase 7 Slice 22 adds per-item overflow menu on movie browsers with Add To Collection, Show Media Info (mirrors `GetMediaItemInfoHandler` JSON shape), and Troubleshoot Playback actions; `/system/troubleshooting/playback?mediaItem=ID` displays media-specific troubleshooting context.
'''
