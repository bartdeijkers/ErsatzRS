nonclickable music-video cards, and no library filter; ErsatzRS matches them.

ADR 0062 intentionally extends that pinned baseline with read-only music-video,
song, and image detail routes, canonical card/search/collection destinations,
shared actions and unavailable warnings, and linked rating, language, studio,
music-label, genre, and tag facts on every applicable detail surface.

Closed 2026-08-24: television list and detail projections choose one stable,
lowest-ID non-empty artwork winner per entity, so legacy duplicate thumbnails
cannot multiply episodes or destabilize pagination. A 27-episode add-on list
remains 27 unique links with season counts 13 and 14 across reload in Chromium
and Firefox.

UCU-02 row 12 is Covered: show Add To dialogs and Quick/Deep Scan dispatch
already work. Four Chromium/Firefox regressions pass; ucu-02 owns exact
request and menu evidence. This is browser binding proof, not new Windows
acceptance or completion of a remote-provider scan.
