adr        = ['0048']
summary    = '''
Ported list/detail coverage exists for `/media/movies`, `/media/tv/shows`, `/media/images`, `/media/music/artists`, `/media/music/songs`, `/media/other/videos`, and `/media/trash` through the shared media browser primitives, localized labels, SQL-backed card/detail loaders, media-info JSON, and scanner refresh behavior. TV show and season details include the ErsatzTV linked fact rows, season/episode action surfaces, schedule refresh side effects, special-feature rows, and playback troubleshooting links. Other-video detail mirrors ErsatzTV card metadata/artwork precedence plus Add To Collection, Show Media Info, Troubleshoot Playback, linked facts, actors, and media-info JSON.

Closed 2026-07-01 for the movie-detail extras regression: `/media/movies/:id` now renders linked extras with the same episode-style row treatment as TV extras and exposes Add To Collection, Add To Playlist, Show Media Info, and Troubleshoot Playback actions. Movie detail also keeps its localized labels and shared modal/action plumbing.

Closed 2026-07-01 for the remaining action/toolbar regression: `/media/music/songs` and `/media/browser/images` now reuse the shared multi-select browser shell, right-side toolbar placement, item overflow menu, media-info/troubleshooting links, and correct song/image playlist collection-type stamps. `/media/music/artists/:id` now resolves initial detail data before the island boundary, restoring the artist Add To Collection dialog/persistence path and rendered artist/music-video preview images. `/media/tv/shows/:id` also resolves detail data before its island boundary after focused browser proof exposed a Suspense hydration mismatch. Movie, show, season, and artist detail routes were rechecked against the ErsatzTV-valid header/row action model.

ADR 0048 adds an ErsatzRS-only movie-detail playback-options surface: audio
track cards appear near the top of `/media/movies/:id`, can seed Add To
Collection/Add To Playlist dialogs with selected audio/subtitle preferences,
and collection/playlist inspection surfaces display saved playback override
summaries.
'''

