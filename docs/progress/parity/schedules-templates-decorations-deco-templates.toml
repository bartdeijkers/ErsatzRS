summary    = '''
Ported: `/schedules`, `/schedules/add`, `/schedules/:id`, and `/schedules/:id/items` provide the ErsatzTV-shaped schedule list/editor/items surface with persisted list/detail page sizes, search, add/edit save, copy dialog, delete confirmation dialog, hydrated item add/copy/reorder/delete, full item field persistence including media-code-backed language selectors, schedule item validation and dependency normalization, playout refresh side effects, no-JS form fallback endpoints for schedule and item save/action paths, and browser visual/action evidence. The schedule list/editor/item editor visible labels, actions, option labels, generated copy-name defaults, fallback collection labels, and no-JS item fallback strings use the persisted-language i18n layer with per-culture translation modules. `/blocks` and `/blocks/:id` port block group/block add/copy/delete, grouped search table, block editor item add/copy/reorder/delete, preview playout modal/table, HTML POST fallback save/add/action rows, and persisted-language list/editor labels/actions/dialogs/toasts/copy-name defaults/duration hour adornment/no-JS labels. `/templates` and `/templates/:id` port template group/template add/copy/delete, grouped search table with dummy empty-group rows, template editor block add/remove/drag, item replacement persistence, overlap/name validation, delete/copy dialogs, HTML POST fallbacks, and persisted-language list/editor labels/actions/dialogs/toasts/copy-name defaults. `/decos`, `/decos/:id`, `/deco-templates`, and `/deco-templates/:id` port deco/deco-template group and item CRUD, MudTreeView-derived row surfaces, deco editor field sections, break-content add/select/delete table behavior, default filler/dead-air fallback fields, deco-template add/remove save flow, raw POST fallbacks, validation/persistence, and the `/deco-templates/:id` day timeline surface. Their visible list/editor labels, option labels, validation/toast text, and no-JS fallback labels use the persisted-language i18n layer. The closeout Source Map / Visual Source Map plan was pruned after completion; durable Playwright route-family proof lives in `tests/e2e/scheduling-route-family.spec.ts`.

Reopened 2026-06-27 from MTV channel dogfood: the generated schedule-items server function can persist a fully populated schedule, but the raw HTML fallback endpoint does not currently deserialize the repeated schedule-item vectors reliably. Keep the feature `In progress` until fallback/API parity is proven end to end.
'''

