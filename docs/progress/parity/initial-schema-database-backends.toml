[[debt]]
id          = 'writing-transactions-started-deferred'
description = 'Almost every write path reads before it writes, but transactions were started with SQLx `begin()`, which SQLite runs in deferred mode: it takes a read snapshot on the first statement and only tries to take the write lock when it first writes. When another connection commits in between, that upgrade fails immediately with SQLITE_BUSY, and `busy_timeout` deliberately does not apply because waiting could never resolve it. Any admin write could therefore fail with `database is locked` while a scan or another editor was writing.'
discovered  = '2026-08-17'
evidence    = 'Reproduced on the affected machine with a 30-second busy timeout: the deferred sequence failed after 0.000s while `BEGIN IMMEDIATE` succeeded, matching the production symptom of a `database is locked` 500 at 15 ms rather than a timed-out wait. `crates/ersatzrs-infra/src/db.rs::begin_write` issues `BEGIN IMMEDIATE` on SQLite and leaves MySQL alone. All 98 production transactions that write across the repositories, the add-on list and storage layers, the scanners, and the Plex, Jellyfin, and Emby persistence layers now use it; `crates/ersatzrs-infra/tests/write_transaction.rs` asserts the deferred path fails fast and the `begin_write` path survives a concurrent writer that queues behind it.'
resolved    = true
resolution  = 'Writing transactions take the write lock up front, where `busy_timeout` applies, so concurrent writers queue instead of failing. The one genuinely read-only transaction (`reconcile_merged_local_shows`) deliberately keeps the deferred begin, because BEGIN IMMEDIATE would serialise readers that WAL otherwise runs concurrently, and says so in a comment. No production transaction body queries the pool rather than the transaction, so none had its failure mode changed into a wait, and none awaits non-database work while holding the lock. A `cargo xtask architecture-lint` rule requires every production `.begin().await` to be `begin_write` or to carry a documented `read-only transaction` justification. Remaining verification is manual and cannot be automated here: exercise the admin UI under a concurrent library scan and confirm no `database is locked` surfaces.'
