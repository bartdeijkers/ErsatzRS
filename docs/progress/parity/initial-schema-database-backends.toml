summary    = '''
In progress: ADR 0080 is implemented and the initial SQLite schema matches the ErsatzTV table/column/foreign-key shape. Infra repositories read/write ErsatzTV integer enums, EF-style UTC `DateTime` text, ErsatzTV `TimeSpan` values, and the covered playout runtime state. SQLite startup and lazy pools enforce foreign keys, a 30-second busy timeout, WAL journaling, NORMAL synchronization, immediate write transactions, bounded retries, and schema health checks. Runtime, Cargo, migrations, CI, developer graphs, and current operator documentation are SQLite-only; removed `mysql://` and `mariadb://` URLs fail with a permanent diagnostic. The maintainer confirmed no user deployment used the retired optional backend, so no conversion runbook is required. Historical MySQL implementation and proof below are retained as delivery evidence. Remaining table-level read/write and real-world decode gaps are tracked in [persistence-gap-matrix.md](../persistence-gap-matrix.md).
'''
