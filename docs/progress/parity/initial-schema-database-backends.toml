summary    = '''
Ported: the initial SQLite schema matches the ErsatzTV table/column/foreign-key shape and infra repositories now read/write ErsatzTV integer enums, EF-style UTC `DateTime` text, ErsatzTV `TimeSpan` values, and playout runtime state tables (`PlayoutAnchor`, `ScheduleItemsEnumeratorState`, `PlayoutGap`, `PlayoutHistory`, `PlayoutProgramScheduleAnchor`, `CollectionEnumeratorState`, `PlayoutScheduleItemFillGroupIndex`, `FillGroupEnumeratorState`, and `PlayoutTemplate`) for the covered persistence surfaces. Classic collection-anchor and fill-group roots use database-assigned global identities on SQLite and MySQL; strict transactional inserts preserve cross-playout ownership and roll back on collisions instead of applying destructive replacement semantics. Phase 7 Slice 14 adds typed `ProgramScheduleItem` subtype repositories (`Duration`/`Flood`/`Multiple`/`One`), schedule item watermark/graphics joins, EF-compatible `ProgramScheduleAlternate` converters, and typed `BlockItem` target/overlay writes. Phase 7 Slice 7 adds the MySQL backend behind the `mysql` feature: URL detection for `mysql://` / `mariadb://`, unsupported-backend errors when the feature is absent, ErsatzTV-style MySQL DDL with named constraints and `utf8mb4`/`utf8mb4_general_ci` parity, runtime backend-aware SQL helpers, and feature-gated MySQL migration/read-write integration coverage. SQLite startup and lazy pools now enforce foreign keys, a 30-second busy timeout, WAL journaling, and NORMAL synchronization on every connection, with a matching migration and health check. Remaining table-level read/write and real-world decode gaps are tracked in [persistence-gap-matrix.md](../persistence-gap-matrix.md).
'''

[[debt]]
id          = 'replace-into-cascade-deleted-child-rows'
description = 'Repository writes used `REPLACE INTO`, which deletes the conflicting row before re-inserting it and therefore fires `ON DELETE CASCADE`. Seventeen production statements targeted a cascade parent, so ordinary saves destroyed unrelated data.'
discovered  = '2026-08-12'
evidence    = 'Reproduced on a live database: editing an FFmpeg profile deleted all four channels, their playouts, and 1741 playout items. All seventeen statements now use `cascade_safe_upsert`, which emits `ON CONFLICT ... DO UPDATE` on SQLite and `ON DUPLICATE KEY UPDATE` on MySQL with one clause per unique key and no assignment to the primary key. Regressions for profile edit, channel save, and media-item rescan were each verified by reintroducing `REPLACE` and observing the children disappear. Statements still using `REPLACE INTO` write only to tables nothing cascades off.'
resolved    = true
resolution  = 'All cascade-parent writes are real upserts. The three behaviours `REPLACE` provided implicitly are reproduced deliberately: conflict resolution on any unique index, the NOT NULL default substitution that only `Channel."Group"` relied on, and the fresh rowid that Plex media-file writes used for `last_insert_id`.'

[[debt]]
id          = 'new-migrations-need-a-build-input'
description = 'A new migration did not run until the crate was rebuilt for an unrelated reason, because `sqlx::migrate!` embeds migrations at compile time and cannot register the directory as a Cargo input.'
discovered  = '2026-08-12'
evidence    = 'A pinned-key migration silently never applied across repeated restarts; the compiled `Migrator` kept the previous migration set. `crates/ersatzrs-infra/build.rs` now emits `rerun-if-changed` for both migration directories.'
resolved    = true
resolution  = 'A build script tracks `migrations/` and `migrations/mysql/`, so adding or editing a `.sql` file invalidates the crate and the new migration runs on the next start.'

