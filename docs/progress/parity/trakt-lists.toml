feature    = 'Trakt provider lists'
etv_source = '`$ERSATZTV_SRC/ErsatzTV.Infrastructure/Trakt/`, `$ERSATZTV_SRC/ErsatzTV.Application/MediaCollections/Commands/*TraktList*`, `ErsatzTV/Pages/TraktLists.razor`, `ErsatzTV/Pages/TraktListEditor.razor`, `ErsatzTV/Shared/AddTraktListDialog.razor`'
rs_target  = 'Deliberately not implemented; provider-neutral Add-on Lists remain available to other packages'
status     = 'Dropped'
adr        = ['0066', '0067', '0069']
summary    = '''
The native official Trakt add-on was retired on 2026-08-16 by ADR 0069. Its
public GitHub Actions build otherwise required a credential for the private
ErsatzRS repository that owns `ersatzrs-addon-contract`; publishing the crate
to crates.io is explicitly prohibited. The legacy host implementation is not
restored. The earlier destructive migration still removes its tables,
configuration, and generated playlists without importing them.

Provider-neutral Add-on Lists remain ported and host-owned for matching,
generated-playlist maintenance, settings, deletion, search, and refresh
cadence. Beeld & Geluid continues to use the capability for Schatkamer series,
public shared-list, and saved-search hyperlinks.
'''

[[debt]]
id          = 'core-playlist-pages-retain-trakt-specific-assumptions'
description = 'Remove residual Trakt-specific code and vocabulary from the core playlist and provider-neutral add-on-list admin pages so provider behavior can enter the host only through the add-on contracts.'
discovered  = '2026-08-31'
evidence    = 'Maintainer request on 2026-08-31. The provider-neutral add-on-list module still named the retired upstream Trakt pages in active page documentation, the add-on contract fixture used a Trakt-specific secret reference, and core locking documentation retained Trakt examples even though the native provider was dropped by ADR 0069.'
resolved    = true
resolution  = 'The active core, contract, and admin page references are provider-neutral. `cargo xtask architecture-lint` now rejects case-insensitive Trakt vocabulary in the core playlist and add-on-list page sources, while legacy schema-removal migrations and compatibility tests remain intentionally available to clean upgrades from older installations.'

