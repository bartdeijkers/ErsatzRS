summary    = '''
Replaced on 2026-08-14 by provider-neutral add-on media lists. Local matching,
generated-playlist maintenance, settings, deletion, search, and refresh cadence
remain host-owned. Trakt HTTP/API behavior and its client-ID reference are
owned by the official Trakt add-on. The destructive forward migration deletes
legacy Trakt-generated playlists and configuration, drops every Trakt table,
and imports no legacy rows. Beeld & Geluid implements the same capability for
series, public shared-list, and saved-search hyperlinks.
'''

