Ported: every PR/push runs a 6-cell `platforms` matrix that builds the workspace for each ErsatzTV-parity RID and runs the test suite on the four natively-built cells (linux-x64 + ubuntu-latest, osx-arm64 + macos-latest, osx-x64 cross-compiled from macos-latest, win-x64 + windows-latest); the two ARM Linux cells build via cross-rs. Tag pushes attach only the active Linux/Windows archives: `ersatzrs-<tag>-linux-x64.tar.gz`, `ersatzrs-<tag>-linux-arm64.tar.gz`, `ersatzrs-<tag>-linux-arm.tar.gz`, and `ersatzrs-<tag>-win-x64.zip`. As of 2026-06-21 the release matrix intentionally omits the two macOS archives (`osx-x64`, `osx-arm64`) until a future macOS-targeted release, and as of 2026-06-24 the release workflow no longer carries a Docker/GHCR publication job. The active release line is Linux/Windows archive-only; the 6-cell CI `platforms` matrix still builds and tests all six RIDs. Windows contributors use `run.cmd` / `run.ps1` mirroring `run.sh`. Only platform-specific code lives behind documented `cfg` guards (Leptos `wasm32` islands, Unix-only ffmpeg test helpers). Per-RID archives ship the parity binaries `ersatzrs-web`, `ersatzrs-scanner`, and `ersatzrs-healthcheck`; the maintenance scheduler runs as an in-process tokio task inside `ersatzrs-web` (ErsatzTV hosted-service parity).
'''

