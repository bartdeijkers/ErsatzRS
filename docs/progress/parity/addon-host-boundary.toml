feature    = 'ErsatzRS/ErsatzRS-addons contract boundary hygiene'
etv_source = 'ErsatzRS product extension; ErsatzTV has no out-of-process add-on boundary to port'
rs_target  = '`crates/ersatzrs-addon-contract`, `crates/ersatzrs-core/src/addon_media_list.rs`, `crates/ersatzrs-scanner/src/remote_stream_playlist.rs`, `crates/ersatzrs-app/src/commands.rs`, `crates/ersatzrs-web/src/admin/i18n.rs`, and the separate `bartdeijkers/ErsatzRS-addons` repository'
status     = 'Ported'
adr        = ['0066', '0068', '0069', '0070']

summary = '''
A 2026-08-15 review of the add-on backend found the host/package division
fundamentally sound. Add-ons never touch the database, the filesystem layout,
matching, generated playlists, NFO generation, or scanning; the host never
contains provider protocol code. Manifest validation, bounded path-safe
extraction, per-invocation content-hash revalidation, cleared process
environments, managed process groups and Job Objects, secret references that
store only a location, and persistent trust tiers are all in place and
consistently applied. Provider names are effectively absent from host source
outside test fixtures.

The review found six specific defects, all sharing one root cause: the contract
exists as prose plus host-side validators, with no executable artifact shared
between the two repositories and no structured diagnostic channel for the `list`
and `play` operations. That gap makes shortcuts attractive, and two of them were
taken — a provider vocabulary table inside the host, and host localization that
string-matches an add-on's English error text across a repository boundary.

Each debt item below has a standalone plan under `plans/` and a milestone under
the `Add-on boundary` phase in `milestones.toml`. Milestones ab-01 through
ab-07 are complete. ADR 0069 retired the native Trakt package and its private
cross-repository dependency while retaining the repo-local reference add-on and
shared conformance proof. One host-owned executable now validates manifests and
catalogs, while the official repository uses a separate Rust publisher instead
of the Python builder. Exact-SHA host CI and official-repository publication,
detached signing, GitHub Pages deployment, and live catalog/signature probes
close the remaining executable-boundary debt.

The 2026-08-17 ADR 0070 amendment removed its former host exception. Schatkamer
URL grammar and normalization now live with HTTP scraping, classification,
provider metadata, and playback in the add-on package. The host validates only
the generic URL and declared network-host contract.
'''

[[debt]]
id          = 'host-contains-provider-availability-vocabulary'
description = 'Remove the yt-dlp-specific availability tokens (`public`, `unlisted`, `private`, `premium_only`, `subscriber_only`, `needs_auth`) from the host and accept only `available`, `unavailable`, and `unknown`. Normalize inside the yt-dlp package on both POSIX and Windows first, then delete the duplicated deserializer and reject unrecognized tokens instead of silently coercing them to `unknown`.'
discovered  = '2026-08-15'
evidence    = 'Resolved by milestone `ab-01` on 2026-08-15. The official yt-dlp POSIX and PowerShell paths emit only the three canonical availability values; core and scanner use direct enum deserialization with the omitted-v1 default; both operational adapters reject an unknown explicit value with a bounded provider-neutral error; and `cargo xtask architecture-lint` prevents the provider vocabulary from re-entering `crates/`. Focused package, infra, scanner, and xtask regressions passed.'
adr         = '0068'
resolved    = true

[[debt]]
id          = 'list-and-play-have-no-structured-diagnostics'
description = 'Give `list` and `play` the same stable `{code, message}` result shape that `addon.check.v1` already has, so the host can localize failures on a code instead of matching an add-on English sentence, and so third-party add-ons get translated failures too.'
discovered  = '2026-08-15'
evidence    = 'Resolved by milestone `ab-02` on 2026-08-15. The shared contract validates and bounds final-stderr-line operation diagnostics; list and play host paths preserve codes while redacting or suppressing add-on text; host-detected setting and secret failures use the same vocabulary; every supported culture translates recognized codes and unknown codes use a generic localized fallback; official POSIX, Windows, and native packages emit the contract; and architecture lint keeps package-specific prose and setting keys out of host crates. Focused package and host suites, both workspace clippy configurations, 1,519 closeout tests plus doctests, the Leptos build, parity-check, and progress validation passed.'
adr         = '0066'
resolved    = true

[[debt]]
id          = 'contract-crate-does-not-own-the-ndjson-payloads'
description = 'Move the `media-list.list` and `remote-stream.list` record types into `ersatzrs-addon-contract`, keep the crate independently versioned and packageable without registry publication, and ship a reference add-on plus a callable conformance check.'
discovered  = '2026-08-15'
evidence    = 'Resolved through milestone `ab-03` on 2026-08-16. Both wire records and enums live in `ersatzrs-addon-contract`; host edges convert them to separate persisted domain enums; shared conformance functions and a runnable reference add-on ship with independently versioned crate 0.1.0. The crate has guarded `publish = false`, canonical GitHub metadata, immutable tag `addon-contract-v0.1.0`, package verification, 21 packaged tests, and warning-free rustdoc. ADR 0069 retired the only native official consumer instead of granting the public add-ons workflow access to the private host repository; the contract therefore remains private and no official package has a cross-repository Cargo dependency.'
adr         = '0066'
resolved    = true

[[debt]]
id          = 'operator-source-url-is-unvalidated'
description = 'Validate the operator-supplied add-on list and playlist manifest URL in the host (scheme, no userinfo) and, when the installed manifest declares specific `network_hosts`, require the URL host to match one of them.'
discovered  = '2026-08-15'
evidence    = 'Resolved by milestone `ab-04` on 2026-08-15. One shared contract validator accepts bounded absolute HTTP(S) without userinfo, enforces exact, leading-dot, wildcard-suffix, or unrestricted host declarations, and returns the canonical URL serialization that every host path stores or forwards. Add-on List import and Remote Stream manifest parsing reject unsafe URLs before provider invocation through the localized `unsupported-url` diagnostic; installed provider adapters enforce `network_hosts`; existing saved lists remain visible with `LastError`; parser-sensitive authority input is forwarded exactly as validated; and reference docs distinguish this host-input check from process confinement. Official Beeld & Geluid, Trakt, and yt-dlp manifests cover their supported source hosts. Focused tests passed, followed by both workspace Clippy configurations, all 1,533 nextest tests and doctests, the Leptos bundle build, the complete parity gate, `cargo deny check`, and package verification for `ersatzrs-addon-contract`.'
adr         = '0066'
resolved    = true

[[debt]]
id          = 'list-contracts-have-opposite-strictness'
description = 'Apply one documented strictness rule to both list record types, including `deny_unknown_fields` and shared null-array handling, and record the capability-version bump as the compatibility escape hatch.'
discovered  = '2026-08-15'
evidence    = 'Resolved through milestone `ab-05` on 2026-08-16. Both contract-owned records reject unknown fields with a bounded diagnostic naming the field, share omitted/null optional-array handling, and are decoded by host adapters through the shared conformance functions. Atomic refresh regressions preserve the prior complete Remote Stream generation and the existing media list, items, and GUIDs. The references freeze existing capability versions and require a version bump for new fields. Official POSIX fixtures and real Windows PowerShell fixtures cover Beeld & Geluid and yt-dlp in media-list and Remote Stream modes; the external repository passes 16 tests and builds a deterministic two-package catalog without native artifacts. ADR 0069 retired native Trakt, so no external revision pin remains part of this acceptance.'
adr         = '0066'
resolved    = true

[[debt]]
id          = 'manifest-contract-has-two-implementations'
description = 'Expose the host manifest validator as a callable tool, run it from the add-ons repository CI before packaging, and reduce `tools/build_repository.py` to publication-specific rules only.'
discovered  = '2026-08-15'
evidence    = 'Resolved by milestone `ab-06` on 2026-08-16. `ersatzrs-addon-contract` 0.1.1 owns bounded parsing and validation for `addon.toml`, `repository.toml`, and repository catalogs; xtask and the dependency-light `ersatzrs-addon-validator` binary call that same path. The public workflow pins the Linux validator by version and SHA-256 and runs it before packaging. Publication directory identity remains repository policy. Focused suites, package verification, both official manifests, and a generated catalog passed, followed by both workspace Clippy configurations, all 1,545 nextest tests plus doctests, architecture/progress validation, and the dependency audit. Host exact-SHA CI run `31943829930` passed on `2bf94ea7d55dc291c591656435f8bd25390cdc7f`; official repository commit `0853dc37c8435296ba680a8dfe216055fd237d7a` passed publication run `31941211236` with the pinned validator SHA check, manifest/catalog validation, signing, and deployment.'
adr         = '0066'
resolved    = true

[[debt]]
id          = 'official-repository-publisher-remains-python'
description = 'After ab-06 leaves only publication policy in `tools/build_repository.py`, replace that builder with a repository-owned Rust CLI while preserving deterministic archives, fixed metadata and modes, Windows batch CRLF normalization, icon and package digests, RID artifact staging, and catalog ordering and validity. Keep detached signing and deployment as separate CI steps, and do not introduce a credential for the private host repository.'
discovered  = '2026-08-16'
evidence    = 'Resolved by milestone `ab-07` on 2026-08-16. The public repository now has a locked Rust `repository-publisher`, and the Python builder plus its publication test were removed. The Rust regressions prove reproducible staged output, metadata and modes, CRLF batch files, package/icon hashes and sizes, and rollback safety; all 15 provider tests, real publication through the pinned host validator, catalog validation, and ZIP integrity passed. Old/new comparison proved equal normalized catalogs, inventories, extracted bytes, modes, and timestamps. Signing and deployment remain separate. Official repository commit `0853dc37c8435296ba680a8dfe216055fd237d7a` passed publication run `31941211236`; the live catalog and detached signature both returned HTTP 200.'
adr         = '0066'
resolved    = true
