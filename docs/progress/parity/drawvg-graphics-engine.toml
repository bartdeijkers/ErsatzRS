treaming plumbing is command-wired and runtime-proven: IPTV and HLS resolve active graphics from the DB, render template-bearing config strings with runtime/media/EPG/per-item variables, write generated VGS/ASS artifacts, and pass the resulting graphics overlay plan into the shared pipeline; the dev MPEG-TS builder accepts the same overlay plan. Ignored FFmpeg smokes prove drawvg compositing in IPTV MPEG-TS output, HLS segment output, and dev MPEG-TS output, and IPTV/HLS temp graphics directories are removed after FFmpeg exits or render failure. Phase 6 schedule integration materializes generated playout-item graphics join rows across classic/block/YAML/scripted paths and preserves YAML/scripted per-item `Variables` for playback. Phase 7 adds durable checked-in VGS source templates for lower-third and song-progress drawvg overlays, a libass subtitle graphics template, README variable documentation, and focused template coverage that guards against raw SVG/XML being treated as drawvg input. The live end-to-end proof imports ErsatzTV-style YAML graphics, attaches Image/Text/Subtitle/Motion elements through `PlayoutItemGraphicsElement`, resolves and renders them through playback, encodes the shared FFmpeg pipeline, and decodes red/white/green/blue pixels from the final MPEG-TS stream. The broad gates pass across fmt, default clippy, mysql-feature clippy, and workspace all-features tests.
