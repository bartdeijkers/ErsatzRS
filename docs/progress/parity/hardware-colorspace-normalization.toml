feature    = 'Hardware colorspace normalization (GPU-resident SetPixelFormat)'
etv_source = '`$ERSATZTV_SRC/ErsatzTV.FFmpeg/Filter/ColorspaceFilter.cs`, plus the per-builder `SetPixelFormat` (`NvidiaPipelineBuilder.cs`, `VaapiPipelineBuilder.cs`, `QsvPipelineBuilder.cs`)'
rs_target  = '`crates/ersatzrs-ffmpeg/src/pipeline/mod.rs` (`build_transcode_pipeline`)'
status     = 'Ported'
summary    = '''
Ported. The earlier software-resident `SetPixelFormat` colorspace branch normalizes non-BT.709 sources to BT.709 with `colorspace`/`colormatrix`/`setparams`, fixing the SD/DVD "256-color GIF" banding/dithering caused by implicit swscale conversion.

This slice ports the GPU-resident hardware encode path for known non-BT.709 sources and pins it to committed ErsatzTV-generated `-filter_complex` fixtures:
- NVENC appends `hwdownload,format=nv12` plus the bt709 normalization node in the end-of-graph SetPixelFormat slot, matching the upstream bt470bg fixture with no extra post-colorspace `hwupload_cuda`.
- VAAPI appends `hwdownload,format=nv12`, the bt709 normalization node, and `format=nv12|p010le|vaapi,hwupload` before `h264_vaapi`.
- QSV applies the normalization after the existing `vpp_qsv` reset-PTS download, matching the upstream mixed-color fixture with no extra post-colorspace `format=nv12,hwupload=...`.
- HDR tonemap now mirrors ErsatzTV's `ResetColorParams(ColorParams.Default)` behavior by marking the current frame BT.709 after tonemap, preventing a redundant SetPixelFormat colorspace node.

Unknown-color GPU-resident sources stay skipped to avoid changing hardware paths with absent ffprobe color metadata; software unknown-color behavior remains ported and fixture-covered. Hardware argv behavior is covered by ErsatzRS snapshots plus fixture-backed SetPixelFormat assertions against `crates/ersatzrs-ffmpeg/tests/fixtures/ersatztv/colorspace/`.
'''
