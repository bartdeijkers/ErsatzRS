summary    = '''
UCU-02 row 11 adds persisted native/Next engine selection, native defaults,
localized labels and server-side HLS Segmenter normalization for Next.
Repository and Chromium/Firefox tests pass, including no-JS forms. Next runtime
acceptance remains owned by upstream-baseline-catch-up.
UCU-02 row 14 adds regression coverage for existing post-save notifications to
normal and preview Next consumers without rebuilding persisted playouts.
The complete web parity gate remains required at UCU-02 window close.
Implemented: `/channels` paged table + delete/show-disabled toggle; generated and stored logo images; disabled/hidden channel number markers; ErsatzTV-like top action bar/content/divider/icon row actions; per-row "Stop Transcode Session" button (between preview and edit) that ports `IFFmpegSegmenterService.IsActive`/`StopChannel` and `IHlsSessionWorker.Cancel` — visibility is driven by a client-side poll of the in-memory HLS session registry (mirrors ErsatzTV's `OnWorkersChanged` re-render) and clicking it cancels the live worker, which kills FFmpeg and removes itself so the icon clears on the next poll; Troubleshoot is visible and linked only when the channel is enabled and has a playout, with blank reserved action space otherwise, matching `Channels.razor`; `/channels/add` and `/channels/:id` SSR multipart editor exposing the full channel edit contract (basics, runtime behavior, playout source/mirror, flags, streaming, stream selection, subtitle/music-video behavior, logo, watermark, fallback filler); repository-backed defaults, supporting lists, validation, full-field persistence, stored/external/remove logo semantics, playlist/list logo preference, subtitle-extraction save side effect, and form-level validation errors. Visible list/editor labels, actions, help text, options, streaming-mode values, and preferred audio/subtitle language values now use the persisted-language i18n layer with per-culture translation modules; the shared language selector is populated from `MediaStream.Language`, `Subtitle.Language`, and `Channel.PreferredAudioLanguageCode` with ISO alias expansion, matching ErsatzTV's `GetAllLanguageCodes` path. Music Video Credits Template now lists the bundled ErsatzTV preset stems from `assets/templates` plus user-editable `data/templates/music-video-credits/*.sbntxt`, mirrors ErsatzTV's browser disabled state when Music Video Credits Mode is not `GenerateSubtitles` while preserving the SSR multipart fallback, persists the selected stem only when Music Video Credits Mode is `GenerateSubtitles`, and IPTV/HLS streaming renders the configured music-video credits template into an ephemeral forced/default ASS subtitle before FFmpeg command generation, falling back to `_default.ass` when the selected template is missing. Startup now extracts the bundled ErsatzTV fonts (`OPTIKabel-Heavy`, `Roboto`, `Sen`) into the FFmpeg `fontsdir`, so `_default.ass` and the other music-video credits presets burn with the same title font as ErsatzTV instead of a libass fallback.
ADRs 0053/0054: `/channels` and
`/channels/:id/watch` share an isolated H.264/AAC preview, while `/epg` uses one
batched 26-hour grid. Hardening covers safe paths, stale work, capacity, live
selection, titles, and playlists; Chromium/Firefox proves real playback.

ADR 0055: both player surfaces make a muted autoplay
attempt per activation. Closing invalidates pending work, and viewport-bound
16:9 sizing keeps the full modal visible on desktop and portrait/landscape
mobile screens.

The SSR editor disables Mirror Source Channel
and Playout Offset unless Playout Source is Mirror, and its inline dependency
script updates both controls when the operator switches modes. The repository
continues to discard forged mirror-only values for Generated channels. The
localized help contract covers every culture; the focused repository regression
and Chromium/Firefox browser flow prove initial state, both transitions, save,
and reload.

'''

[[debt]]
id          = 'channel-editor-no-js-suspense'
description = 'Channel add/edit pages defaulted to out-of-order SSR, leaving the form behind Loading when JavaScript was disabled despite the editor being an SSR component.'
discovered  = '2026-09-22'
resolved    = true
evidence    = 'UCU-02 row 11 initial Chromium/Firefox proof exposed the missing no-JS form. Changed only the two editor routes to SsrMode::InOrder, following locked leptos_router 0.8.15 source documentation. Rebuilt matching SSR/WASM assets; all four unchanged tests in tests/e2e/channel-streaming-engine.spec.ts pass: create, edit, reopen, native defaults, Next mode normalization, and return to native, with and without JavaScript in both browsers.'

[[debt]]
id          = 'mirror-options-enabled-without-mirror-source'
description = 'In the channel editor, the mirror source channel and playout offset controls remain editable while Playout Source is Generated. Disable these dependent controls unless Playout Source is Mirror, so operators cannot configure only the subordinate mirror values while overlooking the required source-mode selection.'
discovered  = '2026-08-10'
evidence    = 'Resolved 2026-08-10. `channel_editor_form` server-renders both mirror-only controls disabled for Generated channels and the stable-DOM inline dependency script enables them only for Mirror. `generated_channel_save_discards_submitted_mirror_options` proves the repository clears forged values. `channel-watch.spec.ts` proves the initial and switched states plus persisted mirror reload in Chromium and Firefox. `all_languages_translate_each_key` covers the new help text in every culture.'
resolved    = true

[[debt]]
id          = 'watch-route-programme-guide-never-scrolled'
description = 'The channel watch route rendered the programme guide inside a plain grid item, so the implicit `auto` column on the page grid sized itself to the full zoomed timeline of the guide (~9700px) and left the `overflow: auto` scroller inside the guide as wide as its content. The timeline never scrolled and the Now, -2h/-1h and +2h/+4h viewport controls had no effect. The standalone `/epg` preview was unaffected because its guide section is a direct grid item and therefore a scroll container.'
discovered  = '2026-08-06'
evidence    = 'Resolved 2026-08-06: `.content` in `crates/ersatzrs-web/src/admin/pages/channels/watch.module.css` pins `grid-template-columns: minmax(0, 1fr)`, so grid items resolve an automatic minimum size of 0 and the guide scroller inherits the container width (measured `clientWidth` 1006 vs `scrollWidth` 9712, previously 9712/9712). `tests/e2e/channel-watch.spec.ts` now asserts the timeline is a real scroll container before its zoom-centre proof and that the +2h control moves `scrollLeft`, on both the watch route and `/epg`; reverting the CSS makes those assertions fail. The zoom-centre assertion had been passing vacuously because a pinned `scrollLeft` of 0 makes the computed centre scale exactly with zoom.'
resolved    = true

[[debt]]
id          = 'mirror-channel-runtime-ignored-source-and-offset'
description = 'Mirror fields persisted in the channel editor, but playback and guide queries selected playouts by the mirror channel id and unsigned duration decoding converted negative offsets to zero. Operators could add an independent mirror playout, producing unrelated programming.'
discovered  = '2026-07-31'
evidence    = 'Resolved 2026-07-31: shared mirror context resolution translates target time to source time and projects programme times back to the target timeline. Repository, direct-stream, HLS, XMLTV, retention, and health regressions pass; focused Chromium `tests/e2e/channel-watch.spec.ts` configures the source and +1 hour offset through `/channels/:id`, verifies effective playout eligibility, and compares the shifted `/epg` lanes with no browser errors.'
resolved    = true

