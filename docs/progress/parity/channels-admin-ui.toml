summary    = '''
Ported in the current Phase 7 slice: `/channels` paged table + delete/show-disabled toggle; generated and stored logo images; disabled/hidden channel number markers; ErsatzTV-like top action bar/content/divider/icon row actions; per-row "Stop Transcode Session" button (between preview and edit) that ports `IFFmpegSegmenterService.IsActive`/`StopChannel` and `IHlsSessionWorker.Cancel` — visibility is driven by a client-side poll of the in-memory HLS session registry (mirrors ErsatzTV's `OnWorkersChanged` re-render) and clicking it cancels the live worker, which kills FFmpeg and removes itself so the icon clears on the next poll; `/channels/add` and `/channels/:id` SSR multipart editor exposing the full channel edit contract (basics, runtime behavior, playout source/mirror, flags, streaming, stream selection, subtitle/music-video behavior, logo, watermark, fallback filler); repository-backed defaults, supporting lists, validation, full-field persistence, stored/external/remove logo semantics, playlist/list logo preference, subtitle-extraction save side effect, and form-level validation errors. Visible list/editor labels, actions, help text, options, streaming-mode values, and preferred audio/subtitle language values now use the persisted-language i18n layer with per-culture translation modules; the shared language selector is populated from `MediaStream.Language`, `Subtitle.Language`, and `Channel.PreferredAudioLanguageCode` with ISO alias expansion, matching ErsatzTV's `GetAllLanguageCodes` path.
'''
