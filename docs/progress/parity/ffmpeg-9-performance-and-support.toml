adr         = '0064'
description = 'Benchmark correctness, throughput, latency, CPU/GPU load, and device transfers for fused libplacebo tone-map/scale/rotation, libplacebo peak-detection policy, native tonemap_vaapi versus the VAAPI/OpenCL bridge, and FFmpeg 9 AMF HDR/hardware-memory conversion versus software tonemapping. Adopt only measured improvements that preserve the same SDR/HDR10 output contract.'
discovered  = '2026-08-07'
evidence    = '`tonemap_cuda_filter` currently emits libplacebo followed by CUDA upload and may be followed by separate CUDA scaling; `tonemap_vaapi_filter` maps VAAPI frames through OpenCL and back; `tonemap_filter_for` sends AMF through the software path. FFmpeg 9 exposes native/fused alternatives, but the differential review produced capability evidence rather than ErsatzRS quality or resource benchmarks.'
resolved    = false

[[debt]]
id          = 'long-filtergraph-file-transport-is-missing'
adr         = '0003'
description = 'Complex filter graphs remain inline argv and can exceed native command-line limits. Add ADR 0003 file transport through FFmpeg 9 `-/filter_complex <path>` behind one portable tested threshold, with private per-spawn storage, cancellation-safe cleanup, sanitized logging, and inline/file snapshot plus runtime coverage.'
discovered  = '2026-08-07'
evidence    = 'FFmpeg 9 removes `-filter_complex_script` and supports the generic file-option form `-/filter_complex <path>`. ErsatzRS never emitted the removed option and currently has no long-graph file transport; dynamic subtitles, watermarks, graphics, opacity expressions, scaling, and HDR filters can all contribute to one graph.'
resolved    = false

