[[debt]]
id          = 'animated-webp-graphics-support-is-uncharacterized'
adr         = '0003'
description = 'Characterize animated WebP watermark/graphics inputs: frame timing, looping, alpha, z-order, cancellation, bounded resource use, and both IPTV output modes, without changing static image behavior.'
discovered  = '2026-08-07'
evidence    = '''
Resolved 2026-08-07 by milestone p8c-03, which uncovered a real defect rather
than only adding coverage.

The loop option is demuxer-specific and a mismatch is fatal, not cosmetic.
Measured against FFmpeg 9: `-loop 1` on an animated WebP or GIF fails with
`Option loop not found` and the input never opens, while `-ignore_loop 0` on a
still image fails with `Option ignore_loop not found`.
`InputFile::graphics_image` applied `-loop 1` unconditionally, so any graphics
element pointing at an animated image took the whole channel down. It now
selects the option from the file header (`ANIM` chunk in an extended RIFF/WEBP
file, `NETSCAPE2.0` extension in a GIF), synchronously and with a bounded 4 KiB
read, defaulting to still on anything unreadable. The watermark path was already
correct: `watermark_input_for_stream` probes with ffprobe and routes animated
images to `-ignore_loop 0`.

`-stream_loop -1` was evaluated as a demuxer-agnostic alternative and rejected:
it opens all three input types but hung a 2-second overlay render past a
two-minute timeout, which is exactly the unbounded resource use this milestone
has to avoid.

Fixtures `crates/ersatzrs-ffmpeg/tests/fixtures/graphics/{animated-alpha,static-alpha}.webp`
are generated from lavfi, contain no third-party content, and are therefore
redistributable; provenance and regeneration commands are in that folder README.

Decoded runtime proof (`animated_webp_overlay_loops_and_composites_alpha`):
per-frame signatures over a 16-frame render show the eight distinct source
frames repeating exactly with `-ignore_loop 0`, and the control case without it
freezing on the final frame. Alpha compositing was verified numerically: a
source pixel (127, 0, 254) at 50% alpha over white decodes to (189, 124, 253),
the per-channel midpoint. Z-order with two stacked animated overlays renders
without error.
'''
resolved    = true

[[debt]]
id          = 'source-orientation-is-uncharacterized'
adr         = '0003'
description = 'Characterize source display-matrix/orientation handling. Persist orientation metadata from scanning through media-version selection, apply it exactly once without fighting FFmpeg autorotation, and compare software transpose, transpose_cuda, and fused libplacebo rotation while preserving scaling, overlays, stream copy, ADR 0064 colour behavior, MPEG-TS, and HLS output.'
discovered  = '2026-08-07'
evidence    = '''
Resolved 2026-08-07 by milestone p8c-02.

The governing measurement: FFmpeg 9 autorotates from display-matrix side data
*before* the filter graph runs, and ignores the legacy `rotate` tag entirely. A
320x180 stream tagged with a 90-degree display matrix transcodes to 180x320 with
no filter of ours (`orientation_autorotation_happens_before_the_filter_graph`).
Applying a transpose would therefore rotate the picture twice — so "apply
orientation exactly once" means adding no rotation filter at all and instead
making ErsatzRS geometry agree with what the decoder emits.

`SourceVideoStream::rotation_degrees` is persisted end to end: ffprobe
`side_data_list.rotation` (already available from `-show_streams`), through
`MediaStream.Rotation` (additive migration `202608071500_media_stream_rotation.sql`
for SQLite and MySQL, NULL for existing rows so nothing changes until a rescan),
to playback stream selection. `displayed_frame_size` transposes a quarter turn
and `square_pixel_frame_size` uses it, so a portrait item stored as 1920x1080
letterboxes to 606x1080 in a 1080p channel instead of filling the frame as if it
were landscape. Anamorphic quarter turns are handled separately because the
sample aspect ratio describes the stored horizontal axis, which the turn maps to
the displayed vertical one.

Stream copy is untouched — no filters, no `-noautorotate` — so the elementary
stream and its display matrix pass through
(`stream_copy_leaves_orientation_metadata_untouched`). Scaling and overlays on a
rotated source were verified against real FFmpeg.

Container consequence, measured and not fixable without transcoding: MP4 and
Matroska carry the display matrix through a stream copy, MPEG-TS does not. A
copied portrait item therefore reaches an MPEG-TS client without rotation
metadata. Transcoded output is unaffected because the rotation is baked into the
pixels. Tracked separately as `stream-copy-drops-rotation-in-mpegts`.

NOT done: `transpose_cuda` and fused libplacebo rotation were not benchmarked,
because autorotation makes an explicit rotation filter unnecessary on every path
ErsatzRS generates. That comparison belongs to a future source-preserving mode.
'''
resolved    = true

[[debt]]
id          = 'stream-copy-drops-rotation-in-mpegts'
adr         = '0003'
description = 'MPEG-TS has no display-matrix container field, so a stream-copied portrait item loses its rotation metadata and a client shows it sideways. MP4 and Matroska preserve it. Decide whether such items should be forced to transcode, flagged in troubleshooting, or documented as a client-side limitation.'
discovered  = '2026-08-07'
evidence    = 'Measured with FFmpeg 9: copying a 90-degree-tagged stream to MP4 and MKV preserves `rotation=90`, while the same copy to MPEG-TS reports no rotation side data. Transcoded output is unaffected because autorotation bakes the rotation into the pixels.'
remediation = '''
Closed 2026-08-08. Decision: report, do not force a transcode.

Re-measured on the FFmpeg 9 runtime across every output ErsatzRS serves, using a
display matrix written with `-display_rotation 90`:

  copy -> MP4                    rotation=90 preserved
  copy -> Matroska               rotation=90 preserved
  copy -> HLS, fMP4 segments     rotation=90 preserved
  copy -> MPEG-TS                lost
  copy -> HLS, MPEG-TS segments  lost
  transcode -> MPEG-TS           no side data needed; 320x180 became 180x320,
                                 so autorotation baked it into the pixels

Every default serving path carries MPEG-TS; fMP4 is opt-in per request
(`mode=segmenter-fmp4`). Forcing a transcode was rejected: copy is an explicit
operator choice with a large CPU cost attached, and overriding it to fix
geometry trades one surprise for a bigger one. ErsatzTV has no rotation handling
at all, so there is no parity constraint here.

Added the `Source Orientation` health check, which names the rotated items
scheduled on copy-video channels along with their rotation and channel number,
and points at the two real fixes. Covered on SQLite and MySQL — its query joins
`MediaVersion`'s per-type id columns through COALESCE under SELECT DISTINCT,
the shape the two backends have disagreed about before. Documented in
`docs/how-to/troubleshoot-startup-and-playback.md` with the measured table and a
reproduction.
'''
resolved    = true

