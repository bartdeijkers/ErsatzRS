id          = 'runtime-hardware-graph-failures-bypass-stream-retry'
adr         = '0014'
description = 'P1: Carry the selected `HardwareGraphOperation` into both the HLS segmenter and direct IPTV supervisors. On abnormal exit, classify known graph stderr, persist a device-scoped denial, rebuild exactly once through the next positively proven graph (Vulkan to CUDA/NVENC, CUDA to software), and surface the denial through existing health/troubleshooting state; arbitrary failures and a failed retry remain terminal. Closure requires supervisor-level tests for both stream families, both fallback levels, persistence/reload, the one-retry bound, and a non-classified control.'
discovered  = '2026-08-07'
evidence    = '`GraphFailureKind::classify` is referenced by startup probing and unit tests only. `hls_worker` retries learned decode failures, and `transport/iptv/stream.rs` retries decode/encoder-open failures, but neither path classifies or persists operation-scoped graph failures.'
remediation = '''
Fixed 2026-08-08. Both stream families now learn a graph denial from a live
failure and retry once through the next proven graph.

The selected operation is derived from the argv that actually ran
(`ersatzrs_ffmpeg::selected_hardware_graph`) rather than tracked alongside it,
so a runtime failure cannot be attributed to a graph the spawn did not use.
On abnormal exit both supervisors classify the stderr with the existing
`GraphFailureKind`, persist a device-scoped denial via
`persist_hardware_graph_denial`, and rebuild. Folding the denial into the
capability report is sufficient for the rebuilt command to select the fallback,
which is what `a_runtime_graph_denial_makes_the_rebuild_select_the_next_proven_graph`
pins.

The graph check runs before the decode classifier because it is the more
specific diagnosis. Both paths bound the retry to one attempt
(`learned_graph_retry_used` in the HLS worker, the single-shot `retry.take()` in
IPTV), and an unclassified failure or a refused rebuild stays terminal.

Regressions: `the_selected_graph_is_derived_from_the_command_that_actually_ran`
and `a_runtime_graph_denial_makes_the_rebuild_select_the_next_proven_graph`;
`cargo xtask smoke` passes.

Narrower than closed: the supervisor-level tests this debt asks for — both
stream families driven through a real failing spawn, both fallback levels, and
persistence/reload across a restart — were not written. The classification,
attribution, persistence, and rebuild-selection steps are each covered
individually, but the assembled supervisor path is not.

Closed 2026-08-08. `a_runtime_graph_failure_is_classified_persisted_and_reloadable`
drives the ladder both supervisors follow — classify the captured FFmpeg 9
stderr, resolve the device identity, persist a device-scoped denial, confirm the
in-memory report the rebuild sees now denies the graph, and confirm it survives
a restart so the next session does not retry a known-broken graph.
`an_unrecognised_runtime_failure_produces_no_denial_and_no_retry` pins the
terminal case: the supervisors only enter the ladder when `classify` returns
`Some`, so an arbitrary failure never learns a denial and never respawns.

Driven against the persistence layer rather than through the supervisors
themselves, which need a live child process and a duplex stream. Rebuild
selection from the resulting state is covered separately by
`a_runtime_graph_denial_makes_the_rebuild_select_the_next_proven_graph`, and
attribution by `the_selected_graph_is_derived_from_the_command_that_actually_ran`.

Second-review correction, 2026-08-08: live classification is now deliberately
narrower than synthetic-probe classification. `classify_runtime` requires
selected-operation filter/device evidence and rejects generic filter
reinitialization, output-pad, subtitle-filter, and encoder-open failures. Learned
denials are merged into the process-wide runtime report as well as the local
snapshot and database, so new HLS workers and direct requests use them without a
restart. Learning is independent from retry permission: a failed CUDA fallback
is persisted and published after the single Vulkan-to-CUDA retry, but is not
retried again. `graph_fallback_failure_is_learned_without_a_second_retry` drives
the direct supervisor through two failing child processes and asserts both
denials in persistence and shared state; the classifier controls and shared
merge have focused regressions in `graph_probe.rs` and `hardware_graph.rs`.

Review follow-up, 2026-08-08: publishing and persistence now share one runtime
write guard, and the database is written from that merged process-wide report.
Therefore a stale HLS or direct-IPTV worker snapshot cannot replace a denial
learned by another worker. The analogous hardware-decode path now has the same
process-wide contract, and direct IPTV retains a no-more-retries observer after
a decode fallback so a subsequent graph failure is still learned. Regressions:
`stale_worker_snapshot_persists_shared_denials_for_restart`,
`stale_worker_snapshot_persists_shared_decode_denials`, and
`graph_failure_after_decode_retry_is_learned_without_a_second_retry`.
'''
resolved    = true

[[debt]]
id          = 'vulkan-graph-probe-does-not-use-the-playback-device-chain'
adr         = '0014'
description = 'P2: Generate the Vulkan probe from the same selected-device initialization used by playback: initialize `cuda=nv`, derive `vulkan=vk@nv`, use the same filter device and graph operations, and key the result to that selected GPU. Keep probe and pipeline argv construction coupled so they cannot drift. Closure requires exact-argv tests comparing the shared device prefix and a multi-device/llvmpipe regression proving that a standalone default Vulkan device cannot approve or deny the NVIDIA playback graph.'
discovered  = '2026-08-07'
evidence    = 'Playback emits `-init_hw_device cuda=nv` followed by `-init_hw_device vulkan=vk@nv`, while `HardwareGraphOperation::NvencHdrVulkanLibplacebo::probe_arguments` initializes standalone `vulkan=vk`; the two commands may select different physical devices.'
remediation = '''
Closed 2026-08-08. `NVENC_HDR_DEVICE_PREFIX` is a single shared constant used by
both the probe command and the playback pipeline, so they cannot drift: both
initialize `cuda=nv`, derive `vulkan=vk@nv` from it, and set `-filter_hw_device vk`.
The probe previously opened a bare `-init_hw_device vulkan`, which selects the
default Vulkan device.

That distinction is not academic. On the maintainer's WSL2 host the default
Vulkan device is `llvmpipe`, a software rasterizer that is not the playback GPU
at all — so the old probe was answering for a device playback never touches.

Re-running the real-hardware gate with the corrected chain returns the same
verdict for the right reason: `nvenc-hdr-vulkan-libplacebo` is denied with
"no usable Vulkan device" — the NVIDIA GPU genuinely exposes no Vulkan device
here — rather than the downstream `cuda-interop` symptom the llvmpipe path
produced. `nvenc-cuda-scale` remains proven.

Regressions: `the_vulkan_probe_and_the_pipeline_share_one_device_chain`
(exact-fragment comparison in both directions, and neither opens a default
Vulkan device) and `a_default_vulkan_device_cannot_stand_in_for_the_playback_gpu`.
'''
resolved    = true

[[debt]]
id          = 'hardware-graph-cache-conflates-completion-with-denials'
adr         = '0014'
description = 'P2: Persist an explicit graph-probe cache record containing completion state, positively proven operations, classified denials, FFmpeg binary identity, and selected device/driver identity. Startup may reuse it only when every identity matches and all applicable operations have terminal evidence; an all-successful empty denial list must remain a valid cache, while a copied/stale/partial record must re-probe and stay non-selectable until proven. Closure requires success-with-zero-denials, partial/unclassified failure, FFmpeg replacement-at-same-path, GPU/driver change, malformed legacy row, and settings-refresh invalidation tests.'
discovered  = '2026-08-07'
evidence    = '`bootstrap.rs` uses `hardware_graph_denials.is_empty()` as the probe-completion marker. All-successful probes therefore run every startup, while any denial can suppress probing even when it belongs to another device; persistence records only the FFmpeg path and denial list.'
remediation = '''
Closed 2026-08-08. The persisted record now carries completion state, positively
proven operations, and the device identity alongside the ffmpeg path and the
classified denials. `is_reusable_for` requires matching identities and terminal
evidence — proven or denied — for every applicable operation, and
`apply_hardware_graph_denials` returns whether the record was reused so startup
re-probes when it was not.

This removes the conflation at both ends. Startup previously re-probed based on
`hardware_graph_denials.is_empty()`, which reads a fully successful probe as
"never probed"; and an empty list from an unprobed machine was
indistinguishable from one where every graph passed.

`deny_hardware_graph` now also drops any earlier proof of the same operation on
the same device. A graph cannot be simultaneously proven and denied, and the
denial is the newer evidence — a startup probe can pass while the graph still
fails under real media.

Regressions: `only_a_complete_identity_matching_record_is_reused` covers
success-with-zero-denials (a valid cache), a partial record left by an
unclassified probe failure, a GPU swap, and FFmpeg replaced at the same path;
`a_legacy_record_is_discarded_rather_than_trusted` covers the pre-existing row
shape, which carries neither completion nor device evidence and is cleared
rather than partially applied. Settings-refresh invalidation is covered by
`graph_state_persists_overwrites_clears_and_reloads`.
'''
resolved    = true

[[debt]]
id          = 'graphics-animation-detection-does-not-parse-container-structure'
adr         = '0003'
description = 'P2: Replace the 4 KiB marker scan with bounded structural readers. Count GIF image descriptors while correctly skipping extension sub-blocks so multi-frame GIFs do not depend on a `NETSCAPE2.0` loop extension; walk RIFF/WebP chunks (including padding and declared sizes) or read the VP8X animation flag so metadata before `ANIM` is safe. Corrupt/truncated/oversized inputs must fail closed without unbounded allocation. Closure requires static controls, a two-frame GIF without a loop extension, a WebP with more than 4 KiB of leading metadata, misleading marker bytes, truncation cases, argv assertions, and a real FFmpeg input-open/loop smoke test.'
discovered  = '2026-08-07'
evidence    = '`image_file_is_animated` reads only 4,096 bytes and searches for `ANIM` or `NETSCAPE2.0`; valid animated GIFs need not carry the loop extension, and valid WebP chunk ordering can place `ANIM` beyond that prefix, causing `graphics_image` to emit the fatal image2-only `-loop 1` option.'
remediation = '''
Closed 2026-08-08. `image_file_is_animated` now parses container structure
instead of scanning a 4 KiB prefix for marker bytes.

GIF: counts image descriptors and stops at the second, skipping extension and
image sub-block chains properly. It deliberately does not consult
`NETSCAPE2.0`, which only carries the loop count — a valid multi-frame GIF need
not have one. Sub-block skipping is the part a scan gets wrong, since compressed
sub-block data can contain any byte including the `0x2C` image separator.

WebP: walks RIFF chunks by declared size with even-boundary padding, reads the
authoritative `VP8X` animation flag, and recognises `ANIM`/`ANMF` wherever they
legitimately sit. A plain `VP8 `/`VP8L` file is a still by definition.

Bounded and fails closed: at most 1 MiB is read, `skip_exact` advances in 4 KiB
chunks so a chunk declaring `u32::MAX` cannot allocate, and anything
unreadable, truncated, malformed, or unrecognised reads as a still — the safe
direction, since a still misclassified as animated breaks playback outright
while the reverse merely fails to loop.

Coverage: `animation_detection_parses_container_structure_not_marker_bytes`
(positive and negative controls, plus the two new fixtures a scan gets wrong —
a two-frame GIF with no loop extension, and a WebP whose `ANIM` sits at offset
6038 behind a 6000-byte XMP chunk) and
`animation_detection_fails_closed_on_hostile_and_truncated_input` (misleading
marker bytes appended to a still, a text file containing the markers,
truncations at each structural boundary, an oversized declared chunk, and a
non-terminating GIF sub-block chain).

Runtime proof:
`detection_agrees_with_ffmpeg_about_which_loop_option_opens_the_input` asserts
for every fixture that the option ErsatzRS would emit opens the input under real
FFmpeg 9 and that the other option does not — the asymmetry that makes a
detection mistake fatal.
'''
resolved    = true
