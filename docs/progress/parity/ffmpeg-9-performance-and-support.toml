summary    = '''
UCU-16 row293 is Covered by the existing managed FFmpeg9 runtime. Paired
complex/simple ASS and SRT render controls and the independent glyph control
prove Arabic shaping. Milestone ucu-16-continuation owns the exact runtime
and retained evidence.

UCU-09 closeout corrected hardware graph probe child cleanup on timeout and
cancellation. A regression failed before the fix and passes with child-exit
verification; all 19 hardware graph tests pass. UCU-09 owns the evidence.

UCU-09 row169 adds provider rotation and Next schema 0.0.5, with decoded four-angle/audio and HTTP smoke proof. Native autorotation is unchanged; the orientation health query now uses the correct video kind. The milestone owns evidence; existing hardware debt is unchanged.

Deferred after Phase 8 and explicitly non-blocking for Phase 9. The FFmpeg 9
differential review found no additional mandatory
command migration after ADR 0063. Phase 8 added operation-scoped NVIDIA graph
probes, persisted denials, health visibility, long-filtergraph file transport,
source-orientation handling, and animated WebP coverage. A 2026-08-07 follow-up
review found that the graph implementation still lacks trustworthy positive
probe/cache state, exact playback-device probing, denial handling in command
selection, runtime supervisor fallback, and portable persistence. The same
review found that graphics animation detection still relies on a bounded marker
scan instead of parsing GIF/WebP structure. Those findings are tracked as
separate open debt below.

The 2026-08-09 residue closeout makes runtime publication coherent: FFmpeg and
ffprobe paths and digests, selected CUDA device/driver identity, graph proof,
learned denials, and a monotonic generation now move together. Settings saves
stage the candidate and publish only after one transaction succeeds; stale
children cannot mutate a replacement generation. NVIDIA capabilities are
probed only for the explicitly selected device zero. Operation probing now also
covers the exact Dolby Vision Profile 5 SDR/H.264 and HDR10/HEVC graphs.

The unresolved hardware and multi-vendor evidence gates remain visible below
for later opportunistic closure; they are not required for Phase 8 closeout or
Phase 9 entry. Vulkan already exists as an internal NVENC HDR processing bridge; it is not a
persisted hardware-acceleration kind. First-class Vulkan H.264/HEVC encoding is
deferred until the existing graph is proven, multi-vendor benchmarks exist, and
a later ADR accepts the schema/UI/release-matrix consequences. Work sequencing
and acceptance live in milestones `p8b-01` through `p8c-04`; the deferred
`p8c-04` decision and the remaining hardware-blocked proof are owned by
`plans/phase-8-hardware-residue.md`.
'''

[[debt]]
id          = 'hardware-graph-probes-cover-only-the-nvidia-graphs'
adr         = '0014'
description = 'The operation-scoped functional probe covers the NVIDIA CUDA scale, Vulkan/libplacebo HDR, and two Profile 5 output graphs. QSV, VAAPI/OpenCL, AMF, VideoToolbox, RKMPP, and V4L2M2M graphs are still selected from advertised capabilities alone, so the same advertised-but-nonfunctional class of failure remains possible there. Extend `HardwareGraphOperation` as those paths gain evidence.'
discovered  = '2026-08-07'
evidence    = '''
`HardwareGraphOperation` in `crates/ersatzrs-ffmpeg/src/graph_probe.rs` defines
`NvencHdrVulkanLibplacebo`, `NvencCudaScale`,
`NvencDolbyVisionProfile5Sdr`, and `NvencDolbyVisionProfile5Hdr10`.
`refresh_hardware_graph_capabilities` still returns early unless the `cuda`
hwaccel is advertised. Only NVIDIA hardware was available to characterize
during Phase 8.


Measured on the development machine 2026-08-08, which is why these paths could
not be characterized here rather than merely "no hardware was available":
`ffmpeg -hwaccels` advertises cuda, vaapi, qsv, drm, opencl, vulkan, and amf,
and `hevc_vaapi`, `hevc_qsv`, and `hevc_amf` are all listed by `-encoders`, but
only cuda creates a device. `-init_hw_device vaapi` and `qsv` both fail with
-542398533, opencl reports no platforms (-1001), `hevc_qsv` cannot open an MFX
session (-9), and `hevc_amf` cannot load `libamfrt64.so.1`. There is no
`/dev/dri`. This is itself the advertised-but-nonfunctional class the graph
probe exists to catch, so it confirms the design while leaving the non-NVIDIA
graphs unproven.

Missing manual gate: a machine with a working Intel (QSV), AMD (VAAPI/AMF),
Apple (VideoToolbox), or Rockchip (RKMPP) device.
'''
resolved    = false

