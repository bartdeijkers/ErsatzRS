In progress: `/media/multi-collections` now ports the ErsatzTV multi-collection list plus add/edit/delete editor surface, including search, persisted page size (`pages.multi_collections.page_size`), manual/smart collection selectors with duplicate disabling, `ScheduleAsGroup` and `PlaybackOrder` persistence, name validation, transactional member replacement, `BuildPlayout(Refresh)` enqueue for playouts whose anchors reference an edited multi-collection, and persisted-language list/editor labels/actions/options/validation/toasts/pager text via per-culture translation modules. `/media/rerun-collections` ports the ErsatzTV list/add/edit/delete surface with persisted target/playback-order fields, HTML POST fallback save/delete paths, page-size config persistence, update-triggered playout refresh, and now persisted-language list/editor labels, actions, options, toasts, and pager text via per-culture translation modules. `/media/filler/presets` ports the ErsatzTV list/editor surface with persisted page size, kind/mode/duration/count/pad/watermark/collection-target/chapter/expression fields, HTML POST fallback save/delete paths, and now persisted-language list/editor labels, actions, options, pager text, toasts, and expression help text via per-culture translation modules. `/media/playlists` now ports the playlist group/tree and playlist editor route with add/delete group and playlist actions, item add/copy/move/delete, name save, item target/playback/count/play-all/EPG fields, validation, transactional item replacement, smart-collection-aware preview reference data dispatched through the canonical `PlayoutBuilder` Classic scheduler path, HTML POST fallback create/save/delete routes covered by browser smoke and focused tests, and persisted-language list/editor labels/actions/options/toasts/preview text via per-culture translation modules. Generated/system playlists intentionally diverge from ErsatzTV's disabled-editor presentation: ADR 0011 keeps scheduling semantics but renders generated rows as read-only projections with clearer Count and Play All labels.
