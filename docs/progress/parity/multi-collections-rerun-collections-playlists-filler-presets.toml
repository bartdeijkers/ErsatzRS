summary    = '''
Ported: `/media/multi-collections` ports the ErsatzTV multi-collection list plus add/edit/delete editor surface, including search, persisted page size (`pages.multi_collections.page_size`), manual/smart collection selectors with duplicate disabling, `ScheduleAsGroup` and `PlaybackOrder` persistence, name validation, transactional member replacement, `BuildPlayout(Refresh)` enqueue for playouts whose anchors reference an edited multi-collection, persisted-language list/editor labels/actions/options/validation/toasts/pager text via per-culture translation modules, and HTML POST fallback save/delete routes that share the hydrated validation/persistence path. `/media/rerun-collections` ports the ErsatzTV list/add/edit/delete surface with persisted target/playback-order fields, HTML POST fallback save/delete paths, page-size config persistence, update-triggered playout refresh, and persisted-language list/editor labels, actions, options, toasts, and pager text via per-culture translation modules. `/media/filler/presets` ports the ErsatzTV list/editor surface with persisted page size, kind/mode/duration/count/pad/watermark/collection-target/chapter/expression fields, HTML POST fallback save/delete paths, and persisted-language list/editor labels, actions, options, pager text, toasts, and expression help text via per-culture translation modules. `/media/playlists` ports the playlist group/tree and playlist editor route with add/delete group and playlist actions, item add/copy/move/delete, name save, item target/playback/count/play-all/EPG fields, validation, transactional item replacement, smart-collection-aware preview reference data dispatched through the canonical `PlayoutBuilder` Classic scheduler path, HTML POST fallback create/save/delete routes covered by browser smoke and focused tests, and persisted-language list/editor labels/actions/options/toasts/preview text via per-culture translation modules. Generated/system playlists intentionally diverge from ErsatzTV's disabled-editor presentation: ADR 0011 keeps scheduling semantics but renders generated rows as read-only projections with clearer Count and Play All labels. `tests/e2e/media-collection-route-family.spec.ts` proves the high-risk route-family surfaces in Chromium with deterministic SQLite seed data, the new multi-collection no-JS fallback, visible geometry checks, hydrated/fallback form controls, localized English labels, and no console/runtime errors.

ADR 0048 intentionally extends collection and playlist item rows with optional
audio/subtitle playback overrides. The add-to-collection/add-to-playlist flows
can now persist those overrides, collection detail and playlist editor surfaces
show compact override summaries, playlist HTML save fallback preserves them,
and scheduling expansion applies them before generated playout items are
persisted.

Closed 2026-07-03: migration `202607030900_collection_item_duplicate_rows`
rebuilds `CollectionItem` around a surrogate `Id` primary key (mirroring
`PlaylistItem`) in both the SQLite and MySQL schemas, so the same movie can
appear several times in one collection when each row carries a different
playback override. Add flows skip rows whose override tuple is identical
(NULL-safe) to an existing row for the same media item, so default adds stay
idempotent; the collection detail page selects, removes, and reorders by row
identity with per-row override summaries; and scheduling expansion dedupes on
(media item, override tuple) so duplicate rows schedule separately with their
own overrides. Proven by
`scheduling_repository_expands_duplicate_collection_rows_with_distinct_overrides`
(ersatzrs-infra) and
`duplicate_collection_rows_with_distinct_overrides_persist_and_remove_independently`
(ersatzrs-web).
'''

