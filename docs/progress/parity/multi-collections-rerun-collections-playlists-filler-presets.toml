id          = 'collection-item-duplicate-playback-overrides'
adr         = '0048'
description = 'The same movie should be addable to the same collection multiple times when each row has a different playback override, so movies with multiple commentary or alternate audio tracks can have every track represented in one collection.'
discovered  = '2026-07-02'
evidence    = 'Maintainer request on 2026-07-02. Current SQLite and MySQL schemas keep `CollectionItem` keyed by `(CollectionId, MediaItemId)` (`PK_CollectionItem`), and the ADR 0048 migration only adds nullable override columns, so the model cannot represent two rows for the same movie in one collection even when `PreferredAudioTitle`, preferred audio/subtitle language, or `SubtitleMode` differ. Reclose only after the collection item identity, add-to-collection flow, collection detail UI, scheduling expansion, SQLite/MySQL migrations, and focused tests prove duplicate same-movie rows with distinct overrides persist and schedule separately.'
resolved    = true
