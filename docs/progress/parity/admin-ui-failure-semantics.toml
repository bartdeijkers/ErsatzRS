description = 'Admin pages frequently call server functions with `.await.unwrap_or_default()`, so settings, source, library, scheduling, and troubleshooting failures can render as plausible defaults or empty data.'
discovered  = '2026-07-21'
evidence    = 'The audit found 149 textual `await ... unwrap_or_default()` occurrences under `crates/ersatzrs-web/src/admin`; the settings parity history already records a real schema error that silently rendered defaults. Close incrementally through milestone p7a-03.'
resolved    = false

