adr        = []
summary    = '''
Not started: many admin resources display empty collections or default forms
when a server function fails, making operational and schema failures look like
valid state. The planned hardening adds reusable localized load/error states,
typed infrastructure read models, and route-family migrations that preserve
real empty-state UX while making failures visible and actionable.
'''

