feature    = 'Support pages (Health / Logs / Troubleshooting)'
etv_source = '`ErsatzTV/Pages/Index.razor`, `ErsatzTV/Pages/Logs.razor`, `ErsatzTV/Pages/Troubleshooting/`'
rs_target  = '`crates/ersatzrs-web/src/admin/pages/system/`, `crates/ersatzrs-web/src/admin/languages/`, `tests/e2e/support-pages.spec.ts`'
status     = 'Ported'
adr        = []
summary    = '''
Ported: `/system/health` renders an ErsatzTV-style two-column health table from
the live health service, filters `NotApplicable` rows, refreshes after scanner
state changes, and feeds the Support nav warning/error badge from persisted
startup/runtime health summaries. `/system/logs` reads the newest OS-local
app-data log file and exposes the ErsatzTV-visible search, sort, paging, and
localized level labels. `/system/troubleshooting` exposes the Tools tab plus
General and platform hardware report tabs; the General report is server-side
JSON from live ErsatzRS state with selected environment values redacted,
runtime paths, CPU summary, warning/fail health rows, FFmpeg settings,
channels, and FFmpeg profiles. Tool routes cover Sequential Schedule
Validation, Block Playout Troubleshooting, media-specific playback
troubleshooting, and the ADR 0013 MPEG-TS tool at
`/system/troubleshooting/mpeg`, which captures bounded channel samples, runs
optional TSDuck continuity/PCR/analyze/bitrate checks, writes redacted report
artifacts, and keeps raw `.ts` samples only when the user opts in. Playback
troubleshooting archives and media samples have real download side effects, and
the generated troubleshooting HLS session route serves the produced playlist
and segments. Visible labels/statuses use the shared persisted-language i18n
layer for `en-us`, `pl`, `pt-br`, and `nl`; focused Rust and e2e tests cover the
health/logs/troubleshooting/sequential/block/playback route family.
'''

[[debt]]
id          = 'remote-stream-zero-duration-health-warning'
description = 'Remote stream media versions with placeholder `00:00:00` duration triggered Zero Duration warnings on `/system/health`, even though live/URL streams can legitimately have no fixed duration.'
discovered  = '2026-06-22'
evidence    = 'Fixed 2026-06-22: `ZeroDurationHealthCheck` now excludes `MediaVersion` rows backed by `RemoteStreamId`; `zero_duration_check_ignores_remote_stream_placeholders` covers a live remote stream with a zero-duration placeholder and media-file URL.'
resolved    = true

[[debt]]
id          = 'channel-stream-selector-folder-disagreement'
description = 'The channel editor listed custom stream selectors from `<data>/scripts/channel-stream-selectors` while playback and playback troubleshooting read `<data>/channel-stream-selectors`, so a selector offered by the channel dropdown was never applied. The folder was also never created at startup, and the extracted troubleshooting runtime turned the resulting `NotFound` into a hard error that replaced the whole `/system/troubleshooting/playback` page with an error message.'
discovered  = '2026-07-25'
evidence    = 'Fixed 2026-07-25: `file_system_layout::channel_stream_selectors_folder` is now the single source of truth for all four call sites, matching `FileSystemLayout.ChannelStreamSelectorsFolder` (`ScriptsFolder/channel-stream-selectors`). `list_channel_stream_selectors` mirrors `LocalFileSystem.ListFiles` — files only, `._*` skipped, absent or unreadable folder yields an empty list — and both the channel editor and the troubleshooting page call it, so they cannot disagree. `host::bootstrap` creates the folder like `Startup.cs` does. Covered by `listing_channel_stream_selectors_treats_a_missing_folder_as_empty`, `listing_channel_stream_selectors_keeps_every_file_but_resource_forks`, and `channel_stream_selectors_folder_keeps_the_ersatztv_scripts_grouping`; regression seen in CI run 30132852456 (`support-pages.spec.ts`, `content-variants.spec.ts`).'
resolved    = true
