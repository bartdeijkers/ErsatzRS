adr         = '0089'
description = 'ADR 0089 removed Logs and Troubleshooting from the navigation drawer in favour of `SystemPageLayout` route tabs, but only the three top-level pages (`/system/health`, `/system/logs`, `/system/troubleshooting`) render the tab strip. The five `/system/troubleshooting/*` detail routes (mpeg, sequential-schedule, block-playout, block-playout/history, playback) do not, so a user deep-linked into one — for example from the media browser playback-troubleshooting links — has no in-page path to Logs and must go through the drawer Support link. The Settings section already implements the equivalent behavior for `/settings/addons/<id>` via `SettingsPageLayoutForPath`.'
discovered  = '2026-09-09'
