summary    = '''
ADR 0132 adds bounded read-only preflight of upcoming local native subtitle
encodings, with all-culture Health messages and existing refresh/SSR behavior.
Milestone subtitle-encoding owns its finite verification and incident evidence.

Upstream catch-up row 1 (1e5c0b12, PR #2842) was Covered when upstream removed
release notes. Row 65 (3e1918c9, PR #2942) restores a release-notes card on
both `/` and `/system/health`. The card renders sanitized Markdown from the
bundled changelog's installed-tag section, or its latest dated release for a
development build, and links to the full local changelog. The optional GitHub
link remains available to operators with repository access; unauthenticated
GitHub release requests returned 404 at reconciliation time.

Ported: `/system/health` renders an ErsatzTV-style two-column health table from
the live health service, filters `NotApplicable` rows, refreshes after scanner
state changes, and feeds the Support nav warning/error badge from persisted
startup/runtime health summaries. `/system/logs` reads the newest OS-local
app-data log file and exposes the ErsatzTV-visible search, sort, paging, and
localized level labels. `/system/troubleshooting` exposes the Tools tab plus
General and platform hardware report tabs; the General report is server-side
JSON from live ErsatzRS state with selected environment values redacted,
runtime paths, detected application/Next/FFmpeg versions, CPU summary, warning/fail health rows, FFmpeg settings,
channels, and FFmpeg profiles. UCU-05 row 80 shares the detected version fields
with playback troubleshooting archives and uses in-order SSR so General JSON
renders without JavaScript. Four focused Chromium/Firefox checks pass; optional
Next absence is explicit, and populated version values have unit coverage.
Tool routes cover Sequential Schedule
Validation, Block Playout Troubleshooting, media-specific playback
troubleshooting, and the ADR 0013 MPEG-TS tool at
`/system/troubleshooting/mpeg`, which captures bounded channel samples, runs
optional TSDuck continuity/PCR/analyze/bitrate checks, writes redacted report
artifacts, and keeps raw `.ts` samples only when the user opts in. Playback
troubleshooting archives and media samples have real download side effects, and
the generated troubleshooting HLS session route serves the produced playlist
and segments. UCU-06 row 93 adds Legacy/Next controls, shared Hls.js playback,
completion logs and in-order SSR for the no-JS GET form. UCU-09 row151 adds a
music-only credits template selector, seek-correct generated ASS and exact
template copies in both-engine diagnostic archives, preserving audio and
persisted channel/playout state. Chromium and Firefox
prove both engines, reports and narrow layouts. Visible labels/statuses use the shared persisted-language i18n
layer for `en-us`, `pl`, `pt-br`, and `nl`; focused Rust and e2e tests cover the
health/logs/troubleshooting/sequential/block/playback route family.

Navigation diverges from ErsatzTV per ADR 0089: the drawer's expanded Support
group is collapsed into one badged `Support` link (`/system/health`, active
across `/system/*`), and `/system/health`, `/system/logs`, and
`/system/troubleshooting` render as in-page route tabs through
`SystemRouteTabs` / `SystemPageLayout`, mirroring the existing Settings route
tabs. The health warning/error badge moved from the group header onto the
Support link and is now visible regardless of drawer scroll position.
Findings 07/08 for v1.1.1 add shared persisted-mode decoding and owned transient
preview states with POST Play/Stop, generation-fenced HLS output and explicit
UTC/programme seek. Both corrections are accepted locally. The feature remains
In progress until the integrated v1.1.1 web parity closeout; remaining channel
setup findings and release acceptance are not implied by these focused proofs.

'''

[[debt]]
id          = 'remote-stream-zero-duration-health-warning'
description = 'Remote stream media versions with placeholder `00:00:00` duration triggered Zero Duration warnings on `/system/health`, even though live/URL streams can legitimately have no fixed duration.'
discovered  = '2026-06-22'
evidence    = 'Fixed 2026-06-22: `ZeroDurationHealthCheck` now excludes `MediaVersion` rows backed by `RemoteStreamId`; `zero_duration_check_ignores_remote_stream_placeholders` covers a live remote stream with a zero-duration placeholder and media-file URL.'
resolved    = true

[[debt]]
id          = 'tsduck-gate-misses-delivery-starvation'
adr         = '0013'
description = 'The manual TSDuck URL gate validated packet integrity but did not compare PCR media elapsed time with wall time; its first packet-count divided by nominal-bitrate correction also misclassified variable-rate HLS.'
discovered  = '2026-08-29'
evidence    = 'Resolved 2026-08-30: the URL gate extracts first-to-last PCR media duration with TSDuck pcrextract, compares it with monotonic capture time, measures startup separately, evaluates rolling byte-rate against the capture average instead of nominal PCR bitrate, and redacts query strings. Deterministic healthy, bursty, starved, startup-timeout, and empty rolling-window cases pass without provider access; a 180-second calibration clip reports 179983 ms of PCR media time.'
resolved    = true

[[debt]]
id          = 'channel-stream-selector-folder-disagreement'
description = 'The channel editor listed custom stream selectors from `<data>/scripts/channel-stream-selectors` while playback and playback troubleshooting read `<data>/channel-stream-selectors`, so a selector offered by the channel dropdown was never applied. The folder was also never created at startup, and the extracted troubleshooting runtime turned the resulting `NotFound` into a hard error that replaced the whole `/system/troubleshooting/playback` page with an error message.'
discovered  = '2026-07-25'
evidence    = 'Fixed 2026-07-25: `file_system_layout::channel_stream_selectors_folder` is now the single source of truth for all four call sites, matching `FileSystemLayout.ChannelStreamSelectorsFolder` (`ScriptsFolder/channel-stream-selectors`). `list_channel_stream_selectors` mirrors `LocalFileSystem.ListFiles` — files only, `._*` skipped, absent or unreadable folder yields an empty list — and both the channel editor and the troubleshooting page call it, so they cannot disagree. `host::bootstrap` creates the folder like `Startup.cs` does. Covered by `listing_channel_stream_selectors_treats_a_missing_folder_as_empty`, `listing_channel_stream_selectors_keeps_every_file_but_resource_forks`, and `channel_stream_selectors_folder_keeps_the_ersatztv_scripts_grouping`; regression seen in CI run 30132852456 (`support-pages.spec.ts`, `content-variants.spec.ts`).'
resolved    = true

