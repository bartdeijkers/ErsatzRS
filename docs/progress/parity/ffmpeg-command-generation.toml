feature    = 'FFmpeg command generation'
etv_source = '`$ERSATZTV_SRC/ErsatzTV.FFmpeg/CommandGenerator.cs`'
rs_target  = '`crates/ersatzrs-ffmpeg`'
status     = 'In progress'
adr        = ['0003', '0014', '0017']

summary    = '''
Current command-generation parity covers the software pipeline plus NVENC,
VAAPI, QSV, AMF, VideoToolbox, RKMPP, and V4L2M2M command shapes with snapshot
coverage. `PipelineRequest` carries source stream metadata, decoder selection
uses the ErsatzTV known-decoder table, and hardware globals/filters are gated by
runtime capability reports before they are emitted. Audio/video output options
now mirror ErsatzTV's command layer for resampling/apad, channels/bitrate/buffer
size/sample-rate gates, scene-detect and GOP flags, MP4/fMP4/HLS movflags,
timescale, frame-rate output, MPEG-TS offset, realtime input, still-image loop,
time limits, output metadata, and platform-specific encoder options.

Hardware capability coverage is in place for VAAPI/QSV device rows, NVIDIA CLI
and native CUDA/NVDEC/NVENC probes, direct macOS VideoToolbox framework
enumeration, and runtime-learned hardware decode denials. Unsupported or denied
decode paths fall back to software input decode while preserving the selected
hardware encoder, with denials persisted in `ConfigElement` and surfaced through
health/troubleshooting. Text/image subtitle, watermark, native graphics, HDR
tonemap, QSV/VAAPI/NVENC upload/download, and color-normalization branches are
snapshot-covered against the current command/filter builders.

The 2026-06-12 ADR 0014 slice added CUDA-filter decode gating, the conservative
NVIDIA architecture-table floor, direct IPTV `.ts`/HLS-direct learned-denial
retry, and denial invalidation when the FFmpeg binary changes or capabilities
are explicitly refreshed. The remaining ADR 0014 debt is live proof on an
encoder-only NVENC build with no CUDA filter kernels.

The 2026-06-16 slice carries `SourceVideoStream.index` and the selected audio
stream through `PipelineRequest` so transcode input maps use the persisted
MediaStream indexes (falling back to the first source audio stream when the
selected one is absent) instead of assuming `0:0`/`0:1`. This fixes watermarked
channels whose files store audio before video, which previously failed with a
filtergraph stream-specifier error (observed live on the MTV channel);
covered by the `pipeline_uses_persisted_stream_indexes_when_audio_precedes_video`
snapshot.

The 2026-06-19 ADR 0017 slice retuned fresh database FFmpeg defaults from the
single conservative `1920x1080 x264 aac` seed to five ready-to-use AC-3 6ch
profiles (720p, 1080p default, 1080p HDR, 4K, 4K HDR). Web startup now applies
the preferred available hardware encoder (Nvenc > Qsv > Vaapi > VideoToolbox >
Amf > None) to that fresh seed after the FFmpeg runtime report is captured,
using hardware-compatible presets (`llhq` for NVENC, `veryfast` for QSV,
unset where platform encoders reject software-style presets), without rewriting
existing profile tables. HLS segmenter output now emits `-max_delay 500000`
only for multichannel AC-3. Focused tests cover seeded DB rows/default pointer/
idempotence, seed hardware update, hardware preference selection, and AC-3
max-delay gating.
'''

