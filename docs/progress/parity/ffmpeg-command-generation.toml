feature    = 'FFmpeg command generation'
etv_source = '`$ERSATZTV_SRC/ErsatzTV.FFmpeg/CommandGenerator.cs`'
rs_target  = '`crates/ersatzrs-ffmpeg`'
status     = 'In progress'
adr        = ['0003', '0014']

summary    = '''
Current command-generation parity covers the software pipeline plus NVENC,
VAAPI, QSV, AMF, VideoToolbox, RKMPP, and V4L2M2M command shapes with snapshot
coverage. `PipelineRequest` carries source stream metadata, decoder selection
uses the ErsatzTV known-decoder table, and hardware globals/filters are gated by
runtime capability reports before they are emitted. Audio/video output options
now mirror ErsatzTV's command layer for resampling/apad, channels/bitrate/buffer
size/sample-rate gates, scene-detect and GOP flags, MP4/fMP4/HLS movflags,
timescale, frame-rate output, MPEG-TS offset, realtime input, still-image loop,
time limits, output metadata, and platform-specific encoder options.

Hardware capability coverage is in place for VAAPI/QSV device rows, NVIDIA CLI
and native CUDA/NVDEC/NVENC probes, direct macOS VideoToolbox framework
enumeration, and the HLS segmenter's runtime-learned hardware decode denial
slice. Unsupported or denied HLS decode paths fall back to software input decode
while preserving the selected hardware encoder. On a classified FFmpeg
hardware-decode-unsupported stderr signature, the HLS segmenter persists a
denial row in `ConfigElement`, updates the in-session runtime report, and retries
once so later HLS segmenter commands select software decode up front; learned
denials are currently reapplied after startup/settings FFmpeg runtime refresh
and are surfaced through health/troubleshooting. Text/image subtitle, watermark,
native graphics, HDR tonemap, QSV/VAAPI/NVENC upload/download, and
color-normalization branches are snapshot-covered against the current
command/filter builders.

Live NVENC/CUDA HLS proof on 2026-06-11 closed only the HLS learned-denial slice
of the AV1 fallback work using a temporary copy of the configured database
because the reported channel 4 no longer existed locally. The proof shifted
channel 2's existing AV1 item into the live window, preserved the learned denial
row, and captured the spawned segmenter argv as `-init_hw_device cuda -hwaccel
none -c:v libdav1d ... -codec:v h264_nvenc`; `/iptv/channel/2.m3u8?mode=segmenter`
and `/iptv/session/2/hls.m3u8` both returned 200, with generated MPEG-TS segment
bytes starting at sync byte `0x47`. Remaining ADR 0014 command-generation parity
debt is tracked below.
'''

[[debt]]
id          = 'nvidia-architecture-gate'
description = 'ADR 0014 requires porting ErsatzTVs conservative NVIDIA architecture gate as an additional AND for decode selection when GPU model information is available.'
discovered  = '2026-06-11'
evidence    = 'docs/adr/0014-runtime-learned-hardware-capability-fallback.md requires the upstream architecture table; the current implementation still relies on native/probed decoder rows plus learned denials.'

[[debt]]
id          = 'iptv-ts-learned-denial'
description = 'Runtime-learned hardware decode denial is implemented for the HLS segmenter only; ADR 0014 also requires IPTV .ts FFmpeg spawns to classify decode-unsupported stderr, retry once with software input decode, and persist the denial.'
discovered  = '2026-06-11'
evidence    = 'crates/ersatzrs-web/src/transport/iptv/stream.rs currently logs unsuccessful direct stream FFmpeg exits without denial classification, retry, or persistence.'

[[debt]]
id          = 'denial-refresh-invalidation'
description = 'ADR 0014 says learned denial rows are cleared when the FFmpeg capability report is explicitly refreshed by path change, settings-save refresh, or manual refresh; the current implementation reapplies persisted denials after startup/settings refresh.'
discovered  = '2026-06-11'
evidence    = 'crates/ersatzrs-web/src/host/bootstrap.rs and crates/ersatzrs-web/src/admin/server_fns/settings.rs apply persisted denials to fresh runtime reports.'

[[debt]]
id          = 'nvenc-decode-cuda-filter-gate'
description = 'NVENC hardware decode is not gated on the CUDA filters the GPU graph emits (`scale_cuda`/`yadif_cuda`/`overlay_cuda`) being present in the FFmpeg build. On an encoder-only build (NVENC encoders + `cuda` hwaccel, no `--enable-cuda-nvcc`/`--enable-cuda-llvm` filter kernels) the pipeline picks hardware decode and fails at runtime with "No such filter", and the ADR 0014 learned-denial stderr signatures do not match that error, so it never self-heals. Decode should fall back to software (keeping NVENC encode) when those filters are absent.'
discovered  = '2026-06-12'
evidence    = '`nvidia_decode` in `crates/ersatzrs-ffmpeg/src/capabilities.rs` checks denials, cuvid decoders, and decoder-detail bit depth but never `report.has_filter` for the CUDA filters; `REQUIRED_FILTERS` in `version.rs` correctly excludes them as optional. A working gate existed on the abandoned `fix/nvenc-gpu-acceleration` branch (commit `b1246b0`, recoverable from reflog) whose other changes are superseded by the landed surface-tracking approach.'
