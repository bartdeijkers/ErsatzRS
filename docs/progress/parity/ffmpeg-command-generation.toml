feature    = 'FFmpeg command generation'
etv_source = '`$ERSATZTV_SRC/ErsatzTV.FFmpeg/CommandGenerator.cs`'
rs_target  = '`crates/ersatzrs-ffmpeg`'
status     = 'In progress'
adr        = ['0003', '0014']

summary    = '''
Current command-generation parity covers the software pipeline plus NVENC,
VAAPI, QSV, AMF, VideoToolbox, RKMPP, and V4L2M2M command shapes with snapshot
coverage. `PipelineRequest` carries source stream metadata, decoder selection
uses the ErsatzTV known-decoder table, and hardware globals/filters are gated by
runtime capability reports before they are emitted. Audio/video output options
now mirror ErsatzTV's command layer for resampling/apad, channels/bitrate/buffer
size/sample-rate gates, scene-detect and GOP flags, MP4/fMP4/HLS movflags,
timescale, frame-rate output, MPEG-TS offset, realtime input, still-image loop,
time limits, output metadata, and platform-specific encoder options.

Hardware capability parity is in place for VAAPI/QSV device rows, NVIDIA CLI and
native CUDA/NVDEC/NVENC probes, and direct macOS VideoToolbox framework
enumeration. Unsupported decode paths are intended to fall back to software
input decode while preserving the selected hardware encoder. Text/image
subtitle, watermark, native graphics, HDR tonemap, QSV/VAAPI/NVENC
upload/download, and color-normalization branches are snapshot-covered against
the current command/filter builders.

Remaining `ParityDebt` is structured below: live HLS segmenter runtime evidence
from 2026-06-10 still shows unsupported AV1 CUDA decode reaching FFmpeg instead
of taking the software-input fallback on the NVENC encode path.
'''

[[debt]]
id          = 'av1-nvenc-live-fallback'
description = 'Unsupported AV1 CUDA/NVDEC decode still reaches the live HLS segmenter instead of falling back to software input decode while preserving NVENC encode.'
discovered  = '2026-06-10'
evidence    = "ErsatzRS.log: channel 4 HLS segmenter exits 69 with \"Your platform doesn't support hardware accelerated AV1 decoding\", packet submit errors, CUDA_ERROR_INVALID_VALUE, and Decode error rate 1 exceeds maximum."
