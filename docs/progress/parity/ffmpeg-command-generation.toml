id          = 'default-profile-1080p60-retune'
adr         = '0017'
description = 'ensure_default_ffmpeg_profile in crates/ersatzrs-infra/src/db.rs still seeds a single conservative ErsatzTV baseline profile ("1920x1080 x264 aac": H.264 High, preset unset/medium, no B-frames, video 2000/4000 kbit, AAC 192 kbps stereo) and never enables hardware acceleration. ADR 0017 (revised) replaces this with FIVE seeded profiles, all AC-3 6ch 640/640 kbit: (1) 1280x720 x264 8-bit SDR 8000 kbit; (2) 1920x1080 x264 8-bit SDR 16000 kbit [default]; (3) 1920x1080 x265 Main10 10-bit HDR10 20000 kbit; (4) 3840x2160 x265 8-bit SDR 45000 kbit; (5) 3840x2160 x265 Main10 10-bit HDR10 60000 kbit. VBV ~= 1x bitrate, B-frames off, deinterlace on, framerate-normalize off, software preset veryfast; bitrates tuned for 25 fps over 1 Gbps unicast (N=2). Seed-time hardware-acceleration detection (Nvenc>Qsv>Vaapi>VideoToolbox>Amf>None) sets hardware_acceleration on all five, with ADR 0014 runtime fallback as the safety net. ffmpeg.default_profile points at profile #2. Resolutions 1280x720/1920x1080/3840x2160 are already seeded. The crates/ersatzrs-ffmpeg DesiredVideoState fallbacks should align. Fresh-DB seed only; existing saved profiles are not overwritten. Implementing the HDR/4K cells also requires HEVC Main10 + 10-bit HDR (BT.2020/PQ) and hardware encode support in the pipeline where not already wired.'
