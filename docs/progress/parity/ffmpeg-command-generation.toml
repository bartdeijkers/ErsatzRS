or generated h264/hevc/mpeg2video/mpeg4/vp8/vp9/av1 samples when matching sample encoders are available, gates NVENC encode by reported pixel formats/profiles when detail rows are present, adds typed `nvidia_decoders` rows for native CUDA/NVDEC codec + bit-depth detail, gates NVENC decode by those rows when present so unsupported device decode falls back to software input while preserving NVENC encode, ports NVIDIA text-subtitle burn upload/download routing so CUDA frames are downloaded before `subtitles` and re-uploaded before later CUDA watermark/graphics overlays, mirrors the upstream NVIDIA Vulkan HDR tonemap global-option branch (`cuda=nv`, `vulkan=vk@nv`, `-hwaccel vulkan`, `-hwaccel_output_format vulkan`) when Vulkan is reported and not disabled, ports VAAPI text-subtitle burn routing so hardware frames are downloaded before `subtitles` and re-uploaded before VAAPI encode, ports VAAPI forced software overlay routing for combined image subtitle plus watermark and `radeonsi` drivers, mirrors the AMF/VideoToolbox/V4L2M2M/RKMPP `SetPixelFormat` builders by always emitting the desired `-pix_fmt` output option for those transcodes, ports the upstream NVENC green-line plus VAAPI/radeonsi crop-metadata bitstream-filter workarounds (`h264_metadata`/`hevc_metadata`) with targeted snapshots, keeps the VAAPI/radeonsi workaround HEVC-only like upstream, ports the shared `NoDemuxDecodeDelayOutputOption` so generated transcode argv includes `-muxdelay 0 -muxpreload 0` before `-movflags +faststart`, matches ErsatzTV's closed-GOP flag spelling (`-flags cgop`), matches ErsatzTV's audio sample-rate output spelling (`-ar 48k` style from kHz profiles), ports ErsatzTV's conditional `AudioChannelsOutputOption` so `-ac` is emitted only when selected source channels differ from the desired output or AAC/AAC-LATM surround output requires an explicit channel count, ports `AudioBufferSizeOutputOption` and the upstream non-NUT gate for audio bitrate, buffer size, and sample rate output options, ports ErsatzTV's MP4/fMP4 movflags selection for HLS direct MP4 copy and fragmented MP4 HLS output, ports `VideoTrackTimescaleOutputOption` with the upstream 90000 playback timescale for non-copy video, ports `SetSceneDetect`/`NoSceneDetectOutputOption` so non-copy transcodes emit `-sc_threshold 0` except MPEG-2 and VideoToolbox decode paths, which use the upstream-supported `1000000000` threshold, mirrors the NVENC image-subtitle `scale_npp` branch when FFmpeg reports the filter and the primary video path was spatially scaled or padded, splits VideoToolbox plus NVENC encode/decode capability decisions so unsupported decode paths fall back to software input without dropping the hardware encoder, splits QSV encode/decode capability decisions so missing QSV decode keeps software input decode while still initializing the QSV filter device, hiding CUDA devices, uploading software frames for QSV filtering, and using the QSV encoder, ports ErsatzTV's QSV 10-bit H.264/HEVC decode workaround plus no-seek multiple-H.264-profile workaround so those sources use software input decode while retaining QSV filtering/encode, populates the QSV multiple-H.264-profile flag from the ErsatzTV-style local-statistics/profile-count trace-headers probe on playback command paths, ports the upstream DTS seek `-c:a dts -core_only true` and AC3 stereo `-c:a ac3 -downmix stereo` input decoder branches using persisted source audio stream metadata on HLS/IPTV/troubleshooting command paths, ports the upstream still-image `loop=-1:1` video filter branch from `SetStillImageLoop` using persisted image media-version metadata, ports `SetRealtimeInput`/`ReadrateInputOption` so realtime transcodes add `-readrate 1.05` and realtime copy/direct paths add `-readrate 1.0` while preserving shared-input decoder-option folding, ports `SetTimeLimit`/`TimeLimitOutputOption` so generated troubleshooting preview commands emit fixed-width `-t HH:MM:SS.fffffff` output limits through `FfmpegState` instead of po