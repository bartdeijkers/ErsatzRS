feature    = 'FFmpeg command generation'
etv_source = '`$ERSATZTV_SRC/ErsatzTV.FFmpeg/CommandGenerator.cs`'
rs_target  = '`crates/ersatzrs-ffmpeg`'
status     = 'In progress'
adr        = ['0003', '0014', '0017']

summary    = '''
Current command-generation parity covers the software pipeline plus NVENC,
VAAPI, QSV, AMF, VideoToolbox, RKMPP, and V4L2M2M command shapes with snapshot
coverage. `PipelineRequest` carries source stream metadata, decoder selection
uses the ErsatzTV known-decoder table, and hardware globals/filters are gated by
runtime capability reports before they are emitted. Audio/video output options
now mirror ErsatzTV's command layer for resampling/apad, channels/bitrate/buffer
size/sample-rate gates, scene-detect and GOP flags, MP4/fMP4/HLS movflags,
timescale, frame-rate output, MPEG-TS offset, realtime input, still-image loop,
time limits, output metadata, and platform-specific encoder options.

Hardware capability coverage is in place for VAAPI/QSV device rows, NVIDIA CLI
and native CUDA/NVDEC/NVENC probes, direct macOS VideoToolbox framework
enumeration, and the HLS segmenter's runtime-learned hardware decode denial
slice. Unsupported or denied HLS decode paths fall back to software input decode
while preserving the selected hardware encoder. On a classified FFmpeg
hardware-decode-unsupported stderr signature, the HLS segmenter persists a
denial row in `ConfigElement`, updates the in-session runtime report, and retries
once so later HLS segmenter commands select software decode up front; learned
denials are currently reapplied after startup/settings FFmpeg runtime refresh
and are surfaced through health/troubleshooting. Text/image subtitle, watermark,
native graphics, HDR tonemap, QSV/VAAPI/NVENC upload/download, and
color-normalization branches are snapshot-covered against the current
command/filter builders.

Live NVENC/CUDA HLS proof on 2026-06-11 closed only the HLS learned-denial slice
of the AV1 fallback work using a temporary copy of the configured database
because the reported channel 4 no longer existed locally. The proof shifted
channel 2's existing AV1 item into the live window, preserved the learned denial
row, and captured the spawned segmenter argv as `-init_hw_device cuda -hwaccel
none -c:v libdav1d ... -codec:v h264_nvenc`; `/iptv/channel/2.m3u8?mode=segmenter`
and `/iptv/session/2/hls.m3u8` both returned 200, with generated MPEG-TS segment
bytes starting at sync byte `0x47`.

The 2026-06-12 slice closed the remaining four ADR 0014 hardware-decode debts:
NVENC hardware decode is now gated on the CUDA filters the GPU graph emits
(`scale_cuda`/`yadif_cuda`/`overlay_cuda`) being present in the build, with the
pipeline demoting the filter graph to software while keeping the NVENC encoder
on encoder-only builds (gate recovered from abandoned commit `b1246b0`,
snapshot `nvenc_pipeline_keeps_nvenc_encode_on_encoder_only_build_snapshot`);
ErsatzTV's conservative NVIDIA architecture table (pre-NvEncSharp
`NvidiaHardwareCapabilities`) is ported as an additional AND over probe rows
when GPU model/SM info is parseable from the capability report's GPU list;
direct IPTV `.ts`/HLS-direct spawns run the same learned-denial loop as the
HLS segmenter (classify decode-unsupported stderr via the shared
`ersatzrs-infra::ffmpeg_capabilities` helpers, persist the denial, respawn
exactly once with software input decode into the same response body); and
persisted denial rows now store the `ffmpeg` path they were learned against —
startup reapplies them only for the same binary, while an FFmpeg path change
or a settings-save capability refresh clears them instead of reapplying.

The 2026-06-16 slice carries `SourceVideoStream.index` and the selected audio
stream through `PipelineRequest` so transcode input maps use the persisted
MediaStream indexes (falling back to the first source audio stream when the
selected one is absent) instead of assuming `0:0`/`0:1`. This fixes watermarked
channels whose files store audio before video, which previously failed with a
filtergraph stream-specifier error (observed live on the MTV channel);
covered by the `pipeline_uses_persisted_stream_indexes_when_audio_precedes_video`
snapshot.
'''

[[debt]]
id          = 'nvenc-filter-gate-live-proof'
adr         = '0014'
description = 'The CUDA-filter decode gate and the encoder-only software-graph demotion are verified by unit tests and argv snapshots only; live proof requires an FFmpeg build with NVENC encoders + `cuda` hwaccel but no CUDA filter kernels, and no such build was available on 2026-06-12 (both local builds ship all three CUDA filters). The IPTV .ts learned-denial retry likewise has unit/snapshot coverage plus a passing `cargo xtask smoke` happy path, but its retry-in-response has not been observed live against real rejecting hardware the way the HLS slice was on 2026-06-11.'
discovered  = '2026-06-12'
evidence    = '`which -a ffmpeg` builds (`/usr/bin/ffmpeg`, `~/.local/ffmpeg-8.1`) each report scale_cuda/yadif_cuda/overlay_cuda present, so the "No such filter" runtime path could not be reproduced live this session.'

[[debt]]
id          = 'default-profile-1080p60-retune'
adr         = '0017'
description = 'The seeded default FFmpeg profile (ensure_default_ffmpeg_profile in crates/ersatzrs-infra/src/db.rs, "1920x1080 x264 aac") still uses the conservative ErsatzTV baseline: H.264 High, video preset unset (libx264 medium), no B-frames, video 2000 kbps / 4000 kbit buffer, AAC 192 kbps stereo. ADR 0017 retunes the default to the 1080p60 / AC-3 6ch / 2-stream / 100 Mbps target: rename to "1920x1080 x264 ac3 6ch", preset veryfast, video 15000/15000 kbit (about 1 s VBV), AC-3 640/640 kbit, 6 channels. The pipeline fallback defaults in crates/ersatzrs-ffmpeg DesiredVideoState should align. Fresh-DB seed only; existing saved profiles are not overwritten.'
discovered  = '2026-06-17'
evidence    = 'Current seed values read from db.rs ensure_default_ffmpeg_profile: preset NULL => libx264 medium (cannot sustain two 1080p60 software encodes in realtime) and a 4000 kbit buffer too small to let -maxrate bind at higher bitrates. Decision recorded in ADR 0017.'
resolved    = false

[[debt]]
id          = 'ac3-segmenter-max-delay'
adr         = '0017'
description = 'The HLS segmenter output does not emit -max_delay for multichannel AC-3, so 6-channel AC-3 can pop or drift at segment boundaries when audio is not interleaved tightly with video. ADR 0017 (section 2) adds -max_delay 500000 (0.5 s) gated to multichannel AC-3 output.'
discovered  = '2026-06-17'
evidence    = 'hls_output / add_output_options in crates/ersatzrs-ffmpeg/src/pipeline/mod.rs emit b:a/maxrate:a + bufsize:a but no -max_delay. Not present in the ErsatzTV baseline either, so this is an ErsatzRS addition.'
resolved    = false
