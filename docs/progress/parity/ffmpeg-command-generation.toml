summary    = '''
Ported: software pipeline emits a faithful argv; NVENC and VAAPI keep the upstream hardware decode-path shape (`-hwaccel`, `-hwaccel_output_format`, `-init_hw_device`, hardware scaling, and `-noautoscale`); and Phase 7 Slice 6 adds QSV/AMF/VideoToolbox/RKMPP/V4L2M2M builder parity for the command layer with dedicated snapshot coverage. Phase 7 Slice 11 adds source video/audio stream metadata to `PipelineRequest`, ports the known decoder table, and selects input video decoders from source codec + hardware acceleration (`h264`, `h264_qsv`, `h264_v4l2m2m`, etc.) with snapshot coverage for the changed argv. Phase 7 Slice 12 adds report-backed hardware capability checks and capability-gated encoder/decoder fallback before hardware globals and filters are emitted. This slice ports ErsatzTV's non-copy audio `aresample=async=1` + `apad` filter chain into command generation, parses VAAPI/QSV profile-entrypoint rows plus VAAPI rate-control and packed-header attributes, enriches the runtime report from default and FFmpeg-profile-specific `vainfo` plus QSV smoke probes, gates VAAPI/QSV encode/decode decisions by those device profiles when present, emits FFmpeg-profile-specific QSV/VAAPI device globals (`-qsv_device`, `-vaapi_device`, `LIBVA_DRIVER_NAME`) in the generated argv, routes NVENC 8-bit watermark/image-subtitle/native-graphics overlays through CUDA upload plus `overlay_cuda`, downloads NVENC 10-bit frames before the software overlay fallback, adds the NVENC decoder software-fallback `hwupload` step before CUDA filters, mirrors the QSV post-scale hardware download plus reset-PTS/fps branch before overlays/output, routes VAAPI image subtitles plus native graphics through VAAPI overlay-input `hwupload` and `overlay_vaapi` when the main frame remains in hardware, captures ErsatzTV's NVIDIA CLI fallback probe (`h264_nvenc -gpu list`) in runtime capabilities plus troubleshooting output, parses `ffmpeg -h encoder=<nvenc>` details into `nvidia_encoders`, probes HEVC NVENC B-frame reference-mode support with a safe encode attempt, keeps the unavailable-library fallback that populates `nvidia_decoders` from safe FFmpeg CUDA/CUVID smoke probes for generated h264/hevc/mpeg2video/mpeg4/vp8/vp9/av1 samples when matching sample encoders are available, gates NVENC encode by reported pixel formats/profiles when detail rows are present, adds typed `nvidia_decoders` rows for native CUDA/NVDEC codec + bit-depth detail, gates NVENC decode by those rows when present so unsupported device decode falls back to software input while preserving NVENC encode, ports NVIDIA text-subtitle burn upload/download routing so CUDA frames are downloaded before `subtitles` and re-uploaded before later CUDA watermark/graphics overlays, mirrors the upstream NVIDIA Vulkan HDR tonemap global-option branch (`cuda=nv`, `vulkan=vk@nv`, `-hwaccel vulkan`, `-hwaccel_output_format vulkan`) when Vulkan is reported and not disabled, ports VAAPI text-subtitle burn routing so hardware frames are downloaded before `subtitles` and re-uploaded before VAAPI encode, ports VAAPI forced software overlay routing for combined image subtitle plus watermark and `radeonsi` drivers, mirrors VAAPI encoder capability output options so CQP-only rows emit `-rc_mode 1` and H.264/HEVC packed-header-misc rows emit `-sei -a53_cc`, mirrors the AMF/VideoToolbox/V4L2M2M/RKMPP `SetPixelFormat` builders by always emitting the desired `-pix_fmt` output option for those transcodes, ports the upstream NVENC green-line plus VAAPI/radeonsi crop-metadata bitstream-filter workarounds (`h264_metadata`/`hevc_metadata`) with targeted snapshots, keeps the VAAPI/radeonsi workaround HEVC-only like upstream, ports the shared `NoDemuxDecodeDelayOutputOption` so generated transcode argv includes `-muxdelay 0 -muxpreload 0` before `-movflags +faststart`, matches ErsatzTV's closed-GOP flag spelling (`-flags cgop`), matches ErsatzTV's audio sample-rate output spelling (`-ar 48k` style from kHz profiles), ports ErsatzTV's conditional `AudioChannelsOutputOption` so `-ac` is emitted only when selected source channels differ from the desired output or AAC/AAC-LATM surround output requires an explicit channel count, ports `AudioBitrateOutputOption`/`VideoBitrateOutputOption` maxrate parity plus `AudioBufferSizeOutputOption` and the upstream non-NUT gate for audio bitrate, buffer size, and sample rate output options, ports ErsatzTV's MP4/fMP4 movflags selection for HLS direct MP4 copy and fragmented MP4 HLS output, ports `VideoTrackTimescaleOutputOption` with the upstream 90000 playback timescale for non-copy video, ports `FrameRateOutputOption` so non-copy, non-QSV commands emit `-r <rate> -vsync cfr` while QSV keeps relying on its reset-PTS/fps filter like upstream, ports MPEG-TS HLS PTS offset probing plus `OutputTsOffsetOption` so restarted segmenter transcodes emit `-output_ts_offset <seconds>s` while fMP4 and copy-video remain skipped like upstream, ports `SetSceneDetect`/`NoSceneDetectOutputOption` so non-copy transcodes emit `-sc_threshold 0` except MPEG-2 and VideoToolbox decode paths, which use the upstream-supported `1000000000` threshold, threads `QsvExtraHardwareFrames` from FFmpeg profiles into QSV deinterlace/scale/upload filters instead of hard-coding the default, ports the upstream HEVC encoder output options for `libx265` (`-tag:v hvc1`, quiet x265 params) and conservative HEVC NVENC (`-tag:v hvc1`, `-b_ref_mode 0`) command generation, mirrors the NVENC image-subtitle `scale_npp` branch when FFmpeg reports the filter and the primary video path was spatially scaled or padded, splits VideoToolbox plus NVENC encode/decode capability decisions so unsupported decode paths fall back to software input without dropping the hardware encoder, splits QSV encode/decode capability decisions so missing QSV decode keeps software input decode while still initializing the QSV filter device, hiding CUDA devices, uploading software frames for QSV filtering, and using the QSV encoder, ports ErsatzTV's QSV 10-bit H.264/HEVC decode workaround plus no-seek multiple-H.264-profile workaround so those sources use software input decode while retaining QSV filtering/encode, populates the QSV multiple-H.264-profile flag from the ErsatzTV-style local-statistics/profile-count trace-headers probe on playback command paths, ports the upstream DTS seek `-c:a dts -core_only true` and AC3 stereo `-c:a ac3 -downmix stereo` input decoder branches using persisted source audio stream metadata on HLS/IPTV/troubleshooting command paths, ports the upstream still-image `loop=-1:1` video filter branch from `SetStillImageLoop` using persisted image media-version metadata, ports `SetRealtimeInput`/`ReadrateInputOption` so realtime transcodes add `-readrate 1.05` and realtime copy/direct paths add `-readrate 1.0` while preserving shared-input decoder-option folding, ports `SetTimeLimit`/`TimeLimitOutputOption` so generated troubleshooting preview commands emit fixed-width `-t HH:MM:SS.fffffff` output limits through `FfmpegState` instead of post-processing argv, populates explicit VideoToolbox framework-result fields (`videotoolbox_decoders`, `videotoolbox_encoders`) from direct macOS VideoToolbox framework enumeration so VideoToolbox command generation is gated by decoder FourCCs plus hardware encoder names instead of assuming `-hwaccel videotoolbox` is sufficient, and ports ErsatzTV's output metadata options (`service_provider`, `service_name`, audio language, subtitle language/title) into `FfmpegState` with IPTV/HLS runtime propagation from channel/playout/audio/subtitle metadata.
This slice also covers the `SetStillImageLoop` realtime still-image filter branch (`loop=-1:1,realtime`) without adding realtime input `-readrate` to still-image video inputs.
This slice also aligns the default FFmpeg startup capability check with ErsatzTV's required filter contract (`apad`, `aresample`, `color`, `colorchannelmixer`, `colorspace`, `crop`, `fade`, `format`, `fps`, `framerate`, `loop`, `loudnorm`, `overlay`, `pad`, `realtime`, `setpts`, `scale`, `subtitles`, `tonemap`, `yadif`, `zscale`) while retaining ErsatzRS's additional `drawvg` requirement from ADR 0003.
This slice also removes the non-upstream software/NVENC `framerate` video filter branch so non-QSV transcodes rely on `FrameRateOutputOption` (`-r ... -vsync cfr`) like ErsatzTV, leaving QSV's reset-PTS/fps path as the hardware-specific exception.
This slice adds the `ersatzrs-hwprobe` native boundary and uses direct macOS VideoToolbox framework calls (`VTIsHardwareDecodeSupported`, `VTCopyVideoEncoderList`) for decoder FourCC and hardware encoder enumeration before command-generation capability gating; non-macOS behavior remains unchanged.
This slice also uses the `ersatzrs-hwprobe` native boundary for CUDA/NVDEC decoder enumeration via `cuvidGetDecoderCaps`, preferring native codec/bit-depth rows whenever CUDA/CUVID APIs are available and keeping FFmpeg sample probes only as the unavailable-library fallback.
This slice also uses the native boundary for NVENC encoder enumeration via `NvEncodeAPICreateInstance` plus CUDA encode-session probing, mapping H.264/HEVC/AV1 GUIDs, profile GUIDs, 10-bit support, and B-frame-ref support into `nvidia_encoders` before falling back to FFmpeg encoder-help probes when `libnvidia-encode`/`nvEncodeAPI64.dll` is unavailable.
This slice also tightens the NVENC decode fallback after 2026-06-09 runtime proof showed FFmpeg advertising `av1_cuvid` on a platform that still failed with "Your platform doesn't support hardware accelerated AV1 decoding": AV1 CUDA decode now requires a positive native/probed NVIDIA decoder detail row, so unsupported AV1 inputs use software decode while retaining NVENC encode.
This slice also ports the `*PipelineBuilder.SetPixelFormat` colorspace branch: when `NormalizeColors` is set (ErsatzTV/ErsatzRS default) and a probed source is not already BT.709, command generation now emits ErsatzTV's `colorspace`/`colormatrix`/`setparams` normalization node at the end of the filter graph (`colormatrix=src=bt470bg:dst=bt709` for BT.470BG, `setparams=...bt709...` for unknown-tag software sources, and `colorspace=...all=bt709:format=yuv420p:range=tv` with input overrides for mixed sources), pinning the desired pixel format so a redundant `-pix_fmt` is suppressed for known sources. `SourceColorParams` now carries the full ffprobe color tags (`color_range`/`space`/`transfer`/`primaries`) and classifies them (`is_bt709`/`is_bt470_bg`/`is_unknown`/`is_mixed`) branch-for-branch with ErsatzTV's `ColorParams`. This fixes the SD/DVD "256-color GIF" banding/dithering caused by swscale's implicit dithered conversion when no explicit colorspace node was present. The GPU-resident hardware-encode branch now matches committed ErsatzTV-generated SetPixelFormat fixtures for known non-BT.709 NVENC, VAAPI, and QSV paths: NVENC and QSV emit the upstream download → normalize segment with no extra post-colorspace upload, VAAPI emits `format=nv12|p010le|vaapi,hwupload`, and HDR tonemap marks frames BT.709 afterward so SetPixelFormat does not add a redundant colorspace node. GPU-resident unknown-color sources remain skipped while software unknown-color behavior remains ported.
'''
