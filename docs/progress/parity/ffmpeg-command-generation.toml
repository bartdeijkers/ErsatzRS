summary    = '''
Current command-generation parity covers the software pipeline plus NVENC,
VAAPI, QSV, AMF, VideoToolbox, RKMPP, and V4L2M2M command shapes with snapshot
coverage. `PipelineRequest` carries source stream metadata, decoder selection
uses the ErsatzTV known-decoder table, and hardware globals/filters are gated by
runtime capability reports before they are emitted. Audio/video output options
now mirror ErsatzTV's command layer for resampling/apad, channels/bitrate/buffer
size/sample-rate gates, scene-detect and GOP flags, MP4/fMP4/HLS movflags,
timescale, frame-rate output, MPEG-TS offset, realtime input, still-image loop,
time limits, output metadata, and platform-specific encoder options.
Row 75 drops NVIDIA and radeonsi crop metadata. Argv snapshots and an FFmpeg 9
NVENC encode pass; AMD live output remains unproven.

Hardware capability coverage is in place for VAAPI/QSV device rows, NVIDIA CLI
and native CUDA/NVDEC/NVENC probes, direct macOS VideoToolbox framework
enumeration, and runtime-learned hardware decode denials. Unsupported or denied
decode paths fall back to software input decode while preserving the selected
hardware encoder, with denials persisted in `ConfigElement` and surfaced through
health/troubleshooting. Text/image subtitle, watermark, native graphics, HDR
tonemap, QSV/VAAPI/NVENC upload/download, and color-normalization branches are
snapshot-covered against the current command/filter builders. ADR 0014's
CUDA-filter decode gate is now live-proven on an encoder-only NVENC build that
reports `cuda` and `h264_nvenc` while omitting `scale_cuda`, `yadif_cuda`, and
`overlay_cuda`; the captured direct IPTV MPEG-TS output stayed H.264 yuv420p
BT.709 and the server log contained no CUDA-filter failure signatures.

The 2026-06-16 slice carries `SourceVideoStream.index` and the selected audio
stream through `PipelineRequest` so transcode input maps use the persisted
MediaStream indexes (falling back to the first source audio stream when the
selected one is absent) instead of assuming `0:0`/`0:1`. This fixes watermarked
channels whose files store audio before video, which previously failed with a
filtergraph stream-specifier error (observed live on the MTV channel);
covered by the `pipeline_uses_persisted_stream_indexes_when_audio_precedes_video`
snapshot.

ADR 0017 supplies five fresh-database AC-3 6ch profiles, selects available
hardware without rewriting saved profiles, and gates HLS multichannel AC-3
max-delay. The resolved default-profile, bitrate, preset-retune and max-delay
debt entries below preserve the exact seed evolution and focused evidence.

The 2026-08-05 ADR 0063 slice upgrades command generation to the exact FFmpeg
9.x contract. Frame-rate normalization emits `-fps_mode:v cfr`, NVENC presets
and tunes are independent, legacy `llhp`/`llhq` values translate at the command
boundary, and startup probes the required output and NVENC option domains.
Existing FFmpeg 8.1 live-proof entries below remain historical evidence for
their specific filter-gating behavior rather than the current runtime version.

A 2026-08-07 differential review found the emitted command surface unaffected by
the 8.1.2 to 9.0 upgrade; see `ffmpeg-9-differential-review` below.

Resolved 2026-10-07: complete metadata confirms absent audio before the shared
native lavfi/index0 fallback. Unknown Automatic, explicit Disabled/Exact,
selected tracks, source seek and fresh retained metadata remain preserved.
Copy/None audio encodes AAC with profile constraints and video copy intact.
Genuine video-only Linux/Windows HLS/direct decoding, silent PCM and Stop/cleanup
pass. UCU-09 owns exact evidence; historical row194 failure/duration proof and
approved platform/hardware debt remain.

UCU15 raw source-format safety is locally verified; its retained platform/final
integration obligation is recorded below without erasing earlier command proof.

'''

