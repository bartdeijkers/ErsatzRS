evidence    = 'Current seed reads from db.rs ensure_default_ffmpeg_profile: one INSERT of "1920x1080 x264 aac", AudioFormat=Aac, 2ch, video 2000/4000 kbit, preset NULL (libx264 medium), HardwareAcceleration=None. Codec/HW enums confirmed in crates/ersatzrs-domain/src/ffmpeg.rs (Hevc, Ac3, TenBit, HardwareAccelerationKind). Decision recorded in ADR 0017 (revised 2026-06-17).'
resolved    = false

