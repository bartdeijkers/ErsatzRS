feature    = 'Repository-backed add-on platform with tiered trust'
etv_source = 'ErsatzRS product extension; ErsatzTV has no repository-backed extension equivalent'
rs_target  = '`crates/ersatzrs-addon-contract`, `crates/ersatzrs-app`, `crates/ersatzrs-infra/src/addons.rs`, `crates/ersatzrs-infra/src/health/checks/addon_platform.rs`, `crates/ersatzrs-web/src/admin/pages/addons.rs`, and the separate official add-ons repository'
status     = 'In progress'
adr        = ['0051', '0066', '0067', '0072', '0074']

summary = '''
The host implementation is substantial: strict package and catalog schemas,
detached Ed25519 catalog verification, replaceable trust roots, rollback and
expiry protection, bounded safe ZIP installation, immutable package/content
integrity, manual update/enable lifecycle, manifest-rendered settings and
declarative panels, secret references, required-dependency lifecycle guards,
repository/install compare-and-swap protection, conditional signed-catalog
refresh, repository-ID-scoped persistent data, managed Unix process-group and
Windows Job Object ownership, health, and localized Settings > Add-ons
administration.

The separate official multi-add-on repository source tree builds deterministic
packages for standalone Beeld & Geluid and operator-supplied yt-dlp adapters on
all six release RIDs. It is intentionally not published from this worktree and
the main repository seed intentionally has no production public key until the
maintainer provisions the private signing key directly in the publisher's
secret store.

ADR 0066's Kodi-shaped distribution model is implemented with verified,
unverified, and sideloaded trust tiers, a single off-by-default unknown-sources
gate, bounded repository and add-on ZIP installation, official-source
fail-closed behavior, persistent tier-aware health reporting, schema-v2
optional icons, and manual source-owned updates. Per ADR 0074 an update no
longer takes a working add-on out of service: the host runs the post-update
readiness check itself and re-enables the add-on when it passes, and holds it
disabled for review only when the new version declares a permission the
previous one did not. The localized manager provides
Installed, Browse, Updates, and Sources views plus canonical
`/settings/addons/{addon_id}` detail pages for metadata, permissions,
configuration, readiness, source offers, and lifecycle actions.

Schema-v4 add-ons can declare `default_source_hosts`: the hosts a package
offers to process, as a statement separate from `permissions.network_hosts`
(which records what it may contact and may legally be `*`). ErsatzRS routes an
operator-supplied source URL to the most specific claim, refuses to guess
between equal claims, and otherwise falls back to an administrator-configured
default remote stream processor for HTTP(S) hosts that package is permitted to
contact. Resolution runs when a list is written, is visible and overridable in
the dialog, and can be changed afterwards; the Remote Stream playback path is
deliberately untouched. See ADR 0072.

Schema-v3 add-ons can declare host-owned media-list storage. Enabling such an
add-on resolves its configured absolute path or a profile-relative default,
creates an idempotent managed Local Media Source, and projects every saved
add-on list as a separately scanned library whose name and folder derive from
the list. The source, libraries, manifest files, bootstrap reconciliation, and
health checks remain host-owned; disabling does not delete user-visible files.
'''

