id          = 'addon-catalog-refresh-is-not-http-conditional'
description = 'Honor the ADR 0066 conditional-refresh contract with HTTP validators and a verified not-modified path instead of downloading the full index and signature every time.'
discovered  = '2026-08-11'
evidence    = '`refresh_repository` persists ETag and Last-Modified, conditionally requests the index, reuses only previously signature-verified exact bytes on a valid 304, and always verifies a detached signature for new 200 response bytes.'
adr         = '0066'
resolved    = true
resolution  = 'Repository refresh persists ETag and Last-Modified, conditionally requests the signed index, revalidates only previously signature-verified bytes on 304, and always fetches and verifies the detached signature for a new 200 response. Focused regressions cover both paths and stale-revision rejection.'

