feature    = 'Local add-on repository platform'
etv_source = 'ErsatzRS product extension; ErsatzTV has no repository-backed extension equivalent'
rs_target  = '`crates/ersatzrs-addon-contract`, `crates/ersatzrs-app`, `crates/ersatzrs-infra/src/addons.rs`, `crates/ersatzrs-infra/src/health/checks/addon_platform.rs`, `crates/ersatzrs-web/src/admin/pages/addons.rs`, and the separate official add-ons repository'
status     = 'In progress'
adr        = ['0051', '0066', '0067', '0072', '0074', '0079', '0081', '0092']

summary = '''
ADR 0081 supersedes the active HTTPS catalog and signing model from ADR 0066.
Operators clone or pull repositories with their own Git tooling into the fixed
profile checkout directory, or upload a complete offline repository ZIP.
ErsatzRS owns no Git process or credentials and performs no repository network
fetch. A strict `repository.toml` plus `addons/<id>/` contract is shared by both
paths; scanning atomically records validated offers, and installation copies
only one explicitly selected add-on into the immutable managed package store.

The off-by-default Unknown Sources gate covers checkout scans, offline bundles,
and individual add-on ZIPs. Checkout and bundle sources have persisted scan
state and health findings. Updates remain manual per add-on after a pull/rescan
or replacement bundle. Source revisions and content fingerprints prevent a
mutated checkout or stale UI action from changing the installed snapshot.
Existing catalog installations remain runnable as legacy unmanaged packages;
an explicit adoption confirmation can bind one to a local offer while
preserving settings and its data namespace.

The separate private official repository is itself the complete local source
for the operator-supplied yt-dlp adapter on all six release RIDs. Beeld & Geluid
is retired under ADR 0092; prior evidence below is historical, not current
support. Its CI validates manifests and publishes an offline bundle
artifact without a signing key, public catalog, or GitHub Pages deployment.

The host still provides bounded safe ZIP extraction, immutable package/content
integrity, manual update/enable lifecycle, manifest-rendered settings and
declarative panels, secret references, required-dependency lifecycle guards,
managed Unix process-group and Windows Job Object ownership, health, and the
localized Installed, Browse, Updates, Sources, and detail-page administration.
Per ADR 0074 a successful update is re-enabled after readiness when it adds no
new permission; otherwise it remains disabled for operator review.

Schema-v4 add-ons can declare `default_source_hosts`: the hosts a package
offers to process, as a statement separate from `permissions.network_hosts`
(which records what it may contact and may legally be `*`). ErsatzRS routes an
operator-supplied source URL to the most specific claim, refuses to guess
between equal claims, and otherwise falls back to an administrator-configured
default remote stream processor for HTTP(S) hosts that package is permitted to
contact. Resolution runs when a list is written, is visible and overridable in
the dialog, and can be changed afterwards; the Remote Stream playback path is
deliberately untouched. See ADR 0072.

Schema-v3 add-ons can declare host-owned media-list storage. Enabling such an
add-on resolves its configured absolute path or a profile-relative default,
creates an idempotent managed Local Media Source, and projects every saved
add-on list as a separately scanned library whose name and folder derive from
the list. The source, libraries, manifest files, bootstrap reconciliation, and
health checks remain host-owned; disabling does not delete user-visible files.

ADR 0079 adds resumable media-list orchestration without weakening the
executable trust boundary. The host keeps every discover/enrich process
bounded, persists validated checkpoints and worker leases, and recovers jobs
after transient failure or restart. The older one-shot capabilities remain a
frozen compatibility path.
'''

