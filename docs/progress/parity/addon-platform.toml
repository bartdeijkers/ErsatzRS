feature    = 'Repository-backed add-on platform with tiered trust'
etv_source = 'ErsatzRS product extension; ErsatzTV has no repository-backed extension equivalent'
rs_target  = '`crates/ersatzrs-addon-contract`, `crates/ersatzrs-app`, `crates/ersatzrs-infra/src/addons.rs`, `crates/ersatzrs-infra/src/health/checks/addon_platform.rs`, `crates/ersatzrs-web/src/admin/pages/addons.rs`, and the separate official add-ons repository'
status     = 'In progress'
adr        = ['0051', '0066']

summary = '''
The host implementation is substantial: strict package and catalog schemas,
detached Ed25519 catalog verification, replaceable trust roots, rollback and
expiry protection, bounded safe ZIP installation, immutable package/content
integrity, manual update/enable lifecycle, manifest-rendered settings and
declarative panels, secret references, required-dependency lifecycle guards,
repository/install compare-and-swap protection, conditional signed-catalog
refresh, repository-ID-scoped persistent data, managed Unix process-group and
Windows Job Object ownership, health, and localized Settings > Add-ons
administration.

The separate official multi-add-on repository source tree builds deterministic
packages for standalone Beeld & Geluid and operator-supplied yt-dlp adapters on
all six release RIDs. It is intentionally not published from this worktree and
the main repository seed intentionally has no production public key until the
maintainer provisions the private signing key directly in the publisher's
secret store.

ADR 0066 was reworked on 2026-08-12 to a Kodi-shaped distribution model after
the mandatory-signing contract proved to admit no private, local, or offline
installation and to tax every third-party author with Ed25519 key custody. The
reworked contract adds three trust tiers (verified, unverified, sideloaded), a
single off-by-default gate for unverified sources, and repository packages
distributed as zips. None of that is implemented; the host still requires a
pinned key on every repository and has no local-file install path. The scope
and sequencing live in `plans/addon-sideload-install.md`.
'''

