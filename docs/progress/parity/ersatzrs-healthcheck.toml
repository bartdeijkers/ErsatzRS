feature    = 'ErsatzRS healthcheck binary and health engine'
etv_source = 'Spec-backed Phase 7 runtime hardening chore; no ErsatzTV equivalent'
rs_target  = '`crates/ersatzrs-healthcheck`, `crates/ersatzrs-infra/src/health`, `crates/ersatzrs-web/src/admin/pages/system/health.rs`, `Dockerfile`, `.github/workflows/release.yml`, `docs/reference/release-bundle.md`'
status     = 'Ported'
adr        = []
summary    = '''
Ported: ErsatzRS now includes a dedicated `ersatzrs-healthcheck` binary that
probes the server readiness endpoint with a direct HTTP GET and exits `0` only
when `/healthz` returns `200`. It defaults to
`http://127.0.0.1:8409/healthz` for Docker, accepts `--url` or host/port/path
arguments plus `ERSATZRS_HEALTHCHECK_URL` for operators, uses bounded TCP/read
timeouts, and returns non-zero exit codes for unhealthy responses or invalid
configuration. The Docker runtime image copies the binary and uses it for
`HEALTHCHECK`, so the runtime stage no longer installs curl solely for
readiness probing. Release archives build and stage the binary beside
`ersatzrs-web` and `ersatzrs-scanner` for Linux and Windows.

Closed 2026-07-01: the in-app Zero Duration health check ignores static image
media versions with conventional still-image file extensions while preserving
warnings for zero-duration videos, audio-backed media, and animated-capable
image paths that still need duration metadata.

The Playback Data Access health check also verifies that global audio and
subtitle language preferences remain readable before runtime stream selection
depends on them.

The Mirror Channels check reports missing or non-Generated sources, malformed
or out-of-range signed offsets, and legacy mirrors that also own a playout.
'''

[[debt]]
id          = 'zero-duration-healthcheck-static-images'
description = 'The in-app Zero Duration health check warns for static images even though zero duration is expected for still image media; it should ignore ordinary image rows and only treat animated/timed images as candidates for missing-duration warnings.'
discovered  = '2026-07-01'
evidence    = 'Resolved 2026-07-01: `ZeroDurationHealthCheck` now fetches `MediaVersion.ImageId` and ignores zero-duration image rows only when the `MediaFile.Path` has a conventional still-image extension (`jpg`, `jpeg`, `png`, `bmp`, `tif`, `tiff`, `heic`, `heif`, `ico`). Animated-capable image paths such as `gif`, `webp`, `apng`, and `avif`, unknown image paths, remote-stream placeholders, and duration-bearing video/audio media keep their prior behavior. Covered by focused `cargo test -p ersatzrs-infra zero_duration_check_ignores_static_image_versions`, `cargo test -p ersatzrs-infra zero_duration_check_warns_for_video_and_animated_image_candidates`, and `cargo test -p ersatzrs-infra zero_duration_check_ignores_remote_stream_placeholders`.'
resolved    = true
