evidence    = 'Review on 2026-08-30: the duration filter calls `std::fs::read_to_string` and `serde_yaml::from_str` once per active durationless sidecar entry inside async `check()`. Remote Stream lists accept up to `MAX_LIST_ITEMS = 10_000`, health checks run serially in the one-minute maintenance pass, and this O(N) blocking work can delay scheduler maintenance and later checks. Closure requires sidecar-carried validated liveness or bounded work off the async executor, without one blocking definition parse per entry.'
