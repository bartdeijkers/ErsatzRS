feature    = 'ErsatzRS healthcheck binary and health engine'
etv_source = 'Spec-backed Phase 7 runtime hardening chore; no ErsatzTV equivalent'
rs_target  = '`crates/ersatzrs-healthcheck`, `crates/ersatzrs-infra/src/health`, `crates/ersatzrs-web/src/admin/pages/system/health.rs`, `Dockerfile`, `.github/workflows/release.yml`, `docs/reference/release-bundle.md`'
status     = 'Ported'
adr        = ['0064']
summary    = '''
Ported: ErsatzRS includes a dedicated `ersatzrs-healthcheck` binary that
probes the server readiness endpoint with a direct HTTP GET and exits `0` only
when `/healthz` returns `200`. It defaults to
`http://127.0.0.1:8409/healthz` for Docker, accepts `--url` or host/port/path
arguments plus `ERSATZRS_HEALTHCHECK_URL` for operators, uses bounded TCP/read
timeouts, and returns non-zero exit codes for unhealthy responses or invalid
configuration. The Docker runtime image copies the binary and uses it for
`HEALTHCHECK`, so the runtime stage no longer installs curl solely for
readiness probing. Release archives build and stage the binary beside
`ersatzrs-web` and `ersatzrs-scanner` for Linux and Windows.

Closed 2026-07-01: the in-app Zero Duration health check ignores static image
media versions with conventional still-image file extensions while preserving
warnings for zero-duration videos, audio-backed media, and animated-capable
image paths that still need duration metadata.

The Playback Data Access health check also verifies that global audio and
subtitle language preferences remain readable before runtime stream selection
depends on them.

The Mirror Channels check reports missing or non-Generated sources, malformed
or out-of-range signed offsets, and legacy mirrors that also own a playout.

The Classic Playout State check reports generated Classic playouts whose
source-keyed collection anchors, fill-group indices, or owned enumerator rows
do not exactly match the active schedule. The scheduler audits and repairs the
same invariant at startup and before every Continue build.

The Output Dynamic Range check uses a backend-portable `SELECT DISTINCT`
ordering and one shared classification contract for SQLite and MySQL. The
focused MySQL regression now runs without an environment-based skip in CI.
'''

[[debt]]
id          = 'zero-duration-healthcheck-static-images'
description = 'The in-app Zero Duration health check warns for static images even though zero duration is expected for still image media; it should ignore ordinary image rows and only treat animated/timed images as candidates for missing-duration warnings.'
discovered  = '2026-07-01'
evidence    = 'Resolved 2026-07-01: `ZeroDurationHealthCheck` now fetches `MediaVersion.ImageId` and ignores zero-duration image rows only when the `MediaFile.Path` has a conventional still-image extension (`jpg`, `jpeg`, `png`, `bmp`, `tif`, `tiff`, `heic`, `heif`, `ico`). Animated-capable image paths such as `gif`, `webp`, `apng`, and `avif`, unknown image paths, remote-stream placeholders, and duration-bearing video/audio media keep their prior behavior. Covered by focused `cargo test -p ersatzrs-infra zero_duration_check_ignores_static_image_versions`, `cargo test -p ersatzrs-infra zero_duration_check_warns_for_video_and_animated_image_candidates`, and `cargo test -p ersatzrs-infra zero_duration_check_ignores_remote_stream_placeholders`.'
resolved    = true

[[debt]]
id          = 'output-dynamic-range-health-query-is-invalid-on-mysql'
adr         = '0064'
description = 'P2: Make the Output Dynamic Range health query portable by including the ordered profile ID in the `SELECT DISTINCT` projection (without changing row classification) or by removing that tie-breaker after proving deterministic output another way. Add backend-shared result assertions and a feature-gated MySQL integration test that seeds duplicate profile names and exercises NotApplicable, invalid, inert-copy, and hardware-demotion rows. Closure requires the focused health tests plus both default and `mysql` Clippy configurations.'
discovered  = '2026-08-07'
evidence    = '''
Found 2026-08-07: `output_dynamic_range.rs` selected distinct profile fields but
ordered by `p."Id"`, which is absent from the projection; MySQL 8 rejects that
query on every health run.

Query fixed 2026-08-08: all three affected health checks now order only by
columns present in their `SELECT DISTINCT` projection
(`output_dynamic_range.rs`, and the two pre-existing checks the pattern was
copied from, `vaapi_driver.rs` and `vaapi_device.rs` — the same defect had been
latent in both). Ordering by the projected tuple is a total order over the
distinct rows, so health messages stay deterministic.

NOT closed: no MySQL server was available on this machine (no service on 3306,
no container runtime), so the fix is portable by construction and compiles under
`--features mysql`, but it has not been executed against a live MySQL 8. The
feature-gated MySQL integration test this debt asks for still needs writing and
running.

Closed 2026-08-08. `run_output_dynamic_range_check` exposes the single check so
both backends assert one classification contract:
`output_dynamic_range_check_classifies_every_row_shape_on_sqlite` and
`mysql_output_dynamic_range_health_check_classifies_every_row_shape` each walk
NotApplicable, invalid (Fail), hardware-demotion (Warning), and inert-copy
(Info), seeding two channels that share a profile name — the duplicate case that
makes the `SELECT DISTINCT` meaningful and that the dropped `Id` tie-breaker
existed for.

Executed 2026-08-10 against an isolated MySQL 8.4.0 server. The focused
`mysql_output_dynamic_range_health_check_classifies_every_row_shape` regression
passed all four states in 84.177 seconds. CI now provisions MySQL 8 and injects
`ERSATZRS_MYSQL_TEST_URL` for this exact non-skipping contract.
'''
resolved    = true
