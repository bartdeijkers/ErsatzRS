id          = 'output-dynamic-range-health-query-is-invalid-on-mysql'
adr         = '0064'
description = 'P2: Make the Output Dynamic Range health query portable by including the ordered profile ID in the `SELECT DISTINCT` projection (without changing row classification) or by removing that tie-breaker after proving deterministic output another way. Add backend-shared result assertions and a feature-gated MySQL integration test that seeds duplicate profile names and exercises NotApplicable, invalid, inert-copy, and hardware-demotion rows. Closure requires the focused health tests plus both default and `mysql` Clippy configurations.'
discovered  = '2026-08-07'
evidence    = '''
Found 2026-08-07: `output_dynamic_range.rs` selected distinct profile fields but
ordered by `p."Id"`, which is absent from the projection; MySQL 8 rejects that
query on every health run.

Query fixed 2026-08-08: all three affected health checks now order only by
columns present in their `SELECT DISTINCT` projection
(`output_dynamic_range.rs`, and the two pre-existing checks the pattern was
copied from, `vaapi_driver.rs` and `vaapi_device.rs` — the same defect had been
latent in both). Ordering by the projected tuple is a total order over the
distinct rows, so health messages stay deterministic.

NOT closed: no MySQL server was available on this machine (no service on 3306,
no container runtime), so the fix is portable by construction and compiles under
`--features mysql`, but it has not been executed against a live MySQL 8. The
feature-gated MySQL integration test this debt asks for still needs writing and
running.

Closed 2026-08-08. `run_output_dynamic_range_check` exposes the single check so
both backends assert one classification contract:
`output_dynamic_range_check_classifies_every_row_shape_on_sqlite` and
`mysql_output_dynamic_range_health_check_classifies_every_row_shape` each walk
NotApplicable, invalid (Fail), hardware-demotion (Warning), and inert-copy
(Info), seeding two channels that share a profile name — the duplicate case that
makes the `SELECT DISTINCT` meaningful and that the dropped `Id` tie-breaker
existed for.

Executed 2026-08-10 against an isolated MySQL 8.4.0 server. The focused
`mysql_output_dynamic_range_health_check_classifies_every_row_shape` regression
passed all four states in 84.177 seconds. CI now provisions MySQL 8 and injects
`ERSATZRS_MYSQL_TEST_URL` for this exact non-skipping contract.
'''
resolved    = true


