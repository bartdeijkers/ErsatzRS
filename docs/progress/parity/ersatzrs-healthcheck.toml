summary    = '''
2026-10-09: ADR 0119 acknowledges provider-unavailable streams through manual
publication exclusion by every owner. Automatic exclusions and local files
remain actionable; reinclusion restores warnings. The resolved debt below owns
the focused verification evidence. Deployment remains separate.

2026-10-02: Unavailable-media diagnostics identify ErsatzRS rather than the
upstream product. Admin translation accepts both legacy cached and current
messages in every supported culture, preserves sample names, and keeps provider
availability distinct from missing disk files. All 23 focused health/i18n tests,
strict infra/web Clippy, formatting and hydration-lint pass. Native deployment
is scheduled for v1.1.1.

UCU-09 row136: admin and maintenance share bounded, independently owned health
runs with five-minute caching and explicit refresh. Results and summary publish
atomically; localized hydrated and no-JS refresh pass in both browsers.

Ported: ErsatzRS includes a dedicated `ersatzrs-healthcheck` binary that
probes the server readiness endpoint with a direct HTTP GET and exits `0` only
when `/healthz` returns `200`. It defaults to
`http://127.0.0.1:8409/healthz` for Docker, accepts `--url` or host/port/path
arguments plus `ERSATZRS_HEALTHCHECK_URL` for operators, uses bounded TCP/read
timeouts, and returns non-zero exit codes for unhealthy responses or invalid
configuration. The Docker runtime image copies the binary and uses it for
`HEALTHCHECK`, so the runtime stage no longer installs curl solely for
readiness probing. Release archives build and stage the binary beside
`ersatzrs-web` and `ersatzrs-scanner` for Linux and Windows.

Closed 2026-07-01: the in-app Zero Duration health check ignores static image
media versions with conventional still-image file extensions while preserving
warnings for zero-duration videos, audio-backed media, and animated-capable
image paths that still need duration metadata.

The Playback Data Access health check also verifies that global audio and
subtitle language preferences remain readable before runtime stream selection
depends on them.

The Mirror Channels check reports missing or non-Generated sources, malformed
or out-of-range signed offsets, and legacy mirrors that also own a playout.

The Classic Playout State check reports generated Classic playouts whose
source-keyed collection anchors, fill-group indices, or owned enumerator rows
do not exactly match the active schedule. The scheduler audits and repairs the
same invariant at startup and before every Continue build. Row 85 includes
RerunCollectionId in that identity: a populated production build reports Pass,
then missing rerun identities report Fail. Ambiguous legacy state requires
explicit Reset; it is not silently rebuilt from empty progress.

The Output Dynamic Range check uses a backend-portable `SELECT DISTINCT`
ordering and one shared classification contract for SQLite and MySQL. The
focused MySQL regression now runs without an environment-based skip in CI.

The Artwork Cardinality check reports aggregate exact/same-source duplicates
and projected show, season, and episode count mismatches without disclosing
paths or provider identities. It links operators to the repaired television
projection invariant while leaving distinct variants visible and intact.

UCU-03 row 32 adds an aggregate-only Artwork Orphans check using the cleanup
predicates, with hourly/manual guidance in all nine cultures. Focused aggregate, cleanup-recovery and all-culture tests pass; evidence
belongs to UCU-03.

Remote Stream and add-on-list health applies liveness, inclusion, and
publication filters so valid live entries and retained excluded draft state do
not inflate the actionable warning count.
'''
