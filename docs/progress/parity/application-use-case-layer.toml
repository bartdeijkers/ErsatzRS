adr        = ['0051']
summary    = '''
In progress: the Phase 7B foundation now provides documented command, query,
application-error, port, and operation-coordination modules in `ersatzrs-app`.
Core repository errors are storage-neutral, infrastructure explicitly maps
SQLx failures, and the native web composition root injects concrete ports into
`ApplicationServices` backed by one shared operation coordinator. Remaining
application workflows still live in web server functions/APIs through raw SQL
and web-owned playout/scan queues; milestones p7b-02 through p7b-05 migrate
those complete vertical slices while endpoint and persisted contracts remain
stable.
'''

