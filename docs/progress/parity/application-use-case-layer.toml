summary    = '''
Not started: the architecture assigns use-case coordination to ersatzrs-app,
but that crate is still an unused one-line placeholder. Application workflows
currently live in web server functions/APIs through raw SQL, concrete
repositories, process-local queues, and split lock registries. The active plan
migrates complete vertical slices behind storage-neutral core ports, beginning
with playout-build and scan orchestration, while keeping endpoint and persisted
contracts stable.
'''

