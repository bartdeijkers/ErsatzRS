feature    = 'Application use-case layer and orchestration boundary'
etv_source = '`$ERSATZTV_SRC/ErsatzTV.Application/`, including Channels, Libraries, MediaCollections, Playouts, Scheduling, Streaming, and Troubleshooting handlers'
rs_target  = '`crates/ersatzrs-app`, `crates/ersatzrs-core`, `crates/ersatzrs-infra`, `crates/ersatzrs-scheduler`, `crates/ersatzrs-web`'
status     = 'In progress'
adr        = ['0051']
summary    = '''
In progress: the Phase 7B foundation provides documented command, query,
application-error, port, and operation-coordination modules in `ersatzrs-app`.
Core repository errors are storage-neutral, infrastructure explicitly maps
SQLx failures, and the native web composition root injects concrete ports into
`ApplicationServices` backed by one shared operation coordinator. Milestone
p7b-02 is complete: one `RequestPlayoutBuild` use case owns admission and typed
outcomes for every web/API producer while the scheduler retains sole FIFO
consumption, mode-aware queued upgrades, one upgradable active-build follow-up,
Refresh/Reset semantics, and persisted build behavior. Scan coordination and
remaining application workflows still live in web transport; milestones
p7b-03 through p7b-05 migrate those complete vertical slices while endpoint
and persisted contracts remain stable.
'''

[[debt]]
id          = 'app-crate-is-unused-placeholder'
description = 'ersatzrs-app is a one-line placeholder with no dependencies or consumers even though ARCHITECTURE.md assigns it responsibility for coordinating use cases.'
discovered  = '2026-07-21'
evidence    = '`ersatzrs-app` now exposes documented commands, queries, typed application errors, injected ports, and operation coordination through `ApplicationServices`; the native web composition root constructs it from concrete infrastructure ports. Architecture-lint retains focused placeholder and dependency-boundary regressions.'
resolved    = true

[[debt]]
id          = 'web-owns-application-orchestration'
description = 'Admin server functions and APIs combine transport, validation, raw SQL, side effects, queues, and concrete repositories, preventing reuse from non-web adapters such as a future video-jukebox add-on API.'
discovered  = '2026-07-21'
evidence    = 'Milestone p7b-02 removed the public playout sender from `AppState` and routed every web/API producer through `ApplicationServices::request_playout_build`. `AppState` still exposes the raw pool, concrete repository bundle, and scan queue/progress while other admin transport code retains direct orchestration. Close the remaining vertical slices through milestones p7b-03 through p7b-05.'
resolved    = false

[[debt]]
id          = 'core-leaks-concrete-storage-error'
description = 'ersatzrs-core::repositories::RepositoryError contains sqlx::Error, so the core trait boundary depends on the concrete persistence implementation.'
discovered  = '2026-07-21'
evidence    = '`RepositoryError` now contains only storage-neutral not-found, conflict, decode, and unavailable categories. `ersatzrs-core` no longer depends on SQLx; infrastructure maps concrete SQLx failures explicitly, and architecture-lint rejects direct or renamed storage dependencies in core.'
resolved    = true

[[debt]]
id          = 'operation-coordination-is-split'
description = 'Web and scheduler maintain separate lock/queue registries for related long-running operations instead of one application-level operation coordinator.'
discovered  = '2026-07-21'
evidence    = '`ApplicationServices::operations()` owns the one process-wide entity locker and playout activity registry used by application admission, scheduler execution, and web polling. Milestone p7b-02 moved playout-build admission and sender access behind the application queue port. Web still owns the scan queue/progress lifecycle; p7b-03 migrates that remaining coordination concern.'
resolved    = false
