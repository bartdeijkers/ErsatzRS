feature    = 'Application use-case layer and orchestration boundary'
etv_source = '`$ERSATZTV_SRC/ErsatzTV.Application/`, including Channels, Libraries, MediaCollections, Playouts, Scheduling, Streaming, and Troubleshooting handlers'
rs_target  = '`crates/ersatzrs-app`, `crates/ersatzrs-core`, `crates/ersatzrs-infra`, `crates/ersatzrs-scheduler`, `crates/ersatzrs-web`'
status     = 'In progress'
adr        = ['0051']
summary    = '''
In progress: the Phase 7B foundation provides documented command, query,
application-error, port, and operation-coordination modules in `ersatzrs-app`.
Core repository errors are storage-neutral, infrastructure explicitly maps
SQLx failures, and the native web composition root injects concrete ports into
`ApplicationServices` backed by one shared operation coordinator. Milestone
p7b-02 and p7b-03 are complete. One `RequestPlayoutBuild` use case owns
playout-build admission, while `RequestLibraryScan` and `RequestShowScan` own
persisted scan validation and distinct FIFO admission. Application registries
provide the shared playout and scan queued/running/progress/terminal state used
by native workers and web polling; scheduled scans coalesce against active
library work while manual requests retain FIFO repeats, and transport rejection
uses the existing failure path. Concrete provider, scanner, subtitle, and
scheduler execution remains in adapters. Block preview and the remaining
application workflows still live in web transport; milestones p7b-04 and
p7b-05 migrate those vertical slices while endpoint and persisted contracts
remain stable.
'''

