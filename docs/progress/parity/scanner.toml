status     = 'In progress'
adr        = ['0057', '0060', '0062']

summary    = '''
Local filesystem scanning dispatches by `Library.MediaKind` for movies, other
videos, songs, images, TV, artists, music videos, and remote streams. It writes
provider-shaped media, metadata, artwork, GUID, genre/tag/studio/person,
`MediaStream`, `LibraryFolder`, and fallback metadata rows using ErsatzTV enum
values and path hashes. Local TV now mirrors `TelevisionFolderScanner.cs`
folder-etag behavior, show/season folder persistence, trashed-item restore
guarding, and stale-folder cleanup.

Local show identity preserves ErsatzTV's title/year baseline while adding ADR
0060's folder and NFO GUID precedence. Full scans transactionally
separate merged remakes/reboots, preserve canonical show/season IDs, split
mixed seasons and extras, invalidate ETags, clean empty parents, and feed the
`Local television identity` health check. The 22/8 repair,
rollback, FFprobe rescan, and 1988/2022 browser tests cover it.

Plex, Jellyfin, and Emby sync paths cover paged libraries and item sync,
collection sync, provider library subtype rows, credential lookup, dry-run
short-circuiting, Plex `totalSize` casing, and the Jellyfin/Emby
`LibraryOptions.PathInfos` shape. Jellyfin/Emby metadata writes now include
movie playback metadata, show/season/episode child metadata, artwork, GUID,
genres, tags, and people. Scan-kind persistence is centralized through
`VideoScanKind::db_value()` to match ErsatzTV numbering
Unknown=0/Progressive=1/Interlaced=2.

Missing-item state transitions are now ported on both scanner families
(previously the `MediaItemState` producer side was entirely absent, so deleted
items stayed `Normal` and never reached `/media/trash` or the File Not Found /
Unavailable health checks). Local scans run a trailing pass per library path
that flags items whose backing file disappeared as `FileNotFound`
(`MovieFolderScanner.FindMoviePaths` + `FlagFileNotFound`). Media-server scans
(Plex/Jellyfin/Emby, movies and TV) diff the set of server item ids against the
database to trash items no longer present (`FlagFileNotFound`), and flag items
still on the server whose resolved local file is missing as `RemoteOnly`
(all scanned kinds support remote streaming; the `Unavailable` branch is wired
for kinds that do not). The consumer side is wired too: scheduling reference
data drops `FileNotFound`/`Unavailable` items when `playout.skip_missing_items`
is enabled, mirroring `PlayoutBuilder`'s `PlayoutSkipMissingItems` gate
(default off; `RemoteOnly` stays eligible).

The 2026-06-19 hardening slice closed the remaining scanner debts. Music-video
NFO parsing now mirrors ErsatzTV's fragment-level `XmlReader` behavior by
extracting the first `<musicvideo>` element from real-world fragment streams
before deserialization, while truly invalid NFO still falls back to filename
metadata. Local scanner writes now retry SQLite `BUSY`/`LOCKED` failures with
bounded backoff, preserving real errors while letting concurrent web/scanner
writers serialize instead of aborting immediately. The media-server
`Unavailable` branch is regression-covered for providers that do not support
remote streaming; the pinned ErsatzTV baseline confirms every concrete
Plex/Jellyfin/Emby scanner currently overrides `ServerSupportsRemoteStreaming`
to `true`, so no additional provider path is missing at the baseline.

Remote Stream scanning parses the complete upstream YAML contract, persists
both source forms and metadata, probes URL or script output, writes playback
rows, and applies folder tags and artwork. URL takes precedence; transient
probe failures preserve valid definitions, while invalid YAML is isolated to
that file. ADR 0057 owns the direct producer contract.

ADR 0062 adds uniform local facets, complete Other Video NFO persistence,
song/image sidecars, FFprobe tag aliases, and Plex Other Video scanning with
ETags, reconciliation, remote playback, people, GUIDs, artwork, and streams.

Reopened 2026-09-02: scan persistence still crosses the documented
infrastructure boundary.
'''

