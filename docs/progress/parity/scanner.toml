summary    = '''
Ported (Phase 4 closed): local filesystem scan via ffprobe dispatches by `Library.MediaKind` for movies, other videos, songs, and images; paged Plex/Jellyfin/Emby sync for movies/shows/seasons/episodes; Plex/Jellyfin/Emby collection sync; CLI dispatch via `--provider`/`--library-id`/`--dry-run`; Plex requests send `Accept: application/json` and decode the real `totalSize` casing; Emby uses `/Shows/{id}/Seasons` and `/Shows/{id}/Episodes`; scanner credential lookup is DB-backed; provider library bootstrap preserves real provider `Key`/`ItemId`; `MediaFile.PathHash` is SHA256 hex; provider dry runs short-circuit before credential loading. Phase 7 Slice 18 deepens scanner parity: the local scanner now writes `MusicVideo`/`MusicVideoMetadata` (with per-folder `Artist`/`ArtistMetadata` resolution) and `RemoteStream`/`RemoteStreamMetadata` rows; `MediaStream` writes carry `Profile`, `PixelFormat`, `ColorRange`/`ColorSpace`/`ColorTransfer`/`ColorPrimaries`, `BitsPerRawSample`, `AttachedPic`, and attachment `FileName`/`MimeType` fields populated from ffprobe and from Plex/Jellyfin/Emby playback metadata; Jellyfin/Emby library list responses now decode `LibraryOptions.PathInfos` into `JellyfinPathInfo`/`EmbyPathInfo` rows (no `PlexPathInfo` exists in ErsatzTV); and `sync_emby_libraries`/`sync_jellyfin_libraries`/`sync_plex_libraries` add/update/delete provider library subtype rows with `Library` cascade and respect `ShouldSyncItems` before changing `MediaKind`. Phase 7 Slice 24 persists Emby/Jellyfin provider movie metadata from playback endpoints and writes fallback metadata (title = file stem, sort/original titles from path) for local scanner items via `insert_fallback_metadata` mirroring ErsatzTV's `FallbackMetadataProvider`, ensuring metadata rows exist for admin browser queries. The current Jellyfin/Emby metadata parity follow-up now writes `ShowMetadata` child rows for Emby shows, `SeasonMetadata` with poster/fanart/GUID rows, and `EpisodeMetadata` with thumbnail/GUID/genre/tag/actor/director/writer rows for both providers. The Local TV scanner is now ported via `local_television.rs` (TV-folder walker, `Show`/`ShowMetadata`/`Season`/`SeasonMetadata`/`Episode`/`EpisodeMetadata` upserts with `tvshow.nfo`/per-episode NFO parsing, artwork discovery, GUIDs, and Genres/Tags/Studios/Actors/Directors/Writers via the shared metadata helpers). The local Artist and MusicVideo scanners now write enriched metadata: `upsert_artist_for_folder` parses `artist.nfo` and writes `ArtistMetadata` (Title/SortTitle/Disambiguation/Biography/Year/Formed/MetadataKind) with Genres/Styles/Moods + thumb/profile/fanart/logo artwork, and `upsert_local_music_video` parses `{video}.nfo` and writes `MusicVideoMetadata` (Title/SortTitle/Album/Plot/Year/ReleaseDate/Track/MetadataKind) with Genres/Tags/Studios/Directors + MusicVideoArtist rows and ErsatzTV-order artwork discovery (per-video suffix → `.tbn` exact-ext → generic name in video dir → parent artist folder). The Local TV scanner now has full `TelevisionFolderScanner.cs` etag/`LibraryFolder` parity: show and season `LibraryFolder` rows are persisted (season `ParentId` → show folder, mirroring `ScanFolder`); each episode `MediaFile.LibraryFolderId` is linked on both insert and existing-file repair (`UpdateLibraryFolderId`); the season folder-etag fast path (`FolderEtag.CalculateWithSubfolders`, .NET-ticks mtime) skips episode probing for unchanged folders while still refreshing season metadata/poster, persisting the etag after a successful scan; a restore guard disables the fast path for any season holding a previously trashed episode (`MediaItem.State IN (1,2)`, exact `GetAllTrashedItems` parity, `RemoteOnly` excluded) so restored files return to `Normal`; skipped episodes advance progress without counting toward `scanned_files`; and `clean_library_folders_for_path` drops stale `LibraryFolder` rows after each library-path scan (deepest-first, kept when `MediaFile`-referenced or having child rows), mirroring `CleanEtagsForLibraryPath`.

Correctness fix this window (`52e1028..626783e`): the four scan-kind writers (local, Plex, Emby, Jellyfin) carried divergent private encode tables (Progressive=0/Unknown=2) while every reader and ErsatzTV use Unknown=0/Progressive=1/Interlaced=2; the mapping is now centralized in `VideoScanKind::db_value()` matching ErsatzTV numbering, so progressive sources without ffprobe `field_order` are no longer read back as interlaced and needlessly deinterlaced. Rows written by earlier builds keep the old values until re-probed (one-time remap 0→1, 2→0 documented in the commit).
Remaining `ParityDebt` (runtime evidence, `ErsatzRS.log` 2026-06-10): music-video NFO parsing fails on hundreds of real-world files with `NFO did not contain a <musicvideo> root element` and falls back to filename metadata — ErsatzTV's NFO reader tolerates these files (fragment/multiple-root leniency), so metadata parity is lost for those libraries. Additionally, library scans intermittently fail with SQLite `(code: 5) database is locked` (`library scan failed library_id=3/5`), so concurrent scan + web activity aborts scans instead of serializing like ErsatzTV.
'''
