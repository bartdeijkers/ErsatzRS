feature    = 'Collections / Smart Collections'
etv_source = '`ErsatzTV/Pages/Collections*.razor`, `ErsatzTV/Pages/SmartCollections.razor`, `ErsatzTV/Pages/SmartCollectionEditor.razor`'
rs_target  = '`crates/ersatzrs-web/src/admin/pages/media/{collections,collection_detail,smart_collections}.rs`, `crates/ersatzrs-web/src/admin/languages/`'
status     = 'Ported'
adr        = ['0083']

summary    = '''
Ported: manual collection list/add/edit/detail and smart collection list/edit pages preserve the upstream persistence, refresh, and scheduling contracts while using the pinned MudBlazor geometry where it remains appropriate. ADR 0083 deliberately replaces the opaque smart-collection query field with a dedicated composer: the default view exposes three localized Match all/Match any/Exclude any cards, and only genuine nested child groups enter a one-level-at-a-time focus view. The canonical query remains the single persisted contract and an editable compatibility surface; a live count uses the same global search projection. `/search` hands its exact query and return URL to the add route. Operators can keep a named advanced query as an ErsatzRS-only authoring draft, recall it, modify it, and update it without triggering smart-collection membership or playout effects. Hydrated editing and the raw HTML POST fallback share the same validated query contract, including exact return-URL and draft preservation across fallback errors. Structured saves await the current composer model rather than persisting a stale canonical projection. Manual custom order supports native drag/drop and Move Up/Down buttons over the same persisted `update_collection_custom_order` path. Collection add/remove/custom-order mutations enqueue `BuildPlayout(Refresh)` for playouts whose persisted program-schedule anchors reference the collection, matching `MediaCollectionRepository.PlayoutIdsUsingCollection`; smart collection updates refresh search targets, smart-collection cache, and dependent playouts. Manual collection deletion cascades its membership rows, and the next search reads only surviving collection names from SQLite. All composer labels, validation failures, and field-catalog names are localized through the persisted-language i18n layer. The shared search-index Lucene smart-collection debt remains closed: profile-copy Chromium and Firefox proof follows the `Music Videos` smart-collection Search action and renders `377 Music Videos`, matching direct SQL while excluding the blocked artists.
'''
