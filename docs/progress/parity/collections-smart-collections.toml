summary    = '''
Ported: manual collection list/add/edit/detail and smart collection list/edit pages now follow the pinned ErsatzTV MudBlazor layout contract: 64px action bars where upstream has them, ExtraLarge-width content, h5-style headings with dividers, dense search/table/pager geometry, icon action columns, editor label/field rows, detail selection actions, section anchors, movie-only custom playback-order controls, and responsive mobile action visibility. `/media/collections/add` creates a collection through both hydrated interaction and the raw HTML POST fallback, then redirects to `/media/collections`; edit saves redirect to the detail page. Manual custom order supports native drag/drop and Move Up/Down buttons over the same persisted `update_collection_custom_order` path. Collection add/remove/custom-order mutations enqueue `BuildPlayout(Refresh)` for playouts whose persisted program-schedule anchors reference the collection, matching `MediaCollectionRepository.PlayoutIdsUsingCollection`; smart collection updates refresh search targets, smart-collection cache, and dependent playouts. The collection and smart-collection labels, validation messages, actions, toasts, and API fallback paths are localized through the persisted-language i18n layer. Browser coverage in `tests/e2e/collections.spec.ts` proves hydrated add, no-JS add fallback persistence, manual list/detail geometry, smart list/editor geometry, and mobile manual-list action usability. Full smart-collection search parity remains blocked on the search-index Lucene debt and is the next parity goal after the admin UI fixes.
'''

