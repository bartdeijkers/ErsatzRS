feature    = 'Collections / Smart Collections'
etv_source = '`ErsatzTV/Pages/Collections*.razor`, `ErsatzTV/Pages/SmartCollections.razor`, `ErsatzTV/Pages/SmartCollectionEditor.razor`'
rs_target  = '`crates/ersatzrs-web/src/admin/pages/media/{collections,collection_detail,smart_collections}.rs`, `crates/ersatzrs-web/src/admin/languages/`'
status     = 'Ported'
adr        = ['0083']

summary    = '''
Ported: manual collection list/add/edit/detail and smart collection list/edit pages preserve the upstream persistence, refresh, and scheduling contracts while using the pinned MudBlazor geometry where it remains appropriate. ADR 0083 deliberately replaces the opaque smart-collection query field with a dedicated composer: the default view exposes three localized Match all/Match any/Exclude any cards, and only genuine nested child groups enter a one-level-at-a-time focus view. The canonical query remains the single persisted contract and an editable compatibility surface; a live count uses the same global search projection. `/search` hands its exact query and return URL to the add route. Operators can keep a named advanced query as an ErsatzRS-only authoring draft, recall it, modify it, and update it without triggering smart-collection membership or playout effects. Hydrated editing and the raw HTML POST fallback share the same validated query contract, including exact return-URL and draft preservation across fallback errors. Structured saves await the current composer model rather than persisting a stale canonical projection. Manual custom order supports native drag/drop and Move Up/Down buttons over the same persisted `update_collection_custom_order` path. Collection add/remove/custom-order mutations enqueue `BuildPlayout(Refresh)` for playouts whose persisted program-schedule anchors reference the collection, matching `MediaCollectionRepository.PlayoutIdsUsingCollection`; smart collection updates refresh search targets, smart-collection cache, and dependent playouts. All composer labels, validation failures, and field-catalog names are localized through the persisted-language i18n layer. The shared search-index Lucene smart-collection debt remains closed: profile-copy Chromium and Firefox proof follows the `Music Videos` smart-collection Search action and renders `377 Music Videos`, matching direct SQL while excluding the blocked artists.
'''

[[debt]]
id          = 'smart-collection-add-route-queried-id-zero'
description = 'The Add Smart Collection route has no `:id` segment, so `SmartCollectionEditorIsland` passed collection id 0 to `get_smart_collection`, which the application layer rejects as a validation error on every page load. Reporting that through the toast channel during server rendering broke island hydration for the whole page, leaving every button and dialog dead.'
discovered  = '2026-07-25'
evidence    = 'Fixed 2026-07-25: the loader now skips the query for id 0 and starts from a blank form, matching `CollectionEditorIsland`. `ToastStore::push` is inert off-wasm so an SSR toast can no longer corrupt hydration, and `hydration-lint` rule-3 blocks new server-side toast reporting. Regression seen in CI run 30132852456: `island-hydration.spec.ts` failed on `/media/smart-collections/add` in Chromium and Firefox with a marker-node mismatch at `toast.rs:169`.'
resolved    = true
