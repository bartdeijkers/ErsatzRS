`the_hls_builder_refuses_unplayable_dolby_vision_before_any_spawn` cover
profiles 5, 7, and an unrecognised profile;
`the_iptv_builder_allows_profile_8_1_transcode_but_rejects_unproven_stream_copy` and
`the_hls_builder_allows_a_compatible_dolby_vision_profile` cover the allowed
transcode cases, rejected copy, and a source with no Dolby Vision at all.

The debt asked for assertions that no child process starts. Those are asserted
at the command boundary instead, because that is where the refusal is enforced:
a refused source yields no command, so the supervisor has nothing to spawn.
Asserting downstream would amount to checking that a value which does not exist
cannot be passed to a function requiring it.

Writing these also confirmed a related behavior: an HEVC Dolby Vision source in
a *direct MPEG-TS* stream is refused rather than copied, because only H.264 is
copy-safe there, so that path genuinely transcodes. The stream-copy exception
is proven with fMP4, where HEVC really is copied.

Second-review correction, 2026-08-08: the HLS worker no longer sleeps and
re-selects a refused item indefinitely. A typed refusal enters the normal
error-slate failure path; when the slate succeeds, `transcoded_until`, session
state, and MPEG-TS timestamp offset advance together. Both HLS and direct IPTV
remove graphics rendered before command construction on this early-refusal
path. Regressions:
`refused_hls_source_enters_error_slate_path_and_advances_the_cursor` and
`early_stream_refusal_cleanup_removes_rendered_graphics_directories`.
'''
resolved    = true

[[debt]]
id          = 'frame-hdr-side-data-is-not-scoped-to-the-video-stream'
adr         = '0064'
description = 'P2: Retain `stream_index` on each `FfprobeFrame`, group frame side data by stream, and pass only the matching group into `stream_to_domain`; if ffprobe omits an index, allow a fallback only when the media has exactly one video stream rather than broadcasting metadata to every stream. Closure requires a two-video-stream JSON regression with distinct mastering display, MaxCLL/MaxFALL, and Dolby Vision data plus a pinned-secondary-stream playback assertion.'
discovered  = '2026-08-07'
evidence    = '`FfprobeFrame` stores only `side_data_list`, and `project_to_media_version` flattens side data from every probed frame into one vector passed to every stream, so a selected secondary stream can inherit or lose metadata from another video stream.'
remediation = '''
Closed 2026-08-08. `FfprobeFrame` retains `stream_index`, and
`frame_side_data_for_stream` passes each stream only its own frames.

An unindexed frame — ffprobe sometimes omits the field — is used only when the
media has exactly one video stream, where there is nothing to confuse it with.
With more than one it is dropped rather than attributed by guesswork, because a
wrong attribution is worse than a missing value: it would give a pinned
secondary stream another stream's colour metadata.

Regressions: `frame_side_data_is_scoped_to_its_own_video_stream` (two video
streams with distinct mastering display, MaxCLL/MaxFALL, and Dolby Vision
records, asserting neither leaks into the other) and
`unindexed_frames_are_used_only_when_there_is_one_video_stream`.
'''
resolved    = true

