MaxCLL/MaxFALL side data, and a concatenated SDR+PQ+HLG NVENC stream reported one
signalling class across all 75 frames.

Backends without a characterized HDR10 graph are demoted to software encoding by
`effective_video_acceleration` (`hdr10_output_support` returns `Unproven`), which
preserves colour semantics at the cost of performance exactly as ADR 0064
prescribes, and the `Output Dynamic Range` health check raises a Warning naming
