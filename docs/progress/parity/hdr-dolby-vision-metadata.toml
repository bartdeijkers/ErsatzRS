feature    = 'HDR static metadata and Dolby Vision source handling'
etv_source = 'ErsatzRS extension enabled by the FFmpeg 9 runtime; no ErsatzTV equivalent (`$ERSATZTV_SRC` contains no Dolby Vision policy and no HDR10 static-metadata emission)'
rs_target  = '`crates/ersatzrs-domain`, `crates/ersatzrs-scanner`, `crates/ersatzrs-infra`, `crates/ersatzrs-app`, `crates/ersatzrs-ffmpeg`, `crates/ersatzrs-web`'
status     = 'Deferred'
adr        = ['0014', '0017', '0064']
summary    = '''
Deferred after Phase 8 and explicitly non-blocking for Phase 9. ADR 0064
defines the beyond-parity SDR, HDR10, HLG, and Dolby
Vision input/output contract. Profiles persist a localized output dynamic
range independently of codec bit depth. Software and NVENC graphs produce
stable BT.709 SDR or BT.2020/PQ HDR10, preserve or replace static metadata only
when its meaning remains valid, and strip incompatible HDR or Dolby Vision
signalling. Backends without a characterized HDR10 graph demote to software
instead of silently emitting SDR, and health reports the performance impact.

Dolby Vision output is not supported. Profile 8.1 and the exact characterized
Profile 7 dual-layer tuple transcode from conventional base layers; Profile 7
uses direct software decode while `dovi_split=mode=bl` remains a fixture oracle.
Profile 5 is admitted only through two positively proven operations on the
selected CUDA/Vulkan/NVENC device: SDR/H.264 and HDR10/HEVC. There is no generic
or guessed-colour fallback. Jellyfin, Emby, Plex, and local scans preserve
complete or explicitly incomplete Dolby Vision identity, and old incomplete
rows fail closed until a rescan supplies the required fields.

The implemented command boundary rejects unsupported and incomplete Dolby
Vision before spawn. Runtime capability proof, learned denial, cache identity,
health, HLS, and direct IPTV all share the selected device and FFmpeg runtime
identity. Dolby Vision stream copy remains rejected until a source, codec,
container, output, and client matrix is proven.

Remaining debt is evidence-gated and retained for later opportunistic closure:
HDR10 and functional graph proof on
non-NVIDIA hardware, the complete Profile 5 production HLS/MPEG-TS run on
matching NVIDIA/Vulkan hardware, and a Dolby Vision passthrough matrix. Exact
evidence and closure state live in the debt entries below; future work is
sequenced by `plans/phase-8-hardware-residue.md`. None of these deferred gates
is required for Phase 8 closeout or Phase 9 entry.
'''

[[debt]]
id          = 'hdr10-is-uncharacterized-on-non-nvidia-hardware'
adr         = '0064'
description = 'QSV, VAAPI, AMF, VideoToolbox, RKMPP, and V4L2M2M have no characterized HDR10 output graph, so an HDR10 profile on those backends encodes in software. Correct but slow. Characterize each against real hardware and add its graph, or record that the backend genuinely cannot signal HDR10.'
discovered  = '2026-08-07'
evidence    = '''
`hdr10_output_support` in `crates/ersatzrs-ffmpeg/src/filter/hdr.rs` marks only `None` and `Nvenc` as `Proven`. No Intel, AMD, Apple, or Rockchip hardware was available during p8a-01; only an NVIDIA RTX 3080 Ti was.


Measured on the development machine 2026-08-08, which is why these paths could
not be characterized here rather than merely "no hardware was available":
`ffmpeg -hwaccels` advertises cuda, vaapi, qsv, drm, opencl, vulkan, and amf,
and `hevc_vaapi`, `hevc_qsv`, and `hevc_amf` are all listed by `-encoders`, but
only cuda creates a device. `-init_hw_device vaapi` and `qsv` both fail with
-542398533, opencl reports no platforms (-1001), `hevc_qsv` cannot open an MFX
session (-9), and `hevc_amf` cannot load `libamfrt64.so.1`. There is no
`/dev/dri`. This is itself the advertised-but-nonfunctional class the graph
probe exists to catch, so it confirms the design while leaving the non-NVIDIA
graphs unproven.

Missing manual gate: a machine with a working Intel (QSV), AMD (VAAPI/AMF),
Apple (VideoToolbox), or Rockchip (RKMPP) device.
'''
resolved    = false

