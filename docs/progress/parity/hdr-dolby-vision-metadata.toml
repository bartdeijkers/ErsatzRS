feature    = 'HDR static metadata and Dolby Vision source handling'
etv_source = 'ErsatzRS extension enabled by the FFmpeg 9 runtime; no ErsatzTV equivalent (`$ERSATZTV_SRC` contains no Dolby Vision policy and no HDR10 static-metadata emission)'
rs_target  = '`crates/ersatzrs-domain`, `crates/ersatzrs-scanner`, `crates/ersatzrs-infra`, `crates/ersatzrs-app`, `crates/ersatzrs-ffmpeg`, `crates/ersatzrs-web`'
status     = 'In progress'
adr        = ['0014', '0017', '0064']
summary    = '''
In progress. ADR 0064 accepts a beyond-parity input/output contract for HDR10,
HLG, SDR, and Dolby Vision sources. FFmpeg profiles will persist a localized
output dynamic-range choice: stable BT.709 SDR or stable BT.2020/PQ HDR10.
Bit depth remains separate, copy profiles preserve source signaling, and
invalid codec/output combinations must fail validation rather than downgrade
silently.

This record corrects the 2026-08-07 differential-review assumption that the two
seeded HDR-named profiles already produce BT.2020/PQ without static metadata.
Current command generation tone-maps every transcoded HDR source to BT.709
because `FFmpegProfile` has no desired output dynamic range. The work is
therefore a color-semantics and persistence slice before it is a metadata-option
slice.

Dolby Vision is an input policy first. Profiles 5, 7, and 8.1 require real
fixture characterization; `dovi_split` is a profile-7 multilayer tool rather
than general Dolby Vision support. Dolby Vision output remains out of scope.
Milestone `p8a-01` has landed the software half of the output contract:
`OutputDynamicRange` is persisted (additive SQLite/MySQL migration defaulting
existing rows to `SdrBt709`), validated, localized in all five cultures, seeded
as HDR10 for exactly the two ADR 0017 profiles named `hdr`, health-checked, and
implemented in the software pipeline for PQ, HLG, SDR, and untagged sources.
The SDR reference-white policy is ITU-R BT.2408 diffuse white (203 cd/m²) and
is proven exact from decoded frames. Evidence, including the mixed
SDR/HDR/HLG programme-transition proof, is recorded in
`docs/how-to/hdr-output-characterization.md`.

Hardware HDR10 output graphs (NVENC/QSV/VAAPI/AMF/VideoToolbox/RKMPP/V4L2M2M)
are NOT yet implemented or characterized; those paths still tone-map to SDR.
Dolby Vision (`p8a-02`) has not started. The active sequence and runtime
acceptance matrix live in
`plans/ffmpeg-9-hdr-dolby-vision-and-pipeline-hardening.md` and milestones
`p8a-01`/`p8a-02`.
'''

[[debt]]
id          = 'hdr-output-dynamic-range-is-implicit'
adr         = '0064'
description = 'FFmpegProfile persists codec, codec profile, bit depth, and tonemap algorithm but no output dynamic range. Every transcoded HDR source currently enters the HDR-to-SDR branch and is marked BT.709, including when an ADR 0017 profile named `hdr` is selected. Implement `SdrBt709` and `Hdr10Bt2020Pq` as a persisted, validated, localized profile contract; default existing rows to SDR to preserve current effective behavior and seed new HDR rows as HDR10.'
discovered  = '2026-08-07'
evidence    = 'Resolved 2026-08-07 by milestone p8a-01. `OutputDynamicRange` is persisted in `crates/ersatzrs-domain/src/ffmpeg.rs`, migrated additively in `migrations/202608071200_output_dynamic_range.sql` (and the MySQL twin) with existing rows defaulting to `SdrBt709`, validated in `ersatzrs-app::commands::validate_output_dynamic_range`, localized in all five cultures, and consumed by `apply_hdr10_output_conversion` in `crates/ersatzrs-ffmpeg/src/pipeline/mod.rs`. Regressions: `existing_sqlite_profiles_default_to_sdr_output_dynamic_range`, `fresh_database_seeds_only_the_adr_0017_hdr_profiles_as_hdr10`, the `hdr10_*` pipeline snapshots, and `sdr_profile_still_tonemaps_an_hdr_source_exactly_as_before`.'
resolved    = true

[[debt]]
id          = 'hdr10-output-omits-static-metadata'
adr         = '0064'
description = 'After the output dynamic-range contract exists, HDR10 output must carry semantically valid mastering-display and content-light metadata. The scanner must persist source metadata, transforms must preserve it only when it remains meaningful, explicit validated profile metadata must cover transforms or missing sources, and SDR output must strip stale HDR/Dolby Vision signaling.'
discovered  = '2026-08-07'
evidence    = 'Resolved 2026-08-07 for the software path by milestone p8a-01. A PQ source is preserved and carries its own side data through both libx265 and hevc_nvenc unmodified; HLG and SDR sources are transformed and therefore receive documented, reviewable profile metadata through the FFmpeg 9 per-stream input options `-mastering_display`/`-content_light` (`hdr10_static_metadata_input_options`). SDR output still strips HDR signalling via the unchanged ErsatzTV tonemap path, asserted by `sdr_profile_still_tonemaps_an_hdr_source_exactly_as_before`. Decoded-frame evidence: `docs/how-to/hdr-output-characterization.md` findings 1, 3, and 5. The scanner does not yet persist typed source mastering-display/MaxCLL values, so profile defaults are used for every transform; that gap is tracked by `hdr10-source-metadata-is-not-persisted`.'
resolved    = true

