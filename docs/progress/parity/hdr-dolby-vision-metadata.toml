[[debt]]
id          = 'dolby-vision-sources-are-unhandled'
adr         = '0064'
description = 'ErsatzRS does not persist Dolby Vision configuration, classify profiles, or define copy/transcode behavior. Characterize profiles 5, 7, and 8.1 against stable SDR and HDR10 outputs; use profile 7/compatible 8.1 base-layer behavior only when fixture-proven; reject unproven profile 5 paths visibly; and make RPU consumption, stripping, or preservation explicit. Dolby Vision output is excluded.'
discovered  = '2026-08-07'
evidence    = '''
Partially resolved 2026-08-07 by milestone p8a-02: the safe-default half is
implemented, the fixture-gated enablement half is blocked.

Implemented and tested. `ersatzrs_ffmpeg::DolbyVisionConfiguration` models the
ffprobe `DOVI configuration record` (field names read from the shipped ffprobe
binary: `dv_profile`, `dv_bl_signal_compatibility_id`, `rpu_present_flag`,
`el_present_flag`, `bl_present_flag`). The record is parsed, persisted through an
additive SQLite/MySQL migration, and carried to playback. The policy follows the
profile definitions rather than a guess: profile 8 with base-layer compatibility
id 1 (HDR10) or 4 (HLG) may play from that base layer with Dolby Vision
signalling removed, because the compatibility id is a standard guarantee;
profile 7 stays unproven because separating its enhancement layer needs
`dovi_split` plus a fixture; profile 5 stays unproven because it has no
conventional fallback at all and decoding it as BT.2020 yields visibly wrong
colour. A `Dolby Vision` health check names every rejected stream and its
reason. Dolby Vision output is not advertised anywhere.

Characterized 2026-08-07 against a real 4K Dolby Vision profile 8.1 HEVC file
supplied by the maintainer. It is a commercial recording, so it is not committed;
the gate `real_dolby_vision_file_is_parsed_and_classified` takes its path from
`ERSATZRS_DOLBY_VISION_FIXTURE` and skips when unset.

ffprobe reports `dv_profile 8`, `dv_bl_signal_compatibility_id 1`,
`rpu_present 1`, `el_present 0`, `bl_present 1`, and the ErsatzRS parser
reproduces every field. The stream confirms the compatibility claim:
`bt2020nc / smpte2084 / bt2020` with mastering-display and MaxCLL/MaxFALL
present. Both output contracts behave as the ADR requires — SDR yields
`bt709/bt709/bt709` with no HDR side data and no DOVI record; HDR10 preserves
`bt2020nc/smpte2084/bt2020` with its metadata and also drops the DOVI record,
which is correct because neither output is Dolby Vision.

`unsupported_source_reason` refuses an unproven Dolby Vision source before
transcoding rather than producing plausible but incorrect colour, and returns
`None` for stream copy, where ErsatzRS is not the one interpreting the colour.

Still unproven, and tracked as `dolby-vision-profiles-5-and-7-are-unproven`:
profiles 5 and 7 remain rejected because no fixture of either was available.
That is the safe default rather than a gap in behavior.
'''
resolved    = true

[[debt]]
id          = 'hdr10-hardware-output-paths-are-unimplemented'
adr         = '0064'
description = 'Only the software pipeline honours `Hdr10Bt2020Pq`. NVENC, QSV, VAAPI, AMF, VideoToolbox, RKMPP, and V4L2M2M still route every HDR source through the tone-map-to-BT.709 branch, so selecting an HDR10 profile with hardware acceleration silently produces SDR — exactly what ADR 0064 forbids. Implement the HDR10 graph per backend or make the combination a capability-gated rejection with health and troubleshooting evidence.'
discovered  = '2026-08-07'
evidence    = '''
Resolved 2026-08-07. No hardware path can now emit SDR from an HDR10 profile.

NVENC is implemented and proven on an RTX 3080 Ti: a PQ source uses
`hwupload,setparams,scale_cuda` and never leaves the GPU (`setparams` works on
CUDA surfaces); HLG and SDR sources convert in software and re-upload through
`format=p010le,hwupload_cuda`. All three produced
`hevc / yuv420p10le / bt2020nc / smpte2084 / bt2020` with mastering-display and
MaxCLL/MaxFALL side data, and a concatenated SDR+PQ+HLG NVENC stream reported one
signalling class across all 75 frames.

Backends without a characterized HDR10 graph are demoted to software encoding by
`effective_video_acceleration` (`hdr10_output_support` returns `Unproven`), which
preserves colour semantics at the cost of performance exactly as ADR 0064
prescribes, and the `Output Dynamic Range` health check raises a Warning naming
the affected profiles. Regressions:
`nvenc_hdr10_keeps_a_pq_source_on_the_gpu`,
`nvenc_hdr10_converts_an_sdr_source_and_re_uploads_to_cuda`,
`nvenc_hdr10_normalizes_hlg_and_downloads_ten_bit_surfaces`,
`unproven_hardware_backends_demote_to_software_for_hdr10`,
`unproven_backends_keep_their_hardware_path_for_sdr_profiles`,
`output_dynamic_range_check_warns_when_hdr10_demotes_to_software`, and
`output_dynamic_range_check_passes_for_nvenc_hdr10`.

Two runtime constraints were discovered and encoded: `hwdownload` can only
produce the surface's own software format (an 8-bit CUDA surface must download
as nv12, a 10-bit one as p010le), and `zscale` cannot convert from an unknown
colourspace, so the SDR chain asserts BT.709 input tags for untagged sources.
'''
resolved    = true

