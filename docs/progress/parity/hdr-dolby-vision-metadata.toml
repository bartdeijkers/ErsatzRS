description = 'ADR 0064 requires the scanner to persist typed source colour primaries, transfer, matrix, range, mastering-display metadata, MaxCLL/MaxFALL, and the Dolby Vision configuration record, and to carry them with the selected stream. Only the raw ffprobe colour tags are persisted today, so an HLG or SDR item transformed into HDR10 always receives the documented profile defaults rather than values derived from the source.'
discovered  = '2026-08-07'
evidence    = '''
Resolved 2026-08-07 for HDR10 static metadata (the Dolby Vision configuration
record belongs to p8a-02).

`MediaStream` now persists `MasteringDisplay`, `MaxCll`, and `MaxFall` through an
additive SQLite/MySQL migration (`202608071600_media_stream_hdr_metadata.sql`);
NULL means the source carried none, so existing rows keep using the documented
profile defaults until a rescan. Mastering display is stored pre-formatted in
FFmpeg`s own `-mastering_display` units because ffprobe already reports them
that way, so nothing is re-scaled.

The probe had to change shape: Matroska carries these as *frame* side data, not
stream side data, so `-show_streams` alone misses them entirely. The scanner
probe now also requests one frame (`-read_intervals %+#1 -show_frames`), which
measured at no detectable extra cost.

The pipeline prefers source metadata over the seeded default when converting an
HLG or SDR item, since the display the content was graded on is unchanged by a
transfer conversion. A PQ source still emits no metadata options at all, because
its own side data survives the encode and injecting anything could only replace
accurate values with less accurate ones. Regressions:
