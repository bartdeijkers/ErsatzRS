feature    = 'FFmpeg filter graph'
etv_source = '`$ERSATZTV_SRC/ErsatzTV.FFmpeg/Filter/ComplexFilter.cs`'
rs_target  = '`crates/ersatzrs-ffmpeg`'
status     = 'Ported'
adr        = ['0003']

summary    = '''
Ported: complex-filter label routing, subtitle/song-progress filters, ffconcat
v1.0 playlist writing, static/dynamic watermark input routing, resource-backed
watermarks, z-index-safe multi-overlay pairing, graphics-image/drawvg
composition, NVENC/CUDA overlay/download edge cases, and native opacity/fade
filter emission are implemented with snapshot coverage and runtime smoke
coverage. Dynamic watermarks (intermittent/opacity-expression/multiple, or any
combined with graphics elements) join the z-ordered graphics overlay plan per
ADR 0005, while a single permanent watermark can stay on the native ffmpeg
watermark path.

Opacity-expression parity now covers both expression syntax and live clock
semantics. The translator rewrites ErsatzTV/NCalc operators and
`LinearFadePoints` / `LinearFadeDuration` helpers into FFmpeg eval syntax,
copies lum/cb/cr through `geq`, and rewrites alpha safely. The 2026-06-17
closeout fixed still opacity-expression inputs to loop like other dynamic still
watermarks, so FFmpeg evaluates `T` over an advancing image timeline instead of
freezing at the first image frame. Focused live proofs run the real direct IPTV
`.ts` and HLS segmenter builders against generated calibration media, capture
spawned FFmpeg argv with `-loop 1`, `-ss 00:00:05.0000000`, `(5+T)`,
`(30+T)`, `mod((86399.5+T),86400)`, and `lt((5+T),12)`, then decode output
pixels at three frames to observe black -> red -> black opacity behavior across
the midnight wrap.

The hardware-only `ffmpeg-command-generation` `nvenc-filter-gate-live-proof`
debt remains open in that feature because this machine still has
CUDA-filter-capable FFmpeg builds rather than the required encoder-only /
no-CUDA-filter build.
'''

[[debt]]
id          = 'opacity-expression-time-variable-semantics'
description = 'Snapshot-covered clock semantics are now implemented in native FFmpeg eval (`content_seconds = in-point/seek + T`, `channel_seconds = channel uptime at spawn + T`, `time_of_day_seconds = mod(seconds-since-midnight-at-spawn + T, 86400)`, `content_total_seconds = probed MediaVersion.Duration`) and threaded through direct IPTV `.ts`, HLS segmenter, and troubleshooting preview builders. Remaining parity debt: no live IPTV/HLS runtime proof has yet captured these exact wall-clock/in-point/duration bindings in an actual stream, so the feature must stay `In progress`.'
discovered  = '2026-06-12'
evidence    = '`$ERSATZTV_SRC/ErsatzTV.Infrastructure/Streaming/Graphics/OpacityExpressionHelper.cs` `GetOpacity` and `GraphicsEngine.cs` bind the four clocks per frame. ErsatzRS translates the same variables through `WatermarkOpacityClock`; `watermark_input_for_stream` now loops still opacity-expression inputs so `T` advances at runtime. Live direct `.ts` proof `cargo test -p ersatzrs-web transport::iptv::stream::tests::stream_body_live_proves_opacity_expression_clock_bindings -- --ignored --nocapture` captured `-loop 1`, `-ss 00:00:05.0000000`, `(5+T)`, `(30+T)`, `mod((86399.5+T),86400)`, and `lt((5+T),12)`, then decoded black -> red -> black samples. Live HLS proof `cargo test -p ersatzrs-infra hls_segmenter_live_proves_opacity_expression_clock_bindings -- --ignored --nocapture` captured the same bindings and decoded the first generated segment with the same opacity transition.'
resolved    = true
