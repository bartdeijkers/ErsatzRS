summary    = '''
Ported for static watermark streaming: complex-filter label routing, subtitle/song-progress filters, and ffconcat v1.0 playlist writing are in place with snapshot coverage. Static watermark inputs loop still images, scale by `WidthPercent`, apply opacity/fade/expression filters, and chain multiple overlays by `ZIndex`; IPTV `.ts`, HLS segmenter, and dev-stream commands attach resolved watermarks; selection covers active deco-template, playout-deco, playout-item, channel, and global precedence with `DisableWatermarks` and playout-template date filter parity. Workspace/mysql gates and an ignored FFmpeg MPEG-TS frame-composition proof pass. Resource-backed dynamic graphics watermarks remain tracked under the graphics-engine plan.

The NVENC/CUDA unconvertible-chain runtime failures recorded on 2026-06-10 now have fixes landed (window `52e1028..626783e`, snapshot-covered): the `Parsed_scale_cuda_1`/`auto_scale_0` mismatch is addressed by tracking the CUDA surface (location + format) whenever the software-decode `hwupload` fallback feeds `scale_cuda` even without a deinterlace branch, so pad/crop/subtitle-burn now emit the required `hwdownload`; and the `Parsed_loop_2`/`auto_scale_1` mismatch plus the bare-503-instead-of-error-screen behavior is addressed by keeping still-image (PNG-background error-screen/song/slug) pipelines in software on the nvenc path (skip the upfront upload, pick the software scale filter, emit the still-image software pixel-format option). Subtitle-burn robustness also improved this window: a seeked subtitle with no remaining cues now reports `None` so callers drop the burn input instead of crashing libass in a retry loop, and subtitles/fontsdir paths are double-escaped for both the filtergraph and filter-option parse levels (fixes Windows drive-colon burn-in failures).
Live NVENC/CUDA HLS proof on 2026-06-11 re-verified the HLS segmenter path for
the learned-denial slice: software AV1 input decode fed the CUDA/NVENC
filter/encode chain with `-hwaccel none -c:v libdav1d` plus CUDA
upload/scale/overlay filters and `h264_nvenc`, producing a 200 HLS playlist and
readable MPEG-TS segments. This proof does not close direct IPTV `.ts`
runtime-learned denial scope.

The 2026-06-11 watermark-routing slice closes the resource-backed dynamic
watermark gap: `ChannelWatermarkImageSource::Resource` now resolves inside the
new `resources_cache_folder()` (`<AppData>/cache/resources`, warn-and-ignore on
missing files, matching `WatermarkSelector`); the web host extracts the bundled
streaming resources (`song_progress_overlay*.png`, song backgrounds, album
cover) at startup with `ResourceExtractorService` overwrite semantics; and the
pipeline ports the `FFmpegLibraryProcessService` routing rule — a single
permanent watermark with no graphics elements keeps the native ffmpeg watermark
input, while dynamic watermarks (intermittent/opacity-expression/multiple, or
any combined with graphics elements) join the z-ordered graphics overlay plan
so they composite with graphics elements like ErsatzTV's graphics engine (per
ADR 0005 ErsatzRS composites with native overlay/fade/opacity filters plus
drawvg for the vector path instead of a raster frame loop). Watermark inputs
now sort together with their overlays by z-index, fixing a latent input/overlay
zip mismatch when watermarks were attached out of z-order. Snapshot coverage:
single-permanent resource watermark stays native, watermark+drawvg z-order
interleave, out-of-order multi-watermark z-index pairing, and the rerouted
multiple/intermittent/opacity-expression watermark snapshots. The
song-with-progress watermark override itself ships with the song video
generation feature, not this slug.
'''

