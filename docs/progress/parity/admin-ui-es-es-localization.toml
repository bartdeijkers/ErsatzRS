summary    = '''
Implemented 2026-08-12: Spanish (Spain) is a first-class admin UI language. The
dedicated `es-es` module carries the accepted regional metadata and aliases and
implements every admin `TextKey`, dynamic helper, and stable error mapping in
Spanish for Spain, preserving the regional axes ("vídeo", "ajustes") against es-419.

The 2026-08-12 completion pass closed the remaining gaps. Glossary: Playout
was rendered "Reproducción" — colliding exactly with Playback — and
"Reproductora"; it is now the product noun `playout`, so "reproducción"
belongs to Playback alone. Stream keeps "emisión", which was already
consistent. Leakage: seven `return trimmed.to_owned()` passthroughs and the
duplicate-deco-template message echoed raw English and are now Spanish.
Localization: `episode_display_subtitle` still used the English compact
`S{season} E{episode}` form and now reads `temporada X, episodio Y`;
`channel_streaming_mode_label` and `TextKey::HlsDirect` return `HLS directo`;
`SubtitleModeHelp` and `PagedTableDemo` were still English.
`ContentVariantSearchHelp` was also still fully English in es-es only.

Technical identifiers (product and provider names, codecs, protocol tokens,
routes, configuration keys) stay verbatim per ADR 0012's translation boundary,
and unknown dynamic server errors pass through untranslated. Coverage is
enforced by `all_languages_translate_each_key`, the supported-registry test,
and module tests for the glossary, the localized episode subtitle, the
backend-error guards, and pass-through behavior.

Browser proof: the `es-es` leg of `tests/e2e/settings-i18n.spec.ts` passes in
Chromium against a live host booted by `scripts/e2e/playwright-e2e.sh` — the
language switch persists, `html lang` becomes `es-es`, and all eight settings
routes render Spanish headings, markers, units, and save actions with zero
English fallback markers, no error/warning alert surfaces, and a clean browser
console.
'''
