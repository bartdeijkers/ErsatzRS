rs_target  = '`crates/ersatzrs-infra/src/playback.rs`, `crates/ersatzrs-infra/src/hls_worker.rs`, `crates/ersatzrs-infra/src/transcode_capacity.rs`, `crates/ersatzrs-infra/src/health/checks/playback_data_access.rs`, `crates/ersatzrs-web/src/transport/iptv/`, `crates/ersatzrs-web/src/api/troubleshooting.rs`'
