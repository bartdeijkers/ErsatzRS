summary    = '''
Playback metadata, target-frame-rate, HLS configuration/current-item, and
active-transcode-capacity loaders now preserve valid absence while returning
typed database or decode failures. IPTV, HLS, capacity slates, and
troubleshooting previews stop before choosing altered FFmpeg inputs, stream
selection, normalization, or capacity defaults after an operational failure.
Correlated logs and the Playback Data Access health check expose those failures.
'''

[[debt]]
id          = 'playback-stream-loaders-swallow-storage-failures'
description = 'Source video/audio stream loaders treat SQL and row-decoding failures as no video stream, no audio streams, or default fields, which can silently change FFmpeg selection behavior.'
discovered  = '2026-07-21'
evidence    = '`load_source_video_stream`, `load_source_audio_streams`, and `load_channel_target_frame_rate` return typed repository results with strict row/value decoding. IPTV, HLS, and troubleshooting callers propagate failures before command construction. Focused SQLite tests cover valid absence, malformed persisted values, and unavailable databases.'
resolved    = true

[[debt]]
id          = 'hls-config-and-current-item-loaders-swallow-failures'
description = 'HLS work-ahead/channel/current-item queries and active-transcode configuration use defaults or None after database errors, conflating an unavailable store with valid missing configuration or no current playout item.'
discovered  = '2026-07-21'
evidence    = '`load_hls_work_ahead_limit`, `load_channel_slug_seconds`, `load_channel_name`, `load_active_hls_item`, and `load_active_transcode_limit` return typed optional results and reject invalid persisted values. Workers stop or retry on failure, capacity admission never substitutes a default after failure, and Playback Data Access health distinguishes missing configuration from invalid or unavailable storage.'
resolved    = true
