summary    = '''
Plex library discovery and scanning now recognize schema-supported Other Video sections, preserving provider ETags, reconciliation, remote playback metadata, artwork, people, GUIDs, streams, and uniform metadata facets under ADR 0062.

Ported: `/media/libraries` joins Library + subtype + MediaSource tables; per-library Scan/Deep Scan fires a background `sync_library_by_id`, the hydrated table polls scan locks/progress like ErsatzTV's library-change/progress subscriptions, and the list now refetches after scanner-updated media state changes. The previous scan-queued snackbar was removed because ErsatzTV's `Libraries.razor` does not show a snackbar for scan dispatch. The web crate invokes `scan_local_library` directly via the `[lib]` target on `ersatzrs-scanner`. Phase 7 Slice 25 adds External Collections section below the libraries table, mirroring ErsatzTV's layout: for each remote MediaSource (Plex/Jellyfin/Emby) with `ShouldSyncItems=1` on any library, renders a row with Scan/Deep Scan buttons that invoke `sync_collections_for_media_source` (a new infra helper that loads provider config once and syncs all enabled libraries). `EntityLocker` now supports keyed string locks for both per-library scans (`library:{id}`) and per-source collection syncs (`collections:{kind}:{id}`). The TV show detail page's Scan/Deep Scan buttons now dispatch a targeted per-show sync via `scan_show(library_id, show_id, kind, deep_scan)`: Plex/Jellyfin/Emby each fetch the single show from the provider (`PlexServerApiClient.GetSingleShow`, Jellyfin/Emby `Items/{itemId}`-equivalent lookup) and run `sync_one_<provider>_show` (upsert show → seasons → episodes with the same `item_etag_matches` shallow-vs-deep contract), mirroring ErsatzTV's `SynchronizePlex/Jellyfin/EmbyShowByIdHandler`; Local intentionally falls back to a full library scan (matches ErsatzTV). After a successful deep show scan, `scan_show` now calls `subtitles::extract_embedded_show_subtitles`, porting ErsatzTV's `ExtractEmbeddedShowSubtitles` (text-subtitle + font-attachment extraction via ffmpeg). It is gated by `ffmpeg.extract_embedded_subtitles` (default off, matching ErsatzTV) and `ffmpeg.use_embedded_subtitles` (default on); Jellyfin/Emby episode scans populate `Subtitle` rows (`metadata::update_episode_subtitles`) so the extractor has rows to act on. Local movies, episodes, music videos, and other videos now also populate `Subtitle` rows from embedded subtitle streams plus same-basename `.srt` / `.ass` / `.ssa` / `.vtt` sidecars, preserving forced/SDH/CC filename flags and ISO language normalization. Jellyfin/Emby movie scans now persist provider subtitle streams into `MovieMetadata` `Subtitle` rows, and Plex movie/episode sync now persists provider subtitle streams into metadata-backed `Subtitle` rows with external subtitle keys preserved as sidecar paths. Playback consumes any persisted `Subtitle` rows for movies, episodes, music videos, other videos, and remote streams in MPEG-TS/HLS paths. Playout-window `ExtractEmbeddedSubtitles` now runs after channel/settings saves and successful playout builds, filters to subtitle-enabled playouts plus next-hour items, and extracts embedded text subtitles/fonts for episode/movie/music-video/other-video rows. Remote-stream subtitle row production is upstream-inactive: ErsatzTV's `RemoteStreamFolderScanner.UpdateSubtitles` call is commented out and `YamlRemoteStreamDefinition` has no subtitle fields. Real-media extraction smoke coverage now generates a tiny embedded-subtitle MKV via FFmpeg and verifies extraction output plus the persisted Subtitle row.

Remaining work: saving a library runs `DELETE FROM "LibraryPath" WHERE "LibraryId" = ?` before re-inserting its paths (`replace_ids`), and `MediaItem` cascades off `LibraryPath`, so it discards every scanned item for that library. Found 2026-08-12 auditing cascade parents; left unchanged because fixing it changes library-save write semantics and needs its own decision on path removal.
'''

[[debt]]
id          = 'library-scan-click-queue'
description = 'Clicking Scan Library on more than one library could run provider scans concurrently or drop a repeated request when a library was already locked. Expected behavior is FIFO queueing in click order while one library scan runs at a time.'
discovered  = '2026-06-22'
evidence    = 'Fixed 2026-06-22: `AppState` now owns a process-local `LibraryScanQueue`; `scan_library` enqueues accepted jobs and a single worker drains them FIFO through the existing provider/local scan paths. `list_locked_libraries` includes queued ids so the hydrated table disables/shows busy state before queued rows start. `library_scan_queue_runs_jobs_fifo_and_stops_when_empty` covers the queue contract.'
resolved    = true
