rs_target  = '`crates/ersatzrs-core/src/xmltv.rs`, `crates/ersatzrs-infra/src/xmltv.rs`, `crates/ersatzrs-infra/src/xmltv_metadata.rs`, `crates/ersatzrs-infra/src/xmltv_templates.rs`, `crates/ersatzrs-web/src/transport/iptv/guide.rs`'
