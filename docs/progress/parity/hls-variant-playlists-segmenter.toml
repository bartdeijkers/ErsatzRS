adr        = []
summary    = '''
Ported (Phase 7). Slice 1 landed the HLS entry surface: `/iptv/channels.m3u`
emits the mode-aware URL suffix (`.m3u8?mode={segmenter,hls-direct}` /
`.ts[?mode=ts-legacy]`), Kodi `#KODIPROP` headers on `kodi*` User-Agents,
short base64 unique ids, `ChannelIdentifier.FromNumber` tvg-id, and
`tvc-stream-{v,a}codec` tags. `/iptv/channel/{n}.m3u8` resolves mode
(segmenter -> multi-variant playlist, TS modes redirect to `.ts`,
`hls-direct` no longer 501s), and `build_multi_variant_playlist` emits
`#EXTM3U` + `#EXT-X-STREAM-INF:BANDWIDTH=...,RESOLUTION=...,CODECS="..."`
using the ErsatzTV `(VideoBitrate + AudioBitrate) * 1000 * 1.2` formula.

Slice 2 landed the first concrete worker: `HlsSessionRegistry` now owns
`try_get`/`try_insert`/`insert`/`remove`, `HlsSessionHandle` exposes async
`trim_playlist`, `HlsSessionWorker` in infra spawns FFmpeg via
`tokio::process::Command` into temp-backed HLS output, mirrors the MPEG-TS
route's provider path-replacement resolution before invoking FFmpeg, uses
atomic registration to prevent duplicate session workers under concurrent
requests, `/iptv/channel/{n}.m3u8?mode=segmenter` starts or touches the worker,
and `/iptv/session/{n}/hls.m3u8` plus `/iptv/session/{n}/{file}` serve the live
playlist and relative segment files from disk.

Slice 3 trims live playlists before serving them, preserves
`#EXT-X-DISCONTINUITY` boundaries across retained segments, deletes stale
temp-backed `.ts` / `.m4s` / `.mp4` files, and supports fMP4 worker output
(`segmenter-fmp4`) with `#EXT-X-MAP` / init-segment delivery through the shared
session file route. Slice 4 ports the direct branch: `.m3u8?mode=hls-direct`
now emits a single-entry playlist with per-channel media-sequence tracking,
`#EXT-X-DISCONTINUITY`, and `/iptv/hls-direct/{n}[.ts|.mp4|.mkv]` targets
driven by `ffmpeg.hls_direct.output_format` (default `mpegts`); the direct
stream route reuses the shared FFmpeg process streaming path and emits
output-format-aware content types.

Slice 5 ports `ConditionalIptvAuthorizeFilter` parity: `/iptv/*` routes are
protected by a route-scoped middleware that activates only when
`JWT__IssuerSigningKey` / `JWT:IssuerSigningKey` is configured, extracts the
token from `?access_token=` or `Authorization: Bearer`, validates HS256
signatures plus `exp`, and preserves the `/iptv/logos` exemption. The subtitle
slice wires the segmenter worker and HLS-direct stream path into the shared
subtitle selector: segmenter burns selected text subtitles or overlays image
subtitles; HLS-direct copies compatible embedded image subtitles for MKV/MP4
outputs and intentionally ignores text subtitles like ErsatzTV.

The stop-session slice (driven by the `/channels` Stop Transcode Session
button) extended the session layer with `HlsSessionHandle::cancel`,
`HlsSessionRegistry::active_channels`/`is_active`/`stop_channel`, and worker
`cancel`, porting `IFFmpegSegmenterService.IsActive`/`StopChannel` and
`IHlsSessionWorker.Cancel`: canceling wakes the worker run loop so it kills
FFmpeg, cleans the working dir, and deregisters, and `active_channels` exposes
the live-session set for client polling.

The final init-cache slice ports ErsatzTV's fMP4 init-segment lifetime model:
fMP4 workers now generate upstream-shaped `live_<generated>_%06d.m4s` segments
and `<generated>_init.mp4` init files, cache init files by hash, rewrite served
`#EXT-X-MAP` lines to the earliest cached init with the same hash, preserve that
earliest init while any later equivalent generation still needs it, delete only
segments before the served playlist window so work-ahead output remains
servable, delete stale non-earliest init files only after their generation is no
longer represented on disk or in the trim generation, and use the retained init
plus latest `.m4s` for fMP4 PTS probing between transcodes. The closeout
includes a real FFmpeg fMP4 runtime smoke against the Big Buck Bunny fixture:
the generated playlist contains the timestamped `#EXT-X-MAP`, the segment is
timestamped `live_<generated>_*.m4s`, and `ffprobe` reads the concatenated init
plus media segment.

Reopened audit (2026-06-08): the exposed HLS playlists, HLS-direct output
formats, access-token middleware, session registry, playlist trimming, fMP4 init
cache, subtitle/watermark/graphics command inputs, and stop-session surface are
ported, but the segmenter runtime does not yet match ErsatzTV's transport
orchestration. ErsatzTV's `StartFFmpegSessionHandler` reads
`ffmpeg.segmenter.timeout_seconds`, disables the timeout for KeepRunning
channels, refreshes graphics elements, starts a worker, and waits for
`ffmpeg.segmenter.initial_segment_count` segments before returning the
multi-variant playlist. The startup-settings slice now reads the persisted
segmenter timeout (default 60 seconds), disables the idle timeout for
KeepRunning channels, starts/touches the worker from both HLS segmenter and
MPEG-TS wrapper paths, and waits until the configured initial segment count is
visible in the live session playlist before returning the multi-variant
playlist. The state-machine slice now enforces `ffmpeg.segmenter.work_ahead_limit`
while reserving accelerated work-ahead slots.

The HLS command-options slice ports ErsatzTV's MPEG-TS segment option rule:
MPEG-TS HLS output now emits
`-hls_segment_options mpegts_flags=+initial_discontinuity` for the first
transcode or any transcode with zero PTS offset, adds `+latm` when the playback
profile uses AAC-LATM, skips the initial-discontinuity flag when a non-zero PTS
offset is applied, and leaves fMP4 HLS output without MPEG-TS segment options.

The first state-machine slice ports the deterministic `HlsSessionState`
transition table and the core worker-loop scheduling rules from ErsatzTV:
Rust now tracks `SeekAndWorkAhead`, `ZeroAndWorkAhead`, `SeekAndRealtime`,
`ZeroAndRealtime`, slug states, and `PlayoutUpdated`; gates transcoding on the
same 60-second buffered-output threshold; switches to realtime once at least
30 seconds are buffered; reads `ffmpeg.segmenter.work_ahead_limit`; reserves a
global work-ahead slot while accelerated transcodes are running; chooses the
request timestamp and start-at-zero behavior from the current state; and bounds
each work-ahead segmenter FFmpeg command to ErsatzTV's 44-second cap before
switching to realtime-paced input, instead of running the full remaining media
path open-ended.

The playout-update notification slice wires the modeled `PlayoutUpdated` state
into the scheduler-owned build path: active HLS handles and registries now
expose `playout_updated`, the concrete worker stores state outside the run-loop
local so notifications can switch the next iteration to `PlayoutUpdated`, and
both requested and periodic playout builds can notify active segmenter sessions
after successful non-Continue builds when persisted playout output changed or
the channel is OnDemand. The HLS worker now treats `PlayoutUpdated` as a live
seek for request-time selection, using the current wall clock instead of a
possibly stale buffered-ahead `transcoded_until` while preserving the ErsatzTV
state transition table. The web host passes its live HLS registry into the
scheduler so the notification reaches in-process workers.

The on-demand runtime slice ports the segmenter-owned playout time-shift and
checkpoint behavior: HLS worker startup now time-shifts OnDemand playout item
windows, guide windows, history, program-schedule anchors, and playout anchors
to the worker start time when needed; successful and failed transcode attempts
refresh `Playout.OnDemandCheckpoint` for OnDemand channels; and the worker now
loads `Channel.SlugSeconds` so the already-ported slug states can be selected
when a channel has slug seconds configured.

The slug-generation slice wires those slug states to runtime output: when the
state machine enters `SlugAndWorkAhead` or `SlugAndRealtime`, the worker now
bypasses playout-item lookup and emits an ErsatzTV-shaped generated black-video
plus silent-audio HLS command for the configured `Channel.SlugSeconds`
duration, preserving profile/resolution metadata, HLS segment options, PTS
offset continuity, and the normal worker cancellation/trim loop before
returning to the zero-start playout state.

The error-fallback slice ports ErsatzTV's failed-transcode replacement process:
when an item FFmpeg segmenter exits unsuccessfully, the worker captures the
stderr tail or fallback exit-code text, writes a generated error ASS subtitle
over the bundled background image, pairs it with null audio, preserves the same
duration, output PTS offset, metadata, HLS segment options, and trim/cancel
loop, then advances with the ErsatzTV-equivalent `NextState(_state, null)`
transition so playlist continuity is maintained after the failed item attempt.

Runtime proof (2026-06-08): with channel 1 in HLS Segmenter mode, the rebuilt
worker returned the multi-variant playlist, then `/iptv/session/1/hls.m3u8`
was sampled for about 70 seconds across the reported 24-second skip and
48-second stop window. Before the work-ahead cap fix, the same proof showed the
playlist media sequence racing from 63 to 228 in about 71 seconds, which let
VLC fall behind deleted segments. After the fix, media sequence advanced from
3 to 22 over the same wall-clock window, and each sampled newest segment
ffprobed as readable HEVC video plus AAC audio. HLS Direct was also reloaded
and a bounded partial `/iptv/hls-direct/1.ts` stream ffprobed with HEVC video
plus AAC audio.

Runtime proof (2026-06-09): after the `PlayoutUpdated` request-time fix,
channel 1 in HLS Segmenter mode again returned the multi-variant playlist and
`/iptv/session/1/hls.m3u8` was sampled for 180 seconds across and beyond the
reported one-to-two-minute failure range. Media sequence advanced from 81 to
128 with a constant 10-segment playlist window and stable discontinuity
sequence, and `live000046.ts` ffprobed as H.264 video plus AAC audio. TSDuck
sampled `/iptv/channel/1.ts?mode=ts` for 161 seconds and reported zero invalid
syncs, transport errors, PCR/PTS/DTS leaps, continuity discontinuities,
duplicated packets, or invalid PES prefixes on the audio, video, PAT, PMT, and
SDT PIDs; the only analysis errors were missing BAT/TDT/TOT tables. HLS Direct
still returned its single-entry playlist and ffprobed as H.264 plus AAC, and
TSDuck sampled `/iptv/channel/1.ts?mode=ts-legacy` for 173 seconds with the
same zero continuity error profile and only missing BAT/TDT/TOT table warnings.

HLS Direct audit: the direct branch remains mostly aligned for the current
surface: `.m3u8?mode=hls-direct` returns a single-entry playlist, target
container comes from `ffmpeg.hls_direct.output_format`, and the stream path uses
copy audio/video with realtime input pacing like ErsatzTV. No HLS-direct-only
ParityDebt was found in this audit, but it shares the direct current
playout-item lookup/fallback limitations documented under MPEG-TS channel
streaming.

Runtime stability audit (2026-06-13): MTV channel 2 in HLS Segmenter mode was
started through `./run.sh serve` and tested with TSDuck against
`/iptv/channel/2.m3u8?mode=segmenter` while the same HLS stream was also open
in VLC as a parallel viewer. VLC froze before the requested 10-minute window
completed. During the freeze window the server kept one segmenter FFmpeg
process alive for `No Doubt - Ex-Girlfriend.mp4`, and direct playlist snapshots
showed `/iptv/session/2/hls.m3u8` advancing from media sequence 64-73 to 70-79
in about ten seconds with no fresh server-side FFmpeg exit logged. This
reopens the client-visible stability gap for parallel HLS playback: playlist
production can continue while VLC stops progressing. The completed TSDuck
analysis covered 3,491,320 packets / 656,368,160 bytes from 00:43:43 to
00:53:44 local time and reported zero invalid syncs, transport errors,
PCR/PTS/DTS leaps, duplicated packets, or invalid PES prefixes, but did report
unexpected continuity discontinuities on PAT (3), SDT/BAT (4), video PID 256
(4), audio PID 257 (3), and PMT PID 4096 (3), plus the expected missing
BAT/TDT/TOT table warnings for this generated stream.
'''

[[debt]]
id          = 'parallel-hls-playback-client-freeze'
description = 'Parallel live HLS playback is not stable enough for parity: with MTV channel 2 open in VLC and TSDuck reading the same `/iptv/channel/2.m3u8?mode=segmenter` stream, VLC froze before the requested 10-minute stability window completed even though the server playlist continued to advance. The completed TSDuck run also observed unexpected continuity discontinuities on PAT, SDT/BAT, video, audio, and PMT PIDs.'
