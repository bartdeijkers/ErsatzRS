description = 'For channels configured with `IdleBehavior = StopOnDisconnect`, VLC playback shutdown must drain every channel transcode session after the configured segmenter idle timeout and must not leave the `/channels` active-session state or FFmpeg process tree running past that timeout. This must cover HLS segmenter playback and the MPEG-TS hybrid wrapper path that starts/touches the HLS segmenter, while preserving the already-ported direct `.ts` response-body disposal behavior.'
discovered  = '2026-06-13'
evidence    = 'User-observed VLC shutdown did not immediately stop the channel transcoding session, but the observation was shorter than the local configured timeout. Local DB evidence during triage: channels 1 and 2 have `IdleBehavior = 0` (`StopOnDisconnect`) and `ffmpeg.segmenter.timeout_seconds = 60`; upstream default from `GetFFmpegSettingsHandler` is also 60 seconds, while persisted ErsatzTV settings may be shorter. Upstream lifecycle evidence is `ChannelEditor.razor` Stop On Disconnect help text, `StartFFmpegSessionHandler` idle-timeout loading/KeepRunning bypass, `HlsSessionWorker` idle cancellation, static `/iptv/session` touch handling, and `IptvController` `RegisterForDispose` for direct `.ts` responses.'
resolved    = true

