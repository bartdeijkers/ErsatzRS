evidence    = 'User-reported VLC freeze during the live run; `curl http://127.0.0.1:8409/iptv/session/2/hls.m3u8` snapshots advanced from media sequence 64-73 to 70-79 in about ten seconds; host process list showed one active MTV segmenter FFmpeg process for `No Doubt - Ex-Girlfriend.mp4`; `/home/bart/.local/share/ErsatzRS/logs/ErsatzRS.log` had no matching fresh segmenter exit at the freeze moment; `/tmp/mtv-hls-tsduck-analysis.txt` reported 3,491,320 packets / 656,368,160 bytes over 00:43:43-00:53:44 local with continuity discontinuities on PID 0 (3), PID 17 (4), PID 256 video (4), PID 257 audio (3), and PID 4096 PMT (3).'
