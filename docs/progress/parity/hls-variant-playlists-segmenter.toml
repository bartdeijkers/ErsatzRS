adr        = ['0015', '0016']
summary    = '''
Ported (Phase 7). The HLS entry surface exposes mode-aware channel URLs:
`/iptv/channels.m3u` emits `.m3u8?mode={segmenter,hls-direct}` /
`.ts[?mode=ts-legacy]` suffixes with Kodi `#KODIPROP` headers, short base64
ids, `ChannelIdentifier.FromNumber` tvg-id, and `tvc-stream-{v,a}codec` tags. `/iptv/channel/{n}.m3u8?mode=segmenter` returns a
multi-variant playlist (`#EXT-X-STREAM-INF` bandwidth from ErsatzTV's
`(VideoBitrate + AudioBitrate) * 1000 * 1.2`); TS modes redirect to `.ts`;
`hls-direct` returns a single-entry playlist with per-channel media-sequence /
`#EXT-X-DISCONTINUITY` tracking and `/iptv/hls-direct/{n}[.ts|.mp4|.mkv]`
targets driven by `ffmpeg.hls_direct.output_format` (copy audio/video, realtime
pacing like ErsatzTV).

The segmenter worker (`HlsSessionWorker` in infra, with
`HlsSessionRegistry`/`HlsSessionHandle`) spawns FFmpeg via
`tokio::process::Command` into temp-backed output, mirrors the MPEG-TS provider
path replacement, registers atomically to avoid duplicate workers, trims live
playlists while preserving `#EXT-X-DISCONTINUITY`, deletes stale segments, and
supports fMP4 output with a hash-keyed init-segment cache and `#EXT-X-MAP`
rewriting. It ports ErsatzTV's deterministic
`HlsSessionState` transition table and worker loop: work-ahead limit with a
44-second cap, 60s buffered-output gate, realtime switch at 30s buffered,
initial-segment-count gating, `PlayoutUpdated` notification from scheduler
builds, OnDemand playout time-shift / `OnDemandCheckpoint`, slug black-video +
silent-audio generation, and failed-transcode error-ASS fallback. MPEG-TS HLS
output emits `-hls_segment_options mpegts_flags=+initial_discontinuity` for the
first / zero PTS-offset transcode (`+latm` for AAC-LATM); fMP4 omits MPEG-TS
segment options. Synthesized `#EXT-X-PROGRAM-DATE-TIME` and media-sequence-order
continuity-counter normalization keep timestamps and PSI/PID continuity stable
across separate FFmpeg process boundaries (ADR 0015).

Access control ports `ConditionalIptvAuthorizeFilter`: `/iptv/*` is protected by
route-scoped middleware active only when `JWT:IssuerSigningKey` is configured,
validating HS256 + `exp` from `?access_token=` or `Authorization: Bearer`, with
the `/iptv/logos` exemption. Subtitles burn/overlay for the segmenter and copy
compatible embedded image subtitles for HLS-direct MKV/MP4 (text ignored like
ErsatzTV). The stop-session surface (`/channels` Stop Transcode) ports
`IsActive`/`StopChannel`/`Cancel`.

StopOnDisconnect lifecycle parity is implemented and live-proven for both the
segmenter and MPEG-TS hybrid wrapper paths: segment serving touches the worker
(`TouchChannel`), active FFmpeg generations observe the configured idle timeout,
cancellation waits for child exit before deregistering and removing the temp
dir, and the wrapper waits for the initial segment count before wrapping. Direct
`.ts` response-body disposal is guarded by
`spawn_stream_body_kills_ffmpeg_when_body_is_dropped`. Sub-second request-time /
in-point seek offsets are preserved as `Duration` end-to-end (TimeSpan-shaped
`-ss 00:HH:MM:SS.fffffff` argv) through active-item selection, the worker
command, `StreamSeek`, direct `.ts`, and troubleshooting previews, matching
ErsatzTV instead of flooring to seconds.

ADR 0016 adds an ErsatzRS-specific active HLS transcode limit
(`ffmpeg.segmenter.active_transcode_limit`, default 2) beside ErsatzTV's
work-ahead limit, capping concurrent segmenter FFmpeg generations to protect
smaller systems during rapid channel switching while recently touched sessions
keep priority.

Runtime proof: repeated TSDuck / `cargo xtask smoke` captures (2026-06-08
through 2026-06-16) showed zero transport, sync-loss, continuity-counter, or
PTS/DTS/PCR faults across MPEG-TS and HLS segmenter paths; the 2026-06-16
`tsduck-playback-gate.sh gate` passed 86 checks with audio-pip cadence
1.000-1.030 s and the earlier clip-rollover deviation gone. Slice-by-slice
history lives in `sessions.ndjson` and git log.
'''

