summary    = '''
In progress (Phase 7). Slice 1 landed the HLS entry surface: `/iptv/channels.m3u` emits the mode-aware URL suffix (`.m3u8?mode={segmenter,hls-direct}` / `.ts[?mode=ts-legacy]`), Kodi `#KODIPROP` headers on `kodi*` User-Agents, short base64 unique ids, `ChannelIdentifier.FromNumber` tvg-id, and `tvc-stream-{v,a}codec` tags. `/iptv/channel/{n}.m3u8` resolves mode (segmenter → multi-variant playlist, TS modes redirect to `.ts`, `hls-direct` no longer 501s), and `build_multi_variant_playlist` emits `#EXTM3U` + `#EXT-X-STREAM-INF:BANDWIDTH=…,RESOLUTION=…,CODECS="…"` using the ErsatzTV `(VideoBitrate + AudioBitrate) * 1000 * 1.2` formula. Slice 2 landed the first concrete worker: `HlsSessionRegistry` now owns `try_get`/`try_insert`/`insert`/`remove`, `HlsSessionHandle` exposes async `trim_playlist`, `HlsSessionWorker` in infra spawns FFmpeg via `tokio::process::Command` into temp-backed HLS output, mirrors the MPEG-TS route's provider path-replacement resolution before invoking FFmpeg, uses atomic registration to prevent duplicate session workers under concurrent requests, `/iptv/channel/{n}.m3u8?mode=segmenter` starts or touches the worker, and `/iptv/session/{n}/hls.m3u8` plus `/iptv/session/{n}/{file}` serve the live playlist and relative segment files from disk. Slice 3 trims live playlists before serving them, preserves `#EXT-X-DISCONTINUITY` boundaries across retained segments, deletes stale temp-backed `.ts` / `.m4s` / `.mp4` files, and supports fMP4 worker output (`segmenter-fmp4`) with `#EXT-X-MAP` / `init.mp4` delivery through the shared session file route. Slice 4 ports the direct branch: `.m3u8?mode=hls-direct` now emits a single-entry playlist with per-channel media-sequence tracking, `#EXT-X-DISCONTINUITY`, and `/iptv/hls-direct/{n}[.ts|.mp4|.mkv]` targets driven by `ffmpeg.hls_direct.output_format` (default `mpegts`); the direct stream route reuses the shared FFmpeg process streaming path and emits output-format-aware content types. Slice 5 ports `ConditionalIptvAuthorizeFilter` parity: `/iptv/*` routes are protected by a route-scoped middleware that activates only when `JWT__IssuerSigningKey` / `JWT:IssuerSigningKey` is configured, extracts the token from `?access_token=` or `Authorization: Bearer`, validates HS256 signatures plus `exp`, and preserves the `/iptv/logos` exemption. The current subtitle slice wires the segmenter worker and HLS-direct stream path into the shared subtitle selector: segmenter burns selected text subtitles or overlays image subtitles; HLS-direct copies compatible embedded image subtitles for MKV/MP4 outputs and intentionally ignores text subtitles like ErsatzTV. Remaining: any fMP4 init-segment cache parity that still matters after direct mode, then the broader Phase 7 items after HLS completion. See the Phase 7 slice log in [`STATUS.md`](../../STATUS.md).
'''
