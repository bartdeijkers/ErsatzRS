adr        = ['0015', '0016']
summary    = '''
Ported (Phase 7). The HLS entry surface exposes mode-aware channel URLs,
multi-variant segmenter playlists, TS redirects, and HLS-direct single-entry
playlists with per-channel media-sequence / `#EXT-X-DISCONTINUITY` tracking and
`ffmpeg.hls_direct.output_format` targets (copy audio/video, realtime pacing).

The segmenter worker (`HlsSessionWorker` in infra, with
`HlsSessionRegistry`/`HlsSessionHandle`) spawns FFmpeg via
`tokio::process::Command` into temp-backed output, mirrors the MPEG-TS provider
path replacement, registers atomically, trims live playlists while preserving
`#EXT-X-DISCONTINUITY`, deletes stale segments, and supports fMP4 with a
hash-keyed init-segment cache and `#EXT-X-MAP` rewriting. It ports ErsatzTV's deterministic `HlsSessionState` transition table
and worker loop: 44s work-ahead cap, 60s buffered-output gate, realtime switch
at 30s buffered, initial-segment-count gating, `PlayoutUpdated` notification,
OnDemand time-shift / `OnDemandCheckpoint`, slug black-video + silent-audio
generation, and failed-transcode error-ASS fallback. MPEG-TS HLS
output emits `-hls_segment_options mpegts_flags=+initial_discontinuity` for the
first / zero PTS-offset transcode (`+latm` for AAC-LATM); fMP4 omits those.
Synthesized `#EXT-X-PROGRAM-DATE-TIME` plus media-sequence-order continuity
and PCR normalization keep timestamps, PSI/PID continuity, and the transport
clock stable across FFmpeg process boundaries (ADR 0015).

Access control ports `ConditionalIptvAuthorizeFilter`: `/iptv/*` route-scoped
middleware active only when `JWT:IssuerSigningKey` is set, validating HS256 +
`exp` from `?access_token=` or `Authorization: Bearer`, with the `/iptv/logos`
exemption. Subtitles burn/overlay for the segmenter and copy compatible embedded
image subtitles for HLS-direct MKV/MP4 (text ignored). The stop-session surface
(`/channels` Stop Transcode) ports `IsActive`/`StopChannel`/`Cancel`.

StopOnDisconnect lifecycle parity is implemented and live-proven for both the
segmenter and MPEG-TS hybrid wrapper paths: segment serving touches the worker
(`TouchChannel`), active FFmpeg generations observe the idle timeout,
cancellation waits for child exit before deregistering and removing the temp
dir, and the wrapper waits for the initial segment count before wrapping. Direct
`.ts` response-body disposal is guarded by
`spawn_stream_body_kills_ffmpeg_when_body_is_dropped`. Sub-second seek offsets
are preserved as `Duration` end-to-end (TimeSpan-shaped `-ss 00:HH:MM:SS.fffffff`
argv) across the worker, `StreamSeek`, direct `.ts`, and troubleshooting
previews, matching ErsatzTV instead of flooring to seconds.

ADR 0016 adds a hard active transcode ceiling
(`ffmpeg.segmenter.active_transcode_limit`, default 2) beside ErsatzTV's
work-ahead limit. A shared process-local reservation registry
(`transcode_capacity.rs`) tracks every transcode with active/limit/peak
snapshotting; no path exceeds the ceiling, and over-capacity admission reclaims
work-ahead, cooling, then stale-watched StopOnDisconnect slots before serving a
slot-free all-streams-in-use slate for the marginal viewer. The 2026-06-21
closeouts folded MPEG-TS direct/legacy/hybrid spawns into the same ceiling,
added a live `Streams in use: X / N (peak Y)` readout plus hardware-aware
suggestion on FFmpeg settings/troubleshooting, and replaced the HLS/MPEG-TS
over-capacity 503 paths with a generated, looping all-streams-in-use slate that
holds no `transcode_capacity` reservation and switches to real content when a
slot frees.

Runtime proof: TSDuck / `cargo xtask smoke` captures through 2026-06-24 show
zero transport, sync-loss, continuity-counter, or PTS/DTS/PCR faults across
MPEG-TS and HLS segmenter paths. The 2026-06-24 proof also verifies decoded
audio pip cadence through normalized HLS segmenter appends. Slice history lives
in `sessions.ndjson`/git.
'''

