[[debt]]
id          = 'active-transcode-limit-not-a-real-ceiling'
adr         = '0016'
description = 'ffmpeg.segmenter.active_transcode_limit (ADR 0016) does not bound concurrent transcodes for actively-watched channels. The priority bypass (force_reserve_active_transcode in crates/ersatzrs-infra/src/hls_worker.rs) increments the counter without an upper bound whenever a session is recently accessed (idle < 30s), and every playlist/segment request calls touch(), so each live viewer permanently bypasses the cap. With K viewers on K channels and limit N, K-N sessions force-reserve, yielding K concurrent transcodes regardless of N. The single 30s constant also conflates "is anyone watching?" with the priority-slot lifetime. The revised ADR 0016 replaces this with a hard capacity ceiling plus an admission/preemption ladder (stop work-ahead, reclaim cooling, preempt stalest watched, else serve an "all streams in use" slate that holds no slot), decoupled watch (~30s) vs retention (= idle timeout) windows, a tuner-model configuration ("Maximum simultaneous transcodes" + reframed work-ahead), a live "Streams in use: X / N" readout, a hardware-aware suggested default, and eventual pipeline-agnostic (MPEG-TS) counting.'
discovered  = '2026-06-17'
evidence    = 'Fixed 2026-06-20: crates/ersatzrs-infra/src/hls_worker.rs removed force_reserve_active_transcode, replaced the active counter with a process-local slot map, added admission-status reporting plus a reclaim signal, and split the 30s HLS_ACTIVE_WATCH_WINDOW from the configured idle-retention timeout. Focused tests prove the counter never exceeds N, work-ahead is reclaimed before cooling and stale watched sessions, stale preemption only targets preemptible watched slots, slot release on drop returns the count to zero, and watch-window expiry reclaims the FFmpeg child without cancelling the retained session. crates/ersatzrs-web/src/transport/iptv/hls.rs and stream.rs now return an all-HLS-transcode-slots-in-use 503 path when no initial playlist is available because capacity is full.'
resolved    = true

