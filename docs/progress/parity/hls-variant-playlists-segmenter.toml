summary    = '''
Ported (Phase 7). The HLS entry surface exposes mode-aware channel URLs,
multi-variant segmenter playlists, TS redirects, and HLS-direct single-entry
playlists with per-channel media-sequence / `#EXT-X-DISCONTINUITY` tracking and
`ffmpeg.hls_direct.output_format` targets (copy audio/video, realtime pacing).

The segmenter worker spawns bounded FFmpeg generations into temp-backed output,
mirrors MPEG-TS provider path replacement, trims playlists while preserving
real `#EXT-X-DISCONTINUITY`, deletes stale segments, and supports fMP4
`#EXT-X-MAP` rewriting. It ports ErsatzTV's state transitions and worker loop:
work-ahead/buffer gates, realtime switching, initial-segment gating,
`PlayoutUpdated`, OnDemand checkpointing, slug output, and error-ASS fallback.
Finite add-on inputs keep one producer for the complete remaining play item:
an initial 44-second read-rate burst fills the buffer, then the same FFmpeg
process continues in realtime and releases its work-ahead reservation after 30
seconds of newly generated segments. This avoids content replay when a
stream-copy producer seeks to the keyframe before an internal chunk boundary.
MPEG-TS HLS output keeps ErsatzTV-style segment options (`+latm` for AAC-LATM)
while ADR 0015 synthesizes program-date-time values and normalizes MPEG-TS
continuity/PCR in media-sequence order. The segmenter now shares the
profile-derived mux-rate and 20 ms PCR-period helper used by direct `.ts`,
legacy concat, and hybrid wrapper outputs, and preserves adaptation-only PCR
packet continuity-counter semantics when CBR muxing inserts PCR-only packets.

Access control ports `ConditionalIptvAuthorizeFilter`; subtitles burn/overlay
for the segmenter and HLS-direct copies compatible embedded image subtitles.
Per-chunk burned text-subtitle seek rebase (ADR 0061) normalizes local or
HTTP(S) UTF-8/UTF-16 sources and rewrites cue timestamps directly, clamping any
cue that straddles a work-ahead chunk boundary instead of silently dropping
it; unsupported syntax or encodings retain the prior FFmpeg compatibility
fallback.
StopOnDisconnect is implemented for segmenter and MPEG-TS hybrid wrapper paths,
direct `.ts` response-body disposal is guarded, and sub-second seek offsets are
preserved end-to-end instead of flooring to seconds.

Generated and delayed mirror channels share the same source playout selection
in HLS-direct and segmenter modes. Source item times are projected onto the
target timeline while channel-specific profiles, branding, selectors, and
subtitle/audio preferences remain target-owned; source rebuilds invalidate all
dependent mirror sessions.

ADR 0016 adds a hard active transcode ceiling shared by HLS and MPEG-TS paths,
with active/limit/peak reporting, hardware-aware suggestions, reclamation of
work-ahead/cooling/stale watched sessions, and a slot-free looping
all-streams-in-use slate instead of over-capacity 503 responses.

Runtime proof: On 2026-06-29, `cargo xtask smoke` passed for `.ts?mode=ts`,
`.m3u8?mode=segmenter`, and the session playlist; `scripts/e2e/tsduck-playback-gate.sh gate`
passed all 86 checks. The HLS segmenter capture reported 2,679 PCR samples,
zero continuity-counter/PTS/DTS/PCR-leap faults, zero transport/sync/scrambling
faults, and audio pip cadence max gap deviation 30 ms. Its HLS-stitched
`pcrverify` jitter remains informational per the manual gate because the
playlist contains real discontinuity markers; direct MPEG-TS, hybrid wrapper,
and HLS-direct each reported zero `pcrverify` jitter faults in the same run.
On 2026-06-30, the 60-second TSDuck playback gate reproduced the real
cross-player freeze as 4 HLS Segmenter PTS leaps before the fix; after switching
MPEG-TS HLS appends to a monotonic worker-owned output timestamp offset, the
same gate passed 64 checks with zero continuity-counter/PTS/DTS/PCR-leap faults
and audio pip cadence max gap deviation 30 ms.
Slice history lives in `sessions.ndjson`/git.
'''

