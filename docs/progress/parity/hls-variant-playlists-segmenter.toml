evidence    = '''
A viewer reported repeated rating graphics within a film. The schedule had one
Script attachment per film. Its opening window was 6.5 seconds and its repeat
interval was 1,200 seconds. An engine switch during the viewing period prevents
attribution of the reported appearances to a specific engine or HLS segment.

In source revision 4bdf2684, hls_worker.rs limits a work-ahead encode to 44
seconds. The native playback path passes the generated drawvg filter to the
pipeline without applying the elapsed programme time. In a synthetic Windows
FFmpeg 9.1.0 probe, seeking to second 44 produced the same opening frames as
starting at zero. Applying the 44-second offset around drawvg kept the sampled
frames clear. This reproduces the filter-clock error at an encoder restart.

Close with decoded native HLS output from one synthetic programme. Verify the
opening graphic is visible, stays absent after a work-ahead restart at second
44 and on a mid-programme tune-in outside the display window, and returns
inside its scheduled repeat window at 1,200 seconds.
'''
