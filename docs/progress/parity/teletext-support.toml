summary    = '''
ADR 0120 requires independent generic engine acceptance with synthetic pages at
p9a-04, then exactly one TV-guide teletext add-on in ErsatzRS-Addons at p9b-01.
The add-on owns NOS-guide-inspired pages 200–299 and content; the host owns
validation, publication, delivery and read-only programme context. Source
subtitle requirements remain. ADR 0123 reopens P9A-01 for full authored Level 2.5,
base fallback and QTeletextMaker TTI/sidecar design interchange. TSDuck,
independent decoding and actual suitable-client display/navigation are required;
Kodi is optional. P9A-02 remains In progress; four milestones are Not started.
No engine/content/editor/client acceptance.

Checked Level 2.5 palette/DRCS values, raw resource identities and supplied-reference
DRCS dependency validation, ordered programs and bounded object-derived reference
collection, presentation declarations and a supplied-selection semantic service
are preparatory. Presentation packet-body encoding and bounded v1 lifting retain
explicit page/X26 presence with unchanged v1 bytes; they do not establish mixed
producer convergence. Checked X27/4 declarations/body coding retain masks and
required inventory; default roots retain their original resource owner. Authored
Same-target explicit calls and glyphs require announced S1 values with located
failures; only synthesized original default roots are exempt. MOT resolution,
declaration-to-selection consistency, final object/display semantics,
physical allocation, native enhanced encoding and editor interfaces remain open.

ADR 0122 profiles/themes/zones and admin/Lua controls remain preparatory.
Shared app controls compose isolated channel drafts; native encoding retains the
same pages. Guide/page bounds have proof. Acquisition, service activation, other
regions, link CRC, UI/Lua and publication remain open.

Supplied metadata and report-only SQLite observations preserve ordinary tracks,
exact stream/file/version association, raw descriptor/membership states and
actual scan-lease checks. Missing records do not establish absence; reported
revisions do not certify bytes and observed pages remain NotAcquired. Bounds
apply after JSON decoding, not to child/input RSS. Pure selected-PID TS/PES/
header parsing preserves raw flags, subcodes, missing PTS and explicit strict
profiles; it establishes no source-byte identity, page readiness or complete
inventory. Scanner acquisition, cross-open revisions and page selection remain
open. Auxiliary failure must preserve ordinary metadata; uncertain cleanup is
fatal. P9A-03 owns detailed evidence and remaining work.

Carousel/PES/TS, all-program PSI/PMT monitoring, PCR/CBR checks and bounded
retention preserve AV, packet timing and epoch-bound acknowledgement. Finite EOF
drains validated output; changed/malformed input is terminal. P9A-04 owns proof.

Authored bindings apply only to final MPEG-TS roles. Legacy wrapper/first-encoder
admission reserves distinct leases atomically; private owner-bound callbacks
transfer the first encoder once and later items reserve independently. Owned
startup, disposal and retries retain cleanup uncertainty. Localized Health
reports applicable limit-one capacity failures. Linux-hosted production-route
proof covers Linux x64 FFmpeg, Windows interop and QEMU ARM64/ARMv7: admission,
token rejection, cancellation/reaping, video, selected English audio, Dutch page
200 and clean TSDuck. Native Windows/ARM hosts and routed source captions/alternate audio remain open.

Localized decoder Health/troubleshooting exists; P9A-02 owns six-RID packaging,
licensing and remaining macOS/platform proof.
P9A-03/04 require source/page persistence, provider-safe rescans, exact
page/language/forced/default selection, native/Next Burn/Convert and copy/output
policy, carriage/passthrough and HLS/browser fallback. Continuous compatible
slate handover, automatic binding, publication/refresh/restart, localized
management and full matrix/source/client/browser/smoke/TSDuck acceptance remain
open. Milestones/debt own evidence; plans/teletext-support.md owns sequencing. UCU exceptions do not waive teletext gates. Production
content waits for p9a-04; Phase 10 waits for p9b-02.
'''

