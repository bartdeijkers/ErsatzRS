summary    = '''
Not started and queued as Phase 9 after UCU-09 and the other p9a-01 prerequisites.
The 2026-10-07 maintainer-authorized planning refresh retains the five milestones
and the undecided product scope. The phase deliberately distinguishes DVB
teletext subtitle pages, interactive full-page browsing, and authored output
services. Milestone p9a-01 must accept the standards/product/runtime contract
before schema or pipeline work decides which of those products ErsatzRS supports.

Current ErsatzRS scanning and playback have no teletext-specific model or
selection path, and the FFmpeg runtime contract does not require or functionally
probe the optional libzvbi teletext decoder. The active sequence in
`plans/teletext-support.md` covers six-RID packaging, SQLite stream/page
persistence and an explicit native/Next engine/source/output matrix. It reuses
existing selection, provider identity, bounded preparation, programme context
and listener boundaries. Localized management, health and decoded fixture/client/
TSDuck proof remain required. UCU platform exceptions do not automatically apply
to teletext. Phase 10 video-jukebox work begins only after p9b-02 closes.
'''

