summary    = '''
Not started and queued as Phase 9. Its required Phase 8 milestones are complete;
the current program order closes Add-on metadata management and the additive
FFmpeg drawtext overlay leg first. The phase deliberately distinguishes DVB
teletext subtitle pages, interactive full-page browsing, and authored output
services. Milestone p9a-01 must accept the standards/product/runtime contract
before schema or pipeline work decides which of those products ErsatzRS supports.

Current ErsatzRS scanning and playback have no teletext-specific model or
selection path, and the FFmpeg runtime contract does not require or functionally
probe the optional libzvbi teletext decoder. The active sequence in
`plans/teletext-support.md` covers six-RID packaging, stream/page persistence,
exact selection, MPEG-TS/HLS behavior, localized management, health, and
fixture/TSDuck runtime proof. Phase 10 video-jukebox work begins only after
p9b-02 closes.
'''

