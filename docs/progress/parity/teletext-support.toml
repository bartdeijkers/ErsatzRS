description = '''Operational defect found on 2026-11-03 while making channel 1 work. The admin reported missing teletext.authoring.policy/teletext.output.policy but offered no control to fix it. The relation between output mode, external MPEG-TS script, publication and actual carriage was unclear. Authored output then ended streams with "teletext needs N null packets but the window has 0" unless a profile used an extreme bitrate (about 78 Mbit/s).
Finite completion list:
(1) DONE: bounded burst deferral in the output gate (EN 300 706 B.9/B.6, PTS on actual interval, explicit SustainedCapacity). Unit evidence only.
(4b) DONE (component): reliable carriage at ordinary profile bitrates through page-aware start deferral (a new page waits up to 5 s for room for the whole page; B.9 100 ms still bounds packets within a page; B.6 unchanged). Deferral applies only after the epoch has received a null packet. A source with no spare capacity at all is rejected immediately, before output is committed, which keeps optional fallback; FFmpeg 6.1 direct-encode captures that start with 1.5 to 3.9 s of no nulls are therefore still rejected at start-up. Repeated with the managed runtime ersatzrs-ffmpeg 2.0.9 (FFmpeg 9.0) and ErsatzRS's own HLS-segmenter plus built-in MPEG-TS-wrapper argv over two 30 s programmes. Null-free stretches are 0.4 to 0.8 s every keyframe, 1.9 s at start-up and 2.7 s at the transition. The gate fails with only the 100 ms deferral and passes with page-aware scheduling: byte-identical AV/PCR, no CC errors, and the runtime libzvbi receives pages 200/201 about 254 times each. Synthetic content. Not yet proven through the full host pump and add-on (item 6).
(2) DONE: admin capacity profile tvguide-16 with global-scope confirmation, server validation and replace confirmation. HTTP integration evidence only.
(3) DONE: readiness checklist on the channel teletext page (add-on, profile, capacity, route, published, broadcast) with route/script explanation and per-channel versus global fixes, localized for all cultures.
