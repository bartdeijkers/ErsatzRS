feature    = 'Teletext support'
etv_source = 'No teletext-specific policy was located in the 2026-10-10 `$ERSATZTV_SRC` audit at 46118d43313b7828780fbfcfb46e980390ea8b0d; p9a-01 records existing subtitle behavior as the baseline and authored pages as an ErsatzRS extension under ADRs 0120/0121'
rs_target  = '`crates/ersatzrs-domain`, `crates/ersatzrs-core`, `crates/ersatzrs-app`, `crates/ersatzrs-infra`, `crates/ersatzrs-scanner`, `crates/ersatzrs-ffmpeg`, `crates/ersatzrs-web`, first-party FFmpeg runtime packaging, `crates/ersatzrs-addon-contract`, one new tvguide teletext add-on in the separate ErsatzRS-Addons repository'
status     = 'In progress'
adr        = ['0120', '0121']
summary    = '''
Phase 9 implementation starts after the recorded p9a-01 prerequisites.
The 2026-10-10 maintainer decision (ADR 0120) requires a generic ErsatzRS
teletext engine first, independently accepted at p9a-04 using synthetic pages,
then one new tvguide teletext add-on in ErsatzRS-Addons at p9b-01. The add-on
owns page structure/navigation inspired only by the TV-guide-related NOS
Teletekst pages 200–299, plus actual TV-guide content. The host owns validation,
publication, rendering/delivery and read-only programme
context. Source subtitle requirements remain.
P9A-01 is Complete under accepted technical ADR 0121; P9A-02 is In progress.
The remaining four milestones are Not started. No engine/content acceptance
is claimed.

Current ErsatzRS scanning and playback have no teletext-specific source model
or selection path. The domain now has checked authored-page draft identities,
typed runs/styles/navigation and structural validation. Character-set and
spacing-control validation, versioned add-on DTOs, publication, persistence and
delivery remain unimplemented; this is preparatory work, not P9A-04 acceptance.
The selected FFmpeg runtime now has an optional bounded
libzvbi decoder-options/text/colour-bitmap probe, independently proven on the
pinned Linux x64 and native Windows executables, plus ARM64/ARMv7 under QEMU
with the Bookworm host-library baseline. The decoder result now has a dedicated
localized Health check and runtime-bound troubleshooting export. Six-RID
packaging, dependency/licensing and remaining platform acceptance remain open
in P9A-02. The separate FFmpeg repository has locally checked standalone
package/source-inventory gates and unpublished native macOS candidate recipes;
source changes do not establish macOS runtime or package acceptance.
The active sequence in
`plans/teletext-support.md` covers six-RID packaging, SQLite stream/page
persistence and an explicit native/Next engine/source/output matrix. It reuses
existing selection, provider identity, bounded preparation, programme context
and listener boundaries. Localized management, health and decoded fixture/client/
TSDuck proof remain required. UCU platform exceptions do not automatically apply
to teletext. Phase 10 video-jukebox work begins only after p9b-02 closes.
'''

