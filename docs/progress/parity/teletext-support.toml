summary    = '''
ADR 0120 requires generic engine acceptance with synthetic pages at p9a-04,
then exactly one tvguide teletext add-on in ErsatzRS-Addons at p9b-01. It owns
NOS-guide-inspired pages 200–299 and guide content; the host owns validation,
publication, rendering/delivery and read-only programme context. Source subtitle
requirements remain. P9A-01 is Complete under ADR 0121; P9A-02 is In progress;
the other four milestones are Not started. No engine/content acceptance is claimed.

Typed drafts validate runs/styles/navigation. Western Latin DVB encoding preserves
spacing, X/26 accents, X/27 links and X/28 national options; decoding proves seven
repertoires, captions and colours. Other regions, link CRC/client proof, versioned
DTOs, persistence and publication remain open. The pure
ffprobe::teletext::project_packed_descriptors API accepts supplied two-byte packed
metadata or n9.0 LF-wrapped base64. Its 1,024-entry resource bound is not a service
limit. Usable entries retain language order, raw type/wire addresses and optional
decimal display pages; missing/unusable/usable-prefix outcomes remain distinct.
TrailingUnpairedPairs flags possibly stale tails after shrink; equal counts
never prove complete inventory. Metadata differs from observed pages; subcode/
charset/region and provenance remain unknown. P9A-03 owns exact synthetic
proof. Probe argv/JSON fields, scanner/schema/UI and ordinary audio/subtitles
are unchanged.

Carousel/PES/TS and all-program PAT/CAT/PMT discovery validate ownership and
continuity. Atomic null-slot replacement and fragmented/growing PMTs preserve
metadata and AV/PCR. PSI/PID monitoring holds partial sections and fences changes,
malformed input and incomplete EOF. PCR/CBR checks packet distance, wrap, gaps
and readiness. Retention shares raw/prepared capacity, arrival ages and one clock,
preflights intervals and enforces first-byte/source/sink deadlines and epoch-bound
writer acknowledgement. Finite EOF drains complete packets at original positions/
timing after an acknowledged cycle; incomplete transport or impossible capacity
fails. Immutable repeats omit C4 erasure; replacement restarts it. P9A-04 owns
exact audiovisual/runtime/decoder/TSDuck evidence.

Authored bindings belong only to final MPEG-TS roles, with paced I/O, fresh epochs,
body errors and zero-byte hardware fallback. Retained output supports refill/short
EOF. Uncertain startup/process/retry cleanup quarantines admission/assets. Legacy
admission/retries atomically reserve distinct wrapper/first-encoder leases;
private UUID callbacks transfer the first encoder once, later items reserve
independently. Owned startup/scoped disposal preserve song/retry cancellation.
Localized Health reports limit one only for applicable enabled legacy defaults.
Linux-hosted route proof uses Linux x64 FFmpeg, Windows interop and QEMU ARM64/
ARMv7: admission, token rejection, cancellation/reaping, video/selected English
audio, Dutch page 200 and clean TSDuck. Native Windows/ARM Rust hosts and full
routed source captions/alternate audio remain unproven.

The bounded optional libzvbi text/bitmap probe has localized Health and
runtime-bound troubleshooting. P9A-02 owns six-RID packaging, licensing and
remaining macOS/platform proof. P9A-03/04 still require SQLite stream/page identity,
provider-safe rescans, exact page/language/forced/default selection, native/Next
Burn/Convert and copy/output
policy, MPEG-TS carriage/passthrough, burn/extraction and HLS/browser fallback.
Continuous compatible slate handover, automatic production binding resolution,
publication/refresh/restart, localized management, full matrix/source/client
acceptance and applicable browser/smoke/TSDuck gates remain open. Detailed
sequencing lives in plans/teletext-support.md. UCU platform exceptions do not
waive teletext acceptance. Production content waits for p9a-04; Phase 10 waits
for p9b-02.
'''

