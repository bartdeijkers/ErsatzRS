etv_source = 'No teletext-specific policy was located in the 2026-10-10 `$ERSATZTV_SRC` audit at 46118d43313b7828780fbfcfb46e980390ea8b0d; p9a-01 records existing subtitle behavior as the baseline and authored pages as an ErsatzRS extension under ADRs 0120/0121'
rs_target  = '`crates/ersatzrs-domain`, `crates/ersatzrs-core`, `crates/ersatzrs-app`, `crates/ersatzrs-infra`, `crates/ersatzrs-scanner`, `crates/ersatzrs-ffmpeg`, `crates/ersatzrs-web`, first-party FFmpeg runtime packaging, `crates/ersatzrs-addon-contract`, one new tvguide teletext add-on in the separate ErsatzRS-Addons repository'
status     = 'In progress'
adr        = ['0120', '0121']
summary    = '''
The 2026-10-10 maintainer decision (ADR 0120) requires a generic ErsatzRS
teletext engine first, independently accepted at p9a-04 using synthetic pages,
then one new tvguide teletext add-on in ErsatzRS-Addons at p9b-01. The add-on
owns page structure/navigation inspired only by the TV-guide-related NOS
Teletekst pages 200–299, plus actual TV-guide content. The host owns validation,
publication, rendering/delivery and read-only programme
context. Source subtitle requirements remain.
P9A-01 is Complete under accepted technical ADR 0121; P9A-02 is In progress.
The remaining four milestones are Not started. No engine/content acceptance
is claimed.

Scanning/playback have no teletext source model or selection path. Checked
domain drafts retain typed runs/styles/navigation and structural validation.
Bounded Western Latin DVB encoding preserves spacing, X/26 accents, X/27 links
and X/28 national designation. Independent decoding proves seven repertoires,
captions and colours on Linux x64/Windows and emulated ARM64/ARMv7. Other
regions, link CRC/client proof, versioned DTOs, publication and persistence
remain open. Serial carousel/PES/TS primitives preserve timing/continuity;
decoder/TSDuck proof includes deliberate counter damage. PAT/CAT/all-program
PMT discovery validates ownership; atomic null-slot replacement and growing/
fragmented PMT installation preserve metadata and input/output continuity.
A six-second two-program, 33-page fixture retains AV/PCR/other-PMT packets and
identical decoded video/both audio hashes/timestamps on those four runtimes.
Continuing PSI/PID monitoring holds partial sections and permanently fences
source changes, malformed input or incomplete EOF. Independent review corrected
an admission duplicate gap. Explicit-policy PCR/CBR validation checks physical
packet distance, wrap, gaps and readiness; removing a null slot fails.
Bounded byte retention and composed output preparation now preserve first-byte
age, share raw/prepared capacity, preflight physical intervals and fence stale,
early or late epoch-bound acknowledgement. Two complete 33-page cycles pass
incremental-input/runtime/TSDuck proof on those four runtimes with simulated
monotonic acknowledgement. Native supervision now admits immutable bindings
only on final MPEG-TS roles, with paced/deadline-bound I/O and fresh child epochs.
Transport faults surface as body errors; zero-byte hardware rejection preserves
fallback. Unconfirmed cleanup quarantines capacity/assets. Finite EOF drains
complete final packets at unchanged positions/timing after a flushed/acknowledged
cycle; incomplete TS/PSI and impossible tail capacity fail visibly. Immutable
repeats omit C4 erasure; replacement restarts it. Retained output now shares
original age, reserve/prepared capacity and one packet schedule, with bounded
refill/short EOF and producer-completion body errors. Startup/hardware retries
preserve cleanup uncertainty. Handover, publication and client proof remain open.
P9A-04 owns independent engine acceptance.
The selected runtime's bounded optional libzvbi text/colour-bitmap probe has a
localized Health check and runtime-bound troubleshooting export. P9A-02 owns
exact decoder/platform evidence; six-RID packaging, dependency/licensing and
macOS acceptance remain open. Unpublished package recipes do not satisfy them.
`plans/teletext-support.md` covers six-RID packaging, SQLite stream/page
persistence and the native/Next source/output matrix using existing selection,
provider identity, bounded preparation, programme context and listeners. Localized management, health and decoded fixture/client/
TSDuck proof remain required. UCU platform exceptions do not automatically apply
to teletext. Phase 10 video-jukebox work begins only after p9b-02 closes.
'''

