[[milestone]]
id         = 'ab-07'
phase      = 'Add-on boundary — host/package contract hygiene'
title      = 'Migrate the official repository publisher to Rust'
status     = 'Complete'
feature    = 'addon-host-boundary'
depends_on = ['ab-06']
acceptance = '''
The official add-ons repository builds packages, icons, and its unsigned
catalog with a repository-owned Rust CLI instead of `build_repository.py`;
the AB-06 host tool remains the only manifest-contract validator; fixed-input
builds are byte-for-byte reproducible and preserve package metadata, CRLF
normalization, hashes, sizes, RID staging, and catalog ordering and validity;
the generated catalog passes the host contract; publication CI uses the Rust
publisher without credentials for the private host repository; and detached
signing plus GitHub Pages deployment remain separate secret-safe downstream
steps.
'''
evidence = '''
Implemented locally on 2026-08-16 in the official add-ons repository. A
checked-in Rust workspace and lockfile now build the repository-owned
`repository-publisher`; `tools/build_repository.py` and its Python-only builder
test were removed. The publisher invokes the pinned AB-06 process validator,
keeps only publication policy, stages output atomically, and preserves
portable/native package selection, fixed ZIP metadata and modes, CRLF batch
files, license injection, icon/package hashes and sizes, lexical ordering, and
the 21-day validity interval. Signing and Pages deployment remain separate
downstream workflow steps, and the publisher has no signing-key input.

Rust format, strict Clippy, two publisher regressions, all 15 remaining Python
provider tests, real fixed-input publication, host catalog validation, and
independent ZIP integrity checks passed. The old Python and new Rust outputs
also had equal normalized catalogs, package inventories, extracted bytes,
modes, and timestamps; only implementation-dependent DEFLATE bytes differed.
Official repository commit `0853dc37c8435296ba680a8dfe216055fd237d7a`
passed publication run `31941211236`, including Rust format and strict Clippy,
publisher and provider tests, pinned validator verification, package/catalog
construction, detached signing, and GitHub Pages deployment. The live catalog
and detached signature both returned HTTP 200. Host exact-SHA CI run
`31943829930` passed on `2bf94ea7d55dc291c591656435f8bd25390cdc7f`.
'''

