acceptance = '''
Only add a warning through the official yt-dlp add-on health check when the
configured yt-dlp could not update and is confirmed behind the latest release
for its configured native update channel. Staleness is a confirmed newer
release, not an age threshold. Prefer evidence from native yt-dlp capabilities;
do not introduce a host-owned release lookup or updater. An unavailable latest
version is unknown, not proof of staleness. Previously confirmed newer-version
evidence may establish staleness while an update fails.
The localized, redacted warning identifies the add-on, program and installed/latest
versions and explains manual update remediation without blocking playback. Focused provider/host health
tests cover failed-and-stale, failed-but-current, unknown latest version,
successful/current updates, and clearance after successful or manual repair.
Existing N-01 update scheduling, execution leases, version checks, process
cleanup and failure reporting remain unchanged. Automatic backup, rollback,
quarantine, extra replacement-validation probes, manual update controls, expanded history,
and new retry/Retry-After infrastructure are withdrawn, not deferred to N-03.
'''
