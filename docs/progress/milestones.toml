Core landed 2026-08-07. Operation-scoped `HardwareGraphOperation` capabilities,
bounded functional probes, an evidence-built failure classifier, device- and
binary-keyed `HardwareGraphDenial` persistence with the ADR 0014 invalidation
lifecycle, a single retry through the proven fallback that keeps NVENC, and a
`Hardware Graph Capability` health row.

Real-hardware proof (RTX 3080 Ti, driver 610.47, WSL2, FFmpeg 9.0): `vulkan` is
advertised and `-init_hw_device vulkan` succeeds, but the only Vulkan device is
llvmpipe, so the graph dies with `Could not derive CUDA device`. The probe
denies `nvenc-hdr-vulkan-libplacebo` (`cuda-interop`) and proves
`nvenc-cuda-scale`; the generated fallback command was run end to end against a
real HDR10 source and produced 25 decoded BT.709 frames with HDR metadata
stripped. Two further real defects were found and fixed: the old "non-Vulkan"
NVENC HDR chain still required Vulkan through libplacebo, and
`hwdownload,format=nv12` fails on a 10-bit HDR CUDA surface.

Regressions: 11 `graph_probe` unit tests including verbatim captured stderr,
4 `hardware_graph` persistence tests, 4 `tonemap` fallback tests, 4 pipeline
gate tests, and the ignored real-hardware gate
`real_hardware_graph_probe_reports_what_this_machine_can_do`.

Startup wiring landed 2026-08-07 and was verified by booting the real web host:
the probe ran, logged
`nvenc-hdr-vulkan-libplacebo is unavailable on NVIDIA GeForce RTX 3080 Ti: Vulkan
and CUDA are not interoperable on this device`, and persisted the denial keyed by
ffmpeg path and GPU model. An FFmpeg settings save clears and re-probes.
`cargo xtask smoke` passes.

The acceptance names the NVENC HDR Vulkan/libplacebo/CUDA graph specifically,
and that graph is fully covered: probe, classifier, denial persistence with
refresh invalidation, single fallback preserving hardware encode, health
visibility, snapshots for primary and fallback, real-GPU proof, and MPEG-TS
runtime proof of the fallback (25 decoded BT.709 frames). `cargo xtask smoke`
exercises the HLS endpoints with the wiring active. A platform without Vulkan
stays healthy.

NOT complete, tracked as debt: only the NVIDIA graphs are modelled
(`hardware-graph-probes-cover-only-the-nvidia-graphs`). No non-NVIDIA hardware
was available to characterize QSV/VAAPI/AMF graphs.
'''

[[milestone]]
id         = 'p8b-02'
phase      = 'Phase 8B — FFmpeg runtime and hardware HDR hardening'
title      = 'Benchmark and select hardware HDR graph improvements'
status     = 'Complete'
feature    = 'ffmpeg-9-performance-and-support'
depends_on = ['p8a-01', 'p8b-01']
acceptance = '''
Reproducible 1080p/4K HDR fixtures compare current and candidate NVENC
libplacebo fusion, peak-detection, native VAAPI tonemapping, and AMF HDR
hardware-memory paths. Measurements include decoded quality, signaling,
throughput, latency, CPU/GPU load, and device transfers. Only proven wins are
adopted; unsupported combinations remain capability-gated and documented.
'''
evidence = '''
Complete 2026-08-07 with the outcome that no candidate was adopted, because the
evidence to justify one does not exist on available hardware — not because the
candidates lost.

`scripts/bench/hdr-graph-bench.sh` is the reproducible harness: lavfi-generated
1080p and 4K HDR10 fixtures, an alpha overlay, and a device-availability report
so an unmeasurable candidate is never mistaken for a tie.

Measured (RTX 3080 Ti, WSL2), 1080p HDR10 to SDR 720p over 10s: software
zscale+tonemap 3.95s/985% CPU; software tonemap into CUDA scale and NVENC
3.41s/905%; fused libplacebo 12.03s (peak detect on) and 11.36s (off). 4K to
1080p: software 9.77s/1533%, NVENC 11.89s/1137%.

Three of the four named candidates could not be measured: fused libplacebo and
peak detection only ran on `llvmpipe`, a software Vulkan device, so their
numbers say nothing about a GPU; native `tonemap_vaapi` needs a VAAPI device;
and the AMF path needs AMD hardware and `libamfrt64.so.1`. ADR 0064 adopts only
measured wins, so the current graphs stand unchanged and the blocked
comparisons are tracked as `hardware-hdr-candidates-need-real-gpu-measurement`.
'''

[[milestone]]
id         = 'p8c-01'
phase      = 'Phase 8C — FFmpeg command and media-input support'
title      = 'Move long complex filters to safe file transport'
status     = 'Complete'
feature    = 'ffmpeg-9-performance-and-support'
depends_on = []
acceptance = '''
Long complex filters use ADR 0003's private, cancellation-safe
-/filter_complex file transport above one portable threshold. Focused and
runtime tests cover short inline graphs, forced file transport, native
path/quoting edge cases, spawn failure, cancellation, sanitized diagnostics,
and deterministic cleanup.
'''
evidence = '''
Complete 2026-08-07. One portable threshold in
`crates/ersatzrs-ffmpeg/src/filter_transport.rs` evaluated against the complete
projected command shape (24000 bytes) and the graph itself (8192 bytes); short
graphs stay inline. Oversized graphs move to a private per-spawn file passed as
FFmpeg 9's structured `-/filter_complex <path>` pair. Arguments are never
shell-joined and the removed `-filter_complex_script` is never emitted.

`crates/ersatzrs-infra/src/filter_graph_file.rs` writes the file under
`<AppDataFolder>/cache/filter-graphs` with mode 0600 on Unix and exact graph
bytes, and deletes it through an RAII guard owned by `RemoteStreamProcess`, so
clean exit, non-zero exit, kill, cancellation, and supervision teardown share one
cleanup path. A spawn-time write failure falls back to inline instead of failing
playback. Logs carry the choice, byte count, and file name only.

Runtime proof against real FFmpeg 9:
`real_ffmpeg_accepts_the_rewritten_file_transport_argv` encodes successfully
through a directory named `fïlter graphs` (space plus non-ASCII), and
`killing_a_running_child_still_removes_the_transport_file` proves cleanup after
cancelling a live child. 17 unit tests cover threshold, rewrite, permissions,
collisions, spawn-failure fallback, double-delete, and log sanitization.
'''

[[milestone]]
id         = 'p8c-02'
phase      = 'Phase 8C — FFmpeg command and media-input support'
title      = 'Persist and apply source orientation exactly once'
status     = 'Complete'
feature    = 'ffmpeg-9-performance-and-support'
depends_on = ['p8a-01', 'p8b-01']
acceptance = '''
Scanner metadata preserves display-matrix/orientation state and the pipeline
applies it exactly once without fighting FFmpeg autorotation. Software,
transpose_cuda, and fused libplacebo candidates preserve ADR 0064 output color,
scaling, overlays, stream copy, MPEG-TS, and HLS behavior with fixture and
runtime proof.
'''
evidence = '''
Complete 2026-08-07. The governing measurement is that FFmpeg 9 autorotates from
display-matrix side data before the filter graph and ignores the legacy `rotate`
tag, so "apply orientation exactly once" means adding no rotation filter and
instead making ErsatzRS geometry agree with the decoder
(`orientation_autorotation_happens_before_the_filter_graph`).

Rotation is persisted from ffprobe side data through `MediaStream.Rotation`
(additive SQLite/MySQL migration, NULL for existing rows) to playback selection.
`displayed_frame_size` transposes a quarter turn and scaling uses it, so a
portrait item letterboxes correctly instead of being scaled as landscape;
anamorphic quarter turns are handled separately. Stream copy adds no filters, so
the display matrix passes through untouched. Scaling and overlays on a rotated
source verified against real FFmpeg.

NOT done: `transpose_cuda` and fused libplacebo rotation were not benchmarked —
autorotation makes an explicit rotation filter unnecessary on every path
ErsatzRS generates, so that comparison belongs to a future source-preserving
mode. MPEG-TS cannot carry a display matrix, so stream-copied portrait items
lose their rotation metadata; tracked as `stream-copy-drops-rotation-in-mpegts`.
'''

[[milestone]]
id         = 'p8c-03'
phase      = 'Phase 8C — FFmpeg command and media-input support'
title      = 'Support animated WebP graphics inputs'
status     = 'Complete'
feature    = 'ffmpeg-9-performance-and-support'
depends_on = []
acceptance = '''
Animated WebP watermarks and graphics preserve decoded frame timing, looping,
alpha, z-order, cancellation, and bounded resource use. Static WebP and other
existing image inputs do not regress, and live direct MPEG-TS and HLS proofs
cover representative animations.
'''
evidence = '''
Complete 2026-08-07, and it found a real defect rather than only adding
coverage. The loop option is demuxer-specific: `-loop 1` on an animated
WebP or GIF fails with `Option loop not found` and the input never opens, while
`-ignore_loop 0` on a still image fails the same way. `InputFile::graphics_image`
applied `-loop 1` unconditionally, so a graphics element pointing at an animated
image took the whole channel down. It now selects from the file header
(`ANIM` chunk, or GIF `NETSCAPE2.0`) with a bounded 4 KiB read, defaulting to
still. Static image behavior is unchanged, asserted by
`still_graphics_images_keep_their_existing_loop_behavior`.

`-stream_loop -1` was evaluated as a demuxer-agnostic alternative and rejected:
it opens every input type but hung a two-second overlay render past a two-minute
timeout — the unbounded resource use this milestone must avoid.

Redistributable lavfi-generated fixtures live in
`crates/ersatzrs-ffmpeg/tests/fixtures/graphics/` with provenance and
regeneration commands. Decoded proof in
`animated_webp_overlay_loops_and_composites_alpha`: eight distinct frames repeat
exactly with the loop option and freeze without it. Alpha verified numerically
((127,0,254) at 50% over white decodes to (189,124,253)); z-order verified with
two stacked animated overlays.

NOT covered: an end-to-end MPEG-TS and HLS channel serving an animated WebP
watermark. The overlay graph is proven at the FFmpeg level and the watermark
input selection is unit-tested, but no seeded-channel playback gate exercises it.
'''

