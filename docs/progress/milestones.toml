id         = 'p7b-01'
phase      = 'Phase 7B — Application-layer extraction'
title      = 'Build the application service foundation'
status     = 'Complete'
feature    = 'application-use-case-layer'
plan       = 'plans/application-layer-and-video-jukebox.md'
depends_on = ['p7a-01']
acceptance = '''
ersatzrs-app contains documented command/query/application-error modules,
core no longer exposes sqlx errors, infra maps concrete failures, and the
native composition root constructs injected ApplicationServices.
'''
evidence = '''
`ersatzrs-app` now owns documented command/query/application-error modules,
injected core ports, and the shared operation coordinator exposed through
`ApplicationServices`. `RepositoryError` is storage-neutral, all SQLx failures
crossing repository boundaries are mapped in infrastructure, and
architecture-lint rejects direct or renamed storage dependencies in core. The
native web composition root constructs the services from concrete library and
playout repositories and shares their operation state with scheduler tasks.
Focused core locking, app service, infra mapping, web composition, and xtask
boundary regressions passed. Both workspace clippy configurations,
`./run.sh test-closeout` (967 nextest tests plus doctests), and
`cargo xtask parity-check` passed; the 2026-07-22 session records the closeout.
'''

[[milestone]]
id         = 'p7b-02'
phase      = 'Phase 7B — Application-layer extraction'
title      = 'Migrate playout-build orchestration'
status     = 'Complete'
feature    = 'application-use-case-layer'
plan       = 'plans/application-layer-and-video-jukebox.md'
depends_on = ['p7b-01']
acceptance = '''
One RequestPlayoutBuild use case owns admission and typed outcomes; all web/API
senders use it while scheduler consumption, Refresh/Reset semantics, and
queued/building feedback remain regression-proven.
'''
evidence = '''
Completed 2026-07-23. `RequestPlayoutBuild` now owns positive-ID validation,
per-playout admission, and typed Accepted, AlreadyQueued, AlreadyBuilding,
Unavailable, and Rejected outcomes through an injected unbounded queue port.
Every web/API producer uses `ApplicationServices`; `AppState` no longer exposes
the sender. The scheduler remains the sole FIFO consumer and uses a lifecycle
guard so queued/building activity clears after success, failure, or
cancellation without clearing a pending follow-up. Pending work upgrades to
`Reset` over `Refresh` over `Continue`, and requests received during a build
share one upgradable follow-up token. Focused regressions prove Refresh/Reset
preservation, FIFO delivery, queued mode upgrades, active-build follow-ups,
duplicate queued/building feedback, closed-worker retry cleanup, transport
outcome mapping, side-effect enqueue order, and persisted build execution.
`cargo xtask architecture-lint`, both workspace clippy
configurations, `./run.sh test-closeout` (977 nextest tests plus doctests), and
`cargo xtask parity-check` (including 385 web tests) passed.
'''

