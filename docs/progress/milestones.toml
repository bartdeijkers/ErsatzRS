feature    = 'hls-variant-playlists-segmenter'
depends_on = []
acceptance = '''
The manual TSDuck URL gate fails structurally clean under-delivery by comparing
PCR media duration, wall-clock average delivery, and rolling no-progress
windows with monotonic elapsed time. The HLS worker exposes sanitized bounded
under-run telemetry and health. Deterministic healthy/stalled/resumed fixtures
classify without provider access. Bounded Windows A/B evidence separates raw
producer delivery from the NVENC and software consumers, and the software
consumer sustains approximately realtime delivery with the managed FFmpeg
runtime.
'''
