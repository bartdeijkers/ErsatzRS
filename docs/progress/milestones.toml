# Fine-grained execution state for active structural plans. The `phase` value
# groups milestones into program increments; dependencies control runnable
# order. Query runnable work with `cargo xtask progress milestones --runnable`.

[[milestone]]
id         = 'amm-o-01'
phase      = 'AMM-O — portable file-backed add-on lists'
title      = 'Rebuild add-on lists from authoritative saved folders'
status     = 'In progress'
feature    = 'addon-metadata-management'
plan       = 'plans/addon-list-lifecycle-broadening.md'
depends_on = ['amm-m-01b']
acceptance = '''
Implement ADR 0093 after verified completion of the active A01-A05 corrections,
before later UX expansion or further N-03 closeout. Saved list content below a
configured add-on media root, including yt-dlp_media, is authoritative over its
SQLite projection. Copying the list folders to an independent installation
with the appropriate add-on installed must allow the next normal or scheduled
scan to discover and reconstruct/update the lists without copying SQLite or
manually re-adding source URLs. Valid file content wins over stale database
copies; administrative saved content must also survive that reconstruction.
If a copied folder conflicts with an existing local list, retain the existing
list and show a warning instead of replacing it or creating duplicate ownership.
Do not encode host behavior against the yt-dlp add-on ID. Reuse existing
YAML/NFO/storage and scan coordination; preserve Save/Publish separation and
current playback. Removing a list in admin retains its folder and files but
hides the list in the admin UI; repeat ordinary/scheduled scans must not make
it visible again. Hiding is installation-local: copying a folder does not
transfer the sender's hidden state, and a newly discovered list is visible on
the receiving installation. Preserve copied saved drafts and last-published
content separately; scanning must not publish newer draft edits. Validated
last-published content becomes active automatically on the receiving
installation; missing Download ahead media requires local preparation without
silently changing its delivery mode. The existing
list page provides a Hidden lists filter and Show list action. Hiding changes
admin visibility only, preserving published media, scheduled playback and refresh.
Local job/process ownership is not portable;
copied artifact pins and ownership sidecars do not confer execution/deletion
authority. Preserve the installed/enabled add-on boundary.
Prove a saved-folder copy into a fresh database/profile, visible reconstructed
list information, stale-database reconciliation and repeat-scan idempotence.
Report invalid/incomplete files without overwriting valid saved content.
The saved JSON document, including draft and published text, is limited to
256 MiB, excluding external video/picture bytes (approved 2026-09-13).
Refuse oversized copies with a warning and oversized Saves with an error,
without committing changes to existing saved content or its local projection.
Test supported Linux/Windows path handling without copying private media,
credentials or machine-specific IDs into fixtures. Cross-review implementation
and tests with Claude. Exclude transport/updater changes, new ZIP import/export
services, whole-database backup and unrelated later UX work.
'''
