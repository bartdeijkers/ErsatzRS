phase      = 'Add-on boundary — host/package contract hygiene'
title      = 'Return provider availability vocabulary to the add-on'
status     = 'Complete'
feature    = 'addon-host-boundary'
depends_on = []
acceptance = '''
The yt-dlp package emits only `available`, `unavailable`, or `unknown` on both
POSIX and Windows; the duplicated `deserialize_addon_availability` is gone from
`ersatzrs-core` and `ersatzrs-scanner`; an unrecognized token is rejected with a
bounded provider-neutral error instead of coerced; and a repository guard fails
if provider vocabulary re-enters `crates/`.
'''
evidence = '''
The official yt-dlp POSIX entrypoint now derives and normalizes availability
inside yt-dlp metadata processing, and its PowerShell path returns the same
three canonical tokens; package fixtures cover all known provider tokens plus
missing and unrecognized fallback behavior. Core and scanner use the derived
provider-neutral enum directly with the v1 omitted-field default. Infra and
scanner regressions prove canonical decoding and bounded operational rejection
without echoing an invalid token. `cargo xtask architecture-lint` recursively
guards `crates/` against provider vocabulary. Focused evidence: 15 add-on
repository tests, 10 infra add-on-list tests, 16 scanner Remote Stream playlist
tests, and 17 xtask architecture-lint tests passed on 2026-08-15.
'''

[[milestone]]
id         = 'ab-02'
phase      = 'Add-on boundary — host/package contract hygiene'
title      = 'Give list and play a structured diagnostic channel'
status     = 'Complete'
feature    = 'addon-host-boundary'
depends_on = []
acceptance = '''
`list` and `play` failures carry a stable validated code alongside a bounded
message; the host emits the same codes for host-detected setting and secret
failures; `canonical_addon_media_list_error` is deleted and translation happens
on the code in every supported culture; an unknown code renders a generic
localized line plus the add-on message; and secret redaction and file-secret
suppression still hold.
'''
evidence = '''
`ersatzrs-addon-contract` owns the bounded `AddonOperationError` shape and the
stable final-stderr-line contract. Host-detected missing settings and secret
references use the same reserved codes as packages; list invocation parses and
redacts the final JSON line, while play supervision logs the validated code and
message without exposing environment or file-backed secrets. The admin UI no
longer matches package prose or setting keys and localizes every reserved code,
with a generic localized fallback for unknown third-party codes. Official
Beeld & Geluid and yt-dlp POSIX and Windows entrypoints and the native Trakt
package emit the contract. Architecture lint prevents package-owned setting
keys and Trakt prose from re-entering host crates.

Verification on 2026-08-15: 17 official repository tests and 5 native Trakt
tests passed; focused host suites passed (37 add-on, 20 play/runtime, 4 i18n,
18 architecture-lint tests); both workspace clippy configurations passed;
`./run.sh test-closeout` passed 1,519 tests plus doctests; `cargo leptos build`
passed; and `cargo xtask parity-check` plus `cargo xtask progress check` passed.
'''

[[milestone]]
id         = 'ab-03'
phase      = 'Add-on boundary — host/package contract hygiene'
title      = 'Make the contract crate own the NDJSON payloads'
status     = 'Complete'
feature    = 'addon-host-boundary'
depends_on = ['ab-01']
acceptance = '''
Both list record types and their wire enums live in `ersatzrs-addon-contract`
with the bytes on the boundary unchanged; the crate is independently versioned,
packageable, and guarded against registry publication; and a reference add-on
plus a callable conformance check ship with the crate.
'''
evidence = '''
The contract crate now owns both NDJSON records, their wire enums and people
records, shared output/item bounds, constructors, per-record validation, and
callable media-list and Remote Stream stdout conformance functions. Host
adapters convert explicitly to the separate persisted domain enums;
`RemoteStreamPerson` and `PlaylistEntry` retain compatibility re-exports. The
crate includes a runnable `reference_addon` example and passes `cargo package`
as an independently versioned 0.1.0 package. The crate declares guarded
`publish = false`; immutable tag `addon-contract-v0.1.0` resolves to pushed
commit `453dddf054aeae27d1959e263bd5288121ab1eab`. The 7-file, 21.1 KiB
compressed archive declares the canonical repository and Zlib license; its 21
packaged tests and warning-free rustdoc build pass. ADR 0069 retired the only
native official consumer, so the public add-ons workflow has no private
cross-repository dependency and no external revision-pin gate remains.

Verification on 2026-08-15: the P2 stderr-tail regression and all focused
contract/infra/scanner suites passed; the contract package and packaged source
compiled; 17 external repository tests and 5 locked native Trakt tests plus
clippy passed; both workspace clippy configurations passed; terminal
`./run.sh test-closeout` passed 1,524 tests plus doctests; and `cargo deny
check`, architecture-lint, and progress validation passed. The first sandboxed
closeout exposed three localhost socket denials, and one later full run exposed
a storage-test concurrency flake that passed immediately in isolation; the
final unrestricted full run was completely green without runner retries.
'''

[[milestone]]
id         = 'ab-04'
phase      = 'Add-on boundary — host/package contract hygiene'
title      = 'Validate the operator source URL and enforce network_hosts'
status     = 'Complete'
feature    = 'addon-host-boundary'
depends_on = []
acceptance = '''
One shared validator rejects unsupported schemes and userinfo at add-on list
import and at playlist manifest parse; a manifest declaring specific
`network_hosts` without `*` refuses a URL whose host does not match; the host
pattern semantics are documented; the rejection renders as a localized
operator error before any provider call; and an existing saved list that would
now fail stays visible and reports the failure.
'''
evidence = '''
Completed 2026-08-15. `ersatzrs-addon-contract` now owns the bounded HTTP(S),
no-userinfo, exact/suffix/wildcard host validator. Add-on List import and Remote
Stream manifest parsing reject unsafe URLs with the localized
`unsupported-url` diagnostic before provider invocation; both installed
provider adapters enforce restrictive `network_hosts`. Reference docs define
the matching, canonical-forwarding, and non-sandbox semantics. Regressions
cover unsafe schemes, userinfo redaction, exact/suffix/wildcard behavior,
parser-sensitive authority canonicalization, operational rejection, and
retaining an existing saved list with `LastError`. The official Beeld & Geluid,
Trakt, and yt-dlp manifests were checked against their supported source hosts.
Focused contract, app, infra, scanner, and web localization tests plus strict
all-target Clippy passed. Full closeout also passed both workspace Clippy
configurations, all 1,533 nextest tests and doctests, the Leptos bundle build,
the complete parity gate, `cargo deny check`, and package verification for
`ersatzrs-addon-contract`.
'''

[[milestone]]
id         = 'ab-05'
phase      = 'Add-on boundary — host/package contract hygiene'
title      = 'Give both list contracts the same strictness'
status     = 'Complete'
feature    = 'addon-host-boundary'
depends_on = ['ab-03']
acceptance = '''
Both record types reject unknown fields and agree on null-array handling; the
official packages emit conforming output on both platforms before the flag
flips; rejection stays atomic with no partial persistence or generated files;
and the capability-version bump is documented as the compatibility policy for
adding a field.
'''
evidence = '''
Implementation and local acceptance completed 2026-08-15. The contract-owned
Remote Stream record now rejects unknown fields just like the media-list
record, while one generic deserializer treats omitted and null optional arrays
as absent in both contracts. Host adapters consume the shared whole-output
conformance functions, whose bounded diagnostics name unknown fields without
echoing invalid values. Regressions prove both wire rules and prove that a
second-line rejection publishes no partial YAML/NFO generation while retaining
the previous complete definitions and playlist identity. A failed media-list
refresh likewise preserves the complete existing list, items, and GUIDs while
recording only `LastError`. The capability references now freeze existing
versions and require a version bump for new fields.

Completed 2026-08-16. The official POSIX fixture suite passed. Real Windows
PowerShell fixture runs covered Beeld & Geluid and yt-dlp in media-list and
Remote Stream modes; this found and fixed yt-dlp emitting `[null]` for missing
genres/tags, and the rerun emitted empty arrays. After ADR 0069 retired native
Trakt, the external repository's 16 tests passed and its deterministic build
produced exactly the Beeld & Geluid and yt-dlp packages without native
artifacts. The contract package verified; both workspace Clippy configurations
passed; and the final unrestricted closeout passed all 1,540 nextest tests plus
doctests. A pre-existing flaky storage test was corrected by keeping its
fixture insert and `last_insert_rowid()` read on one SQLite transaction.
'''

