130-second Windows capture remained structurally valid and the bounded server
log recorded no process failure. The initial 60-second media estimate was
rejected on 2026-08-30 because packet count divided by nominal PCR bitrate is
invalid for VBR HLS. The corrected gate uses PCR elapsed time, and the worker
now records provider-neutral segment advancement. ADR 0084 adds play v2, a
software-encoding restart before one bounded 1080p-to-720p recovery, a verified
24-hour fallback cache, and localized health visibility. Software decisions
are channel/profile fingerprint-scoped, verified 720p decisions can escalate,
and the fast severe-under-run window remains 20 seconds. Twenty-two focused
delivery tests and two software-fallback tests pass, alongside the existing
all-language web health and focused yt-dlp selector/seek tests. The
affected Rust graph passed 1,494 tests, `cargo xtask smoke` passed all three
stream probes, and the synthetic TSDuck gate passed 64 checks with no transport
or timestamp faults. Read-only dogfood of the existing `v1.0.32-beta` package
isolated the shortfall to its NVENC consumer while a bounded `libx264` probe
delivered about 44 seconds of media in 45 seconds. On 2026-09-02 the corrected
native build and shared five-minute VLC/TSDuck repetition were deferred to the
next applicable packaged-Windows dogfood and playback acceptance run, where
they can be exercised with the broader runtime suite; no unrun check is
represented as passing in this slice.
'''

