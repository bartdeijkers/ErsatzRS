The non-default `development-routes` feature plus the explicit
`ERSATZRS_ENABLE_DEVELOPMENT_ROUTES` runtime gate controls both development
routes. Focused default/feature-enabled web tests and the all-features route
registration regression passed. `hydration.toml` now owns browser-verification
state; TEST.md links to `cargo xtask progress routes`, and xtask regressions
prove the validator rejects a duplicate table and both mismatch directions.
`tests/e2e/playouts-feedback.spec.ts` passed 4/4 Chromium/Firefox tests against
a matched SSR/WASM bundle, covering the detailed list, detail, preference, and
dialog workflow. Scanner/show notes now describe implemented provider behavior.
`cargo xtask parity-check`, both workspace clippy configurations,
`./run.sh test-closeout` (961 nextest tests plus doctests), and
`cargo leptos build` passed.
'''

