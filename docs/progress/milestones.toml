[[milestone]]
id         = 'p7b-02'
phase      = 'Phase 7B — Application-layer extraction'
title      = 'Migrate playout-build orchestration'
status     = 'Complete'
feature    = 'application-use-case-layer'
plan       = 'plans/application-layer-and-video-jukebox.md'
depends_on = ['p7b-01']
acceptance = '''
One RequestPlayoutBuild use case owns admission and typed outcomes; all web/API
senders use it while scheduler consumption, Refresh/Reset semantics, and
queued/building feedback remain regression-proven.
'''
evidence = '''
Completed 2026-07-23. `RequestPlayoutBuild` now owns positive-ID validation,
per-playout admission, and typed Accepted, AlreadyQueued, AlreadyBuilding,
Unavailable, and Rejected outcomes through an injected unbounded queue port.
Every web/API producer uses `ApplicationServices`; `AppState` no longer exposes
the sender. The scheduler remains the sole FIFO consumer and uses a lifecycle
guard so queued/building activity clears after success, failure, or
cancellation without clearing a pending follow-up. Pending work upgrades to
`Reset` over `Refresh` over `Continue`, and requests received during a build
share one upgradable follow-up token. Focused regressions prove Refresh/Reset
preservation, FIFO delivery, queued mode upgrades, active-build follow-ups,
duplicate queued/building feedback, closed-worker retry cleanup, transport
outcome mapping, side-effect enqueue order, and persisted build execution.
`cargo xtask architecture-lint`, both workspace clippy
configurations, `./run.sh test-closeout` (977 nextest tests plus doctests), and
`cargo xtask parity-check` (including 385 web tests) passed.
'''

[[milestone]]
id         = 'p7b-03'
phase      = 'Phase 7B — Application-layer extraction'
title      = 'Migrate scan-operation orchestration'
status     = 'Complete'
feature    = 'application-use-case-layer'
plan       = 'plans/application-layer-and-video-jukebox.md'
depends_on = ['p7b-01']
acceptance = '''
Application services own library/show scan admission, FIFO queueing, locking,
progress, and failure lifecycle; every transport observes one operation
registry and existing scan behavior remains regression-proven.
'''
evidence = '''
Completed 2026-07-24. `RequestLibraryScan` and `RequestShowScan` validate
positive persisted identities, provider subtype, show membership, and sync
eligibility before admitting every accepted request to one unbounded FIFO
worker port. Scheduled admission atomically coalesces a library that is already
queued or running while manual repeats retain FIFO semantics.
`ScanOperationRegistry` owns queued/running/completed/failed state, per-library
full/show exclusion, clamped progress, retained failure diagnostics, bounded
terminal history, and success/failure/cancellation/worker shutdown cleanup.
The native composition root dispatches Plex, Jellyfin, and Emby targeted show
scans, preserves Local full-library fallback and deep-scan semantics, and
extracts embedded subtitles only after successful eligible deep show scans.
Leptos server-function names, arguments, polling DTOs, progress rings/spinners,
localization, and hydration shape remain unchanged; rejected requests now use
the existing transport error path instead of reporting a queued bool, and an
additive diagnostic query exposes terminal operation state.
Periodic refreshes and web producers now use application admission, and
architecture lint rejects reintroduced web queue/progress ownership, direct
server-function provider dispatch, scheduler subprocess dispatch, or concrete
application dependencies. External-collection synchronization remains the
separate keyed operation already owned by the shared application coordinator.
Focused application, infrastructure, scheduler, web route, and architecture
regressions passed; complete closeout evidence is recorded in the matching
session and parity feature.
'''

[[milestone]]
id         = 'p7b-04'
phase      = 'Phase 7B — Application-layer extraction'
title      = 'Replace simplified block preview with the real engine'
status     = 'Complete'
feature    = 'block-scheduling-ui'
plan       = 'plans/application-layer-and-video-jukebox.md'
depends_on = ['p7a-02', 'p7a-03', 'p7b-01']
acceptance = '''
Unsaved block preview constructs upstream-shaped temporary scheduling state,
invokes the real block preview builder in Reset mode, returns actual enriched
playout rows, and surfaces failures instead of empty results.
'''
evidence = '''
Completed 2026-07-24. The block editor keeps its public server-function and row
DTO contract while adapting every real block collection key into an
application-owned preview query. The application service validates the unsaved
draft, constructs temporary all-days block-template/playout/reference state at
the current request time, and invokes the production `PlayoutBuilder` in Reset
mode through a storage-neutral port. Infrastructure hydrates the same media,
collection, smart-shuffle, tag, and reference data used by persisted block
scheduling; only rows actually added by the builder are returned with their
real media title, start, finish, and duration.

The inline editor preview has stable idle, loading, empty, ready, and localized
error states without persisting the draft. Typed application, infrastructure,
and transport regressions cover all supported collection kinds, valid empty
output, missing references, builder failures, and closed storage. A database-
seeded Playwright scenario proves the real generated row, unsaved-name
isolation across reload, error and empty states, stable geometry, and responsive
containment in Chromium and Firefox; architecture, hydration, parity, and full
workspace closeout gates passed.
'''

[[milestone]]
id         = 'p7b-05'
phase      = 'Phase 7B — Application-layer extraction'
title      = 'Migrate remaining admin use cases and queries'
status     = 'Complete'
feature    = 'application-use-case-layer'
plan       = 'plans/application-layer-and-video-jukebox.md'
depends_on = ['p7b-02', 'p7b-03', 'p7b-04']
acceptance = '''
Collection, playlist, channel, schedule, settings, Trakt, and media handlers
are thin transport adapters over app use cases/read models; admin code no
longer requires a raw database pool and public server-function contracts stay
stable.
'''
evidence = '''
Completed 2026-07-24. Collection, playlist, channel, schedule, settings,
Trakt, media-source, media-browser, playout, template, deco, filler,
watermark, troubleshooting, artwork, and layout handlers now adapt stable
transport DTOs to injected application commands and queries. `ersatzrs-app`
owns validation, transaction/side-effect ordering, and storage-neutral
outcomes; core owns the ports and typed records; infrastructure owns every
SQL statement, row decode, and backend-specific insert/query detail. The
native web composition root constructs those adapters, and no production
admin server function or API obtains a raw database pool.

Post-closeout review on 2026-07-25 hardened mutation failure semantics:
collection media actions validate referenced rows and atomically create a new
collection with its first item; failed initial playout admission removes the
unbuilt record; automatic rebuild admission failures remain typed and visible
across collection, schedule, settings, and playout workflows; and FFmpeg
profile decode or storage failures are no longer presented as absence.

The architecture baseline fell from 515 direct admin SQL constructors, 173
server-error-to-default patterns, and 833 row-decode defaults to zero. A new
`raw_admin_pool` rule also rejects production admin/API pool retrieval.
Shared localized resource wrappers preserve stable loading, ready, empty, and
error DOM states without rendering failed forms or plausible empty data.

Application (42), infrastructure (354), web (385), and architecture-lint (16)
regressions passed, including SQLite/MySQL query selection, transactional
rollback, storage and row-decode failures, collection variants, and schedule
hydration. Both workspace clippy configurations, 1,016 nextest tests plus
doctests, matched SSR/WASM build, web parity/hydration gates, representative
Chromium/Firefox route-family coverage, and the MPEG-TS/HLS smoke gate passed.
Public server-function names, serialized DTOs, endpoint behavior, validation,
and persisted side effects remain intact.
'''

