acceptance = '''
Add a provider-neutral delivery setting as a labeled native HTML select at list
level, localized in every supported culture and usable with and without
JavaScript. Choices are Stream (default),
Download ahead, and Download ahead only for new videos; this is neither a
checkbox nor a per-item override. The setting is independent of SponsorBlock
and available for supported add-on lists, not keyed to yt-dlp or a removal
option. Use declared delivery capabilities for unsupported-mode feedback;
do not promise download support for every provider or finite/live source.
Keep yt-dlp as the first integration without building speculative adapters.
Download ahead works with SponsorBlock disabled or unavailable; interval
removal is a separate optional operation, not optional to honor once enabled.
Enabled SponsorBlock applies in every mode: streamed items skip intervals via
AMM-M-01A; downloaded items have those intervals removed from their files.
The new-videos-only mode must honor it for both existing streamed items and
newly imported downloaded items. A delivery-mode change must never silently
disable removal; report unsupported or failed removal explicitly rather than
claiming uncut media is processed. Stream uses AMM-M-01A without mandatory full
downloads. Download ahead prepares included finite videos in full before their
prepared publication becomes playable, removing SponsorBlock intervals when
the existing removal option is enabled. The new-videos choice applies only to
videos first imported after enabling that mode; videos already in the list
keep streaming. Persist that distinction across refreshes and restarts rather
than treating a cache miss or repeated import of an existing item as new.
Entering or re-enabling new-videos-only creates a fresh persisted cutoff;
saving the unchanged mode preserves it. Show the saved cutoff date/time beside
the delivery selector with localized explanatory text. Already-known videos
stream after the next publication; current published playback stays frozen.
Freeze each item's effective delivery choice with its published revision;
changing the saved list setting must not mutate current published playback.
Reuse shared browser/access, durable jobs, artifact admission and revision
binding; validate processed duration, safe cancellation/restart and actual
prepared channel playback. No partial-file playback or silent cross-mode
fallback. Preserve live playback with an explicit finite-only reason.
Keep downloads bounded using existing admission limits; configurable disk-usage
health warnings remain AMM-M-03 under its 2026-09-08 scope revision. Show preparation
progress/failures without disrupting the last complete publication. Focused
tests cover SponsorBlock enabled and disabled in all three choices, including
both existing-streamed and new-downloaded cohorts in new-videos-only mode,
downloads without SponsorBlock support, provider-neutral
mode eligibility, the first-import boundary, persistence and
draft/published isolation, plus hydrated and no-JavaScript selection/save.
Re-enable tests/e2e/addon-preparation-restart.spec.ts and
tests/e2e/addon-prepared-playback.spec.ts through the explicit Download ahead
workflow. Prove actual host-death cleanup and safe restart, revision artifact
pinning and decoded prepared-file channel playback; do not restore a mandatory
download fallback to Stream merely to satisfy these tests.
'''
