[[milestone]]
id         = 'p8a-01'
phase      = 'Phase 8A — HDR and Dolby Vision output contract'
title      = 'Implement the SDR and HDR10 output contract'
status     = 'Complete'
feature    = 'hdr-dolby-vision-metadata'
depends_on = []
acceptance = '''
FFmpeg profiles persist and locally edit a validated SdrBt709 or
Hdr10Bt2020Pq output contract; existing rows retain effective SDR behavior and
fresh ADR 0017 HDR seeds select HDR10. SQLite/MySQL, scanner metadata, every
software/hardware pipeline, health, and troubleshooting agree on the complete
SDR/HDR10 source-output matrix. MPEG-TS/HLS runtime proofs assert decoded image
quality, stable color signaling, static metadata, overlays, and mixed-item
transitions rather than argv alone.
'''
evidence = '''
Software half complete (2026-08-07). `OutputDynamicRange` persists through an
additive SQLite/MySQL migration that defaults existing rows to `SdrBt709`
(`existing_sqlite_profiles_default_to_sdr_output_dynamic_range`); a fresh
database seeds exactly the two ADR 0017 `hdr` profiles as HDR10
(`fresh_database_seeds_only_the_adr_0017_hdr_profiles_as_hdr10`). Validation
rejects non-HEVC/AV1 and 8-bit HDR10 rather than downgrading
(`hdr10_requires_a_codec_that_can_carry_static_metadata`,
`hdr10_requires_ten_bit_output`); the editor control and both rejection
messages are localized in all five cultures and pass
`all_languages_translate_each_key`. A new `Output Dynamic Range` health check
reports unproducible and inert-copy profiles (4 tests).

Software pipeline behavior is snapshot- and runtime-proven: `hdr10_*` pipeline
snapshots, `sdr_profile_still_tonemaps_an_hdr_source_exactly_as_before` (the
ErsatzTV SDR path is byte-identical), and
`hdr10_output_signalling_is_identical_for_sdr_and_hdr_items`. Decoded proof
against the shipped FFmpeg 9 runtime is recorded in
`docs/explanation/hdr-output-characterization.md`: the SDR reference white lands
exactly on the BT.2408 203 cd/m² PQ code value (10-bit Y = 573), PQ sources
retain their own mastering-display/MaxCLL through both libx265 and hevc_nvenc,
and a concatenated SDR + HDR10 + HLG MPEG-TS stream reports one signalling
class across all 75 frames with no change at either item boundary.

Hardware paths landed 2026-08-07. NVENC HDR10 is implemented and proven on an
RTX 3080 Ti for PQ (stays on the GPU), HLG, and SDR sources, including a
concatenated NVENC mixed-source stream with one signalling class across all 75
frames. Backends with no characterized HDR10 graph demote to software encoding
instead of emitting SDR, and the health check warns. Two runtime constraints
were found and encoded: `hwdownload` must use the source surface's own format,
and `zscale` needs asserted input tags for untagged sources.

Scanner metadata and the remaining runtime proofs landed 2026-08-07. `MediaStream`
persists `MasteringDisplay`/`MaxCll`/`MaxFall` through an additive migration; the
probe now reads one frame because Matroska carries these as frame side data,
which `-show_streams` alone misses. Conversions prefer source metadata over the
seeded default; a PQ source still injects nothing. Verified against a real HDR10
file by `source_hdr_metadata_is_parsed_from_a_real_hdr10_file`.

HDR10 was also proven through an alpha overlay and burned subtitles to both
MPEG-TS and HLS (fMP4), each keeping `bt2020nc / smpte2084 / bt2020` plus both
metadata blocks, with the overlay confirmed to actually composite. `cargo xtask
smoke` passes with the new migrations.

NOT complete, tracked as debt: HDR10 is uncharacterized on non-NVIDIA hardware
(`hdr10-is-uncharacterized-on-non-nvidia-hardware`), and the seeded HDR10
defaults are documented constants rather than operator-editable profile fields
(`hdr10-profile-metadata-is-not-operator-editable`).
'''

[[milestone]]
id         = 'p8a-02'
phase      = 'Phase 8A — HDR and Dolby Vision output contract'
title      = 'Characterize and support Dolby Vision inputs'
status     = 'Complete'
feature    = 'hdr-dolby-vision-metadata'
depends_on = ['p8a-01']
acceptance = '''
Known profile 5, 7, and 8.1 fixtures establish copy and transcode behavior for
SDR and HDR10 targets. Scanner persistence, RPU/base/enhancement-layer handling,
libplacebo and dovi_split use, output signaling, rejection behavior, health,
overlays, subtitles, scaling, restart, MPEG-TS, and HLS are explicit and
runtime-proven. Dolby Vision output remains unadvertised.
'''
evidence = '''
Complete 2026-08-07 and expanded by the verified 2026-08-09 Phase 8 closeout.
The ffprobe `DOVI configuration record` is parsed, persisted through additive
SQLite/MySQL migrations, retained across local and remote-provider scans, and
carried to playback. SDR output strips incompatible HDR/Dolby Vision side data;
HDR10 preserves or supplies valid static metadata while removing Dolby Vision
signalling. The health check names and counts every rejected stream.

The admitted policies are fixture-shaped rather than profile-number guesses.
Profile 8 requires the characterized 8.1 tuple: compatibility id 1, BL and RPU
present, and EL absent. Profile 7 requires the exact progressive HEVC Main 10,
yuv420p10le, compatibility-id-6 BL+EL+RPU tuple and directly software-decodes
its conventional HDR10 base layer; `dovi_split=mode=bl` remains the comparison
oracle. Profile 5 requires the complete tuple plus positive proof of the exact
selected-device SDR/H.264 or HDR10/HEVC CUDA/Vulkan/libplacebo/NVENC operation.
There is no generic fallback, Profile 8.4 remains rejected, and Dolby Vision
output is not advertised.

Real Profile 8.1 and Profile 7 gates cover SDR/HDR10 output, seek, scaling,
overlay, burned subtitle, MPEG-TS, HLS, stable signalling, and absent DOVI
records. Profile 5 has equivalent graph characterization plus automated probe,
command, health, HLS/IPTV refusal, and learned-denial regressions. Its final
complete production HLS/MPEG-TS run on matching NVIDIA/Vulkan hardware remains
visible debt in `hdr-dolby-vision-metadata.toml`; the milestone itself remains
complete because unsupported or unproven operations fail closed.
'''

