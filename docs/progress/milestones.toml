# Fine-grained execution state for active structural plans. The `phase` value
# groups milestones into program increments; dependencies control runnable
# order. Query runnable work with `cargo xtask progress milestones --runnable`.

[[milestone]]
id         = 'p7a-01'
phase      = 'Phase 7A — Guardrails and failure semantics'
title      = 'Decide and enforce the application boundary'
status     = 'Complete'
feature    = 'application-use-case-layer'
plan       = 'plans/application-layer-and-video-jukebox.md'
depends_on = []
acceptance = '''
An accepted ADR defines the application/composition boundaries, and a
baseline-aware architecture gate prevents an empty app crate, forbidden app
dependencies, new direct admin SQL, and new server-error-to-default loaders.
'''
evidence = '''
ADR 0051 is Accepted and indexed; `ersatzrs-app::ApplicationServices` replaces
the placeholder entry point. `cargo xtask architecture-lint` passes with exact
production baselines for 535 direct admin SQL calls and 115 server-error
default loaders. Its nine focused regressions cover empty-app, renamed and
workspace dependencies, SQL aliases and glob imports, raw Executor SQL,
production-capable cfg forms, and exact upward/downward ratcheting. The gate
runs in CI and `cargo xtask parity-check`. Closeout passed both
workspace clippy configurations, 946 nextest tests plus doctests, the Leptos
build, `cargo xtask parity-check p7a-01 app` (including 378 web tests),
`cargo deny check`, and `cargo xtask progress check`.
'''

[[milestone]]
id         = 'p7a-02'
phase      = 'Phase 7A — Guardrails and failure semantics'
title      = 'Make playback and HLS data-access failures explicit'
status     = 'Complete'
feature    = 'runtime-data-access-error-semantics'
plan       = 'plans/application-layer-and-video-jukebox.md'
depends_on = []
acceptance = '''
Playback metadata, HLS configuration/current-item, and transcode-capacity
loaders distinguish absent data from database/decode failure; callers,
health checks, and focused failure-path tests preserve that distinction.
'''
evidence = '''
Playback stream and target-frame-rate loaders, HLS configuration/current-item
loaders, and active-transcode capacity now return typed optional results and
strictly distinguish valid absence, persisted-value/row decode failures, and
database failures. IPTV, HLS workers and slates, path replacement, stream
selection, and troubleshooting callers propagate operational failures before
building a behavior-changing FFmpeg command; correlated logs and the Playback
Data Access health check expose invalid or unavailable configuration. Focused
SQLite failure-path regressions cover every loader family and the health
contract. Closeout passed both workspace clippy configurations, 951 nextest
tests plus doctests, `cargo xtask parity-check p7a-02 playback hls
--leptos-build` (including architecture/hydration gates and 380 web tests),
`cargo xtask smoke` MPEG-TS/HLS probes, `cargo deny check`, and
`cargo xtask progress check`.
'''

[[milestone]]
id         = 'p7a-03'
phase      = 'Phase 7A — Guardrails and failure semantics'
title      = 'Introduce typed admin load and error states'
status     = 'Complete'
feature    = 'admin-ui-failure-semantics'
plan       = 'plans/application-layer-and-video-jukebox.md'
depends_on = []
acceptance = '''
The complete `/settings/*` and `/media/libraries` route families render through
one localized, hydration-stable wrapper with
`data-state="loading|ready|empty|error"`. A closed-pool regression for each
family proves storage failure renders `data-state="error"` with no submittable
form. Their query rows and configuration values use typed infrastructure reads
that preserve the Phase 7A `RepositoryError` vocabulary. The architecture
baseline falls exactly from 535 to 519 direct admin SQL calls, 204 to 184
server-error default loaders, and 851 to 843 row-decode defaults. The whole-app
island hydration gate covers one injected settings error state and the stable
navigation badge markers.
'''
evidence = '''
The seven `/settings/*` pages and `/media/libraries` now keep server-function
results typed through the render boundary and use one `AdminResourceState`
wrapper for localized loading, ready, empty, and failed presentation. Settings
write-back DTOs no longer implement `Default`; native settings and library
queries decode through infra read models and return the existing
`RepositoryError` variants. Closed-pool regressions for both families render
`data-state="error"` without a form or submit control. Architecture lint now
counts awaited `unwrap_or_default`, `unwrap_or`, `unwrap_or_else`, `.ok()`,
silent awaited `if let Ok`, form-rendering Suspense fallbacks, and
`try_get(...).unwrap_or*`; its baselines fell exactly from 535/204/851 to
519/184/843. The whole-app Chromium hydration gate passed 57/57 routes,
including an injected settings storage failure and stable navigation-badge
markers. Review closeout added a polling-recovery regression and passed the
57-test Chromium island spec through the normal Playwright CI wrapper, proving
the failure injection is not skipped. Both workspace clippy configurations
passed, and `./run.sh test-closeout` passed 957 nextest tests plus doctests.
'''

