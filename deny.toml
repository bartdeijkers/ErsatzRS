[advisories]
version = 2
yanked = "deny"
ignore = [
  # Transitive through Leptos 0.7/tachys/either_of. No safe upstream upgrade is
  # available yet; revisit when Leptos moves off paste.
  "RUSTSEC-2024-0436",
  # Transitive through Leptos 0.8 proc macros (leptos_macro,
  # leptos_router_macro, reactive_stores_macro, rstml/syn_derive). No safe
  # upstream upgrade is available yet; revisit when Leptos migrates away from
  # proc-macro-error2.
  "RUSTSEC-2026-0173",
  # libsqlite3-sys 0.37 bundles SQLite < 3.54.0 (uninitialized page-cache read
  # when a database is opened with a crafted `-wal` file of a different page
  # size). It arrives through sqlx-sqlite 0.9.0, which pins
  # libsqlite3-sys < 0.38, so the patched 0.39 is unreachable. ErsatzRS only
  # opens its own local database (ADR 0080); exploitation needs an attacker
  # who can already write that database and its WAL. Temporary by maintainer
  # decision (2026-11-09): remove once sqlx accepts libsqlite3-sys >= 0.39.
  "RUSTSEC-2026-0459",
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "BSL-1.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # base16 via leptos/wasm_split_macros theme support.
  "CC0-1.0",
  "ISC",
  "MIT",
  # borrow-or-share, pulled in transitively by jsonschema via fluent-uri.
  # MIT No Attribution is MIT without the attribution clause - fully permissive.
  "MIT-0",
  # option-ext, pulled in transitively by directories for platform path lookup.
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
  # webpki-roots (TLS CA bundle), pulled in transitively by the rustls stack.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[[bans.skip]]
name = "convert_case"
version = "=0.6.0"
reason = "Leptos currently pulls config 0.15 / leptos_config alongside newer proc-macro crates that use convert_case 0.11."

[[bans.skip]]
name = "getrandom"
version = "=0.2.17"
reason = "Current graph spans ring/rustls on 0.2, rand 0.9 on 0.3, and leptos/tempfile/uuid on 0.4."

[[bans.skip]]
name = "getrandom"
version = "=0.3.4"
reason = "Current graph spans ring/rustls on 0.2, rand 0.9 on 0.3, and leptos/tempfile/uuid on 0.4."

[[bans.skip]]
name = "r-efi"
version = "=5.3.0"
reason = "Follows the split between getrandom 0.3 and getrandom 0.4 in the current upstream graph."

[[bans.skip]]
name = "thiserror"
version = "=1.0.69"
reason = "Leptos/server_fn still transitively depend on gloo-net 0.6 while the workspace crates use thiserror 2."

[[bans.skip]]
name = "thiserror-impl"
version = "=1.0.69"
reason = "Leptos/server_fn still transitively depend on gloo-net 0.6 while the workspace crates use thiserror 2."

[[bans.skip]]
name = "windows-sys"
version = "=0.52.0"
reason = "Still pulled in transitively by ring 0.17 via rustls; the rest of the graph is on windows-sys 0.61."

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
