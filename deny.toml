[advisories]
version = 2
yanked = "deny"
ignore = [
  # Transitive through Leptos 0.7/tachys/either_of. No safe upstream upgrade is
  # available yet; revisit when Leptos moves off paste.
  "RUSTSEC-2024-0436",
  # async-std discontinued advisory. async-std is a dev-dependency only, pulled
  # in transitively by httpmock → async-object-pool. No production code is
  # affected; revisit when httpmock drops the async-object-pool dependency.
  "RUSTSEC-2025-0052",
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "BSL-1.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "GPL-3.0-or-later",
  "ISC",
  "MIT",
  # option-ext, pulled in transitively by directories for platform path lookup.
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
  # webpki-roots (TLS CA bundle), pulled in transitively by the rustls stack.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
