[advisories]
version = 2
yanked = "deny"
ignore = [
  # Transitive through Leptos 0.7/tachys/either_of. No safe upstream upgrade is
  # available yet; revisit when Leptos moves off paste.
  "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "BSL-1.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "GPL-3.0-or-later",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
