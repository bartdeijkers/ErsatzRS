[workspace]
resolver = "2"
members = [
    "crates/ersatzrs-domain",
    "crates/ersatzrs-core",
    "crates/ersatzrs-ffmpeg",
    "crates/ersatzrs-infra",
    "crates/ersatzrs-app",
    "crates/ersatzrs-web",
    "crates/ersatzrs-scanner",
]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Bart Deijkers <bartdeijkers@gmail.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/bart/ErsatzRS"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
