[workspace]
resolver = "2"
members = [
    "crates/ersatzrs-addon-contract",
    "crates/ersatzrs-domain",
    "crates/ersatzrs-core",
    "crates/ersatzrs-hwprobe",
    "crates/ersatzrs-platform",
    "crates/ersatzrs-ffmpeg",
    "crates/ersatzrs-infra",
    "crates/ersatzrs-app",
    "crates/ersatzrs-web",
    "crates/ersatzrs-scanner",
    "crates/ersatzrs-healthcheck",
    "crates/ersatzrs-scheduler",
    "crates/ersatzrs-launcher",
    "xtask",
]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
authors = ["Bart Deijkers <bartdeijkers@gmail.com>"]
license = "Zlib"
repository = "https://github.com/bartdeijkers/ErsatzRS"

# Shared SQLite-only sqlx dependency. The union of all crate features
# (runtime-tokio, sqlite, migrate, chrono, uuid, macros) is declared here so
# cargo compiles sqlx once with one feature set. Per-crate Cargo.toml files use
# `sqlx = { workspace = true }`.
[workspace.dependencies]
quick-xml = { version = "0.42", features = ["serialize"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate", "chrono", "uuid", "macros"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Dev profile tuned for the edit -> hot-reload loop. See BUILD.md for rationale.
[profile.dev]
opt-level = 0
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = true

# The web library's large native test harness can exceed MSVC's PDB size limit
# even with line tables only. Test outcomes do not require debug information.
[profile.test]
debug = 0

# Optimise dependencies once so mlua / sqlx / leptos macro output runs at a
# usable speed in dev. Cold builds pay ~30s extra; warm rebuilds of workspace
# crates remain fast because deps are cached.
[profile.dev.package."*"]
opt-level = 1

# These crates dominate first-build time and gain almost nothing from -O1.
[profile.dev.package.mlua]
opt-level = 0

[profile.dev.package.sqlx-macros]
opt-level = 0

# Even line-table-only debug data pushes the native web rlib beyond the 4-GiB
# archive limit understood by MSVC's linker. Dependencies keep line tables.
[profile.dev.package.ersatzrs-web]
debug = 0
