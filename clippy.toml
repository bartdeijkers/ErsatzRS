# Keep the numeric MSRV out of this file until the first release locks it.
# The policy is defined in STYLE.md: current stable minus one.
avoid-breaking-exported-api = true

disallowed-methods = [
  { path = "std::env::var", reason = "Use the configuration layer so defaults, files, env, and CLI stay consistent." },
  { path = "std::env::var_os", reason = "Use the configuration layer so defaults, files, env, and CLI stay consistent." },
]
