name: Full verification
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        default: self-hosted
        options: [self-hosted, github-hosted]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: full-verification-${{ github.ref }}-${{ inputs.runner || 'self-hosted' }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      runner: ${{ inputs.runner || '' }}
    secrets: inherit
