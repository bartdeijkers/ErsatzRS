name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Create GitHub release
    runs-on: [self-hosted, ersatzrs-linux-release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

  web-assets:
    name: Build web assets
    needs: release
    runs-on: [self-hosted, ersatzrs-linux-release]
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      LEPTOS_HASH_FILES: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-web-assets
          cache-bin: "true"
      - name: Install web asset tools
        run: |
          set -euo pipefail
          if ! command -v stylance >/dev/null 2>&1 || [ "$(stylance --version)" != "stylance-cli 0.8.2" ]; then
            cargo install stylance-cli --version 0.8.2 --locked
          fi
          if ! command -v cargo-leptos >/dev/null 2>&1 || [ "$(cargo leptos --version)" != "cargo-leptos 0.3.6" ]; then
            cargo install cargo-leptos --version 0.3.6 --locked
          fi
      - name: Build Leptos site assets
        run: |
          set -euo pipefail
          (cd crates/ersatzrs-web && cargo leptos build --release --frontend-only --lib-features hydrate)
          test -f crates/ersatzrs-web/public/bundle.css
          test -d target/site/pkg
      - name: Stage web assets
        run: |
          set -euo pipefail
          mkdir -p release-web-assets
          cp -R crates/ersatzrs-web/public release-web-assets/public
          cp -R target/site release-web-assets/site
      - name: Upload web assets
        uses: actions/upload-artifact@v7
        with:
          name: web-assets
          path: release-web-assets/

  binaries:
    # Build release binaries for every ErsatzTV-parity RID and attach them
    # as archives to the GitHub release. CI stays on the self-hosted
    # development checks; hosted platform builds run only for releases.
    name: Release archive (${{ matrix.rid }})
    needs: [release, web-assets]
    runs-on: ${{ fromJSON(matrix.runner) }}
    permissions:
      contents: write
      # Needed only for the optional Azure code-signing OIDC login below; granted
      # unconditionally but unused unless the signing secrets are configured.
      id-token: write
    env:
      # Hosted release runners must not inherit the developer self-hosted
      # target-dir from the committed .cargo/config.toml (which points at a
      # local /mnt path that does not exist here). Keep build output inside the
      # workspace so the `target/...` staging paths below resolve on every RID.
      # `cross` honours CARGO_TARGET_DIR and mounts it into its container, so the
      # arm builds land in this same workspace `target/` the staging step reads;
      # without this override the committed /mnt path would break them inside the
      # container too.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # Hosted and cross release builders are memory constrained. The workspace
      # default release profile is tuned for maximum optimization
      # (LTO + one codegen unit), which can get the large SSR web crate killed
      # by the runner. Keep packaged artifacts as release builds while using a
      # lower-memory profile shape for CI packaging.
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_LTO: "false"
      # Empty unless the signing secrets are configured. Hoisted to job env
      # because the `secrets` context is not available in step `if:` conditions;
      # the optional signing steps gate on `env.AZURE_CLIENT_ID != ''`.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    strategy:
      fail-fast: false
      matrix:
        # v1.0.10-alpha is a Windows-only hotfix release: only the win-x64 archive is
        # produced (Linux, macOS, and Docker are intentionally omitted). Restore
        # the Linux/macOS entries before the next full release.
        include:
          - rid: win-x64
            runner: '["self-hosted","ersatzrs-windows-release"]'
            target: x86_64-pc-windows-msvc
            cross: false
            archive: zip
    steps:
      - uses: actions/checkout@v6
      - name: Prefer Git Bash on Windows
        if: ${{ matrix.rid == 'win-x64' }}
        shell: pwsh
        run: |
          # WSL bash cannot execute GitHub Actions' Windows temp script paths.
          "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.rid }}
          # Self-hosted runner shares $CARGO_HOME/bin with the developer
          # shell, so don't let rust-cache prune cargo-leptos /
          # stylance-cli / wasm-bindgen / cross between runs.
          cache-bin: "false"
      - name: Install cross
        if: ${{ matrix.cross }}
        run: cargo install cross --locked
      - name: Download web assets
        uses: actions/download-artifact@v8
        with:
          name: web-assets
          path: release-web-assets
      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          TARGET: ${{ matrix.target }}
          ERSATZRS_SKIP_STYLANCE: "1"
        run: |
          set -euo pipefail
          # win-x64 also ships the tray launcher; build it in this single cargo
          # invocation instead of a separate one to avoid a redundant build.
          bins=(--bin ersatzrs-web --bin ersatzrs-scanner)
          if [ "$RID" = "win-x64" ]; then
            bins+=(--bin ersatzrs-launcher)
          fi
          cargo build --release "${bins[@]}" --target "$TARGET"
      - name: Build (cross)
        if: ${{ matrix.cross }}
        env:
          ERSATZRS_SKIP_STYLANCE: "1"
        run: cross build --release --bin ersatzrs-web --bin ersatzrs-scanner --target ${{ matrix.target }}
      - name: Bundle FFmpeg 8.1 with drawvg (win-x64)
        if: ${{ matrix.rid == 'win-x64' }}
        shell: bash
        env:
          # Pinned Gyan win64 GPL build of FFmpeg 8.1. ErsatzRS hard-requires the
          # `drawvg` filter (FFmpeg 8.1+), asserted below.
          FFMPEG_ZIP_URL: https://github.com/GyanD/codexffmpeg/releases/download/8.1.1/ffmpeg-8.1.1-full_build.zip
        run: |
          set -euo pipefail
          curl -fL "$FFMPEG_ZIP_URL" -o ffmpeg-win64.zip
          7z x ffmpeg-win64.zip -offmpeg-extracted >/dev/null
          ffmpeg_exe="$(find ffmpeg-extracted -name ffmpeg.exe | head -n1)"
          ffprobe_exe="$(find ffmpeg-extracted -name ffprobe.exe | head -n1)"
          if [ -z "$ffmpeg_exe" ] || [ -z "$ffprobe_exe" ]; then
            echo "ffmpeg.exe/ffprobe.exe not found in the GyanD archive" >&2
            exit 1
          fi
          cp "$ffmpeg_exe" ffmpeg.exe
          cp "$ffprobe_exe" ffprobe.exe
          # Hard-require the drawvg filter; fail the release if it is missing.
          ./ffmpeg.exe -hide_banner -filters | grep -w drawvg
      # --- Optional Windows code signing (skipped until secrets exist) ---------
      # Disabled by default: both steps are skipped unless AZURE_CLIENT_ID is set.
      # Signs the built exes in place (before staging) so the copies that get
      # zipped are signed. See RELEASING.md for the one-time Azure setup.
      - name: Azure login for signing (optional)
        if: ${{ matrix.rid == 'win-x64' && env.AZURE_CLIENT_ID != '' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Windows binaries (optional)
        if: ${{ matrix.rid == 'win-x64' && env.AZURE_CLIENT_ID != '' }}
        uses: azure/trusted-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: ErsatzRS
          certificate-profile-name: ErsatzRS
          files-folder: ${{ github.workspace }}/target/${{ matrix.target }}/release
          files-folder-filter: ersatzrs-web.exe,ersatzrs-scanner.exe,ersatzrs-launcher.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      # -------------------------------------------------------------------------
      - name: Stage archive
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          stage="ersatzrs-${VERSION}-${RID}"
          mkdir -p "$stage"
          if [ "$RID" = "win-x64" ]; then
            cp "target/${TARGET}/release/ersatzrs-web.exe" "$stage/"
            cp "target/${TARGET}/release/ersatzrs-scanner.exe" "$stage/"
            # The launcher is the user-facing entry point; ship it as ErsatzRS.exe.
            cp "target/${TARGET}/release/ersatzrs-launcher.exe" "$stage/ErsatzRS.exe"
            # Bundled FFmpeg staged by the earlier step.
            cp ffmpeg.exe "$stage/"
            cp ffprobe.exe "$stage/"
          else
            cp "target/${TARGET}/release/ersatzrs-web" "$stage/"
            cp "target/${TARGET}/release/ersatzrs-scanner" "$stage/"
          fi
          cp -R release-web-assets/public "$stage/public"
          cp -R release-web-assets/site "$stage/site"
          cp -R assets "$stage/assets"
          cp LICENSE "$stage/"
          cp README.md "$stage/"
          if [ "$ARCHIVE" = "zip" ]; then
            7z a -tzip "${stage}.zip" "$stage" >/dev/null
            echo "ARCHIVE_PATH=${stage}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "${stage}.tar.gz" "$stage"
            echo "ARCHIVE_PATH=${stage}.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "$VERSION" "$ARCHIVE_PATH" --clobber --repo "$REPO"

  docker:
    name: Publish Docker image
    # v0.0.8-alpha is a Windows/Linux archive-only release.
    if: ${{ false }}
    needs: [release, web-assets]
    runs-on: [self-hosted, ersatzrs-linux-release]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Normalize image metadata
        run: |
          echo "REGISTRY_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Download web assets
        uses: actions/download-artifact@v8
        with:
          name: web-assets
          path: release-web-assets

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/bake-action@v7
        with:
          # Build from the checked-out workspace instead of the default Git
          # context: the downloaded `release-web-assets/` artifact only exists
          # in the workspace and the Dockerfile COPYs it.
          source: .
          files: docker-bake.hcl
          targets: ersatzrs-release
          push: true

      - name: Verify multi-arch manifest
        run: |
          docker buildx imagetools inspect "$REGISTRY_IMAGE:$VERSION" > manifest.txt
          grep -q 'linux/amd64' manifest.txt
          grep -q 'linux/arm64' manifest.txt
          grep -q 'linux/arm/v7' manifest.txt

      - name: Collect static FFmpeg capability reports
        run: |
          require_capability() {
            local file="$1"
            local name="$2"
            if ! grep -wq "$name" "$file"; then
              echo "missing required FFmpeg capability '$name' in $file" >&2
              exit 1
            fi
          }

          assert_common_capabilities() {
            local slug="$1"
            require_capability "capability-reports/${slug}-filters.txt" drawvg
            require_capability "capability-reports/${slug}-filters.txt" subtitles
            require_capability "capability-reports/${slug}-encoders.txt" aac
            require_capability "capability-reports/${slug}-encoders.txt" ac3
            require_capability "capability-reports/${slug}-encoders.txt" libx264
            require_capability "capability-reports/${slug}-encoders.txt" libx265
            require_capability "capability-reports/${slug}-encoders.txt" libsvtav1
            require_capability "capability-reports/${slug}-decoders.txt" h264
            require_capability "capability-reports/${slug}-decoders.txt" hevc
            require_capability "capability-reports/${slug}-decoders.txt" av1
          }

          assert_gpu_capabilities() {
            local platform="$1"
            local slug="$2"
            case "$platform" in
              linux/amd64)
                require_capability "capability-reports/${slug}-hwaccels.txt" cuda
                require_capability "capability-reports/${slug}-hwaccels.txt" vaapi
                require_capability "capability-reports/${slug}-hwaccels.txt" vulkan
                require_capability "capability-reports/${slug}-hwaccels.txt" qsv
                require_capability "capability-reports/${slug}-encoders.txt" h264_nvenc
                require_capability "capability-reports/${slug}-encoders.txt" hevc_nvenc
                require_capability "capability-reports/${slug}-encoders.txt" h264_vaapi
                require_capability "capability-reports/${slug}-encoders.txt" hevc_vaapi
                require_capability "capability-reports/${slug}-encoders.txt" h264_qsv
                require_capability "capability-reports/${slug}-encoders.txt" hevc_qsv
                require_capability "capability-reports/${slug}-decoders.txt" h264_cuvid
                require_capability "capability-reports/${slug}-decoders.txt" hevc_cuvid
                ;;
              linux/arm64)
                require_capability "capability-reports/${slug}-hwaccels.txt" vaapi
                require_capability "capability-reports/${slug}-hwaccels.txt" vulkan
                require_capability "capability-reports/${slug}-encoders.txt" h264_vaapi
                require_capability "capability-reports/${slug}-encoders.txt" hevc_vaapi
                ;;
              linux/arm/v7)
                ;;
              *)
                echo "unhandled platform '$platform'" >&2
                exit 1
                ;;
            esac
          }

          mkdir -p capability-reports
          for platform in linux/amd64 linux/arm64 linux/arm/v7; do
            slug="${platform//\//-}"
            docker run --rm --platform "$platform" --entrypoint ffmpeg "$REGISTRY_IMAGE:$VERSION" -version \
              > "capability-reports/${slug}-ffmpeg-version.txt"
            docker run --rm --platform "$platform" --entrypoint ffprobe "$REGISTRY_IMAGE:$VERSION" -version \
              > "capability-reports/${slug}-ffprobe-version.txt"
            docker run --rm --platform "$platform" --entrypoint ffmpeg "$REGISTRY_IMAGE:$VERSION" -hide_banner -filters \
              > "capability-reports/${slug}-filters.txt"
            docker run --rm --platform "$platform" --entrypoint ffmpeg "$REGISTRY_IMAGE:$VERSION" -hide_banner -encoders \
              > "capability-reports/${slug}-encoders.txt"
            docker run --rm --platform "$platform" --entrypoint ffmpeg "$REGISTRY_IMAGE:$VERSION" -hide_banner -decoders \
              > "capability-reports/${slug}-decoders.txt"
            docker run --rm --platform "$platform" --entrypoint ffmpeg "$REGISTRY_IMAGE:$VERSION" -hide_banner -hwaccels \
              > "capability-reports/${slug}-hwaccels.txt"
            docker run --rm --platform "$platform" --entrypoint ffmpeg "$REGISTRY_IMAGE:$VERSION" \
              -hide_banner \
              -f lavfi -i color=c=black:s=32x32:d=0.1 \
              -vf "drawvg=script='rect 4 4 16 16 fill',format=yuv420p" \
              -frames:v 1 -f null -
            assert_common_capabilities "$slug"
            assert_gpu_capabilities "$platform" "$slug"
          done

      - name: Upload FFmpeg capability reports
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-capability-reports
          path: capability-reports/
