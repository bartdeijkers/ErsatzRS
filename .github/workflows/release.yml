name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Create GitHub release
    runs-on: [self-hosted, ersatzrs-linux-release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

  web-assets:
    name: Build web assets
    needs: release
    runs-on: [self-hosted, ersatzrs-linux-release]
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      LEPTOS_HASH_FILES: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-web-assets
          cache-bin: "true"
      - name: Install web asset tools
        run: |
          set -euo pipefail
          if ! command -v stylance >/dev/null 2>&1 || [ "$(stylance --version)" != "stylance-cli 0.8.2" ]; then
            cargo install stylance-cli --version 0.8.2 --locked
          fi
          if ! command -v cargo-leptos >/dev/null 2>&1 || [ "$(cargo leptos --version)" != "cargo-leptos 0.3.6" ]; then
            cargo install cargo-leptos --version 0.3.6 --locked
          fi
      - name: Build Leptos site assets
        run: |
          set -euo pipefail
          (cd crates/ersatzrs-web && cargo leptos build --release --frontend-only --lib-features hydrate)
          test -f crates/ersatzrs-web/public/bundle.css
          test -d target/site/pkg
      - name: Stage web assets
        run: |
          set -euo pipefail
          mkdir -p release-web-assets
          cp -R crates/ersatzrs-web/public release-web-assets/public
          cp -R target/site release-web-assets/site
      - name: Upload web assets
        uses: actions/upload-artifact@v7
        with:
          name: web-assets
          path: release-web-assets/

  binaries:
    # Build active Linux/Windows release binaries and attach them as archives
    # to the GitHub release. macOS and Docker publication are intentionally
    # outside the active release line for now.
    name: Release archive (${{ matrix.rid }})
    needs: [release, web-assets]
    runs-on: ${{ fromJSON(matrix.runner) }}
    permissions:
      contents: write
      # Needed only for the optional Azure code-signing OIDC login below; granted
      # unconditionally but unused unless the signing secrets are configured.
      id-token: write
    env:
      # Hosted release runners must not inherit the developer self-hosted
      # target-dir from the committed .cargo/config.toml (which points at a
      # local /mnt path that does not exist here). Keep build output inside the
      # workspace so the `target/...` staging paths below resolve on every RID.
      # `cross` honours CARGO_TARGET_DIR and mounts it into its container, so the
      # arm builds land in this same workspace `target/` the staging step reads;
      # without this override the committed /mnt path would break them inside the
      # container too.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # Hosted and cross release builders are memory constrained. The workspace
      # default release profile is tuned for maximum optimization
      # (LTO + one codegen unit), which can get the large SSR web crate killed
      # by the runner. Keep packaged artifacts as release builds while using a
      # lower-memory profile shape for CI packaging.
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_LTO: "false"
      # Must match the web-assets job. The SSR binary and the WASM bundle are
      # built in SEPARATE jobs; if they disagree about Leptos file hashing the
      # running server emits `/pkg/*.<hash>.{js,wasm}` URLs the bundle does not
      # contain and the admin UI never hydrates ("wasm checksum mismatch" — the
      # recurring release breakage). Also pinned in crates/ersatzrs-web/Cargo.toml
      # ([package.metadata.leptos] hash-files = false) and enforced by the
      # "Verify web bundle" gate step below.
      LEPTOS_HASH_FILES: "false"
      # Empty unless the signing secrets are configured. Hoisted to job env
      # because the `secrets` context is not available in step `if:` conditions;
      # the optional signing steps gate on `env.AZURE_CLIENT_ID != ''`.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    strategy:
      fail-fast: false
      matrix:
        # Active release matrix (see docs/how-to/publish-release.md). Linux and
        # Windows build on self-hosted runners; arm64/armv7 are cross-compiled
        # on the x86_64 Linux runner. macOS archives are intentionally omitted
        # until a future macOS-targeted release so GitHub-hosted runner credits
        # are not spent on this release line.
        include:
          - rid: linux-x64
            runner: '["self-hosted","ersatzrs-linux-release"]'
            target: x86_64-unknown-linux-gnu
            cross: false
            archive: tar.gz
          - rid: linux-arm64
            runner: '["self-hosted","ersatzrs-linux-release"]'
            target: aarch64-unknown-linux-gnu
            cross: true
            archive: tar.gz
          - rid: linux-arm
            runner: '["self-hosted","ersatzrs-linux-release"]'
            target: armv7-unknown-linux-gnueabihf
            cross: true
            archive: tar.gz
          - rid: win-x64
            runner: '["self-hosted","ersatzrs-windows-release"]'
            target: x86_64-pc-windows-msvc
            cross: false
            archive: zip
    steps:
      - uses: actions/checkout@v7
      - name: Prefer Git Bash on Windows
        if: ${{ matrix.rid == 'win-x64' }}
        shell: pwsh
        run: |
          # WSL bash cannot execute GitHub Actions' Windows temp script paths.
          "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.rid }}
          # Self-hosted runner shares $CARGO_HOME/bin with the developer
          # shell, so don't let rust-cache prune cargo-leptos /
          # stylance-cli / wasm-bindgen / cross between runs.
          cache-bin: "false"
      - name: Install cross
        if: ${{ matrix.cross }}
        run: cargo install cross --locked
      - name: Download web assets
        uses: actions/download-artifact@v8
        with:
          name: web-assets
          path: release-web-assets
      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          TARGET: ${{ matrix.target }}
          ERSATZRS_SKIP_STYLANCE: "1"
        run: |
          set -euo pipefail
          # win-x64 also ships the tray launcher; build it in this single cargo
          # invocation instead of a separate one to avoid a redundant build.
          bins=(--bin ersatzrs-web --bin ersatzrs-scanner --bin ersatzrs-healthcheck)
          if [ "$RID" = "win-x64" ]; then
            bins+=(--bin ersatzrs-launcher)
          fi
          cargo build --release "${bins[@]}" --target "$TARGET"
      - name: Build (cross)
        if: ${{ matrix.cross }}
        env:
          ERSATZRS_SKIP_STYLANCE: "1"
        run: cross build --release --bin ersatzrs-web --bin ersatzrs-scanner --bin ersatzrs-healthcheck --target ${{ matrix.target }}
      # Boot the assembled bundle (this RID's freshly built SSR binary + the
      # web-assets artifact) and fail the release if any `/pkg` hydration asset
      # 404s. This is the structural catch for the recurring "wasm checksum
      # mismatch" breakage, which no other step detects. Runs on linux-x64 only:
      # the self-hosted linux runner can execute the native binary and the asset
      # URLs the server emits are platform-independent, so one RID proves the
      # whole bundle is consistent.
      - name: Verify web bundle (wasm checksum gate)
        if: ${{ matrix.rid == 'linux-x64' }}
        shell: bash
        env:
          ERSATZRS_WEB_BIN: ${{ github.workspace }}/target/${{ matrix.target }}/release/ersatzrs-web
          ERSATZRS_SITE_ROOT: ${{ github.workspace }}/release-web-assets/site
        run: scripts/release/verify-web-bundle.sh
      # --- Optional Windows code signing (skipped until secrets exist) ---------
      # Disabled by default: both steps are skipped unless AZURE_CLIENT_ID is set.
      # Signs the built exes in place (before staging) so the copies that get
      # zipped are signed. See RELEASING.md for the one-time Azure setup.
      - name: Azure login for signing (optional)
        if: ${{ matrix.rid == 'win-x64' && env.AZURE_CLIENT_ID != '' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Windows binaries (optional)
        if: ${{ matrix.rid == 'win-x64' && env.AZURE_CLIENT_ID != '' }}
        uses: azure/trusted-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: ErsatzRS
          certificate-profile-name: ErsatzRS
          files-folder: ${{ github.workspace }}/target/${{ matrix.target }}/release
          files-folder-filter: ersatzrs-web.exe,ersatzrs-scanner.exe,ersatzrs-healthcheck.exe,ersatzrs-launcher.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      # -------------------------------------------------------------------------
      - name: Stage archive
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          stage="ersatzrs-${VERSION}-${RID}"
          mkdir -p "$stage"
          if [ "$RID" = "win-x64" ]; then
            cp "target/${TARGET}/release/ersatzrs-web.exe" "$stage/"
            cp "target/${TARGET}/release/ersatzrs-scanner.exe" "$stage/"
            cp "target/${TARGET}/release/ersatzrs-healthcheck.exe" "$stage/"
            # The launcher is the user-facing entry point; ship it as ErsatzRS.exe.
            cp "target/${TARGET}/release/ersatzrs-launcher.exe" "$stage/ErsatzRS.exe"
          else
            cp "target/${TARGET}/release/ersatzrs-web" "$stage/"
            cp "target/${TARGET}/release/ersatzrs-scanner" "$stage/"
            cp "target/${TARGET}/release/ersatzrs-healthcheck" "$stage/"
          fi
          cp -R release-web-assets/public "$stage/public"
          cp -R release-web-assets/site "$stage/site"
          cp -R assets "$stage/assets"
          cp LICENSE "$stage/"
          cp README.md "$stage/"
          if find "$stage" \( -iname 'ffmpeg*' -o -iname 'ffprobe*' \) -print -quit | grep -q .; then
            echo "release archives must not bundle ffmpeg or ffprobe" >&2
            exit 1
          fi
          if [ "$ARCHIVE" = "zip" ]; then
            7z a -tzip "${stage}.zip" "$stage" >/dev/null
            echo "ARCHIVE_PATH=${stage}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "${stage}.tar.gz" "$stage"
            echo "ARCHIVE_PATH=${stage}.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "$VERSION" "$ARCHIVE_PATH" --clobber --repo "$REPO"
