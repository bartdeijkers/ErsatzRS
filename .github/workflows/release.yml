name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  beta-windows:
    # Beta tags deliberately exercise only the active Windows release runner.
    # They are pre-release packages, not a Linux or Docker publication.
    if: ${{ endsWith(github.ref_name, '-beta') || contains(github.ref_name, '-beta.') }}
    name: Windows beta archive
    runs-on: [self-hosted, ersatzrs-windows-release]
    permissions:
      contents: write
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # The Windows runner shares a machine with WSL; bound compiler memory.
      CARGO_BUILD_JOBS: "2"
      LEPTOS_HASH_FILES: "false"
    steps:
      - uses: actions/checkout@v7
      - name: Test beta draft guard (offline)
        shell: pwsh
        run: ./scripts/release/test-beta-draft.ps1
      - name: Prefer Git Bash on Windows
        shell: pwsh
        run: |
          "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown,x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-win-x64-beta
          cache-bin: "true"
      - name: Install web asset tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command stylance -ErrorAction SilentlyContinue) -or (stylance --version) -ne 'stylance-cli 0.8.2') {
            cargo install stylance-cli --version 0.8.2 --locked
          }
          if (-not (Get-Command cargo-leptos -ErrorAction SilentlyContinue) -or (cargo leptos --version) -ne 'cargo-leptos 0.3.6') {
            cargo install cargo-leptos --version 0.3.6 --locked
          }
      - name: Build web assets and Windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location crates/ersatzrs-web
          cargo leptos build --release --frontend-only --lib-features hydrate
          Pop-Location
          $env:ERSATZRS_SKIP_STYLANCE = "1"
          cargo build --release --bin ersatzrs-web --bin ersatzrs-scanner --bin ersatzrs-healthcheck --bin ersatzrs-launcher --target x86_64-pc-windows-msvc
      - name: Test Windows startup registration
        shell: pwsh
        env:
          ERSATZRS_SKIP_STYLANCE: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test -p ersatzrs-platform --target x86_64-pc-windows-msvc windows_startup
      - name: Verify web bundle (wasm checksum gate)
        shell: bash
        env:
          ERSATZRS_WEB_BIN: ${{ github.workspace }}/target/x86_64-pc-windows-msvc/release/ersatzrs-web.exe
          ERSATZRS_SITE_ROOT: ${{ github.workspace }}/target/site
        run: scripts/release/verify-web-bundle.sh
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify Next staging (offline)
        run: python scripts/release/test-stage-next.py
      - name: Stage archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $stage = "ersatzrs-$tag-win-x64"
          $archive = "$stage.zip"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          Remove-Item -Force $archive -ErrorAction SilentlyContinue
          New-Item -ItemType Directory $stage | Out-Null
          $bin = Join-Path $env:CARGO_TARGET_DIR 'x86_64-pc-windows-msvc/release'
          Copy-Item "$bin/ersatzrs-web.exe" $stage
          Copy-Item "$bin/ersatzrs-scanner.exe" $stage
          Copy-Item "$bin/ersatzrs-healthcheck.exe" $stage
          Copy-Item "$bin/ersatzrs-launcher.exe" "$stage/ErsatzRS.exe"
          Copy-Item -Recurse "$env:CARGO_TARGET_DIR/site" "$stage/site"
          # `cargo leptos build --frontend-only` can leave assets-dir content
          # in the source public/ directory on Windows. Merge it explicitly so
          # the archive still exposes one complete site/ runtime tree.
          Copy-Item -Recurse -Force "crates/ersatzrs-web/public/*" "$stage/site"
          Copy-Item -Recurse assets "$stage/assets"
          Copy-Item LICENSE, README.md $stage
          $css = Get-Item "$stage/site/bundle.css" -ErrorAction Stop
          if ($css.Length -eq 0) {
            throw 'release archive must contain a non-empty site/bundle.css'
          }
          if (-not (Test-Path "$stage/site/pkg/ersatzrs-web.js") -or -not (Test-Path "$stage/site/pkg/ersatzrs-web.wasm")) {
            throw 'release archive must contain Leptos JavaScript and WASM assets under site/pkg'
          }
          if (-not (Test-Path "$stage/site/fonts")) {
            throw 'release archive must stage merged public assets (fonts, images, css) under site/'
          }
          if (Test-Path "$stage/public") {
            throw 'release archive must not ship a separate public/ folder; admin-UI assets belong under site/'
          }
          if (Get-ChildItem -Path $stage -Recurse -File -Include 'ffmpeg*', 'ffprobe*' | Select-Object -First 1) {
            throw 'release archives must not bundle ffmpeg or ffprobe'
          }
          $launcher = Get-Item "$stage/ErsatzRS.exe" -ErrorAction Stop
          if ($launcher.Length -eq 0) {
            throw 'Windows release archive must contain a non-empty ErsatzRS.exe startup launcher'
          }
          python scripts/release/stage-next.py --rid win-x64 --output "$stage/next"
          if ($LASTEXITCODE -ne 0) { throw 'Next runtime staging failed' }
          Move-Item "$stage/next/ersatztv-channel.exe" "$stage/ersatztv-channel.exe"
          Move-Item "$stage/next/libvpl.dll" "$stage/libvpl.dll" -ErrorAction Stop
          Move-Item "$stage/next/libvpl-LICENSE.txt" "$stage/libvpl-LICENSE.txt" -ErrorAction Stop
          Compress-Archive -Path $stage -DestinationPath $archive
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $archive))
          try {
            $launcherEntry = $zip.Entries | Where-Object { $_.FullName.Replace('\', '/') -eq "$stage/ErsatzRS.exe" } | Select-Object -First 1
            if ($null -eq $launcherEntry -or $launcherEntry.Length -eq 0) {
              throw 'Windows zip must contain the non-empty ErsatzRS.exe startup launcher at its package root'
            }
          } finally {
            $zip.Dispose()
          }
          "ARCHIVE_PATH=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Stage unpublished beta draft archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/release/stage-beta-draft.ps1 -Repository $env:GITHUB_REPOSITORY -Tag $env:GITHUB_REF_NAME -Archive $env:ARCHIVE_PATH

  release:
    name: Create GitHub release
    if: ${{ !(endsWith(github.ref_name, '-beta') || contains(github.ref_name, '-beta.')) }}
    runs-on: [self-hosted, ersatzrs-linux-release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

  web-assets:
    name: Build web assets
    if: ${{ !(endsWith(github.ref_name, '-beta') || contains(github.ref_name, '-beta.')) }}
    needs: release
    runs-on: [self-hosted, ersatzrs-linux-release]
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      LEPTOS_HASH_FILES: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-web-assets
          cache-bin: "true"
      - name: Install web asset tools
        run: |
          set -euo pipefail
          if ! command -v stylance >/dev/null 2>&1 || [ "$(stylance --version)" != "stylance-cli 0.8.2" ]; then
            cargo install stylance-cli --version 0.8.2 --locked
          fi
          if ! command -v cargo-leptos >/dev/null 2>&1 || [ "$(cargo leptos --version)" != "cargo-leptos 0.3.6" ]; then
            cargo install cargo-leptos --version 0.3.6 --locked
          fi
      - name: Build Leptos site assets
        run: |
          set -euo pipefail
          (cd crates/ersatzrs-web && cargo leptos build --release --frontend-only --lib-features hydrate)
          test -f crates/ersatzrs-web/public/bundle.css
          test -d target/site/pkg
      - name: Stage web assets
        run: |
          set -euo pipefail
          mkdir -p release-web-assets
          cp -R target/site release-web-assets/site
          # Frontend-only builds do not consistently copy assets-dir content
          # into site-root on every platform. Merge the generated public
          # source explicitly while retaining the single site/ archive layout.
          cp -R crates/ersatzrs-web/public/. release-web-assets/site/
          test -f release-web-assets/site/bundle.css
      - name: Upload web assets
        uses: actions/upload-artifact@v7
        with:
          name: web-assets
          path: release-web-assets/

  binaries:
    # Build active Linux/Windows release binaries and attach them as archives
    # to the GitHub release. macOS publication is intentionally outside the
    # active release line for now; Docker/GHCR publication is handled by the
    # docker job below.
    name: Release archive (${{ matrix.rid }})
    if: ${{ !(endsWith(github.ref_name, '-beta') || contains(github.ref_name, '-beta.')) }}
    needs: [release, web-assets]
    runs-on: ${{ fromJSON(matrix.runner) }}
    permissions:
      contents: write
      # Needed only for the optional Azure code-signing OIDC login below; granted
      # unconditionally but unused unless the signing secrets are configured.
      id-token: write
    env:
      # Hosted release runners must not inherit the developer self-hosted
      # target-dir from the committed .cargo/config.toml (which points at a
      # local /mnt path that does not exist here). Keep build output inside the
      # workspace so the `target/...` staging paths below resolve on every RID.
      # `cross` honours CARGO_TARGET_DIR and mounts it into its container, so the
      # arm builds land in this same workspace `target/` the staging step reads;
      # without this override the committed /mnt path would break them inside the
      # container too.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # Hosted and cross release builders are memory constrained. The workspace
      # default release profile is tuned for maximum optimization
      # (LTO + one codegen unit), which can get the large SSR web crate killed
      # by the runner. Keep packaged artifacts as release builds while using a
      # lower-memory profile shape for CI packaging.
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_LTO: "false"
      # Must match the web-assets job. The SSR binary and the WASM bundle are
      # built in SEPARATE jobs; if they disagree about Leptos file hashing the
      # running server emits `/pkg/*.<hash>.{js,wasm}` URLs the bundle does not
      # contain and the admin UI never hydrates ("wasm checksum mismatch" — the
      # recurring release breakage). Also pinned in crates/ersatzrs-web/Cargo.toml
      # ([package.metadata.leptos] hash-files = false) and enforced by the
      # "Verify web bundle" gate step below.
      LEPTOS_HASH_FILES: "false"
      # Empty unless the signing secrets are configured. Hoisted to job env
      # because the `secrets` context is not available in step `if:` conditions;
      # the optional signing steps gate on `env.AZURE_CLIENT_ID != ''`.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    strategy:
      fail-fast: false
      matrix:
        # Active release matrix (see docs/how-to/publish-release.md). Linux and
        # Windows build on self-hosted runners; arm64/armv7 are cross-compiled
        # on the x86_64 Linux runner. macOS archives are intentionally omitted
        # until a future macOS-targeted release so GitHub-hosted runner credits
        # are not spent on this release line.
        include:
          - rid: linux-x64
            runner: '["self-hosted","ersatzrs-linux-release"]'
            target: x86_64-unknown-linux-gnu
            cross: false
            archive: tar.gz
          - rid: linux-arm64
            runner: '["self-hosted","ersatzrs-linux-release"]'
            target: aarch64-unknown-linux-gnu
            cross: true
            archive: tar.gz
          - rid: linux-arm
            runner: '["self-hosted","ersatzrs-linux-release"]'
            target: armv7-unknown-linux-gnueabihf
            cross: true
            archive: tar.gz
          - rid: win-x64
            runner: '["self-hosted","ersatzrs-windows-release"]'
            target: x86_64-pc-windows-msvc
            cross: false
            archive: zip
    steps:
      - uses: actions/checkout@v7
      - name: Prefer Git Bash on Windows
        if: ${{ matrix.rid == 'win-x64' }}
        shell: pwsh
        run: |
          # WSL bash cannot execute GitHub Actions' Windows temp script paths.
          "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.rid }}
          # Self-hosted runner shares $CARGO_HOME/bin with the developer
          # shell, so don't let rust-cache prune cargo-leptos /
          # stylance-cli / wasm-bindgen / cross between runs.
          cache-bin: "false"
      - name: Install cross
        if: ${{ matrix.cross }}
        run: cargo install cross --locked
      - name: Download web assets
        uses: actions/download-artifact@v8
        with:
          name: web-assets
          path: release-web-assets
      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          TARGET: ${{ matrix.target }}
          ERSATZRS_SKIP_STYLANCE: "1"
        run: |
          set -euo pipefail
          # win-x64 also ships the tray launcher; build it in this single cargo
          # invocation instead of a separate one to avoid a redundant build.
          bins=(--bin ersatzrs-web --bin ersatzrs-scanner --bin ersatzrs-healthcheck)
          if [ "$RID" = "win-x64" ]; then
            bins+=(--bin ersatzrs-launcher)
          fi
          cargo build --release "${bins[@]}" --target "$TARGET"
      - name: Build (cross)
        if: ${{ matrix.cross }}
        env:
          ERSATZRS_SKIP_STYLANCE: "1"
        run: cross build --release --bin ersatzrs-web --bin ersatzrs-scanner --bin ersatzrs-healthcheck --target ${{ matrix.target }}
      - name: Test Windows startup registration
        if: ${{ matrix.rid == 'win-x64' }}
        shell: pwsh
        env:
          ERSATZRS_SKIP_STYLANCE: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test -p ersatzrs-platform --target x86_64-pc-windows-msvc windows_startup
      # Boot the assembled bundle (this RID's freshly built SSR binary + the
      # web-assets artifact) and fail the release if any `/pkg` hydration asset
      # 404s. This is the structural catch for the recurring "wasm checksum
      # mismatch" breakage, which no other step detects. Runs on linux-x64 only:
      # the self-hosted linux runner can execute the native binary and the asset
      # URLs the server emits are platform-independent, so one RID proves the
      # whole bundle is consistent.
      - name: Verify web bundle (wasm checksum gate)
        if: ${{ matrix.rid == 'linux-x64' }}
        shell: bash
        env:
          ERSATZRS_WEB_BIN: ${{ github.workspace }}/target/${{ matrix.target }}/release/ersatzrs-web
          ERSATZRS_SITE_ROOT: ${{ github.workspace }}/release-web-assets/site
        run: scripts/release/verify-web-bundle.sh
      # --- Optional Windows code signing (skipped until secrets exist) ---------
      # Disabled by default: both steps are skipped unless AZURE_CLIENT_ID is set.
      # Signs the built exes in place (before staging) so the copies that get
      # zipped are signed. See RELEASING.md for the one-time Azure setup.
      - name: Azure login for signing (optional)
        if: ${{ matrix.rid == 'win-x64' && env.AZURE_CLIENT_ID != '' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Windows binaries (optional)
        if: ${{ matrix.rid == 'win-x64' && env.AZURE_CLIENT_ID != '' }}
        uses: azure/trusted-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: ErsatzRS
          certificate-profile-name: ErsatzRS
          files-folder: ${{ github.workspace }}/target/${{ matrix.target }}/release
          files-folder-filter: ersatzrs-web.exe,ersatzrs-scanner.exe,ersatzrs-healthcheck.exe,ersatzrs-launcher.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      # -------------------------------------------------------------------------
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify Next staging (offline)
        run: python scripts/release/test-stage-next.py
      - name: Build pinned upstream Next for ARMv7
        if: ${{ matrix.rid == 'linux-arm' }}
        run: docker buildx build --platform linux/arm/v7 --file Dockerfile --target next-artifacts-export --output type=local,dest=release-next-armv7 .
      - name: Stage archive
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          stage="ersatzrs-${VERSION}-${RID}"
          mkdir -p "$stage"
          if [ "$RID" = "win-x64" ]; then
            cp "target/${TARGET}/release/ersatzrs-web.exe" "$stage/"
            cp "target/${TARGET}/release/ersatzrs-scanner.exe" "$stage/"
            cp "target/${TARGET}/release/ersatzrs-healthcheck.exe" "$stage/"
            # The launcher is the user-facing entry point; ship it as ErsatzRS.exe.
            cp "target/${TARGET}/release/ersatzrs-launcher.exe" "$stage/ErsatzRS.exe"
          else
            cp "target/${TARGET}/release/ersatzrs-web" "$stage/"
            cp "target/${TARGET}/release/ersatzrs-scanner" "$stage/"
            cp "target/${TARGET}/release/ersatzrs-healthcheck" "$stage/"
          fi
          cp -R release-web-assets/site "$stage/site"
          cp -R assets "$stage/assets"
          cp LICENSE "$stage/"
          cp README.md "$stage/"
          if find "$stage" \( -iname 'ffmpeg*' -o -iname 'ffprobe*' \) -print -quit | grep -q .; then
            echo "release archives must not bundle ffmpeg or ffprobe" >&2
            exit 1
          fi
          if [ "$RID" = "win-x64" ] && [ ! -s "$stage/ErsatzRS.exe" ]; then
            echo "Windows release archive must contain a non-empty ErsatzRS.exe startup launcher" >&2
            exit 1
          fi
          next_options=()
          if [ "$RID" = "linux-arm" ]; then
            next_options=(--source-build release-next-armv7)
          fi
          python scripts/release/stage-next.py --rid "$RID" --output "$stage/next" "${next_options[@]}"
          next_binary="ersatztv-channel"
          if [ "$RID" = "win-x64" ]; then next_binary="${next_binary}.exe"; fi
          mv "$stage/next/$next_binary" "$stage/$next_binary"
          if [ "$RID" = "win-x64" ]; then
            mv "$stage/next/libvpl.dll" "$stage/libvpl.dll"
            mv "$stage/next/libvpl-LICENSE.txt" "$stage/libvpl-LICENSE.txt"
          fi
          if [ "$ARCHIVE" = "zip" ]; then
            7z a -tzip "${stage}.zip" "$stage" >/dev/null
            if [ "$RID" = "win-x64" ] && ! 7z l -slt "${stage}.zip" | tr "\\\\" "/" | grep -Fx "Path = ${stage}/ErsatzRS.exe" >/dev/null; then
              echo "Windows zip must contain ErsatzRS.exe at its package root" >&2
              exit 1
            fi
            echo "ARCHIVE_PATH=${stage}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "${stage}.tar.gz" "$stage"
            echo "ARCHIVE_PATH=${stage}.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "$VERSION" "$ARCHIVE_PATH" --clobber --repo "$REPO"

  docker:
    name: Publish Docker image
    if: ${{ !(endsWith(github.ref_name, '-beta') || contains(github.ref_name, '-beta.')) }}
    needs: [release, web-assets]
    runs-on: [self-hosted, ersatzrs-linux-release]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Normalize image metadata
        shell: bash
        run: |
          set -euo pipefail
          registry_image="ghcr.io/${GITHUB_REPOSITORY,,}"
          channel_tag=""
          case "$GITHUB_REF_NAME" in
            *-beta*) channel_tag="beta" ;;
            *-alpha*) channel_tag="alpha" ;;
            *) channel_tag="latest" ;;
          esac
          echo "REGISTRY_IMAGE=$registry_image" >> "$GITHUB_ENV"
          echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          echo "CHANNEL_TAG=$channel_tag" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download web assets
        uses: actions/download-artifact@v8
        with:
          name: web-assets
          path: release-web-assets

      - name: Build and push multi-arch image
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.hcl
          targets: ersatzrs-release
          push: true

      - name: Publish channel tag
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "$REGISTRY_IMAGE:$CHANNEL_TAG" \
            "$REGISTRY_IMAGE:$VERSION"

      - name: Verify multi-arch manifest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$REGISTRY_IMAGE:$VERSION" > manifest.txt
          grep -q 'linux/amd64' manifest.txt
          grep -q 'linux/arm64' manifest.txt
          grep -q 'linux/arm/v7' manifest.txt

      - name: Upload Docker manifest report
        uses: actions/upload-artifact@v7
        with:
          name: docker-manifest
          path: manifest.txt
