name: Clean up old workflow runs

# Deletes old, completed workflow runs (and with them their logs and
# artifacts). Runs that are queued or in progress, runs for the head commit of
# an open pull request, and successful Release runs are never deleted.
#
# Manual runs default to a dry run that only reports what would be deleted.
# The weekly schedule applies the default policy.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report what would be deleted
        type: boolean
        default: true
      min_age_days:
        description: Delete every completed run older than this many days
        type: number
        default: 30
      failed_min_age_days:
        description: Delete failed or cancelled runs older than this many days
        type: number
        default: 7
      max_deletions:
        description: Stop after this many deletions (GITHUB_TOKEN allows 1000 API calls per hour)
        type: number
        default: 800
  schedule:
    - cron: "17 3 * * 0"

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: cleanup-actions
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete old workflow runs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/github-script@v9
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          MIN_AGE_DAYS: ${{ inputs.min_age_days || 30 }}
          FAILED_MIN_AGE_DAYS: ${{ inputs.failed_min_age_days || 7 }}
          MAX_DELETIONS: ${{ inputs.max_deletions || 800 }}
        with:
          script: |
            const dryRun = process.env.DRY_RUN === 'true';
            const day = 24 * 60 * 60 * 1000;
            const now = Date.now();
            const minAge = Number(process.env.MIN_AGE_DAYS) * day;
            const failedMinAge = Number(process.env.FAILED_MIN_AGE_DAYS) * day;
            const maxDeletions = Number(process.env.MAX_DELETIONS);
            const { owner, repo } = context.repo;

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            const protectedShas = new Set(openPulls.map((pull) => pull.head.sha));

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, status: 'completed', per_page: 100,
            });

            const candidates = runs.filter((run) => {
              if (run.id === context.runId) return false;
              if (protectedShas.has(run.head_sha)) return false;
              if (run.name === 'Release' && run.conclusion === 'success') return false;
              const age = now - Date.parse(run.created_at);
              if (age > minAge) return true;
              return age > failedMinAge && run.conclusion !== 'success';
            });

            const summary = {};
            for (const run of candidates) {
              const key = `${run.name} (${run.conclusion})`;
              summary[key] = (summary[key] || 0) + 1;
            }
            core.info(`Completed runs: ${runs.length}; to delete: ${candidates.length}`);
            for (const [key, count] of Object.entries(summary).sort()) {
              core.info(`  ${count}\t${key}`);
            }

            if (dryRun) {
              core.notice(`Dry run: ${candidates.length} of ${runs.length} completed runs would be deleted.`);
              return;
            }

            let deleted = 0;
            for (const run of candidates.slice(0, maxDeletions)) {
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
                deleted += 1;
              } catch (error) {
                core.warning(`Could not delete run ${run.id}: ${error.message}`);
              }
            }
            const left = candidates.length - deleted;
            core.notice(`Deleted ${deleted} workflow runs; ${left} candidates left for a later run.`);
