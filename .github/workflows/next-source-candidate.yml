name: Next source candidate (macOS)

# Linux and Windows candidates can be built and exercised on the maintainer's
# host. These two runners provide the missing macOS build environments. This
# workflow uploads candidates only; it cannot publish a dependency release.
on:
  push:
    branches: [build/next-rtsp-candidate]
    paths:
      - .github/workflows/next-source-candidate.yml
      - scripts/release/next-patches/**
      - scripts/release/prepare-next-source.py
      - scripts/release/package-next-source.py
      - scripts/release/test-prepare-next-source.py
      - scripts/release/test-package-next-source.py
  workflow_dispatch:
    inputs:
      review_manifest:
        description: Reviewed Next source to build without changing production downloads
        type: choice
        required: true
        default: scripts/release/next-patches/manifest.json
        options:
          - scripts/release/next-patches/manifest.json
          - scripts/release/next-patches/v0.2.1/manifest.json
          - scripts/release/next-patches/v0.2.2/manifest.json
          - scripts/release/next-patches/v0.2.2/manifest-sourceout-candidate.json
          - scripts/release/next-patches/v0.2.3/manifest-mpp-fallback-candidate.json

permissions:
  contents: read

concurrency:
  group: next-source-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Next ${{ matrix.rid }} source candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            rid: osx-x64
            target: x86_64-apple-darwin
          - runner: macos-15
            rid: osx-arm64
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      NEXT_REVIEW_MANIFEST: ${{ inputs.review_manifest || 'scripts/release/next-patches/manifest.json' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Select the reviewed compiler
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util, os
          spec = importlib.util.spec_from_file_location("prepare", "scripts/release/prepare-next-source.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          review = module.reviewed_manifest(os.environ["NEXT_REVIEW_MANIFEST"])
          compiler = review.get("rust_toolchain", "1.97.1")
          if compiler not in {"1.97.1", "1.99.0"}:
              raise ValueError("Next candidate compiler requires an explicit workflow review")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"NEXT_RUST_TOOLCHAIN={compiler}\n")
          PY
      - uses: dtolnay/rust-toolchain@1.97.1
        if: env.NEXT_RUST_TOOLCHAIN == '1.97.1'
        with:
          targets: ${{ matrix.target }}
      - uses: dtolnay/rust-toolchain@1.99.0
        if: env.NEXT_RUST_TOOLCHAIN == '1.99.0'
        with:
          targets: ${{ matrix.target }}
      - name: Check source and package guards
        run: |
          python3 scripts/release/test-prepare-next-source.py
          python3 scripts/release/test-package-next-source.py
      - name: Prepare exact reviewed source
        shell: bash
        run: |
          set -euo pipefail
          source_url=$(python3 -c 'import json,os; m=json.load(open(os.environ["NEXT_REVIEW_MANIFEST"])); print(m.get("source_archive_url", "https://codeload.github.com/ErsatzTV/next/legacy.tar.gz/" + m["upstream_revision"]))')
          curl --fail --location --retry 3 --output next-source.tar.gz "$source_url"
          python3 scripts/release/prepare-next-source.py --source-archive next-source.tar.gz --output .next-source --manifest "$NEXT_REVIEW_MANIFEST"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .next-source
          prefix-key: next-adr0116-${{ matrix.rid }}
          cache-bin: false
      - name: Build reviewed source and check native startup
        shell: bash
        working-directory: .next-source
        env:
          NEXT_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ETV_VERSION=$(python3 -c 'import json; print(json.load(open("ersatzrs-source.json"))["distribution_version"])')
          export ETV_VERSION
          cargo "+$NEXT_RUST_TOOLCHAIN" build --locked --release --package ersatztv-channel --target "$NEXT_TARGET"
          python3 -c 'import hashlib,json; assert hashlib.sha256(open("Cargo.lock","rb").read()).hexdigest() == json.load(open("ersatzrs-source.json"))["cargo_lock_sha256"]'
          mkdir ../next-payload
          cp "target/$NEXT_TARGET/release/ersatztv-channel" LICENSE ../next-payload/
          strip ../next-payload/ersatztv-channel
          codesign --force --sign - ../next-payload/ersatztv-channel
          codesign --verify --strict ../next-payload/ersatztv-channel
          ../next-payload/ersatztv-channel --version | tee ../next-version.txt
          test "$(cat ../next-version.txt)" = "ersatztv-channel $ETV_VERSION"
      - name: Package exact payload with provenance
        shell: bash
        env:
          NEXT_RID: ${{ matrix.rid }}
        run: |
          python3 scripts/release/package-next-source.py --payload next-payload \
            --source-provenance .next-source/ersatzrs-source.json --rid "$NEXT_RID" \
            --output packages --rustc "$(rustc "+$NEXT_RUST_TOOLCHAIN" --version)" --manifest "$NEXT_REVIEW_MANIFEST"
      - uses: actions/upload-artifact@v4
        with:
          name: next-source-candidate-${{ matrix.rid }}
          path: |
            packages/
            next-version.txt
            .next-source/ersatzrs-source.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
