name: Windows-only v1.3.1 release
run-name: Windows-only v1.3.1 (${{ inputs.operation }})

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [build, draft]
        required: true
      source_sha:
        type: string
        required: true
      ci_run:
        type: string
        default: ''
      package_run:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    if: inputs.operation == 'build'
    runs-on: [self-hosted, ersatzrs-windows-release]
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_BUILD_JOBS: '2'
      LEPTOS_HASH_FILES: 'false'
      LEPTOS_OUTPUT_NAME: ersatzrs-web
      GH_TOKEN: ${{ github.token }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_SHA -cnotmatch '^[a-f0-9]{40}$' -or (git rev-parse HEAD) -cne $env:SOURCE_SHA) {
            throw 'The package requires its exact source commit'
          }
          if ((gh api "repos/$env:GITHUB_REPOSITORY/pulls/207" --jq '.merge_commit_sha') -cne $env:SOURCE_SHA) {
            throw 'The package source must be the merge commit of PR 207'
          }
      - name: Prefer Git Bash on Windows
        shell: pwsh
        run: |
          "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown,x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-win-x64-beta
          cache-bin: "true"
      - name: Install web asset tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command stylance -ErrorAction SilentlyContinue) -or (stylance --version) -ne 'stylance-cli 0.8.2') {
            cargo install stylance-cli --version 0.8.2 --locked
          }
          if (-not (Get-Command cargo-leptos -ErrorAction SilentlyContinue) -or (cargo leptos --version) -ne 'cargo-leptos 0.3.6') {
            cargo install cargo-leptos --version 0.3.6 --locked
          }
      - name: Build web assets and Windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location crates/ersatzrs-web
          cargo leptos build --release --frontend-only --lib-features hydrate
          if ($LASTEXITCODE -ne 0) { throw 'Web assets build failed' }
          Pop-Location
          $env:ERSATZRS_SKIP_STYLANCE = "1"
          cargo build --release --bin ersatzrs-web --bin ersatzrs-scanner --bin ersatzrs-healthcheck --bin ersatzrs-launcher --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows build failed' }
      - name: Test Windows startup registration
        shell: pwsh
        env:
          ERSATZRS_SKIP_STYLANCE: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test -p ersatzrs-platform --target x86_64-pc-windows-msvc windows_startup
      - name: Verify web bundle (wasm checksum gate)
        shell: bash
        env:
          ERSATZRS_WEB_BIN: ${{ github.workspace }}/target/x86_64-pc-windows-msvc/release/ersatzrs-web.exe
          ERSATZRS_SITE_ROOT: ${{ github.workspace }}/target/site
        run: scripts/release/verify-web-bundle.sh
      - name: Use installed Python on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import sys; assert sys.version_info >= (3, 12), 'Python 3.12 or newer is required'"
          if ($LASTEXITCODE -ne 0) { throw 'Install Python 3.12 or newer on the Windows release runner' }
          $pythonDirectory = python -c "import os, sys; print(os.path.dirname(sys.executable))"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot locate installed Python' }
          $pythonDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify Next staging (offline)
        run: python scripts/release/test-stage-next.py
      - name: Azure login for signing (optional)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Windows binaries (optional)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/trusted-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: ErsatzRS
          certificate-profile-name: ErsatzRS
          files-folder: ${{ github.workspace }}/target/x86_64-pc-windows-msvc/release
          files-folder-filter: ersatzrs-web.exe,ersatzrs-scanner.exe,ersatzrs-healthcheck.exe,ersatzrs-launcher.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Stage archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v1.3.1'
          $stage = "ersatzrs-$tag-win-x64"
          $archive = "$stage.zip"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          Remove-Item -Force $archive -ErrorAction SilentlyContinue
          New-Item -ItemType Directory $stage | Out-Null
          $bin = Join-Path $env:CARGO_TARGET_DIR 'x86_64-pc-windows-msvc/release'
          Copy-Item "$bin/ersatzrs-web.exe" $stage
          Copy-Item "$bin/ersatzrs-scanner.exe" $stage
          Copy-Item "$bin/ersatzrs-healthcheck.exe" $stage
          Copy-Item "$bin/ersatzrs-launcher.exe" "$stage/ErsatzRS.exe"
          Copy-Item -Recurse "$env:CARGO_TARGET_DIR/site" "$stage/site"
          # `cargo leptos build --frontend-only` can leave assets-dir content
          # in the source public/ directory on Windows. Merge it explicitly so
          # the archive still exposes one complete site/ runtime tree.
          Copy-Item -Recurse -Force "crates/ersatzrs-web/public/*" "$stage/site"
          Copy-Item -Recurse assets "$stage/assets"
          Copy-Item LICENSE, README.md $stage
          $css = Get-Item "$stage/site/bundle.css" -ErrorAction Stop
          if ($css.Length -eq 0) {
            throw 'release archive must contain a non-empty site/bundle.css'
          }
          if (-not (Test-Path "$stage/site/pkg/ersatzrs-web.js") -or -not (Test-Path "$stage/site/pkg/ersatzrs-web.wasm")) {
            throw 'release archive must contain Leptos JavaScript and WASM assets under site/pkg'
          }
          if (-not (Test-Path "$stage/site/fonts")) {
            throw 'release archive must stage merged public assets (fonts, images, css) under site/'
          }
          if (Test-Path "$stage/public") {
            throw 'release archive must not ship a separate public/ folder; admin-UI assets belong under site/'
          }
          if (Get-ChildItem -Path $stage -Recurse -File -Include 'ffmpeg*', 'ffprobe*' | Select-Object -First 1) {
            throw 'release archives must not bundle ffmpeg or ffprobe'
          }
          $launcher = Get-Item "$stage/ErsatzRS.exe" -ErrorAction Stop
          if ($launcher.Length -eq 0) {
            throw 'Windows release archive must contain a non-empty ErsatzRS.exe startup launcher'
          }
          python scripts/release/stage-next.py --rid win-x64 --output "$stage/next"
          if ($LASTEXITCODE -ne 0) { throw 'Next runtime staging failed' }
          Get-ChildItem -LiteralPath "$stage/next" -File -Force |
            Where-Object { $_.Name -cnotin @('LICENSE', 'origin.json') } |
            Move-Item -Destination $stage -ErrorAction Stop
          Compress-Archive -Path $stage -DestinationPath $archive
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $archive))
          try {
            $launcherEntry = $zip.Entries | Where-Object { $_.FullName.Replace('\', '/') -eq "$stage/ErsatzRS.exe" } | Select-Object -First 1
            if ($null -eq $launcherEntry -or $launcherEntry.Length -eq 0) {
              throw 'Windows zip must contain the non-empty ErsatzRS.exe startup launcher at its package root'
            }
          } finally {
            $zip.Dispose()
          }
          "ARCHIVE_PATH=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Record package source and digest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hash = (Get-FileHash $env:ARCHIVE_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
          @{ source_sha = $env:SOURCE_SHA; sha256 = $hash } |
            ConvertTo-Json -Compress | Set-Content -Encoding ascii package-provenance.json
      - uses: actions/upload-artifact@v7
        with:
          name: v1.3.1-windows-package
          path: |
            ersatzrs-v1.3.1-win-x64.zip
            package-provenance.json
          if-no-files-found: error

  draft:
    if: inputs.operation == 'draft'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      CI_RUN: ${{ inputs.ci_run }}
      PACKAGE_RUN: ${{ inputs.package_run }}
      DELIVERY_SHA: ${{ github.sha }}
    steps:
      - name: Verify exact source, full CI and package run
        run: |
          python3 - <<'CHECK'
          import json, os, re, subprocess

          def api(endpoint):
              return json.loads(subprocess.check_output(["gh", "api", endpoint], text=True))

          source, ci_run, package_run = (os.environ[key] for key in ("SOURCE_SHA", "CI_RUN", "PACKAGE_RUN"))
          if not re.fullmatch(r"[a-f0-9]{40}", source) or not all(i.isdecimal() for i in (ci_run, package_run)):
              raise SystemExit("Expected an exact source SHA and two Actions run IDs")
          repo = "repos/" + os.environ["GITHUB_REPOSITORY"]
          pr = api(f"{repo}/pulls/207")
          if not pr["merged"] or pr["merge_commit_sha"] != source:
              raise SystemExit("Application source is not the merged PR 207 commit")
          ci = api(f"{repo}/actions/runs/{ci_run}")
          if (ci["head_sha"], ci["event"], ci["status"], ci["conclusion"]) != (source, "workflow_dispatch", "completed", "success"):
              raise SystemExit("Full CI evidence does not match the release source")
          jobs = api(f"{repo}/actions/runs/{ci_run}/jobs?per_page=100&filter=latest")["jobs"]
          good = {job["name"] for job in jobs if job["conclusion"] == "success"}
          expected = {"Format", "Clippy", "Build CI artifacts", "Test", "Teletext 1.5", "Next engine",
                      "Cargo deny", "Documentation links", "CI ok"}
          expected |= {f"Playwright E2E ({suite}, {browser})" for suite in ("general", "1.5")
                       for browser in ("chromium", "firefox")}
          if expected - good:
              raise SystemExit("Missing CI jobs: " + ", ".join(sorted(expected - good)))
          package = api(f"{repo}/actions/runs/{package_run}")
          if (package["head_sha"], package["name"], package["conclusion"]) != (
              os.environ["DELIVERY_SHA"], "Windows-only v1.3.1 release", "success"):
              raise SystemExit("Package run does not match this delivery revision")
          CHECK
      - uses: actions/download-artifact@v8
        with:
          name: v1.3.1-windows-package
          run-id: ${{ inputs.package_run }}
          github-token: ${{ github.token }}
      - name: Create the annotated tag and Windows-only draft
        run: |
          set -euo pipefail
          archive=ersatzrs-v1.3.1-win-x64.zip
          verified_hash=$(jq -er --arg source "$SOURCE_SHA" 'select(.source_sha == $source) | .sha256 | select(test("^[a-f0-9]{64}$"))' package-provenance.json)
          printf '%s  %s\n' "$verified_hash" "$archive" | sha256sum --check
          unzip -tq "$archive"
          tags="repos/$GITHUB_REPOSITORY/git"
          current=$(gh api "$tags/matching-refs/tags/v1.3.1" --jq '.[] | select(.ref == "refs/tags/v1.3.1") | [.object.type, .object.sha] | @tsv')
          if [ -n "$current" ]; then
            IFS=$'	' read -r kind tag_object <<< "$current"
            [[ "$kind" = tag && "$(gh api "$tags/tags/$tag_object" --jq .object.sha)" = "$SOURCE_SHA" ]]
          else
            tag_object=$(gh api "$tags/tags" -f tag=v1.3.1 -f message='v1.3.1 Windows-only release' \
              -f type=commit -f object="$SOURCE_SHA" -f 'tagger[name]=github-actions[bot]' \
              -f 'tagger[email]=41898282+github-actions[bot]@users.noreply.github.com' \
              -f "tagger[date]=$(date -u +%FT%TZ)" --jq .sha)
            gh api "$tags/refs" -f ref=refs/tags/v1.3.1 -f sha="$tag_object" --jq .ref
          fi
          gh release create v1.3.1 "$archive" --verify-tag --draft --title 'ErsatzRS v1.3.1' --repo "$GITHUB_REPOSITORY" --notes "Windows x64 package for the Channel Teletext Atlas and broadcast switch. See PR #207. The package is built from $SOURCE_SHA and reports the source workspace version 1.3.0."
