name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Self-hosted runner shares $CARGO_HOME/bin with the developer
          # shell, so don't let rust-cache prune cargo-leptos /
          # stylance-cli / wasm-bindgen between runs.
          cache-bin: "false"
      - name: Install Stylance CLI
        run: cargo install stylance-cli --version 0.8.2 --locked
      - name: Clippy (default / SQLite)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (MySQL feature)
        run: cargo clippy --workspace --all-targets --features mysql -- -D warnings

  test:
    name: Test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Self-hosted runner shares $CARGO_HOME/bin with the developer
          # shell, so don't let rust-cache prune cargo-leptos /
          # stylance-cli / wasm-bindgen between runs.
          cache-bin: "false"
      - name: Install Stylance CLI
        run: cargo install stylance-cli --version 0.8.2 --locked
      - name: Test (all features)
        run: cargo test --workspace --all-features --lib --bins --tests

  deny:
    name: Cargo deny
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.6 --locked
      - name: Cargo deny
        run: cargo deny --all-features check

  commitlint:
    name: Commit lint
    runs-on: self-hosted
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: ./commitlint.config.cjs

  docs:
    name: Documentation links
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - name: Check Markdown files exist
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f STYLE.md
          test -f ARCHITECTURE.md
          test -f PORTING.md
          test -f docs/README.md
