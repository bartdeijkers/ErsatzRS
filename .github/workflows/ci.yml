name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fmt:
    name: Format
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Stylance CLI
        run: cargo install stylance-cli --version 0.8.0 --locked
      - name: Clippy (default / SQLite)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (MySQL feature)
        run: cargo clippy --workspace --all-targets --features mysql -- -D warnings

  test:
    name: Test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Stylance CLI
        run: cargo install stylance-cli --version 0.8.0 --locked
      - name: Test (all features)
        run: cargo test --workspace --all-features

  deny:
    name: Cargo deny
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2

  commitlint:
    name: Commit lint
    runs-on: self-hosted
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  docs:
    name: Documentation links
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - name: Check Markdown files exist
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f STYLE.md
          test -f ARCHITECTURE.md
          test -f PORTING.md
          test -f docs/README.md
