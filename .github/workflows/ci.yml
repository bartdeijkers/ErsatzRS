name: CI
run-name: ${{ github.event.pull_request.draft && 'CI (Draft)' || inputs.audit_only && 'CI (Audit only)' || inputs.browser_only && inputs.browser_only != 'none' && 'CI (Browser recovery)' || (inputs.teletext_only && inputs.teletext_only != 'none') && 'CI (Teletext only)' || inputs.next_engine_only && inputs.next_case_set == 'subtitle-nul' && 'CI (Next subtitle-NUL recovery)' || inputs.next_engine_only && 'CI (Next engine only)' || inputs.test_only && 'CI (Test only)' || 'CI' }}

on:
  pull_request:
    # Do not add `labeled`: dependency automation applies several routine
    # labels, and each label event would start another full CI run.
    # `ready_for_review` starts the full PR lane once a draft is marked ready;
    # draft pull requests run only the fast lane (see Preflight).
    types: [opened, synchronize, reopened, ready_for_review]
    # No `paths-ignore` here: `main` requires the `CI ok` check, and a
    # workflow that never starts never reports it, which would leave
    # docs-only PRs unmergeable. Preflight instead detects a PR that touches
    # only the non-code paths listed under `push` below and skips the gate,
    # and `CI ok` then reports success for it.
  push:
    branches: [main]
    # Skip the Rust CI gate when a push touches only non-code paths (docs,
    # plans, markdown, images, agent config). The daily progress routine
    # commits doc-only changes directly to main (see
    # docs/automation/daily-progress-routine.md) and validates them locally
    # with `cargo xtask progress check`. A push that also changes anything
    # outside this list (any .rs, Cargo manifest, or .github/ file) still runs
    # CI in full. Applies to push only; pull_request always runs the gate.
    paths-ignore:
      - 'docs/**'
      - 'plans/**'
      - '.claude/**'
      - '.codex/**'
      - '*.md'
      - '**/*.md'
      - '*.png'
      - '**/*.png'
  # Nightly full suite on main (both browsers, every domain). Pull requests run
  # only the domains they touch and a merge whose tree its PR already tested is
  # skipped, so this run is the safety net. Preflight skips it when main's tree
  # already passed a full run.
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      runner:
        description: Runner used for this manual CI run
        type: choice
        required: true
        default: self-hosted
        options:
          - self-hosted
          - github-hosted
      test_only:
        description: Run only the Rust Test job (does not establish full CI acceptance)
        type: boolean
        required: false
        default: false
      audit_only:
        description: Run dependency audit only (does not establish full CI acceptance; incompatible with other focused modes)
        type: boolean
        required: false
        default: false
      next_engine_only:
        description: Run only the Next engine job (does not establish full CI acceptance; incompatible with test_only)
        type: boolean
        required: false
        default: false
      next_case_set:
        description: Bounded Next recovery cases (nondefault requires next_engine_only)
        type: choice
        required: false
        default: all
        options:
          - all
          - subtitle-nul
      teletext_only:
        description: Run selected teletext jobs (2.5/all opt into experimental checks; partial CI)
        type: choice
        required: false
        default: none
        options:
          - none
          - all
          - '1.5'
          - '2.5'
          - 1.5-rust
      browser_only:
        description: Run the bounded recovery case set in selected browsers (partial CI; incompatible with other focused modes)
        type: choice
        required: false
        default: none
        options:
          - none
          - chromium
          - firefox
          - both
      browser_case_set:
        description: Bounded browser recovery cases (nondefault sets require browser_only)
        type: choice
        required: false
        default: fixtures
        options:
          - fixtures
          - channel-preview
          - teletext-1.5
          - teletext-runtime
      reset_target_dir:
        description: Wipe the self-hosted runner's persistent CARGO_TARGET_DIR before building (use if a build looks stale/corrupted)
        type: boolean
        required: false
        default: false
      reuse_artifacts:
        description: Exact local artifact references as JSON (self-hosted focused recovery only; fails closed without rebuilding)
        type: string
        required: false
        default: ''

# Bursty pushing is common here (44% of recent consecutive commits landed
# <10 min apart). On the single self-hosted runner that queues full clippy+test
# cycles nobody waits for, so cancel superseded runs per ref (PR branches and
# main) within each runner pool. Keeping the pools independent also lets the
# on-demand hosted fallback proceed if a self-hosted runner is unavailable,
# and vice versa. Focused repairs use separate groups so they cannot cancel
# a still-running full gate whose unaffected evidence must be preserved.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}-${{ inputs.runner == 'github-hosted' && 'github-hosted' || 'self-hosted' }}${{ github.event_name == 'schedule' && '-nightly' || '' }}${{ inputs.audit_only && '-audit-only' || inputs.browser_only && inputs.browser_only != 'none' && format('-browser-{0}{1}', inputs.browser_only, inputs.browser_case_set && inputs.browser_case_set != 'fixtures' && format('-{0}', inputs.browser_case_set) || '') || (inputs.teletext_only && inputs.teletext_only != 'none') && format('-teletext-{0}', inputs.teletext_only) || inputs.next_engine_only && format('-next-engine-only{0}', inputs.next_case_set == 'subtitle-nul' && '-subtitle-nul' || '') || '' }}
  cancel-in-progress: true

permissions:
  contents: read

# Two self-hosted runners share one persistent machine. Each runner runs its
# jobs serially in its own workspace, so sharing build output across that
# runner's jobs loses no wall-clock parallelism. Point
# CARGO_TARGET_DIR at github.workspace's parent, which the runner creates
# once per repo and actions/checkout's default `git clean -ffdx` does not
# touch (it only cleans inside the checkout itself) — so target/ now
# persists across every job and run on that runner instead of being wiped
# and restored through Swatinem/rust-cache's remote blob service every
# time. Harmless on the GitHub-hosted fallback path: it just relocates
# target/ within the same disposable VM disk. See BUILD.md "CI runner
# selection" for the recovery step if this directory ever looks stale.
env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/../ci-target
  # Same-host runners share the user's cache by default. Other machines safely
  # miss this cache and download the unchanged GitHub artifact instead.
  CI_LOCAL_ARTIFACT_CACHE: ${{ vars.CI_LOCAL_ARTIFACT_CACHE }}
  CI_REUSE_ARTIFACTS: ${{ inputs.reuse_artifacts }}

jobs:
  # A direct fast-forward merge gives main the exact commit a feature-branch
  # run already proved green, so the push-triggered run recompiles and retests
  # a byte-identical tree. Ask the API whether this SHA already has a
  # successful CI run and skip the gate if it does.
  #
  # Push only. A pull_request must be evaluated on its own merge result, and a
  # manual dispatch is an explicit request to re-run. A PR merge commit is a
  # new SHA, so this never skips one. A pull_request is skipped only when it
  # changes nothing but the non-code paths ignored for `push`.
  #
  # Pinned to a hosted runner on purpose: the self-hosted pool is one machine
  # with two runners, and adding a gate job there would charge every run
  # queue time to save a duplicate that is comparatively rare.
  #
  # Preflight also chooses the lane (`outputs.lane`) that the gate jobs and
  # `CI ok` follow:
  #   skip    - already proven SHA, or a docs-only pull request.
  #   light   - draft pull request: Format, Clippy, Build, Test, deny,
  #             commit lint and docs only. `CI ok` fails on purpose so a draft
  #             never carries a passing required check into its ready run.
  #   pr      - ready pull request: the domains it touches
  #             (scripts/ci-domains.py), browsers in Chromium only. A green run
  #             records the tested merge tree as a `ci-tree-<tree>` artifact,
  #             and a push to main with that tree is skipped.
  #   full    - every other push, the nightly run and every manual dispatch:
  #             everything. A green run records `ci-full-<tree>`, and the
  #             nightly run is skipped when main's tree already has one.
  #   A ready pull request whose domains select nothing runs as `skip`.
  preflight:
    name: Preflight
    if: ${{ inputs.audit_only || (!inputs.test_only && !inputs.next_engine_only && (!inputs.teletext_only || inputs.teletext_only == 'none') && (!inputs.browser_only || inputs.browser_only == 'none')) }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.select.outputs.skip || steps.duplicate.outputs.skip }}
      lane: ${{ steps.select.outputs.lane || steps.duplicate.outputs.lane }}
      tree: ${{ steps.duplicate.outputs.tree }}
      # Domain selection of a `pr` lane run. Empty for every other lane, which
      # the jobs read as "run".
      run_next: ${{ steps.select.outputs.run_next }}
      run_teletext: ${{ steps.select.outputs.run_teletext }}
      run_browser: ${{ steps.select.outputs.run_browser }}
      pr_matrix: ${{ steps.select.outputs.pr_matrix }}
      nextest_filter: ${{ steps.select.outputs.nextest_filter }}
      archive_packages: ${{ steps.select.outputs.archive_packages }}
      general_filter: ${{ steps.select.outputs.general_filter }}
      deselected: ${{ steps.select.outputs.deselected }}
    steps:
      - name: Reject mixed audit mode
        if: ${{ inputs.audit_only && (inputs.test_only || inputs.next_engine_only || (inputs.teletext_only && inputs.teletext_only != 'none') || (inputs.browser_only && inputs.browser_only != 'none') || (inputs.browser_case_set && inputs.browser_case_set != 'fixtures') || inputs.reuse_artifacts || (inputs.next_case_set && inputs.next_case_set != 'all')) }}
        run: |
          echo "::error::audit_only cannot be combined with another focused CI mode"
          exit 1
      - name: Reject unfocused artifact reuse
        if: ${{ inputs.reuse_artifacts && !inputs.test_only && !inputs.next_engine_only && (!inputs.teletext_only || inputs.teletext_only == 'none') && (!inputs.browser_only || inputs.browser_only == 'none') }}
        run: |
          echo "::error::artifact reuse is restricted to an explicit focused recovery"
          exit 1
      - id: duplicate
        uses: actions/github-script@v9
        with:
          script: |
            const lane = (name) => {
              core.setOutput('lane', name);
              core.setOutput('skip', name === 'skip' ? 'true' : 'false');
            };
            // The full lane records its tree so the nightly run can skip it.
            const full = async () => {
              lane('full');
              core.setOutput('tree', await treeOf(context.sha));
            };
            const treeOf = async (sha) => (await github.rest.git.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
            })).data.tree.sha;
            if (context.eventName === 'pull_request') {
              // Mirrors the `push` paths-ignore list. Any file outside it,
              // including a rename from outside it, runs the full gate.
              const nonCode = (path) => /^(docs|plans|\.claude|\.codex)\//.test(path)
                || /\.(md|png)$/.test(path);
              const files = await github.paginate(
                github.rest.pulls.listFiles,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  per_page: 100,
                },
              );
              const docsOnly = files.length > 0 && files.every(
                (file) => nonCode(file.filename)
                  && (!file.previous_filename || nonCode(file.previous_filename)),
              );
              if (docsOnly) {
                lane('skip');
                core.notice('This pull request changes only non-code paths; skipping the gate.');
              } else if (context.payload.pull_request.draft) {
                lane('light');
                core.notice('Draft pull request: fast lane only. Mark it ready for review to run the full PR lane.');
              } else {
                lane('pr');
                // context.sha is the merge commit this run tests.
                core.setOutput('tree', await treeOf(context.sha));
                const changed = new Set();
                for (const file of files) {
                  changed.add(file.filename);
                  if (file.previous_filename) changed.add(file.previous_filename);
                }
                require('fs').writeFileSync(
                  `${process.env.RUNNER_TEMP}/changed-files.txt`, [...changed].join('\n') + '\n',
                );
                core.info('pull_request runs the PR lane (touched domains, browsers in Chromium only).');
              }
              return;
            }
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            // A `ci-tree-<tree>` / `ci-full-<tree>` marker is uploaded by
            // `CI ok` only after every selected job passed.
            const provenBy = async (prefix, tree, events) => {
              const artifacts = await github.paginate(
                github.rest.actions.listArtifactsForRepo,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: `${prefix}-${tree}`,
                  per_page: 100,
                },
              );
              for (const artifact of artifacts) {
                if (artifact.expired || !artifact.workflow_run) continue;
                const run = (await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: artifact.workflow_run.id,
                })).data;
                if (run.path !== '.github/workflows/ci.yml' || !events.includes(run.event)
                  || run.head_repository?.full_name !== repository
                  || (run.conclusion && run.conclusion !== 'success')) continue;
                return run;
              }
              return null;
            };
            if (context.eventName === 'schedule') {
              const tree = await treeOf(context.sha);
              const run = await provenBy('ci-full', tree, ['push', 'schedule', 'workflow_dispatch']);
              if (run) {
                lane('skip');
                core.notice(`Tree ${tree} already passed a full run (${run.html_url}); skipping the nightly run.`);
              } else {
                await full();
              }
              return;
            }
            if (context.eventName !== 'push') {
              await full();
              core.info(`${context.eventName} runs the selected gate.`);
              return;
            }
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                head_sha: context.sha,
                per_page: 100,
              },
            );
            // Pull request runs test a merge commit, not their head SHA, and
            // do not run every job; only push or dispatch runs prove a SHA.
            const proven = runs.filter(
              (run) => run.id !== context.runId && run.conclusion === 'success'
                && run.event !== 'pull_request'
                && run.display_title !== 'CI (Test only)'
                && run.display_title !== 'CI (Next engine only)'
                && run.display_title !== 'CI (Teletext only)'
                && run.display_title !== 'CI (Browser recovery)'
                && run.display_title !== 'CI (Audit only)',
            );
            if (proven.length > 0) {
              lane('skip');
              const links = proven.map((run) => run.html_url).join(', ');
              core.notice(
                `${context.sha} already passed CI (${links}); skipping this duplicate run.`,
              );
              return;
            }
            // A merged pull request lands as a new SHA, but often with the
            // exact tree its PR lane already tested. The nightly full run
            // covers the domains and Firefox jobs that lane left out.
            const tree = await treeOf(context.sha);
            const run = await provenBy('ci-tree', tree, ['pull_request']);
            if (run) {
              lane('skip');
              core.notice(
                `Tree ${tree} already passed the PR lane (${run.html_url}); skipping this run. The nightly run covers the rest.`,
              );
              return;
            }
            await full();
      - uses: actions/checkout@v7
        if: ${{ steps.duplicate.outputs.lane == 'pr' }}
        with:
          # Cone mode always includes root files such as Cargo.toml.
          sparse-checkout: |
            scripts
            tests/e2e
      - id: select
        name: Select touched domains
        if: ${{ steps.duplicate.outputs.lane == 'pr' }}
        run: |
          python3 scripts/ci-domains.py select "$RUNNER_TEMP/changed-files.txt" > "$RUNNER_TEMP/selection.json"
          python3 - "$RUNNER_TEMP/selection.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          s = json.load(open(sys.argv[1]))
          print(json.dumps(s, indent=1), file=sys.stderr)
          general = s["general_specs"] == "all" or bool(s["general_specs"])
          rows = []
          if general:
              rows.append({"suite": "general", "project": "chromium", "port": "18409"})
          if s["teletext_browser"]:
              rows.append({"suite": "1.5", "project": "chromium", "port": "18411"})
          deselected = [job for job, on in (("next_engine", s["next"]), ("teletext", s["teletext_rust"]),
                                            ("hydration", bool(rows))) if not on]
          nothing = not (s["rust_packages"] or rows)
          print(f"lane={'skip' if nothing else 'pr'}")
          print(f"skip={'true' if nothing else 'false'}")
          print(f"run_next={str(s['next']).lower()}")
          print(f"run_teletext={str(s['teletext_rust']).lower()}")
          print(f"run_browser={str(bool(rows)).lower()}")
          print("pr_matrix=" + json.dumps({"include": rows}, separators=(",", ":")))
          print(f"nextest_filter={s['nextest_filter']}")
          print("archive_packages=" + " ".join(s["archive_packages"]))
          print(f"general_filter={s['general_filter']}")
          print("deselected=" + json.dumps(deselected, separators=(",", ":")))
          PY
          {
            echo "### Selected CI domains"
            echo '```json'
            cat "$RUNNER_TEMP/selection.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  fmt:
    name: Format
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ${{ fromJSON(inputs.runner == 'github-hosted' && '"ubuntu-24.04"' || '["self-hosted","Linux"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Compare new Clippy allows with the PR base or push predecessor.
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: cargo fmt --all -- --check
      - name: Focused audit selection safeguards
        if: ${{ inputs.audit_only }}
        run: python3 scripts/ci-build-artifacts_test.py
      - name: New Clippy allow policy
        env:
          CLIPPY_ALLOW_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          base="$CLIPPY_ALLOW_BASE"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="HEAD^"
          fi
          python3 scripts/check_new_clippy_allows.py --base "$base"

  clippy:
    name: Clippy
    runs-on: ${{ fromJSON(inputs.runner == 'github-hosted' && '"ubuntu-24.04"' || '["self-hosted","Linux"]') }}
    # Gate on the fast fmt job so a formatting failure doesn't burn a full
    # clippy build on the serial self-hosted runner.
    needs: [preflight, fmt]
    if: ${{ !inputs.audit_only }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Reset persistent target-dir (manual escape hatch)
        if: ${{ inputs.reset_target_dir == true }}
        run: rm -rf "$CARGO_TARGET_DIR"
      # Only needed on the GitHub-hosted fallback path: self-hosted jobs
      # reuse the persistent CARGO_TARGET_DIR set at workflow level instead
      # (see the comment above `env:`), so restoring a remote cache on top
      # of it there would risk overwriting fresher local objects with a
      # staler blob for no benefit.
      - uses: Swatinem/rust-cache@v2
        if: ${{ inputs.runner == 'github-hosted' }}
        with:
          # Self-hosted runner shares $CARGO_HOME/bin with the developer
          # shell, so don't let rust-cache prune cargo-leptos /
          # stylance-cli / wasm-bindgen between runs.
          cache-bin: "false"
      - name: Install Stylance CLI
        run: |
          if ! command -v stylance >/dev/null 2>&1 || [ "$(stylance --version)" != "stylance-cli 0.8.2" ]; then
            cargo install stylance-cli --version 0.8.2 --locked
          fi
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: ${{ inputs.reuse_artifacts && 'Verify reused CI artifacts' || 'Build CI artifacts' }}
    needs: [preflight, fmt]
    if: ${{ always() && !cancelled() && !inputs.audit_only && (needs.fmt.result == 'success' || inputs.test_only || inputs.next_engine_only || (inputs.teletext_only && inputs.teletext_only != 'none') || (inputs.browser_only && inputs.browser_only != 'none')) }}
    runs-on: ${{ fromJSON(inputs.runner == 'github-hosted' && '"ubuntu-24.04"' || '["self-hosted","Linux","X64"]') }}
    timeout-minutes: 120
    outputs:
      rust_artifact: ${{ steps.identity.outputs.rust_artifact }}
      web_artifact: ${{ steps.identity.outputs.web_artifact }}
      rust_cache_key: ${{ steps.reuse.outputs.rust_cache_key || steps.identity.outputs.rust_cache_key }}
      web_cache_key: ${{ steps.reuse.outputs.web_cache_key || steps.identity.outputs.web_cache_key }}
      rust_digest: ${{ steps.reuse.outputs.rust_digest || steps.identity.outputs.rust_digest }}
      web_digest: ${{ steps.reuse.outputs.web_digest || steps.identity.outputs.web_digest }}
      rust_source_sha: ${{ steps.reuse.outputs.rust_source_sha || github.sha }}
      web_source_sha: ${{ steps.reuse.outputs.web_source_sha || github.sha }}
    env:
      # Kether V (Ryzen 9 5900X, 24 threads, 64 GB) hosts both self-hosted
      # runners: 6 jobs each leaves half the threads free when both build.
      CARGO_BUILD_JOBS: ${{ inputs.runner == 'github-hosted' && '4' || '6' }}
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: ${{ inputs.runner == 'github-hosted' && '-C link-arg=-fuse-ld=lld' || '' }}
      LEPTOS_OUTPUT_NAME: ersatzrs-web
      LEPTOS_HASH_FILES: "false"
      ARCHIVE_PACKAGES: ${{ needs.preflight.outputs.archive_packages }}
      BUILD_RUST: ${{ !inputs.reuse_artifacts && (!inputs.browser_only || inputs.browser_only == 'none') }}
      BUILD_WEB: ${{ !inputs.reuse_artifacts && !inputs.test_only && !inputs.next_engine_only && inputs.teletext_only != '1.5-rust' }}
    steps:
      - name: Validate dispatch mode
        env:
          TEST_ONLY: ${{ inputs.test_only }}
          NEXT_ONLY: ${{ inputs.next_engine_only }}
          NEXT_CASE_SET: ${{ inputs.next_case_set || 'all' }}
          TELETEXT_ONLY: ${{ inputs.teletext_only }}
          BROWSER_ONLY: ${{ inputs.browser_only }}
          BROWSER_CASE_SET: ${{ inputs.browser_case_set || 'fixtures' }}
          REUSE_ARTIFACTS: ${{ inputs.reuse_artifacts }}
          RUNNER_POOL: ${{ inputs.runner }}
          RESET_TARGET_DIR: ${{ inputs.reset_target_dir }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          modes = [os.environ[key] == 'true' for key in ('TEST_ONLY', 'NEXT_ONLY')]
          modes += [os.environ[key] not in ('', 'none') for key in ('TELETEXT_ONLY', 'BROWSER_ONLY')]
          if sum(modes) > 1:
              raise SystemExit('Focused CI modes are mutually exclusive')
          next_case_set = os.environ.get('NEXT_CASE_SET', 'all')
          if next_case_set not in ('all', 'subtitle-nul'):
              raise SystemExit('Unknown Next recovery case set')
          if next_case_set != 'all' and os.environ['NEXT_ONLY'] != 'true':
              raise SystemExit('Next recovery case set requires next_engine_only')
          case_set = os.environ['BROWSER_CASE_SET']
          if case_set not in ('fixtures', 'channel-preview', 'teletext-1.5', 'teletext-runtime'):
              raise SystemExit('Unknown browser recovery case set')
          if case_set != 'fixtures' and os.environ['BROWSER_ONLY'] in ('', 'none'):
              raise SystemExit('Browser recovery case set requires browser_only')
          if os.environ.get('REUSE_ARTIFACTS'):
              if sum(modes) != 1 or os.environ.get('RUNNER_POOL') != 'self-hosted' or os.environ.get('RESET_TARGET_DIR') == 'true':
                  raise SystemExit('Artifact reuse requires one self-hosted focused mode without target reset')
              if not isinstance(json.loads(os.environ['REUSE_ARTIFACTS']), dict):
                  raise SystemExit('Artifact reuse references must be a JSON object')
          PYCODE
      - uses: actions/checkout@v7
      - name: Reuse verified CI artifacts
        id: reuse
        if: ${{ inputs.reuse_artifacts != '' }}
        env:
          REUSE_KINDS: ${{ inputs.browser_only && inputs.browser_only != 'none' && 'web' || (inputs.test_only || inputs.next_engine_only || inputs.teletext_only == '1.5-rust') && 'rust' || 'rust web' }}
        run: |
          mkdir -p ci-artifacts
          for kind in $REUSE_KINDS; do
            python3 scripts/ci-build-artifacts.py reuse --kind "$kind" --sha "$GITHUB_SHA" \
              --archive "ci-artifacts/$kind.tar.gz" --output-file "$GITHUB_OUTPUT"
          done
      - uses: dtolnay/rust-toolchain@1.97.1
        if: ${{ !inputs.reuse_artifacts }}
        with:
          targets: wasm32-unknown-unknown
      - name: Reset persistent target-dir (manual escape hatch)
        if: ${{ inputs.reset_target_dir == true && !inputs.reuse_artifacts }}
        run: rm -rf "$CARGO_TARGET_DIR"
      - uses: Swatinem/rust-cache@v2
        if: ${{ inputs.runner == 'github-hosted' && !inputs.reuse_artifacts }}
        with:
          key: ci-build
          cache-bin: "true"
      - name: Install LLVM linker
        if: ${{ inputs.runner == 'github-hosted' && !inputs.reuse_artifacts }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes lld
      - name: Install build tools
        if: ${{ !inputs.reuse_artifacts }}
        run: |
          if ! command -v stylance >/dev/null 2>&1 || [ "$(stylance --version)" != "stylance-cli 0.8.2" ]; then
            cargo install stylance-cli --version 0.8.2 --locked
          fi
          if ! command -v cargo-nextest >/dev/null 2>&1 || [[ "$(cargo nextest --version)" != cargo-nextest\ 0.9.140* ]]; then
            cargo install cargo-nextest --version 0.9.140 --locked
          fi
          if [[ "$BUILD_WEB" == 'true' ]] && { ! command -v cargo-leptos >/dev/null 2>&1 || [ "$(cargo leptos --version)" != "cargo-leptos 0.3.6" ]; }; then
            cargo install cargo-leptos --version 0.3.6 --locked
          fi
      - name: Build CI helper executables
        if: ${{ !inputs.reuse_artifacts }}
        run: |
          git diff --exit-code
          echo "Runner hardware: $(nproc) threads, CARGO_BUILD_JOBS=$CARGO_BUILD_JOBS"
          free -g || true
          df -h "$GITHUB_WORKSPACE/.." || true
          cargo build --locked -p xtask --bin xtask
          "$CARGO_TARGET_DIR/debug/xtask" target-size
          cargo build --locked -p ersatzrs-ffmpeg --example provision_runtime
          mkdir -p ci-artifacts/build-rust/bin ci-artifacts/build-web/bin
          for kind in rust web; do
            cp "$CARGO_TARGET_DIR/debug/xtask" "ci-artifacts/build-$kind/bin/xtask"
            cp "$CARGO_TARGET_DIR/debug/examples/provision_runtime" "ci-artifacts/build-$kind/bin/provision_runtime"
          done
      - name: Archive Rust tests and ordinary smoke server
        if: env.BUILD_RUST == 'true'
        run: |
          cargo build --locked --bin ersatzrs-web
          cp "$CARGO_TARGET_DIR/debug/ersatzrs-web" ci-artifacts/build-rust/bin/ersatzrs-web-smoke
          cp "$(command -v cargo-nextest)" ci-artifacts/build-rust/bin/cargo-nextest
          # A `pr` lane run archives only the selected crates and every crate
          # depending on them; every other run archives the whole workspace.
          scope=(--workspace)
          if [[ -n "$ARCHIVE_PACKAGES" ]]; then
            cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/metadata.json"
            scope=()
            for package in $(python3 scripts/ci-domains.py closure "$RUNNER_TEMP/metadata.json" $ARCHIVE_PACKAGES); do
              scope+=(--package "$package")
            done
          fi
          echo "nextest archive scope: ${scope[*]}"
          cargo nextest archive --locked "${scope[@]}" --lib --bins --tests --archive-file ci-artifacts/build-rust/nextest.tar.zst
          python3 scripts/ci-build-artifacts.py pack --kind rust --directory ci-artifacts/build-rust \
            --archive ci-artifacts/rust.tar.gz --sha "$GITHUB_SHA"
      - name: Build matched server and complete Leptos site
        if: env.BUILD_WEB == 'true'
        env:
          # Native lld flags must never reach the wasm32 linker.
          RUSTFLAGS: ""
          LEPTOS_SITE_ROOT: ${{ github.workspace }}/ci-artifacts/build-web/site
        run: |
          (cd crates/ersatzrs-web && stylance . --output-file public/bundle.css && cargo leptos build)
          cp "$CARGO_TARGET_DIR/debug/ersatzrs-web" ci-artifacts/build-web/bin/ersatzrs-web
          cp -R crates/ersatzrs-web/public/. ci-artifacts/build-web/site/
          python3 scripts/ci-build-artifacts.py pack --kind web --directory ci-artifacts/build-web \
            --archive ci-artifacts/web.tar.gz --sha "$GITHUB_SHA"
      - name: Record immutable artifact names
        id: identity
        if: ${{ !inputs.reuse_artifacts }}
        run: |
          echo "rust_artifact=ci-rust-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "web_artifact=ci-web-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          for artifact_kind in rust web; do
            if [[ -f "ci-artifacts/$artifact_kind.tar.gz" ]]; then
              artifact_digest=$(sha256sum "ci-artifacts/$artifact_kind.tar.gz")
              artifact_digest=${artifact_digest%% *}
              echo "${artifact_kind}_digest=$artifact_digest" >> "$GITHUB_OUTPUT"
              echo "${artifact_kind}_cache_key=$GITHUB_REPOSITORY_ID-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$artifact_kind" >> "$GITHUB_OUTPUT"
            fi
          done
      - name: Publish local Rust artifact
        if: ${{ inputs.runner != 'github-hosted' && env.BUILD_RUST == 'true' }}
        env:
          CI_ARTIFACT_KEY: ${{ steps.identity.outputs.rust_cache_key }}
        run: |
          python3 scripts/ci-build-artifacts.py publish-local --kind rust --archive ci-artifacts/rust.tar.gz \
            --sha "$GITHUB_SHA" --cache-key "$CI_ARTIFACT_KEY"
      - name: Publish local web artifact
        if: ${{ inputs.runner != 'github-hosted' && env.BUILD_WEB == 'true' }}
        env:
          CI_ARTIFACT_KEY: ${{ steps.identity.outputs.web_cache_key }}
        run: |
          python3 scripts/ci-build-artifacts.py publish-local --kind web --archive ci-artifacts/web.tar.gz \
            --sha "$GITHUB_SHA" --cache-key "$CI_ARTIFACT_KEY"
      - uses: actions/upload-artifact@v7
        if: env.BUILD_RUST == 'true'
        with:
          name: ${{ steps.identity.outputs.rust_artifact }}
          path: ci-artifacts/rust.tar.gz
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: env.BUILD_WEB == 'true'
        with:
          name: ${{ steps.identity.outputs.web_artifact }}
          path: ci-artifacts/web.tar.gz
          compression-level: 0
          retention-days: 7
      - name: Bound completed self-hosted build cache
        if: ${{ inputs.runner != 'github-hosted' && !inputs.reuse_artifacts }}
        run: |
          # All consumers use uploaded/local immutable copies, never this target.
          cache_kib=$(du -sk -- "$CARGO_TARGET_DIR" | awk '{print $1}')
          cache_limit_gib="${ERSATZRS_TARGET_CLEAN_THRESHOLD_GIB:-60}"
          [[ "$cache_limit_gib" =~ ^[0-9]+$ ]]
          # The second runner lives on a 100 GB disk: also clean when less than
          # 20 GiB stays free, whatever the cache size.
          free_kib=$(df -Pk -- "$CARGO_TARGET_DIR" | awk 'NR==2 {print $4}')
          if (( cache_kib >= cache_limit_gib * 1024 * 1024 || free_kib < 20 * 1024 * 1024 )); then
            echo "Completed build cache is ${cache_kib} KiB with ${free_kib} KiB free; freeing it before consumers restore artifacts."
            cargo clean
          fi

  test:
    name: Test
    needs: [preflight, build]
    if: ${{ always() && !cancelled() && needs.build.result == 'success' && !inputs.next_engine_only && (!inputs.teletext_only || inputs.teletext_only == 'none') && (!inputs.browser_only || inputs.browser_only == 'none') }}
    runs-on: ${{ fromJSON(inputs.runner == 'github-hosted' && '"ubuntu-24.04"' || '["self-hosted","Linux","X64"]') }}
    env:
      NEXTEST_TEST_THREADS: "4"
      # Set only by a `pr` lane run: the touched crates and their dependents.
      NEXTEST_FILTER: ${{ needs.preflight.outputs.nextest_filter }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch local rust artifact
        id: local_artifact
        if: ${{ inputs.runner != 'github-hosted' }}
        env:
          CI_ARTIFACT_KEY: ${{ needs.build.outputs.rust_cache_key }}
          CI_ARTIFACT_DIGEST: ${{ needs.build.outputs.rust_digest }}
        run: |
          python3 scripts/ci-build-artifacts.py fetch-local --kind rust --archive ci-input/rust.tar.gz \
            --sha "$GITHUB_SHA" --cache-key "$CI_ARTIFACT_KEY" --expected-digest "$CI_ARTIFACT_DIGEST" \
            --output-file "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        if: ${{ !inputs.reuse_artifacts && steps.local_artifact.outputs.hit != 'true' }}
        with:
          name: ${{ needs.build.outputs.rust_artifact }}
          path: ci-input
      - name: Restore verified Rust build
        run: |
          python3 scripts/ci-build-artifacts.py restore --kind rust --archive ci-input/rust.tar.gz \
            --directory "$RUNNER_TEMP/ci-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB" \
            --sha "$GITHUB_SHA" --env-file "$GITHUB_ENV"
      - name: General Rust regressions
        run: |
          # A `pr` lane run narrows the selection to the touched crates and
          # every crate that depends on them; other lanes run it whole.
          "$CI_NEXTEST" nextest run --archive-file "$CI_NEXTEST_ARCHIVE" --workspace-remap "$GITHUB_WORKSPACE" \
            --profile ci --no-tests pass \
            -E "($(python3 scripts/ci-teletext-selection.py rust general)) & (${NEXTEST_FILTER:-all()})"
      - name: Collect test timings
        if: always()
        run: |
          mkdir -p ci-artifacts
          report="target/nextest/ci/junit.xml"
          if [ ! -f "$report" ]; then report="$CARGO_TARGET_DIR/nextest/ci/junit.xml"; fi
          if [ -f "$report" ]; then cp "$report" ci-artifacts/junit.xml; fi
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/junit.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Validate progress index and architecture boundaries
        run: |
          "$CI_XTASK" progress check
          "$CI_XTASK" architecture-lint

  next_engine:
    name: Next engine
    defaults:
      run:
        shell: bash
    runs-on: ${{ fromJSON(inputs.runner == 'github-hosted' && '"ubuntu-24.04"' || '["self-hosted","Linux","X64"]') }}
    needs: [preflight, build]
    if: ${{ always() && !cancelled() && needs.build.result == 'success' && needs.preflight.outputs.lane != 'light' && needs.preflight.outputs.run_next != 'false' && !inputs.test_only && (!inputs.teletext_only || inputs.teletext_only == 'none') && (!inputs.browser_only || inputs.browser_only == 'none') }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: ${{ inputs.runner == 'github-hosted' && '8' || '2' }}
      # Runtime fixtures share channel1's report path in this owned app-data root.
      NEXTEST_TEST_THREADS: "1"
      ERSATZRS_FFMPEG_RELEASE_TAG: 2.0.9
    steps:
      - uses: actions/checkout@v7
      - name: Fetch local rust artifact
        id: local_artifact
        if: ${{ inputs.runner != 'github-hosted' }}
        env:
          CI_ARTIFACT_KEY: ${{ needs.build.outputs.rust_cache_key }}
          CI_ARTIFACT_DIGEST: ${{ needs.build.outputs.rust_digest }}
        run: |
          python3 scripts/ci-build-artifacts.py fetch-local --kind rust --archive ci-input/rust.tar.gz \
            --sha "$GITHUB_SHA" --cache-key "$CI_ARTIFACT_KEY" --expected-digest "$CI_ARTIFACT_DIGEST" \
            --output-file "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        if: ${{ !inputs.reuse_artifacts && steps.local_artifact.outputs.hit != 'true' }}
        with:
          name: ${{ needs.build.outputs.rust_artifact }}
          path: ci-input
      - name: Restore verified Rust build
        run: |
          python3 scripts/ci-build-artifacts.py restore --kind rust --archive ci-input/rust.tar.gz \
            --directory "$RUNNER_TEMP/ci-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB" \
            --sha "$GITHUB_SHA" --env-file "$GITHUB_ENV"
      - name: Prepare isolated runtime and diagnostics
        run: |
          mkdir -p ci-artifacts/next-engine
          runtime_tmp="$RUNNER_TEMP/next-engine-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$runtime_tmp/app-data"
          echo "TMPDIR=$runtime_tmp" >> "$GITHUB_ENV"
          echo "ERSATZRS_APP_DATA_DIR=$runtime_tmp/app-data" >> "$GITHUB_ENV"
          git rev-parse HEAD > ci-artifacts/next-engine/ersatzrs-sha.txt
          rm -f target/nextest/ci/junit.xml "$CARGO_TARGET_DIR/nextest/ci/junit.xml"
      - name: Stage Next and validated FFmpeg runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Retain every reviewed archive for inventory and real acquisition/health tests.
          python3 - <<'PYCODE' | tee ci-artifacts/next-engine/next-runtime.log
          import importlib.util, os, pathlib, shutil
          spec = importlib.util.spec_from_file_location('stage_next', 'scripts/release/stage-next.py')
          stage = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(stage)
          manifest = pathlib.Path(stage.__file__).resolve().parent / 'next-patches/manifest.json'
          packages = pathlib.Path(os.environ['TMPDIR']) / 'next-packages'
          packages.mkdir()
          shutil.copyfile(manifest, packages / 'manifest.json')
          for rid, package in sorted(stage.MANIFEST['runtime_packages'].items()):
              archive = packages / package['asset']
              archive.write_bytes(stage.download(stage.package_url(rid), stage.MAX_ARCHIVE))
              output = pathlib.Path(os.environ['TMPDIR']) / ('next' if rid == 'linux-x64' else f'next-verified-{rid}')
              stage.stage_patched_snapshot(rid, output, archive)
          asset = stage.MANIFEST['runtime_packages']['linux-x64']['asset']
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'ERSATZRS_NEXT_TEST_PACKAGE_ARCHIVE={packages / asset}\n')
              env.write(f'ERSATZRS_NEXT_TEST_PACKAGE_MANIFEST={manifest}\n')
              env.write(f'NEXT_CANDIDATE_PACKAGES={packages}\n')
          PYCODE
          cp "$TMPDIR/next/origin.json" ci-artifacts/next-engine/next-origin.json
          sha256sum "$TMPDIR/next/ersatztv-channel" > ci-artifacts/next-engine/next-sha256.txt
          echo "ETV_NEXT_FOLDER=$TMPDIR/next" >> "$GITHUB_ENV"
          echo "ERSATZRS_NEXT_TEST_BIN=$TMPDIR/next/ersatztv-channel" >> "$GITHUB_ENV"
          "$CI_PROVISION_RUNTIME" "$TMPDIR/ffmpeg" "$GITHUB_ENV" | tee ci-artifacts/next-engine/ffmpeg-runtime.log
          python3 scripts/e2e/stage-rtsp-test-server.py --output "$TMPDIR/rtsp-server" | tee ci-artifacts/next-engine/rtsp-test-server.log
          echo "ERSATZRS_NEXT_TEST_RTSP_SERVER=$TMPDIR/rtsp-server/mediamtx" >> "$GITHUB_ENV"
      - name: Next components, real-engine decoding and HTTP EOF
        env:
          NEXT_CASE_SET: ${{ inputs.next_case_set || 'all' }}
        run: |
          "$CI_NEXTEST" nextest run --archive-file "$CI_NEXTEST_ARCHIVE" --workspace-remap "$GITHUB_WORKSPACE" --profile ci --run-ignored all -E "$(python3 scripts/ci-teletext-selection.py next-recovery "$NEXT_CASE_SET") & (package(=ersatzrs-infra) | package(=ersatzrs-web)) & kind(lib)" 2>&1 | tee ci-artifacts/next-engine/tests.log
      - name: Next HTTP playback, burned subtitles and preview
        run: |
          smoke_port="$(python3 -c 'import socket; sock = socket.socket(); sock.bind(("127.0.0.1", 0)); print(sock.getsockname()[1]); sock.close()')"
          ERSATZRS_SMOKE_PORT="$smoke_port" "$CI_XTASK" smoke --server-bin "$CI_SMOKE_SERVER" --next --hls-lifecycle --keep-temp 2>&1 | tee ci-artifacts/next-engine/smoke.log
      - name: Next Hybrid playback with converted subtitles
        run: |
          smoke_port="$(python3 -c 'import socket; sock = socket.socket(); sock.bind(("127.0.0.1", 0)); print(sock.getsockname()[1]); sock.close()')"
          ERSATZRS_SMOKE_PORT="$smoke_port" "$CI_XTASK" smoke --server-bin "$CI_SMOKE_SERVER" --next-convert --keep-temp 2>&1 | tee ci-artifacts/next-engine/smoke-convert.log
      - name: Collect Next diagnostics
        if: always()
        run: |
          python3 - <<'PYCODE'
          import os, pathlib, shutil
          destination = pathlib.Path('ci-artifacts/next-engine')
          destination.mkdir(parents=True, exist_ok=True)
          for root in (pathlib.Path('target/nextest'), pathlib.Path(os.environ['CARGO_TARGET_DIR']) / 'nextest'):
              report = root / 'ci/junit.xml'
              if report.is_file():
                  shutil.copyfile(report, destination / 'junit.xml')
          runtime = pathlib.Path(os.environ.get('TMPDIR', os.environ['RUNNER_TEMP']))
          for index, log in enumerate(runtime.glob('ersatzrs-smoke-*/ersatzrs-web-smoke.log')):
              shutil.copyfile(log, destination / f'host-{index}.log')
          for index, log in enumerate(sorted(runtime.glob('.tmp*/session.log'))):
              shutil.copyfile(log, destination / f'runtime-session-{index}.log')
          if data := os.environ.get('ERSATZRS_APP_DATA_DIR'):
              reports = pathlib.Path(data) / 'ffmpeg-reports'
              if reports.is_dir():
                  shutil.copytree(reports, destination / 'ffmpeg-reports', dirs_exist_ok=True)
          PYCODE
      - name: Upload Next diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: next-engine-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/next-engine/
          if-no-files-found: warn
          retention-days: 14

  teletext:
    name: Teletext ${{ matrix.level }}
    defaults:
      run:
        shell: bash
    runs-on: ${{ fromJSON(inputs.runner == 'github-hosted' && '"ubuntu-24.04"' || '["self-hosted","Linux","X64"]') }}
    needs: [preflight, build]
    if: ${{ always() && !cancelled() && needs.build.result == 'success' && needs.preflight.outputs.lane != 'light' && needs.preflight.outputs.run_teletext != 'false' && !inputs.test_only && !inputs.next_engine_only && (!inputs.browser_only || inputs.browser_only == 'none') }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        level: ${{ fromJSON(inputs.teletext_only == 'all' && '["1.5","2.5"]' || inputs.teletext_only == '2.5' && '["2.5"]' || '["1.5"]') }}
    env:
      CARGO_BUILD_JOBS: "1"
      TELETEXT_LEVEL: ${{ matrix.level }}
      NEXTEST_TEST_THREADS: "4"
      ERSATZRS_FFMPEG_RELEASE_TAG: 2.0.9
    steps:
      - uses: actions/checkout@v7
      - name: Fetch local rust artifact
        id: local_artifact
        if: ${{ inputs.runner != 'github-hosted' }}
        env:
          CI_ARTIFACT_KEY: ${{ needs.build.outputs.rust_cache_key }}
          CI_ARTIFACT_DIGEST: ${{ needs.build.outputs.rust_digest }}
        run: |
          python3 scripts/ci-build-artifacts.py fetch-local --kind rust --archive ci-input/rust.tar.gz \
            --sha "$GITHUB_SHA" --cache-key "$CI_ARTIFACT_KEY" --expected-digest "$CI_ARTIFACT_DIGEST" \
            --output-file "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        if: ${{ !inputs.reuse_artifacts && steps.local_artifact.outputs.hit != 'true' }}
        with:
          name: ${{ needs.build.outputs.rust_artifact }}
          path: ci-input
      - name: Restore verified Rust build
        run: |
          python3 scripts/ci-build-artifacts.py restore --kind rust --archive ci-input/rust.tar.gz \
            --directory "$RUNNER_TEMP/ci-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB" \
            --sha "$GITHUB_SHA" --env-file "$GITHUB_ENV"
      - name: Prepare isolated runtime and diagnostics
        run: |
          mkdir -p ci-artifacts/teletext-${{ matrix.level }}
          runtime_tmp="$RUNNER_TEMP/teletext-${{ matrix.level }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$runtime_tmp"
          echo "TMPDIR=$runtime_tmp" >> "$GITHUB_ENV"
          git rev-parse HEAD > ci-artifacts/teletext-${{ matrix.level }}/ersatzrs-sha.txt
          rm -f target/nextest/ci/junit.xml "$CARGO_TARGET_DIR/nextest/ci/junit.xml"
      - name: Stage Next and validated FFmpeg runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release/stage-next.py --rid linux-x64 --output "$TMPDIR/next" | tee ci-artifacts/teletext-${{ matrix.level }}/next-runtime.log
          cp "$TMPDIR/next/origin.json" ci-artifacts/teletext-${{ matrix.level }}/next-origin.json
          sha256sum "$TMPDIR/next/ersatztv-channel" > ci-artifacts/teletext-${{ matrix.level }}/next-sha256.txt
          echo "ETV_NEXT_FOLDER=$TMPDIR/next" >> "$GITHUB_ENV"
          echo "ERSATZRS_NEXT_TEST_BIN=$TMPDIR/next/ersatztv-channel" >> "$GITHUB_ENV"
          "$CI_PROVISION_RUNTIME" "$TMPDIR/ffmpeg" "$GITHUB_ENV" | tee ci-artifacts/teletext-${{ matrix.level }}/ffmpeg-runtime.log
          python3 scripts/e2e/stage-rtsp-test-server.py --output "$TMPDIR/rtsp-server" | tee ci-artifacts/teletext-${{ matrix.level }}/rtsp-test-server.log
          echo "ERSATZRS_NEXT_TEST_RTSP_SERVER=$TMPDIR/rtsp-server/mediamtx" >> "$GITHUB_ENV"
      - name: Teletext workspace regressions
        run: |
          "$CI_NEXTEST" nextest run --archive-file "$CI_NEXTEST_ARCHIVE" --workspace-remap "$GITHUB_WORKSPACE" --profile ci -E "$(python3 scripts/ci-teletext-selection.py rust "$TELETEXT_LEVEL")" 2>&1 | tee ci-artifacts/teletext-${{ matrix.level }}/tests.log
      - name: Preserve workspace test timings
        if: always()
        run: |
          report="target/nextest/ci/junit.xml"
          if [ ! -f "$report" ]; then report="$CARGO_TARGET_DIR/nextest/ci/junit.xml"; fi
          if [ -f "$report" ]; then cp "$report" ci-artifacts/teletext-${{ matrix.level }}/workspace-junit.xml; fi
          rm -f target/nextest/ci/junit.xml "$CARGO_TARGET_DIR/nextest/ci/junit.xml"
      - name: Teletext Next runtime regressions
        run: |
          proof_parent="$GITHUB_WORKSPACE/ci-artifacts/teletext-$TELETEXT_LEVEL/source-proofs"
          mkdir -p "$proof_parent"
          export ERSATZRS_NEXT_TELETEXT_PROOF_PARENT="$proof_parent"
          "$CI_NEXTEST" nextest run --archive-file "$CI_NEXTEST_ARCHIVE" --workspace-remap "$GITHUB_WORKSPACE" --profile ci --run-ignored all --no-tests pass -E "$(python3 scripts/ci-teletext-selection.py rust "$TELETEXT_LEVEL" --next-runtime) & (package(=ersatzrs-infra) | package(=ersatzrs-web)) & kind(lib)" 2>&1 | tee ci-artifacts/teletext-${{ matrix.level }}/next-tests.log
      - name: Collect teletext diagnostics
        if: always()
        run: |
          python3 - <<'PYCODE'
          import os, pathlib, shutil
          destination = pathlib.Path('ci-artifacts/teletext-${{ matrix.level }}')
          destination.mkdir(parents=True, exist_ok=True)
          for root in (pathlib.Path('target/nextest'), pathlib.Path(os.environ['CARGO_TARGET_DIR']) / 'nextest'):
              report = root / 'ci/junit.xml'
              if report.is_file():
                  shutil.copyfile(report, destination / 'junit.xml')
          for index, log in enumerate(pathlib.Path(os.environ.get('TMPDIR', os.environ['RUNNER_TEMP'])).glob('ersatzrs-smoke-*/ersatzrs-web-smoke.log')):
              shutil.copyfile(log, destination / f'host-{index}.log')
          PYCODE
      - name: Upload teletext diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: teletext-${{ matrix.level }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/teletext-${{ matrix.level }}/
          if-no-files-found: warn
          retention-days: 14

  hydration:
    name: Playwright E2E (${{ matrix.suite }}, ${{ matrix.project }})
    runs-on: ${{ fromJSON(inputs.runner == 'github-hosted' && '"ubuntu-24.04"' || '["self-hosted","Linux","X64"]') }}
    # Every selected job executes the same verified SSR/WASM build. Browser
    # suites start only after Test passed (or was not selected), so a red
    # Rust run stops before hours of browser time.
    needs: [preflight, build, test]
    if: ${{ always() && !cancelled() && needs.build.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') && needs.preflight.outputs.lane != 'light' && needs.preflight.outputs.run_browser != 'false' && !inputs.test_only && !inputs.next_engine_only && inputs.teletext_only != '1.5-rust' }}
    # Default: general and1.5; experimental2.5 requires teletext_only=2.5/all.
    # One job per selected suite/project. Each suite uses a single worker because
    # it mutates shared application state in its test database (TEST.md): each
    # job runs scripts/e2e/playwright-e2e.sh separately, and that script
    # creates its own temporary database and web host per invocation, so the
    # two projects cannot see each other's state. Splitting by project rather
    # than by `--shard` also keeps every `mode: 'serial'` group whole inside
    # one job.
    #
    # Pull requests (lane `pr`) run Chromium only, and only the suites and
    # specs of the domains they touch; Firefox and the rest run nightly on main
    # (lane `full`) and on manual dispatch.
    #
    # Selected suite/project combinations run serially within this workflow. Both self-hosted
    # runners share one machine, so simultaneous browser suites compete for
    # CPU and memory; an otherwise
    # unexplained Chromium hydration timeout occurred while both overlapped.
    # `max-parallel: 1` removes that contention; `fail-fast: false` still runs
    # the remaining combinations when one fails. It only serializes within one workflow run: a
    # second concurrent run can still overlap. Each project keeps its own port
    # so either runner can take either job.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(inputs.browser_only == 'chromium' && '{"include":[{"suite":"recovery","project":"chromium","port":"18409"}]}' || inputs.browser_only == 'firefox' && '{"include":[{"suite":"recovery","project":"firefox","port":"18410"}]}' || inputs.browser_only == 'both' && '{"include":[{"suite":"recovery","project":"chromium","port":"18409"},{"suite":"recovery","project":"firefox","port":"18410"}]}' || inputs.teletext_only == 'all' && '{"include":[{"suite":"1.5","project":"chromium","port":"18411"},{"suite":"1.5","project":"firefox","port":"18412"},{"suite":"2.5","project":"chromium","port":"18413"},{"suite":"2.5","project":"firefox","port":"18414"}]}' || inputs.teletext_only == '1.5' && '{"include":[{"suite":"1.5","project":"chromium","port":"18411"},{"suite":"1.5","project":"firefox","port":"18412"}]}' || inputs.teletext_only == '2.5' && '{"include":[{"suite":"2.5","project":"chromium","port":"18413"},{"suite":"2.5","project":"firefox","port":"18414"}]}' || needs.preflight.outputs.lane == 'pr' && needs.preflight.outputs.pr_matrix || '{"include":[{"suite":"general","project":"chromium","port":"18409"},{"suite":"general","project":"firefox","port":"18410"},{"suite":"1.5","project":"chromium","port":"18411"},{"suite":"1.5","project":"firefox","port":"18412"}]}') }}
    env:
      # Keep CI independent from the maintainer's live admin server on 8409.
      ERSATZRS_E2E_PORT: ${{ matrix.port }}
      # Keep each project's result JSON and host log separate; both jobs upload
      # from test-results/.
      ERSATZRS_E2E_RESULT_DIR: test-results/${{ matrix.suite }}-${{ matrix.project }}
      ERSATZRS_FFMPEG_RELEASE_TAG: 2.0.9
      # Independently qualified Linux x64 2.0.9 payloads; never infer the
      # expected capability or identity from the Health result under test.
      ERSATZRS_TELETEXT_E2E_ORIGINAL_PTS: "true"
      ERSATZRS_TELETEXT_E2E_FFMPEG_SHA256: 50ee90f724b22c4706e782fa834670cb14539d798e2693f3466c248b724b3eab
      ERSATZRS_TELETEXT_E2E_FFPROBE_SHA256: f61fff7f05e615f22ffe1f5b0ae832d37167d83147a2357f06af9fd97872f85e
    steps:
      - uses: actions/checkout@v7
      - name: Fetch local web artifact
        id: local_artifact
        if: ${{ inputs.runner != 'github-hosted' }}
        env:
          CI_ARTIFACT_KEY: ${{ needs.build.outputs.web_cache_key }}
          CI_ARTIFACT_DIGEST: ${{ needs.build.outputs.web_digest }}
        run: |
          python3 scripts/ci-build-artifacts.py fetch-local --kind web --archive ci-input/web.tar.gz \
            --sha "$GITHUB_SHA" --cache-key "$CI_ARTIFACT_KEY" --expected-digest "$CI_ARTIFACT_DIGEST" \
            --output-file "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        if: ${{ !inputs.reuse_artifacts && steps.local_artifact.outputs.hit != 'true' }}
        with:
          name: ${{ needs.build.outputs.web_artifact }}
          path: ci-input
      - name: Restore verified web build
        run: |
          python3 scripts/ci-build-artifacts.py restore --kind web --archive ci-input/web.tar.gz \
            --directory "$RUNNER_TEMP/ci-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB" \
            --sha "$GITHUB_SHA" --env-file "$GITHUB_ENV"
      - name: Hydration lint
        run: '"$CI_XTASK" hydration-lint -p ersatzrs-web'
      - uses: actions/cache@v6
        if: ${{ inputs.runner == 'github-hosted' }}
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Install web E2E tools
        run: npm ci
      - name: Stage pinned playback runtimes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runtime_tmp="$RUNNER_TEMP/browser-runtime-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.suite }}-${{ matrix.project }}"
          mkdir -p "$runtime_tmp"
          python3 scripts/release/stage-next.py --rid linux-x64 --output "$runtime_tmp/next"
          "$CI_PROVISION_RUNTIME" "$runtime_tmp/ffmpeg" "$GITHUB_ENV"
          echo "ETV_NEXT_FOLDER=$runtime_tmp/next" >> "$GITHUB_ENV"
          echo "ERSATZRS_FFMPEG_DIR=$runtime_tmp/ffmpeg" >> "$GITHUB_ENV"
      - name: Playwright E2E suite or bounded fixture recovery
        env:
          BROWSER_ONLY: ${{ inputs.browser_only }}
          BROWSER_PROJECT: ${{ matrix.project }}
          BROWSER_SUITE: ${{ matrix.suite }}
          BROWSER_CASE_SET: ${{ inputs.browser_case_set || 'fixtures' }}
          PR_GENERAL_FILTER: ${{ needs.preflight.outputs.general_filter }}
          # RUST_LOG also reaches the pinned Next child; preserve its DEBUG diagnostics.
          RUST_LOG: warn,ersatzrs_web=info,ersatzrs_infra::next_engine::diagnostics=debug,ersatztv_channel=debug,ersatztv_core=debug,ersatztv_playout=debug,ffpipeline=debug,ffmpeg=debug
        run: |
          export ErsatzRS_FFMPEG__PATH="$FFMPEG_PATH"
          export ErsatzRS_FFPROBE__PATH="$FFPROBE_PATH"
          ffmpeg_bin_dir="$(dirname "$FFMPEG_PATH")"
          export PATH="$ffmpeg_bin_dir:$PATH"
          playwright_args=(--project="$BROWSER_PROJECT")
          if [[ -n "$BROWSER_ONLY" && "$BROWSER_ONLY" != 'none' ]]; then
            recovery_args="$(python3 scripts/ci-teletext-selection.py browser-recovery "$BROWSER_CASE_SET")"
            mapfile -t selected_cases <<< "$recovery_args"
            playwright_args+=("${selected_cases[@]}")
          elif [[ "$BROWSER_SUITE" == 'general' && -n "$PR_GENERAL_FILTER" ]]; then
            # A `pr` lane run: only the specs of the touched admin areas plus
            # the hydration smoke set (scripts/ci-domains.py).
            playwright_args+=("$PR_GENERAL_FILTER")
          else
            playwright_args+=("$(python3 scripts/ci-teletext-selection.py browser "$BROWSER_SUITE")")
          fi
          scripts/e2e/playwright-e2e.sh "${playwright_args[@]}"
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-${{ matrix.suite }}-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  deny:
    name: Cargo deny
    needs: fmt
    if: needs.fmt.result == 'success'
    runs-on: ${{ fromJSON(inputs.runner == 'github-hosted' && '"ubuntu-24.04"' || '["self-hosted","Linux"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install cargo-deny
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1 || [ "$(cargo deny --version)" != "cargo-deny 0.19.6" ]; then
            cargo install cargo-deny --version 0.19.6 --locked
          fi
      - name: Cargo deny
        run: cargo deny check

  commitlint:
    name: Commit lint
    needs: fmt
    runs-on: ${{ fromJSON(inputs.runner == 'github-hosted' && '"ubuntu-24.04"' || '["self-hosted","Linux"]') }}
    if: ${{ !inputs.audit_only && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve commit lint range
        id: commit_range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "base_sha=$PULL_REQUEST_BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "head_sha=$PULL_REQUEST_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags origin main
            head_sha=$(git rev-parse HEAD)
            base_sha=$(git merge-base origin/main HEAD)
            if [ "$base_sha" = "$head_sha" ]; then
              base_sha=$(git rev-parse HEAD^)
            fi
            echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
            echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          fi
      # Only needed on the GitHub-hosted fallback path: self-hosted runs
      # already have a warm ~/.npm cache from the shared, persistent $HOME.
      - uses: actions/cache@v6
        if: ${{ inputs.runner == 'github-hosted' }}
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Install commit lint dependencies
        run: npm ci
      - name: Lint pull request commits
        env:
          BASE_SHA: ${{ steps.commit_range.outputs.base_sha }}
          HEAD_SHA: ${{ steps.commit_range.outputs.head_sha }}
        run: ./node_modules/.bin/commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  docs:
    name: Documentation links
    needs: preflight
    if: ${{ !inputs.audit_only && needs.preflight.outputs.skip != 'true' }}
    runs-on: ${{ fromJSON(inputs.runner == 'github-hosted' && '"ubuntu-24.04"' || '["self-hosted","Linux"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Check Markdown files exist
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f STYLE.md
          test -f ARCHITECTURE.md
          test -f PORTING.md
          test -f docs/README.md
      - name: Check CI suite ownership and artifact integrity
        run: |
          python3 scripts/ci-teletext-selection_test.py
          python3 scripts/ci-domains_test.py
          python3 scripts/ci-build-artifacts_test.py
          python3 scripts/e2e/playwright-e2e_test.py
          python3 scripts/release/test-docker-recovery.py
      - name: Check CI trigger contract
        run: |
          if grep -Eq '^[[:space:]]*types:.*[[:space:],]labeled([][[:space:],]|$)' .github/workflows/ci.yml; then
            echo "Pull-request labels must not trigger full CI."
            exit 1
          fi
          if grep -Eq 'github\.event\.pull_request\.label[s]' .github/workflows/ci.yml; then
            echo "Pull-request labels must not select a CI runner."
            exit 1
          fi

  # The single required status check for `main` (branch protection). It
  # aggregates every gate job so the protection rule never has to track job or
  # matrix names. It runs even after a failure or cancellation (`always()`):
  # GitHub treats a skipped required check as passing, so this job must
  # report a real failure instead of being skipped. Focused manual recovery
  # modes do not establish full CI and therefore do not run it.
  ci_ok:
    name: CI ok
    needs: [preflight, fmt, clippy, build, test, next_engine, teletext, hydration, deny, commitlint, docs]
    if: ${{ always() && !inputs.audit_only && !inputs.test_only && !inputs.next_engine_only && (!inputs.teletext_only || inputs.teletext_only == 'none') && (!inputs.browser_only || inputs.browser_only == 'none') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every gate job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          needs = json.loads(os.environ["NEEDS"])
          results = {job: data["result"] for job, data in needs.items()}
          for job, result in sorted(results.items()):
              print(f"{job}: {result}")
          if results.get("preflight") != "success":
              sys.exit("::error::Preflight did not succeed")
          bad = [job for job, result in results.items() if result not in ("success", "skipped")]
          if bad:
              sys.exit(f"::error::Gate jobs did not pass: {', '.join(sorted(bad))}")
          if needs["preflight"]["outputs"].get("skip") == "true":
              print("Preflight skipped the gate (already proven SHA or docs-only change).")
              sys.exit(0)
          lane = needs["preflight"]["outputs"].get("lane") or "full"
          # Commit lint runs only for pull requests and manual dispatches.
          optional = {"commitlint"} if os.environ["EVENT_NAME"] == "push" else set()
          # Jobs a lane leaves out on purpose (see Preflight).
          optional |= {
              "light": {"next_engine", "teletext", "hydration"},
          }.get(lane, set())
          if lane == "pr":
              # Domains the pull request does not touch (scripts/ci-domains.py).
              optional |= set(json.loads(needs["preflight"]["outputs"].get("deselected") or "[]"))
          missing = [job for job, result in results.items()
                     if result != "success" and job not in optional]
          if missing:
              sys.exit(f"::error::Gate jobs were skipped: {', '.join(sorted(missing))}")
          if lane == "light":
              # A passing check here would let the head SHA merge while the
              # full run after `ready_for_review` is still in progress.
              sys.exit("::error::Draft pull request: the fast lane passed. Mark it ready for review to run the full PR lane.")
          print(f"All gate jobs passed ({lane} lane).")
          PY
      - name: Record the tested tree
        if: ${{ github.event_name == 'pull_request' && needs.preflight.outputs.tree != '' }}
        env:
          TREE: ${{ needs.preflight.outputs.tree }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: printf '%s\n%s\n' "$TREE" "$RUN_URL" > ci-tree.txt
      # Read by Preflight on the push to main: the merged tree passed the PR
      # lane, so that push is skipped and the nightly run covers the rest.
      - uses: actions/upload-artifact@v7
        if: ${{ github.event_name == 'pull_request' && needs.preflight.outputs.tree != '' }}
        with:
          name: ci-tree-${{ needs.preflight.outputs.tree }}
          path: ci-tree.txt
          retention-days: 14
      - name: Record the fully tested tree
        if: ${{ needs.preflight.outputs.lane == 'full' && needs.preflight.outputs.tree != '' }}
        env:
          TREE: ${{ needs.preflight.outputs.tree }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: printf '%s\n%s\n' "$TREE" "$RUN_URL" > ci-full.txt
      # Read by Preflight on the nightly run: skip it when main's tree already
      # passed a full run.
      - uses: actions/upload-artifact@v7
        if: ${{ needs.preflight.outputs.lane == 'full' && needs.preflight.outputs.tree != '' }}
        with:
          name: ci-full-${{ needs.preflight.outputs.tree }}
          path: ci-full.txt
          retention-days: 14
