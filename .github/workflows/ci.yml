name: CI

on:
  pull_request:
    # Do not add `labeled`: dependency automation applies several routine
    # labels, and each label event would start another full CI run.
    types: [opened, synchronize, reopened]
    # Same non-code skip as `push` below. Safe here only because this
    # repository has no branch protection, so no required status check can be
    # left unreported by a skipped run. If branch protection is ever enabled,
    # do NOT drop this list: add a sentinel job that reports success under the
    # required check names instead, or docs-only PRs become unmergeable.
    paths-ignore:
      - 'docs/**'
      - 'plans/**'
      - '.claude/**'
      - '.codex/**'
      - '*.md'
      - '**/*.md'
      - '*.png'
      - '**/*.png'
  push:
    branches: [main]
    # Skip the Rust CI gate when a push touches only non-code paths (docs,
    # plans, markdown, images, agent config). The daily progress routine
    # commits doc-only changes directly to main (see
    # docs/automation/daily-progress-routine.md) and validates them locally
    # with `cargo xtask progress check`. A push that also changes anything
    # outside this list (any .rs, Cargo manifest, or .github/ file) still runs
    # CI in full. Applies to push only; pull_request always runs the gate.
    paths-ignore:
      - 'docs/**'
      - 'plans/**'
      - '.claude/**'
      - '.codex/**'
      - '*.md'
      - '**/*.md'
      - '*.png'
      - '**/*.png'
  workflow_dispatch:
    inputs:
      runner:
        description: Runner used for this manual CI run
        type: choice
        required: true
        default: self-hosted
        options:
          - self-hosted
          - github-hosted
      reset_target_dir:
        description: Wipe the self-hosted runner's persistent CARGO_TARGET_DIR before building (use if a build looks stale/corrupted)
        type: boolean
        required: false
        default: false

# Bursty pushing is common here (44% of recent consecutive commits landed
# <10 min apart). On the single self-hosted runner that queues full clippy+test
# cycles nobody waits for, so cancel superseded runs per ref (PR branches and
# main) within each runner pool. Keeping the pools independent also lets the
# on-demand hosted fallback proceed if a self-hosted runner is unavailable,
# and vice versa.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}-${{ inputs.runner == 'github-hosted' && 'github-hosted' || 'self-hosted' }}
  cancel-in-progress: true

permissions:
  contents: read

# Two self-hosted runners share one persistent machine. Each runner runs its
# jobs serially in its own workspace, so sharing build output across that
# runner's jobs loses no wall-clock parallelism. Point
# CARGO_TARGET_DIR at github.workspace's parent, which the runner creates
# once per repo and actions/checkout's default `git clean -ffdx` does not
# touch (it only cleans inside the checkout itself) — so target/ now
# persists across every job and run on that runner instead of being wiped
# and restored through Swatinem/rust-cache's remote blob service every
# time. Harmless on the GitHub-hosted fallback path: it just relocates
# target/ within the same disposable VM disk. See BUILD.md "CI runner
# selection" for the recovery step if this directory ever looks stale.
env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/../ci-target

jobs:
  # A direct fast-forward merge gives main the exact commit a feature-branch
  # run already proved green, so the push-triggered run recompiles and retests
  # a byte-identical tree. Ask the API whether this SHA already has a
  # successful CI run and skip the gate if it does.
  #
  # Push only. A pull_request must be evaluated on its own merge result, and a
  # manual dispatch is an explicit request to re-run. A PR merge commit is a
  # new SHA, so this never skips one.
  #
  # Pinned to a hosted runner on purpose: the self-hosted pool is one machine
  # with two runners, and adding a gate job there would charge every run
  # queue time to save a duplicate that is comparatively rare.
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.duplicate.outputs.skip }}
    steps:
      - id: duplicate
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'push') {
              core.setOutput('skip', 'false');
              core.info(`${context.eventName} always runs the full gate.`);
              return;
            }
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                head_sha: context.sha,
                per_page: 100,
              },
            );
            const proven = runs.filter(
              (run) => run.id !== context.runId && run.conclusion === 'success',
            );
            core.setOutput('skip', proven.length > 0 ? 'true' : 'false');
            if (proven.length > 0) {
              const links = proven.map((run) => run.html_url).join(', ');
              core.notice(
                `${context.sha} already passed CI (${links}); skipping this duplicate run.`,
              );
            }

  fmt:
    name: Format
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ${{ fromJSON(inputs.runner == 'github-hosted' && '"ubuntu-24.04"' || '["self-hosted","Linux"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Compare new Clippy allows with the PR base or push predecessor.
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: cargo fmt --all -- --check
      - name: New Clippy allow policy
        env:
          CLIPPY_ALLOW_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          base="$CLIPPY_ALLOW_BASE"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="HEAD^"
          fi
          python3 scripts/check_new_clippy_allows.py --base "$base"

  clippy:
    name: Clippy
    runs-on: ${{ fromJSON(inputs.runner == 'github-hosted' && '"ubuntu-24.04"' || '["self-hosted","Linux"]') }}
    # Gate on the fast fmt job so a formatting failure doesn't burn a full
    # clippy build on the serial self-hosted runner.
    needs: fmt
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Reset persistent target-dir (manual escape hatch)
        if: ${{ inputs.reset_target_dir == true }}
        run: rm -rf "$CARGO_TARGET_DIR"
      # Only needed on the GitHub-hosted fallback path: self-hosted jobs
      # reuse the persistent CARGO_TARGET_DIR set at workflow level instead
      # (see the comment above `env:`), so restoring a remote cache on top
      # of it there would risk overwriting fresher local objects with a
      # staler blob for no benefit.
      - uses: Swatinem/rust-cache@v2
        if: ${{ inputs.runner == 'github-hosted' }}
        with:
          # Self-hosted runner shares $CARGO_HOME/bin with the developer
          # shell, so don't let rust-cache prune cargo-leptos /
          # stylance-cli / wasm-bindgen between runs.
          cache-bin: "false"
      - name: Install Stylance CLI
        run: |
          if ! command -v stylance >/dev/null 2>&1 || [ "$(stylance --version)" != "stylance-cli 0.8.2" ]; then
            cargo install stylance-cli --version 0.8.2 --locked
          fi
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    if: ${{ inputs.runner != 'github-hosted' }}
    runs-on: ${{ fromJSON(inputs.runner == 'github-hosted' && '"ubuntu-24.04"' || '["self-hosted","Linux"]') }}
    # Gate on the fast fmt job so a formatting failure doesn't burn a full
    # test build on the serial self-hosted runner.
    needs: fmt
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Reset persistent target-dir (manual escape hatch)
        if: ${{ inputs.reset_target_dir == true }}
        run: rm -rf "$CARGO_TARGET_DIR"
      # This job only ever runs self-hosted (see the `if:` above), so it
      # relies solely on the persistent CARGO_TARGET_DIR set at workflow
      # level (see the comment above `env:`) — no remote cache needed here.
      - name: Install Stylance CLI
        run: |
          if ! command -v stylance >/dev/null 2>&1 || [ "$(stylance --version)" != "stylance-cli 0.8.2" ]; then
            cargo install stylance-cli --version 0.8.2 --locked
          fi
      - name: Install cargo-nextest
        run: |
          if ! command -v cargo-nextest >/dev/null 2>&1; then
            cargo install cargo-nextest --version 0.9.140 --locked
          fi
      # Unit, binary and integration tests, no doctests. Next component tests
      # run in the dedicated Next engine job below. The `ci`
      # profile adds a JUnit report so per-test durations land in an artifact;
      # .config/nextest.toml reports anything slower than 60s in the summary.
      - name: Test
        run: cargo nextest run --profile ci --workspace --lib --bins --tests -E 'not test(next_engine::)'
      # nextest resolves its store directory from the workspace root, not from
      # CARGO_TARGET_DIR, so the report lands in <workspace>/target/nextest even
      # though build artifacts go to the persistent target-dir. Look in both and
      # stage the report inside the workspace: upload-artifact cannot read paths
      # outside it, and CARGO_TARGET_DIR points at the workspace's parent.
      - name: Collect test timings
        if: always()
        run: |
          mkdir -p ci-artifacts
          report="$(find "$GITHUB_WORKSPACE/target/nextest" \
            "$CARGO_TARGET_DIR/nextest" \
            -type f -name junit.xml 2>/dev/null | head -n 1)"
          if [ -n "$report" ]; then
            cp "$report" ci-artifacts/junit.xml
            echo "Collected $report"
          else
            echo "No nextest JUnit report found" >&2
          fi
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/junit.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Validate progress index (docs/progress/)
        run: cargo xtask progress check
      - name: Validate architecture boundaries and debt ratchets
        run: cargo xtask architecture-lint
      - name: Check persistent target-dir size
        run: cargo xtask target-size

  test_hosted:
    name: Test (${{ matrix.shard }})
    if: ${{ inputs.runner == 'github-hosted' }}
    runs-on: ubuntu-24.04
    # Keep cold workspace linking within the hosted job lifetime by splitting
    # the large web crate's library and binary test targets. Preserve native
    # runner parallelism; debug info is not needed to determine test outcomes.
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        shard:
          - workspace-minus-web
          - web-lib
          - web-bins
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          # Without an explicit key, rust-cache's default (job id + OS/env
          # hash) does not factor in the matrix value, so all three shards
          # collided on one cache entry and raced to restore/save it.
          key: test-hosted-${{ matrix.shard }}
          cache-bin: "true"
      - name: Install LLVM linker
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes lld
      - name: Install Stylance CLI
        run: cargo install stylance-cli --version 0.8.2 --locked
      - name: Install cargo-nextest
        run: |
          if ! command -v cargo-nextest >/dev/null 2>&1; then
            cargo install cargo-nextest --version 0.9.140 --locked
          fi
      - name: Test remaining workspace
        if: matrix.shard == 'workspace-minus-web'
        run: cargo nextest run --profile ci --workspace --exclude ersatzrs-web --lib --bins --tests -E 'not test(next_engine::)'
      - name: Test web library
        if: matrix.shard == 'web-lib'
        run: cargo nextest run --profile ci -p ersatzrs-web --lib
      # `--bins` alone left the ersatzrs-web integration targets (tests/*.rs)
      # unrun on this path, while the self-hosted `test` job covers them
      # through `--tests`. Keep the two paths equivalent.
      - name: Test web binaries and integration tests
        if: matrix.shard == 'web-bins'
        run: cargo nextest run --profile ci -p ersatzrs-web --bins --tests
      - name: Validate progress index (docs/progress/)
        if: matrix.shard == 'workspace-minus-web'
        run: cargo xtask progress check
      - name: Validate architecture boundaries and debt ratchets
        if: matrix.shard == 'workspace-minus-web'
        run: cargo xtask architecture-lint

  next_engine:
    name: Next engine
    defaults:
      run:
        shell: bash
    runs-on: ${{ fromJSON(inputs.runner == 'github-hosted' && '"ubuntu-24.04"' || '["self-hosted","Linux","X64"]') }}
    needs: fmt
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "8"
      ERSATZRS_FFMPEG_RELEASE_TAG: v2.0.4
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Reset persistent target-dir (manual escape hatch)
        if: ${{ inputs.reset_target_dir == true }}
        run: rm -rf "$CARGO_TARGET_DIR"
      - uses: Swatinem/rust-cache@v2
        if: ${{ inputs.runner == 'github-hosted' }}
        with:
          cache-bin: "true"
      - name: Prepare isolated runtime and diagnostics
        run: |
          mkdir -p ci-artifacts/next-engine
          runtime_tmp="$RUNNER_TEMP/next-engine-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$runtime_tmp"
          echo "TMPDIR=$runtime_tmp" >> "$GITHUB_ENV"
          git rev-parse HEAD > ci-artifacts/next-engine/ersatzrs-sha.txt
          rm -f target/nextest/ci/junit.xml "$CARGO_TARGET_DIR/nextest/ci/junit.xml"
      - name: Install test tools
        run: |
          if ! command -v stylance >/dev/null 2>&1 || [ "$(stylance --version)" != "stylance-cli 0.8.2" ]; then
            cargo install stylance-cli --version 0.8.2 --locked
          fi
          if ! command -v cargo-nextest >/dev/null 2>&1; then
            cargo install cargo-nextest --version 0.9.140 --locked
          fi
      - name: Stage Next and validated FFmpeg runtime
        run: |
          python3 scripts/release/stage-next.py --rid linux-x64 --output "$TMPDIR/next" | tee ci-artifacts/next-engine/next-runtime.log
          cp "$TMPDIR/next/origin.json" ci-artifacts/next-engine/next-origin.json
          sha256sum "$TMPDIR/next/ersatztv-channel" > ci-artifacts/next-engine/next-sha256.txt
          echo "ETV_NEXT_FOLDER=$TMPDIR/next" >> "$GITHUB_ENV"
          echo "ERSATZRS_NEXT_TEST_BIN=$TMPDIR/next/ersatztv-channel" >> "$GITHUB_ENV"
          cargo run --locked -p ersatzrs-ffmpeg --example provision_runtime -- "$TMPDIR/ffmpeg" "$GITHUB_ENV" | tee ci-artifacts/next-engine/ffmpeg-runtime.log
          python3 scripts/e2e/stage-rtsp-test-server.py --output "$TMPDIR/rtsp-server" | tee ci-artifacts/next-engine/rtsp-test-server.log
          echo "ERSATZRS_NEXT_TEST_RTSP_SERVER=$TMPDIR/rtsp-server/mediamtx" >> "$GITHUB_ENV"
      - name: Next components, real-engine decoding and HTTP EOF
        run: |
          ./run.sh test -p ersatzrs-infra -p ersatzrs-web --lib --profile ci --run-ignored all -E '(test(next_engine::) or test(transport::iptv::next_media::)) and not test(fixture_child)' 2>&1 | tee ci-artifacts/next-engine/tests.log
      - name: Next HTTP playback, burned subtitles and preview
        run: |
          smoke_port="$(python3 -c 'import socket; sock = socket.socket(); sock.bind(("127.0.0.1", 0)); print(sock.getsockname()[1]); sock.close()')"
          ERSATZRS_SMOKE_PORT="$smoke_port" cargo xtask smoke --next --hls-lifecycle --keep-temp 2>&1 | tee ci-artifacts/next-engine/smoke.log
      - name: Next Hybrid playback with converted subtitles
        run: |
          smoke_port="$(python3 -c 'import socket; sock = socket.socket(); sock.bind(("127.0.0.1", 0)); print(sock.getsockname()[1]); sock.close()')"
          ERSATZRS_SMOKE_PORT="$smoke_port" cargo xtask smoke --next-convert --keep-temp 2>&1 | tee ci-artifacts/next-engine/smoke-convert.log
      - name: Collect Next diagnostics
        if: always()
        run: |
          python3 - <<'PYCODE'
          import os, pathlib, shutil
          destination = pathlib.Path('ci-artifacts/next-engine')
          destination.mkdir(parents=True, exist_ok=True)
          for root in (pathlib.Path('target/nextest'), pathlib.Path(os.environ['CARGO_TARGET_DIR']) / 'nextest'):
              report = root / 'ci/junit.xml'
              if report.is_file():
                  shutil.copyfile(report, destination / 'junit.xml')
          for index, log in enumerate(pathlib.Path(os.environ.get('TMPDIR', os.environ['RUNNER_TEMP'])).glob('ersatzrs-smoke-*/ersatzrs-web-smoke.log')):
              shutil.copyfile(log, destination / f'host-{index}.log')
          PYCODE
      - name: Upload Next diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: next-engine-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/next-engine/
          if-no-files-found: warn
          retention-days: 14

  hydration:
    name: Playwright E2E (${{ matrix.project }})
    runs-on: ${{ fromJSON(inputs.runner == 'github-hosted' && '"ubuntu-24.04"' || '["self-hosted","Linux"]') }}
    # Gate on the fast fmt job so formatting failures do not burn a browser
    # E2E build.
    needs: fmt
    # One job per Playwright project. The suite runs on a single worker because
    # it mutates shared application state in its test database (TEST.md): each
    # job runs scripts/e2e/playwright-e2e.sh separately, and that script
    # creates its own temporary database and web host per invocation, so the
    # two projects cannot see each other's state. Splitting by project rather
    # than by `--shard` also keeps every `mode: 'serial'` group whole inside
    # one job.
    #
    # The projects run one after the other, not side by side. Both self-hosted
    # runners share one machine, so two suites building ersatzrs-web and
    # driving browsers at once compete for its CPU and memory; an otherwise
    # unexplained Chromium hydration timeout occurred while both overlapped.
    # `max-parallel: 1` removes that contention at the cost of roughly ten
    # minutes of wall time; `fail-fast: false` still runs the second project
    # when the first fails. It only serializes within one workflow run: a
    # second concurrent run can still overlap. Each project keeps its own port
    # so either runner can take either job.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - project: chromium
            port: "18409"
          - project: firefox
            port: "18410"
    env:
      # Keep CI independent from the maintainer's live admin server on 8409.
      ERSATZRS_E2E_PORT: ${{ matrix.port }}
      # Keep each project's result JSON and host log separate; both jobs upload
      # from test-results/.
      ERSATZRS_E2E_RESULT_DIR: test-results/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      - name: Reset persistent target-dir (manual escape hatch)
        if: ${{ inputs.reset_target_dir == true }}
        run: rm -rf "$CARGO_TARGET_DIR"
      # Only needed on the GitHub-hosted fallback path: self-hosted runs
      # reuse the persistent CARGO_TARGET_DIR set at workflow level instead
      # (see the comment above `env:`).
      - uses: Swatinem/rust-cache@v2
        if: ${{ inputs.runner == 'github-hosted' }}
        with:
          # Hosted runners restore these pinned tools to avoid repeated
          # cold installs.
          cache-bin: "true"
      - name: Hydration lint
        run: cargo xtask hydration-lint -p ersatzrs-web
      # Only needed on the GitHub-hosted fallback path: self-hosted runs
      # already have a warm ~/.npm cache from the shared, persistent $HOME
      # (npm's cache directory is not inside the git checkout, so it is
      # never touched by actions/checkout's clean step).
      - uses: actions/cache@v6
        if: ${{ inputs.runner == 'github-hosted' }}
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Install web E2E tools
        run: |
          set -euo pipefail
          if ! command -v stylance >/dev/null 2>&1 || [ "$(stylance --version)" != "stylance-cli 0.8.2" ]; then
            cargo install stylance-cli --version 0.8.2 --locked
          fi
          if ! command -v cargo-leptos >/dev/null 2>&1 || [ "$(cargo leptos --version)" != "cargo-leptos 0.3.6" ]; then
            cargo install cargo-leptos --version 0.3.6 --locked
          fi
          npm ci
      - name: Full Playwright E2E suite
        run: scripts/e2e/playwright-e2e.sh --project=${{ matrix.project }}
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  deny:
    name: Cargo deny
    needs: fmt
    if: needs.fmt.result == 'success'
    runs-on: ${{ fromJSON(inputs.runner == 'github-hosted' && '"ubuntu-24.04"' || '["self-hosted","Linux"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install cargo-deny
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1 || [ "$(cargo deny --version)" != "cargo-deny 0.19.6" ]; then
            cargo install cargo-deny --version 0.19.6 --locked
          fi
      - name: Cargo deny
        run: cargo deny check

  commitlint:
    name: Commit lint
    needs: fmt
    runs-on: ${{ fromJSON(inputs.runner == 'github-hosted' && '"ubuntu-24.04"' || '["self-hosted","Linux"]') }}
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve commit lint range
        id: commit_range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "base_sha=$PULL_REQUEST_BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "head_sha=$PULL_REQUEST_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags origin main
            head_sha=$(git rev-parse HEAD)
            base_sha=$(git merge-base origin/main HEAD)
            if [ "$base_sha" = "$head_sha" ]; then
              base_sha=$(git rev-parse HEAD^)
            fi
            echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
            echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          fi
      # Only needed on the GitHub-hosted fallback path: self-hosted runs
      # already have a warm ~/.npm cache from the shared, persistent $HOME.
      - uses: actions/cache@v6
        if: ${{ inputs.runner == 'github-hosted' }}
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Install commit lint dependencies
        run: npm ci
      - name: Lint pull request commits
        env:
          BASE_SHA: ${{ steps.commit_range.outputs.base_sha }}
          HEAD_SHA: ${{ steps.commit_range.outputs.head_sha }}
        run: ./node_modules/.bin/commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  docs:
    name: Documentation links
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ${{ fromJSON(inputs.runner == 'github-hosted' && '"ubuntu-24.04"' || '["self-hosted","Linux"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Check Markdown files exist
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f STYLE.md
          test -f ARCHITECTURE.md
          test -f PORTING.md
          test -f docs/README.md
      - name: Check CI trigger contract
        run: |
          if grep -Eq '^[[:space:]]*types:.*[[:space:],]labeled([][[:space:],]|$)' .github/workflows/ci.yml; then
            echo "Pull-request labels must not trigger full CI."
            exit 1
          fi
          if grep -Eq 'github\.event\.pull_request\.label[s]' .github/workflows/ci.yml; then
            echo "Pull-request labels must not select a CI runner."
            exit 1
          fi
