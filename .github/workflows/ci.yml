name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Skip the Rust CI gate when a push touches only non-code paths (docs,
    # plans, markdown, images, agent config). The daily progress routine
    # commits doc-only changes directly to main (see
    # docs/automation/daily-progress-routine.md) and validates them locally
    # with `cargo xtask progress check`. A push that also changes anything
    # outside this list (any .rs, Cargo manifest, or .github/ file) still runs
    # CI in full. Applies to push only; pull_request always runs the gate.
    paths-ignore:
      - 'docs/**'
      - 'plans/**'
      - '.claude/**'
      - '.codex/**'
      - '*.md'
      - '**/*.md'
      - '*.png'
      - '**/*.png'

# Bursty pushing is common here (44% of recent consecutive commits landed
# <10 min apart). On the single self-hosted runner that queues full clippy+test
# cycles nobody waits for, so cancel superseded runs per ref (PR branches and
# main). Only the latest commit on a ref is validated.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: [self-hosted, Linux]
    # Gate on the fast fmt job so a formatting failure doesn't burn a full
    # clippy build on the serial self-hosted runner.
    needs: fmt
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Self-hosted runner shares $CARGO_HOME/bin with the developer
          # shell, so don't let rust-cache prune cargo-leptos /
          # stylance-cli / wasm-bindgen between runs.
          cache-bin: "false"
      - name: Install Stylance CLI
        run: cargo install stylance-cli --version 0.8.2 --locked
      - name: Clippy (default / SQLite)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (MySQL feature)
        run: cargo clippy --workspace --all-targets --features mysql -- -D warnings

  test:
    name: Test
    runs-on: [self-hosted, Linux]
    # Gate on the fast fmt job so a formatting failure doesn't burn a full
    # test build on the serial self-hosted runner.
    needs: fmt
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Self-hosted runner shares $CARGO_HOME/bin with the developer
          # shell, so don't let rust-cache prune cargo-leptos /
          # stylance-cli / wasm-bindgen between runs.
          cache-bin: "false"
      - name: Install Stylance CLI
        run: cargo install stylance-cli --version 0.8.2 --locked
      - name: Test (all features)
        run: cargo test --workspace --all-features --lib --bins --tests
      - name: Validate progress index (docs/progress/)
        run: cargo xtask progress check

  hydration:
    name: Hydration
    runs-on: [self-hosted, Linux]
    # Gate on the fast fmt job so formatting failures do not burn a browser
    # smoke build on the serial self-hosted runner.
    needs: fmt
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # Self-hosted runner shares $CARGO_HOME/bin with the developer
          # shell, so don't let rust-cache prune cargo-leptos /
          # stylance-cli / wasm-bindgen between runs.
          cache-bin: "false"
      - name: Hydration lint
        run: cargo xtask hydration-lint -p ersatzrs-web
      - name: Detect browser hydration smoke scope
        id: hydration_scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [[ -z "$base" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "No base commit available; running hydration smoke."
            exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(crates/ersatzrs-web/|tests/e2e/|scripts/e2e/hydration-smoke\.sh|scripts/release/verify-web-bundle\.sh|xtask/src/hydration_lint\.rs|\.hydration-lint-baseline|\.github/workflows/(ci|release)\.yml|package\.json|package-lock\.json|Cargo\.toml|Cargo\.lock|\.cargo/config\.toml|TEST\.md|BUILD\.md)$|(^|/)Cargo\.toml$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install web hydration tools
        if: steps.hydration_scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          if ! command -v stylance >/dev/null 2>&1 || [ "$(stylance --version)" != "stylance-cli 0.8.2" ]; then
            cargo install stylance-cli --version 0.8.2 --locked
          fi
          if ! command -v cargo-leptos >/dev/null 2>&1 || [ "$(cargo leptos --version)" != "cargo-leptos 0.3.6" ]; then
            cargo install cargo-leptos --version 0.3.6 --locked
          fi
          npm ci
      - name: Browser island hydration smoke
        if: steps.hydration_scope.outputs.run == 'true'
        run: scripts/e2e/hydration-smoke.sh
      - name: Browser island hydration smoke skipped
        if: steps.hydration_scope.outputs.run != 'true'
        run: echo "No web, Leptos, workflow, or hydration-sensitive files changed; browser hydration smoke skipped."

  deny:
    name: Cargo deny
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.6 --locked
      - name: Cargo deny
        run: cargo deny --all-features check

  commitlint:
    name: Commit lint
    runs-on: [self-hosted, Linux]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: ./commitlint.config.cjs

  docs:
    name: Documentation links
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v7
      - name: Check Markdown files exist
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f STYLE.md
          test -f ARCHITECTURE.md
          test -f PORTING.md
          test -f docs/README.md
