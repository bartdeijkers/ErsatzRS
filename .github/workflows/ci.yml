name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    # Skip the Rust CI gate when a push touches only non-code paths (docs,
    # plans, markdown, images, agent config). The daily progress routine
    # commits doc-only changes directly to main (see
    # docs/automation/daily-progress-routine.md) and validates them locally
    # with `cargo xtask progress check`. A push that also changes anything
    # outside this list (any .rs, Cargo manifest, or .github/ file) still runs
    # CI in full. Applies to push only; pull_request always runs the gate.
    paths-ignore:
      - 'docs/**'
      - 'plans/**'
      - '.claude/**'
      - '.codex/**'
      - '*.md'
      - '**/*.md'
      - '*.png'
      - '**/*.png'
  workflow_dispatch:
    inputs:
      runner:
        description: Runner used for this manual CI run
        type: choice
        required: true
        default: self-hosted
        options:
          - self-hosted
          - github-hosted

# Bursty pushing is common here (44% of recent consecutive commits landed
# <10 min apart). On the single self-hosted runner that queues full clippy+test
# cycles nobody waits for, so cancel superseded runs per ref (PR branches and
# main). Only the latest commit on a ref is validated.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ${{ fromJSON((inputs.runner == 'github-hosted' || contains(github.event.pull_request.labels.*.name, 'ci:github-hosted')) && '"ubuntu-24.04"' || '["self-hosted","Linux"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ${{ fromJSON((inputs.runner == 'github-hosted' || contains(github.event.pull_request.labels.*.name, 'ci:github-hosted')) && '"ubuntu-24.04"' || '["self-hosted","Linux"]') }}
    # Gate on the fast fmt job so a formatting failure doesn't burn a full
    # clippy build on the serial self-hosted runner.
    needs: fmt
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          # Self-hosted runner shares $CARGO_HOME/bin with the developer
          # shell, so don't let rust-cache prune cargo-leptos /
          # stylance-cli / wasm-bindgen between runs.
          cache-bin: "false"
      - name: Install Stylance CLI
        run: cargo install stylance-cli --version 0.8.2 --locked
      - name: Clippy (default / SQLite)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (MySQL feature)
        run: cargo clippy --workspace --all-targets --features mysql -- -D warnings

  test:
    name: Test
    runs-on: ${{ fromJSON((inputs.runner == 'github-hosted' || contains(github.event.pull_request.labels.*.name, 'ci:github-hosted')) && '"ubuntu-24.04"' || '["self-hosted","Linux"]') }}
    # Gate on the fast fmt job so a formatting failure doesn't burn a full
    # test build on the serial self-hosted runner.
    needs: fmt
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          # Self-hosted runner shares $CARGO_HOME/bin with the developer
          # shell, so don't let rust-cache prune cargo-leptos /
          # stylance-cli / wasm-bindgen between runs.
          cache-bin: "false"
      - name: Install Stylance CLI
        run: cargo install stylance-cli --version 0.8.2 --locked
      - name: Test (all features)
        run: |
          # Fresh hosted VMs have twice been reclaimed during the uncapped
          # all-features compile. Reduce compile pressure there while leaving
          # the local self-hosted runner at Cargo's native parallelism.
          if [ "$RUNNER_ENVIRONMENT" = "github-hosted" ]; then
            export CARGO_BUILD_JOBS=2
          fi
          cargo test --workspace --all-features --lib --bins --tests
      - name: Validate progress index (docs/progress/)
        run: cargo xtask progress check
      - name: Validate architecture boundaries and debt ratchets
        run: cargo xtask architecture-lint

  hydration:
    name: Playwright E2E
    runs-on: ${{ fromJSON((inputs.runner == 'github-hosted' || contains(github.event.pull_request.labels.*.name, 'ci:github-hosted')) && '"ubuntu-24.04"' || '["self-hosted","Linux"]') }}
    # Gate on the fast fmt job so formatting failures do not burn a browser
    # E2E build on the serial self-hosted runner.
    needs: fmt
    env:
      # Keep CI independent from the maintainer's live admin server on 8409.
      ERSATZRS_E2E_PORT: "18409"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # Self-hosted runner shares $CARGO_HOME/bin with the developer
          # shell, so don't let rust-cache prune cargo-leptos /
          # stylance-cli / wasm-bindgen between runs.
          cache-bin: "false"
      - name: Hydration lint
        run: cargo xtask hydration-lint -p ersatzrs-web
      - name: Install web E2E tools
        run: |
          set -euo pipefail
          if ! command -v stylance >/dev/null 2>&1 || [ "$(stylance --version)" != "stylance-cli 0.8.2" ]; then
            cargo install stylance-cli --version 0.8.2 --locked
          fi
          if ! command -v cargo-leptos >/dev/null 2>&1 || [ "$(cargo leptos --version)" != "cargo-leptos 0.3.6" ]; then
            cargo install cargo-leptos --version 0.3.6 --locked
          fi
          npm ci
      - name: Full Playwright E2E suite
        run: scripts/e2e/playwright-e2e.sh
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  deny:
    name: Cargo deny
    runs-on: ${{ fromJSON((inputs.runner == 'github-hosted' || contains(github.event.pull_request.labels.*.name, 'ci:github-hosted')) && '"ubuntu-24.04"' || '["self-hosted","Linux"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.6 --locked
      - name: Cargo deny
        run: cargo deny --all-features check

  commitlint:
    name: Commit lint
    runs-on: ${{ fromJSON((inputs.runner == 'github-hosted' || contains(github.event.pull_request.labels.*.name, 'ci:github-hosted')) && '"ubuntu-24.04"' || '["self-hosted","Linux"]') }}
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve commit lint range
        id: commit_range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "base_sha=$PULL_REQUEST_BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "head_sha=$PULL_REQUEST_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags origin main
            echo "base_sha=$(git merge-base origin/main HEAD)" >> "$GITHUB_OUTPUT"
            echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Install commit lint dependencies
        run: npm ci
      - name: Lint pull request commits
        env:
          BASE_SHA: ${{ steps.commit_range.outputs.base_sha }}
          HEAD_SHA: ${{ steps.commit_range.outputs.head_sha }}
        run: ./node_modules/.bin/commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  docs:
    name: Documentation links
    runs-on: ${{ fromJSON((inputs.runner == 'github-hosted' || contains(github.event.pull_request.labels.*.name, 'ci:github-hosted')) && '"ubuntu-24.04"' || '["self-hosted","Linux"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Check Markdown files exist
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f STYLE.md
          test -f ARCHITECTURE.md
          test -f PORTING.md
          test -f docs/README.md
