name: PR checks
run-name: ${{ (github.event_name == 'push' || inputs.quick_only) && 'CI' || github.event_name == 'schedule' && 'Full verification' || github.event.pull_request.draft && 'CI (Draft)' || inputs.audit_only && 'CI (Audit only)' || inputs.browser_only && inputs.browser_only != 'none' && 'CI (Browser recovery)' || (inputs.teletext_only && inputs.teletext_only != 'none') && 'CI (Teletext only)' || inputs.next_engine_only && inputs.next_case_set == 'subtitle-nul' && 'CI (Next subtitle-NUL recovery)' || inputs.next_engine_only && 'CI (Next engine only)' || inputs.test_only && 'CI (Test only)' || (github.event_name == 'pull_request' && 'PR checks' || 'CI') }}

on:
  pull_request:
    # Do not add `labeled`: dependency automation applies several routine
    # labels, and each label event would start another full CI run.
    # `ready_for_review` starts the full PR lane once a draft is marked ready;
    # draft pull requests run only the fast lane (see Preflight).
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    # No `paths-ignore` here: `main` requires the `CI ok` check, and a
    # workflow that never starts never reports it, which would leave
    # docs-only PRs unmergeable. Preflight selects small checks for known
    # documentation-only changes; ready PRs still report `CI ok`.
  push:
    branches: [main]
  # Reused by the small push workflow and the independent full weekrun.
  workflow_call:
    inputs:
      runner:
        type: string
        default: ''
      quick_only:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      runner:
        description: Runner used for this manual CI run
        type: choice
        required: true
        default: self-hosted
        options:
          - self-hosted
          - github-hosted
      test_only:
        description: Run only the Rust Test job (does not establish full CI acceptance)
        type: boolean
        required: false
        default: false
      audit_only:
        description: Run dependency audit only (does not establish full CI acceptance; incompatible with other focused modes)
        type: boolean
        required: false
        default: false
      next_engine_only:
        description: Run only the Next engine job (does not establish full CI acceptance; incompatible with test_only)
        type: boolean
        required: false
        default: false
      next_case_set:
        description: Bounded Next recovery cases (nondefault requires next_engine_only)
        type: choice
        required: false
        default: all
        options:
          - all
          - subtitle-nul
      teletext_only:
        description: Run selected teletext jobs (2.5/all opt into experimental checks; partial CI)
        type: choice
        required: false
        default: none
        options:
          - none
          - all
          - '1.5'
          - '2.5'
          - 1.5-rust
      browser_only:
        description: Run the bounded recovery case set in selected browsers (partial CI; incompatible with other focused modes)
        type: choice
        required: false
        default: none
        options:
          - none
          - chromium
          - firefox
          - both
      browser_case_set:
        description: Bounded browser recovery cases (nondefault sets require browser_only)
        type: choice
        required: false
        default: fixtures
        options:
          - fixtures
          - channel-preview
          - teletext-1.5
          - teletext-runtime
      reset_target_dir:
        description: Wipe the self-hosted runner's persistent CARGO_TARGET_DIR before building (use if a build looks stale/corrupted)
        type: boolean
        required: false
        default: false
      reuse_artifacts:
        description: Exact local artifact references as JSON (self-hosted recovery; full CI requires complete workspace coverage; no rebuild)
        type: string
        required: false
        default: ''
      resume_run:
        description: Completed full CI run whose successful unchanged checks may be reused (requires reuse_artifacts)
        type: string
        required: false
        default: ''

# Bursty pushing is common here (44% of recent consecutive commits landed
# <10 min apart). On the single self-hosted runner that queues full clippy+test
# cycles nobody waits for, so cancel superseded runs per ref (PR branches and
# main) within each runner pool. Keeping the pools independent also lets the
# on-demand hosted fallback proceed if a self-hosted runner is unavailable,
# and vice versa. Focused repairs use separate groups so they cannot cancel
# a still-running full gate whose unaffected evidence must be preserved.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}-${{ inputs.runner == 'github-hosted' && 'github-hosted' || 'self-hosted' }}${{ (github.event_name == 'push' || inputs.quick_only) && '-quick' || github.event_name == 'schedule' && '-weekly' || github.event_name == 'workflow_dispatch' && '-qualification' || '-pr' }}${{ inputs.audit_only && '-audit-only' || inputs.browser_only && inputs.browser_only != 'none' && format('-browser-{0}{1}', inputs.browser_only, inputs.browser_case_set && inputs.browser_case_set != 'fixtures' && format('-{0}', inputs.browser_case_set) || '') || (inputs.teletext_only && inputs.teletext_only != 'none') && format('-teletext-{0}', inputs.teletext_only) || inputs.next_engine_only && format('-next-engine-only{0}', inputs.next_case_set == 'subtitle-nul' && '-subtitle-nul' || '') || '' }}
  cancel-in-progress: true

permissions:
  contents: read

# Two self-hosted runners share one persistent machine. Each runner runs its
# jobs serially in its own workspace, so sharing build output across that
# runner's jobs loses no wall-clock parallelism. Point
# CARGO_TARGET_DIR at github.workspace's parent, which the runner creates
# once per repo and actions/checkout's default `git clean -ffdx` does not
# touch (it only cleans inside the checkout itself) — so target/ now
# persists across every job and run on that runner instead of being wiped
# and restored through Swatinem/rust-cache's remote blob service every
# time. Harmless on the GitHub-hosted fallback path: it just relocates
# target/ within the same disposable VM disk. See BUILD.md "CI runner
# selection" for the recovery step if this directory ever looks stale.
env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/../ci-target
  # insta otherwise runs `cargo metadata` to find the workspace root. Execution
  # jobs consume prebuilt binaries without installing a toolchain, so on a
  # fresh GitHub-hosted runner every snapshot test makes rustup install it at
  # once; those racing installs fail and the snapshots resolve to the wrong
  # directory.
  INSTA_WORKSPACE_ROOT: ${{ github.workspace }}
  # Same-host runners share the user's cache by default. Other machines safely
  # miss this cache and download the unchanged GitHub artifact instead.
  CI_LOCAL_ARTIFACT_CACHE: ${{ vars.CI_LOCAL_ARTIFACT_CACHE }}
  CI_REUSE_ARTIFACTS: ${{ inputs.reuse_artifacts }}

jobs:
  # light: compile-free checks plus full Clippy/deny; no runtime/test artifacts.
  # pr: reviewed behavioral domains, Rust reverse dependents and Chromium.
  # full: explicit qualification and the independent weekly workflow.
  # skip: a qualified complete proof already covers the requested execution.
  # Main always runs small checks, reporting exact-tree behavioral provenance
  # separately. A draft never establishes a passing required merge check.
  preflight:
    name: Preflight
    if: ${{ inputs.audit_only || (!inputs.test_only && !inputs.next_engine_only && (!inputs.teletext_only || inputs.teletext_only == 'none') && (!inputs.browser_only || inputs.browser_only == 'none')) }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      # `github-hosted` when no self-hosted runner is online (see the
      # "Choose the runner pool" step); empty means the self-hosted pool.
      pool: ${{ steps.pool.outputs.pool }}
      skip: ${{ steps.pr_proof.outputs.skip || steps.select.outputs.skip || steps.duplicate.outputs.skip }}
      lane: ${{ steps.pr_proof.outputs.lane || steps.select.outputs.lane || steps.duplicate.outputs.lane }}
      tree: ${{ steps.duplicate.outputs.tree }}
      # Domain selection of a `pr` lane run. Empty for every other lane, which
      # the jobs read as "run".
      run_next: ${{ steps.resume.outputs.run_next || steps.select.outputs.run_next }}
      run_teletext: ${{ steps.resume.outputs.run_teletext || steps.select.outputs.run_teletext }}
      run_browser: ${{ steps.resume.outputs.run_browser || steps.select.outputs.run_browser }}
      run_test: ${{ steps.resume.outputs.run_test || steps.select.outputs.run_test }}
      reuse_clippy: ${{ steps.resume.outputs.reuse_clippy }}
      resumed_checks: ${{ steps.resume.outputs.resumed_checks }}
      resume_matrix: ${{ steps.resume.outputs.resume_matrix }}
      build_rust: ${{ steps.select.outputs.build_rust }}
      build_web: ${{ steps.select.outputs.build_web }}
      build_smoke: ${{ steps.select.outputs.build_smoke }}
      pr_matrix: ${{ steps.select.outputs.pr_matrix }}
      nextest_filter: ${{ steps.select.outputs.nextest_filter }}
      archive_packages: ${{ steps.select.outputs.archive_packages }}
      general_filter: ${{ steps.resume.outputs.general_filter || steps.select.outputs.general_filter }}
      teletext_filter: ${{ steps.select.outputs.teletext_filter }}
      deselected: ${{ steps.select.outputs.deselected }}
      required_jobs: ${{ steps.select.outputs.required_jobs }}
    steps:
      - name: Reject mixed audit mode
        if: ${{ inputs.audit_only && (inputs.test_only || inputs.next_engine_only || (inputs.teletext_only && inputs.teletext_only != 'none') || (inputs.browser_only && inputs.browser_only != 'none') || (inputs.browser_case_set && inputs.browser_case_set != 'fixtures') || inputs.reuse_artifacts || (inputs.next_case_set && inputs.next_case_set != 'all')) }}
        run: |
          echo "::error::audit_only cannot be combined with another focused CI mode"
          exit 1
      - id: duplicate
        env:
          CI_QUICK_ONLY: ${{ inputs.quick_only }}
        uses: actions/github-script@v9
        with:
          script: |
            const lane = (name) => {
              core.setOutput('lane', name);
              core.setOutput('skip', name === 'skip' ? 'true' : 'false');
            };
            // The full lane records its tree so the weekly run can skip it.
            const full = async () => {
              lane('full');
              core.setOutput('tree', await treeOf(context.sha));
            };
            const treeOf = async (sha) => (await github.rest.git.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
            })).data.tree.sha;
            if (process.env.CI_QUICK_ONLY === 'true') {
              lane('light');
              return;
            }
            if (context.eventName === 'pull_request') {
              // Only known documentation ownership can omit behavioral builds.
              // Match ci-domains.py; embedded CHANGELOG and served assets run.
              const nonCode = (path) => /^(docs|plans|\.claude|\.codex)\//.test(path)
                || (/^[^/]+\.md$/.test(path) && path !== 'CHANGELOG.md');
              const expected = context.payload.pull_request;
              const sameRevision = (pr) => pr.head.sha === expected.head.sha
                && pr.base.sha === expected.base.sha && pr.changed_files === expected.changed_files;
              const getPull = async () => (await github.rest.pulls.get({
                ...context.repo, pull_number: expected.number,
              })).data;
              if (!sameRevision(await getPull())) throw new Error('PR changed since this event; refusing stale selection');
              const files = await github.paginate(
                github.rest.pulls.listFiles,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  per_page: 100,
                },
              );
              if (!sameRevision(await getPull()) || !Number.isInteger(expected.changed_files)
                  || files.length !== expected.changed_files || files.length === 0) {
                throw new Error('Incomplete or stale PR diff; refusing to deselect checks');
              }
              const validPath = (path) => typeof path === 'string' && path.length > 0
                && path === path.trim() && !/[\r\n\\]/.test(path) && !path.startsWith('/')
                && !path.split('/').some(part => !part || part === '.' || part === '..');
              const names = new Set();
              for (const file of files) {
                if (!validPath(file.filename) || names.has(file.filename)
                    || !['added', 'modified', 'removed', 'renamed', 'copied', 'changed', 'unchanged'].includes(file.status)
                    || (file.previous_filename && !validPath(file.previous_filename))
                    || (file.status === 'renamed' && !file.previous_filename)) {
                  throw new Error('Malformed PR file metadata; refusing to deselect checks');
                }
                names.add(file.filename);
              }
              const docsOnly = files.length > 0 && files.every(
                (file) => nonCode(file.filename)
                  && (!file.previous_filename || nonCode(file.previous_filename)),
              );
              if (docsOnly) {
                lane('light');
                core.notice('Documentation-only pull request: run the small checks without artifacts.');
              } else if (context.payload.pull_request.draft) {
                lane('light');
                core.notice('Draft pull request: fast lane only. Mark it ready for review to run the full PR lane.');
              } else {
                lane('pr');
                // context.sha is the merge commit this run tests.
                core.setOutput('tree', await treeOf(context.sha));
                const changed = new Set();
                for (const file of files) {
                  changed.add(file.filename);
                  if (file.previous_filename) changed.add(file.previous_filename);
                }
                require('fs').writeFileSync(
                  `${process.env.RUNNER_TEMP}/changed-files.txt`, [...changed].join('\n') + '\n',
                );
                require('fs').writeFileSync(
                  `${process.env.RUNNER_TEMP}/added-files.txt`,
                  files.filter(file => ['added', 'copied'].includes(file.status))
                    .map(file => file.filename).join('\n'),
                );
                core.info('pull_request runs the PR lane (touched domains, browsers in Chromium only).');
              }
              return;
            }
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            // A `ci-tree-<tree>` / `ci-full-<tree>` marker is uploaded by
            // `CI ok` only after every selected job passed.
            const provenBy = async (prefix, tree, events) => {
              const artifacts = await github.paginate(
                github.rest.actions.listArtifactsForRepo,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: `${prefix}-${tree}`,
                  per_page: 100,
                },
              );
              for (const artifact of artifacts) {
                if (artifact.expired || !artifact.workflow_run) continue;
                const run = (await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: artifact.workflow_run.id,
                })).data;
                if (!['.github/workflows/ci.yml', '.github/workflows/full-verification.yml'].includes(run.path) || !events.includes(run.event)
                  || run.head_repository?.full_name !== repository
                  || run.status !== 'completed' || run.conclusion !== 'success') continue;
                return run;
              }
              return null;
            };
            if (context.eventName === 'schedule') {
              const tree = await treeOf(context.sha);
              const run = await provenBy('ci-full', tree, ['push', 'schedule', 'workflow_dispatch']);
              if (run) {
                lane('skip');
                core.notice(`Tree ${tree} already passed a full run (${run.html_url}); skipping the weekly run.`);
              } else {
                await full();
              }
              return;
            }
            if (context.eventName !== 'push') {
              await full();
              core.info(`${context.eventName} runs the selected gate.`);
              return;
            }
            // A green small push is not behavioral evidence. Only a completed
            // selected/full proof marker can establish integration coverage.
            // A merged pull request lands as a new SHA, but often with the
            // exact tree its PR lane already tested. The weekly full run
            // covers the domains and Firefox jobs that lane left out.
            const tree = await treeOf(context.sha);
            const run = await provenBy('ci-tree', tree, ['pull_request']);
            if (run) {
              core.setOutput('integration_proven', 'true');
              lane('light');
              core.notice(
                `Tree ${tree} already passed the PR lane (${run.html_url}); reusing its behavioral proof; running small checks. The weekly run covers the rest.`,
              );
              return;
            }
            const fullRun = await provenBy('ci-full', tree, ['push', 'schedule', 'workflow_dispatch']);
            if (fullRun) {
              core.setOutput('integration_proven', 'true');
              lane('light');
              core.notice(`Tree ${tree} already passed full CI (${fullRun.html_url}); reusing its behavioral proof; running small checks.`);
              return;
            }
            core.setOutput('integration_proven', 'false');
            lane('light');
            core.notice('No prior exact-tree proof: small main checks only; full qualification remains required before release.');
      - uses: actions/github-script@v9
        name: Report main integration evidence
        if: github.event_name == 'push' && github.ref_name == 'main'
        env:
          PROVEN: ${{ steps.duplicate.outputs.integration_proven }}
        with:
          script: |
            await core.summary.addRaw(process.env.PROVEN === 'true'
              ? 'Exact-tree PR/full behavioral proof found; running small checks.'
              : 'No exact-tree behavioral proof found. Small CI is not integration or release acceptance. Run full qualification before release.').write();
      - uses: actions/checkout@v7
        if: ${{ steps.duplicate.outputs.lane == 'pr' || inputs.resume_run }}
        # Source-shape validation needs the actual merge-result source files.
        with:
          # Include the PR head's direct parent, even through the merge ref.
          fetch-depth: 3
      - id: resume
        name: Verify completed check inputs and provenance
        if: ${{ inputs.resume_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run }}
          RESUME_ARTIFACTS: ${{ inputs.reuse_artifacts }}
          RESUME_ALLOWED: ${{ github.event_name == 'workflow_dispatch' && steps.duplicate.outputs.lane == 'full' && inputs.reuse_artifacts && inputs.runner == 'self-hosted' && !inputs.audit_only && !inputs.test_only && !inputs.next_engine_only && (!inputs.teletext_only || inputs.teletext_only == 'none') && (!inputs.browser_only || inputs.browser_only == 'none') }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import importlib.util, json, os, re, subprocess
          if os.environ['RESUME_ALLOWED'] != 'true' or not re.fullmatch(r'[1-9][0-9]*', os.environ['RESUME_RUN_ID']):
              raise ValueError('Check resumption requires a full self-hosted artifact-reuse dispatch')
          spec = importlib.util.spec_from_file_location('artifacts', 'scripts/ci-build-artifacts.py')
          artifacts = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(artifacts)
          route = f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['RESUME_RUN_ID']}"
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True))
          run, jobs = api(route), api(route + '/jobs?per_page=100&filter=latest')
          producer = next(row for row in jobs['jobs'] if row['name'] == 'Verify reused CI artifacts')
          log_args = ['gh', 'api',
              f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/jobs/{producer['id']}/logs"]
          if '--allow-escape-sequences' in subprocess.check_output(['gh', 'api', '--help'], text=True):
              log_args.append('--allow-escape-sequences')
          producer_log = subprocess.check_output(log_args, text=True)
          browser_logs = {}
          for row in jobs['jobs']:
              if row['name'] in ('Playwright E2E (general, chromium)', 'Playwright E2E (general, firefox)'):
                  args = list(log_args)
                  args[2] = f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/jobs/{row['id']}/logs"
                  browser_logs[row['name']] = subprocess.check_output(args, text=True)
          proof = artifacts.resume_checks(run, jobs, os.environ['GITHUB_REPOSITORY'],
              os.environ['GITHUB_SHA'], os.environ['RESUME_ARTIFACTS'], producer_log, browser_logs)
          print('resumed_checks=' + json.dumps(proof, separators=(',', ':')))
          for output, job in [('run_test', 'test'), ('run_next', 'next_engine'),
                              ('run_teletext', 'teletext'), ('run_browser', 'hydration')]:
              print(output + '=' + str(job not in proof['jobs']).lower())
          print('reuse_clippy=' + str('clippy' in proof['jobs']).lower())
          print('general_filter=' + proof['general_filter'])
          rows = proof['browser_pending'] or [{'suite':'general','project':'chromium','port':'18409'}]
          print('resume_matrix=' + json.dumps({'include': rows}, separators=(',', ':')))
          PY
      - id: pr_proof
        name: Verify completed full proof for the required PR check
        if: ${{ steps.duplicate.outputs.lane == 'pr' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/ci-build-artifacts_test.py
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import importlib.util, json, os
          spec = importlib.util.spec_from_file_location('artifacts', 'scripts/ci-build-artifacts.py')
          artifacts = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(artifacts)
          proof = artifacts.resume_pr_checks(os.environ['GITHUB_REPOSITORY'],
              os.environ['PR_HEAD_SHA'], os.environ['GITHUB_SHA'])
          if proof:
              print('qualified_pr_proof=' + json.dumps(proof, separators=(',', ':')))
              print('lane=skip')
              print('skip=true')
          PY
      - id: select
        name: Select touched domains
        if: ${{ steps.duplicate.outputs.lane == 'pr' && steps.pr_proof.outputs.skip != 'true' }}
        run: |
          # The checkout is the merge result; its first parent is the base the
          # pull request changes. Translation and re-export changes are read
          # against it, and stay broad when it is not available.
          base=()
          if git rev-parse --verify --quiet 'HEAD^2^{commit}' >/dev/null; then
            base=(--base-rev "$(git rev-parse 'HEAD^1')")
          fi
          python3 scripts/ci-domains.py select "$RUNNER_TEMP/changed-files.txt" \
            --added-files "$RUNNER_TEMP/added-files.txt" "${base[@]}" > "$RUNNER_TEMP/selection.json"
          python3 - "$RUNNER_TEMP/selection.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          s = json.load(open(sys.argv[1]))
          print(json.dumps(s, indent=1), file=sys.stderr)
          if not (all(type(s[key]) is bool for key in ("next", "teletext_rust", "teletext_browser"))
                  and all(type(s["products"][key]) is bool for key in ("rust", "web", "smoke_server"))
                  and ((s["nextest_filter"] == "none()") == (not s["rust_packages"]))):
              raise ValueError("Invalid PR selection types or Rust filter")
          general = s["general_specs"] == "all" or bool(s["general_specs"])
          rows = []
          if general:
              rows.append({"suite": "general", "project": "chromium", "port": "18409"})
          if s["teletext_browser"]:
              if not (s["teletext_filter"] and s["teletext_specs"]):
                  raise ValueError("Selected teletext suite has no explicit specs")
              rows.append({"suite": "1.5", "project": "chromium", "port": "18411"})
          if general and s["general_specs"] != "all" and not s["general_filter"]:
              raise ValueError("Selected general suite has no explicit specs")
          if s["products"] != {"rust": bool(s["rust_packages"] or s["next"] or s["teletext_rust"]),
                               "web": bool(rows), "smoke_server": s["next"]}:
              raise ValueError("Selected products and consumers disagree")
          deselected = [job for job, on in (("test", bool(s["rust_packages"])), ("next_engine", s["next"]), ("teletext", s["teletext_rust"]),
                                            ("hydration", bool(rows))) if not on]
          nothing = not (s["products"]["rust"] or rows)
          print(f"lane={'light' if nothing else 'pr'}")
          print('skip=false')
          print(f"run_next={str(s['next']).lower()}")
          print(f"run_teletext={str(s['teletext_rust']).lower()}")
          print(f"run_browser={str(bool(rows)).lower()}")
          print(f"run_test={str(bool(s['rust_packages'])).lower()}")
          print(f"build_rust={str(s['products']['rust']).lower()}")
          print(f"build_web={str(s['products']['web']).lower()}")
          print(f"build_smoke={str(s['products']['smoke_server']).lower()}")
          print("pr_matrix=" + json.dumps({"include": rows}, separators=(",", ":")))
          print(f"nextest_filter={s['nextest_filter']}")
          print("archive_packages=" + " ".join(s["archive_packages"]))
          print(f"general_filter={s['general_filter']}")
          print(f"teletext_filter={s['teletext_filter']}")
          print("deselected=" + json.dumps(sorted(deselected), separators=(",", ":")))
          jobs = {"preflight", "fmt", "clippy", "build", "test", "next_engine", "teletext", "hydration", "deny", "commitlint", "docs"}
          print("required_jobs=" + json.dumps(sorted(jobs - set(deselected)), separators=(",", ":")))
          PY
          {
            echo "### Selected CI domains"
            echo '```json'
            cat "$RUNNER_TEMP/selection.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - id: pool
        name: Choose the runner pool
        if: ${{ !inputs.runner }}
        # The pool choice is an optimisation: whatever goes wrong here, the run
        # keeps the self-hosted pool instead of failing.
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          RUNNER_STATUS_TOKEN: ${{ secrets.CI_RUNNER_STATUS_TOKEN }}
        with:
          script: |
            // Listing self-hosted runners needs repository Administration
            // (read), which GITHUB_TOKEN cannot have. Without the optional
            // CI_RUNNER_STATUS_TOKEN secret (and on fork pull requests, which
            // get no secrets) the run keeps the self-hosted pool and queues
            // until a runner comes online, as before.
            const token = process.env.RUNNER_STATUS_TOKEN;
            if (!token) {
              core.info('No CI_RUNNER_STATUS_TOKEN: using the self-hosted pool.');
              return;
            }
            const keepSelfHosted = async (reason) => {
              core.warning(`${reason} Using the self-hosted pool.`);
              await core.summary.addRaw(`:warning: Runner fallback unavailable: ${reason} `
                + 'This run uses the self-hosted pool. Renew the `CI_RUNNER_STATUS_TOKEN` '
                + 'repository secret to restore the GitHub-hosted fallback.\n').write();
            };
            let response;
            try {
              response = await getOctokit(token).request(
                'GET /repos/{owner}/{repo}/actions/runners',
                { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 },
              );
            } catch (error) {
              const expired = error.status === 401 ? ' (expired or revoked token)' : '';
              await keepSelfHosted(`Could not read runner status: HTTP ${error.status ?? '?'}${expired}, ${error.message}.`);
              return;
            }
            // Personal access tokens report their expiry; warn two weeks ahead.
            const expiry = Date.parse(response.headers['github-authentication-token-expiration'] ?? '');
            if (!Number.isNaN(expiry) && expiry - Date.now() < 14 * 24 * 3600 * 1000) {
              core.warning(`CI_RUNNER_STATUS_TOKEN expires on ${new Date(expiry).toISOString().slice(0, 10)}; renew it to keep the hosted fallback.`);
            }
            const runners = response.data.runners ?? [];
            const usable = runners.filter((runner) => runner.status === 'online'
              && ['self-hosted', 'Linux'].every(
                (label) => (runner.labels ?? []).some((l) => l.name === label)));
            if (usable.length > 0) {
              core.info(`Self-hosted runners online: ${usable.map((r) => r.name).join(', ')}`);
              return;
            }
            core.setOutput('pool', 'github-hosted');
            core.notice('No self-hosted runner is online: this run uses GitHub-hosted runners.');


  fmt:
    name: Format
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ${{ fromJSON((needs.preflight.outputs.lane == 'light' || inputs.runner == 'github-hosted' || needs.preflight.outputs.pool == 'github-hosted') && '"ubuntu-24.04"' || '["self-hosted","Linux"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Compare new Clippy allows with the PR base or push predecessor.
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: cargo fmt --all -- --check
      - name: Focused audit selection safeguards
        if: ${{ inputs.audit_only }}
        run: python3 scripts/ci-build-artifacts_test.py
      - name: New Clippy allow policy
        env:
          CLIPPY_ALLOW_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          base="$CLIPPY_ALLOW_BASE"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="HEAD^"
          fi
          python3 scripts/check_new_clippy_allows.py --base "$base"

  clippy:
    name: Clippy
    runs-on: ${{ fromJSON((inputs.runner == 'github-hosted' || needs.preflight.outputs.pool == 'github-hosted') && '"ubuntu-24.04"' || '["self-hosted","Linux"]') }}
    # Gate on the fast fmt job so a formatting failure doesn't burn a full
    # clippy build on the serial self-hosted runner.
    needs: [preflight, fmt]
    if: ${{ !inputs.audit_only && needs.preflight.outputs.reuse_clippy != 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Reset persistent target-dir (manual escape hatch)
        if: ${{ inputs.reset_target_dir == true }}
        run: rm -rf "$CARGO_TARGET_DIR"
      # Only needed on the GitHub-hosted fallback path: self-hosted jobs
      # reuse the persistent CARGO_TARGET_DIR set at workflow level instead
      # (see the comment above `env:`), so restoring a remote cache on top
      # of it there would risk overwriting fresher local objects with a
      # staler blob for no benefit.
      - uses: Swatinem/rust-cache@v2
        if: ${{ (inputs.runner == 'github-hosted' || needs.preflight.outputs.pool == 'github-hosted') }}
        with:
          # Self-hosted runner shares $CARGO_HOME/bin with the developer
          # shell, so don't let rust-cache prune cargo-leptos /
          # stylance-cli / wasm-bindgen between runs.
          cache-bin: "false"
      - name: Install Stylance CLI
        run: |
          if ! command -v stylance >/dev/null 2>&1 || [ "$(stylance --version)" != "stylance-cli 0.8.2" ]; then
            cargo install stylance-cli --version 0.8.2 --locked
          fi
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: ${{ inputs.reuse_artifacts && 'Verify reused CI artifacts' || 'Build CI artifacts' }}
    needs: [preflight, fmt]
    if: ${{ always() && !cancelled() && !inputs.audit_only && needs.preflight.outputs.lane != 'light' && (needs.fmt.result == 'success' || inputs.test_only || inputs.next_engine_only || (inputs.teletext_only && inputs.teletext_only != 'none') || (inputs.browser_only && inputs.browser_only != 'none')) }}
    runs-on: ${{ fromJSON((inputs.runner == 'github-hosted' || needs.preflight.outputs.pool == 'github-hosted') && '"ubuntu-24.04"' || '["self-hosted","Linux","X64"]') }}
    timeout-minutes: 120
    outputs:
      rust_artifact: ${{ steps.identity.outputs.rust_artifact }}
      web_artifact: ${{ steps.identity.outputs.web_artifact }}
      rust_cache_key: ${{ steps.reuse.outputs.rust_cache_key || steps.identity.outputs.rust_cache_key }}
      web_cache_key: ${{ steps.reuse.outputs.web_cache_key || steps.identity.outputs.web_cache_key }}
      rust_digest: ${{ steps.reuse.outputs.rust_digest || steps.identity.outputs.rust_digest }}
      web_digest: ${{ steps.reuse.outputs.web_digest || steps.identity.outputs.web_digest }}
      rust_source_sha: ${{ steps.reuse.outputs.rust_source_sha || github.sha }}
      web_source_sha: ${{ steps.reuse.outputs.web_source_sha || github.sha }}
    env:
      # Kether V (Ryzen 9 5900X, 24 threads, 64 GB) hosts both self-hosted
      # runners: 6 jobs each leaves half the threads free when both build.
      CARGO_BUILD_JOBS: ${{ (inputs.runner == 'github-hosted' || needs.preflight.outputs.pool == 'github-hosted') && '4' || '6' }}
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: ${{ (inputs.runner == 'github-hosted' || needs.preflight.outputs.pool == 'github-hosted') && '-C link-arg=-fuse-ld=lld' || '' }}
      LEPTOS_OUTPUT_NAME: ersatzrs-web
      LEPTOS_HASH_FILES: "false"
      ARCHIVE_PACKAGES: ${{ needs.preflight.outputs.archive_packages }}
      BUILD_RUST: ${{ !inputs.reuse_artifacts && (!inputs.browser_only || inputs.browser_only == 'none') && (needs.preflight.outputs.lane != 'pr' || needs.preflight.outputs.build_rust == 'true') }}
      BUILD_WEB: ${{ !inputs.reuse_artifacts && !inputs.test_only && !inputs.next_engine_only && inputs.teletext_only != '1.5-rust' && (needs.preflight.outputs.lane != 'pr' || needs.preflight.outputs.build_web == 'true') }}
      BUILD_SMOKE: ${{ !inputs.reuse_artifacts && !inputs.test_only && (!inputs.browser_only || inputs.browser_only == 'none') && (!inputs.teletext_only || inputs.teletext_only == 'none') && needs.preflight.outputs.lane != 'light' && (needs.preflight.outputs.lane != 'pr' || needs.preflight.outputs.build_smoke == 'true') }}
    steps:
      - name: Validate dispatch mode
        env:
          TEST_ONLY: ${{ inputs.test_only }}
          NEXT_ONLY: ${{ inputs.next_engine_only }}
          NEXT_CASE_SET: ${{ inputs.next_case_set || 'all' }}
          TELETEXT_ONLY: ${{ inputs.teletext_only }}
          BROWSER_ONLY: ${{ inputs.browser_only }}
          BROWSER_CASE_SET: ${{ inputs.browser_case_set || 'fixtures' }}
          REUSE_ARTIFACTS: ${{ inputs.reuse_artifacts }}
          RUNNER_POOL: ${{ inputs.runner }}
          RESET_TARGET_DIR: ${{ inputs.reset_target_dir }}
          RESUME_RUN_ID: ${{ inputs.resume_run }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          modes = [os.environ[key] == 'true' for key in ('TEST_ONLY', 'NEXT_ONLY')]
          modes += [os.environ[key] not in ('', 'none') for key in ('TELETEXT_ONLY', 'BROWSER_ONLY')]
          if sum(modes) > 1:
              raise SystemExit('Focused CI modes are mutually exclusive')
          if os.environ.get('RESUME_RUN_ID') and (sum(modes) or not os.environ.get('REUSE_ARTIFACTS')):
              raise SystemExit('Check resumption requires full artifact reuse')
          next_case_set = os.environ.get('NEXT_CASE_SET', 'all')
          if next_case_set not in ('all', 'subtitle-nul'):
              raise SystemExit('Unknown Next recovery case set')
          if next_case_set != 'all' and os.environ['NEXT_ONLY'] != 'true':
              raise SystemExit('Next recovery case set requires next_engine_only')
          case_set = os.environ['BROWSER_CASE_SET']
          if case_set not in ('fixtures', 'channel-preview', 'teletext-1.5', 'teletext-runtime'):
              raise SystemExit('Unknown browser recovery case set')
          if case_set != 'fixtures' and os.environ['BROWSER_ONLY'] in ('', 'none'):
              raise SystemExit('Browser recovery case set requires browser_only')
          if os.environ.get('REUSE_ARTIFACTS'):
              if os.environ.get('RUNNER_POOL') != 'self-hosted' or os.environ.get('RESET_TARGET_DIR') == 'true':
                  raise SystemExit('Artifact reuse requires self-hosted execution without target reset')
              references = json.loads(os.environ['REUSE_ARTIFACTS'])
              if not isinstance(references, dict):
                  raise SystemExit('Artifact reuse references must be a JSON object')
              if sum(modes) == 0 and set(references) != {'rust', 'web'}:
                  raise SystemExit('Full CI reuse requires both Rust and matched web references')
          PYCODE
      - uses: actions/checkout@v7
      - name: Free hosted runner disk and memory
        # A standard hosted runner has 4 vCPUs, 16 GB RAM and about 14 GB of
        # free disk; a full workspace test build exceeds that, and the runner
        # then dies with "lost communication". Drop preinstalled toolchains CI
        # does not use and add swap so linking large test binaries survives.
        if: ${{ (inputs.runner == 'github-hosted' || needs.preflight.outputs.pool == 'github-hosted') && !inputs.reuse_artifacts }}
        run: |
          df -h / ; free -g
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell /usr/local/julia* || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo fallocate -l 12G /mnt/ci-swap && sudo chmod 600 /mnt/ci-swap \
            && sudo mkswap /mnt/ci-swap >/dev/null && sudo swapon /mnt/ci-swap || true
          df -h / ; free -g
          # Incremental state roughly doubles target/; a cold hosted build gains nothing from it.
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
      - name: Reuse verified CI artifacts
        id: reuse
        if: ${{ inputs.reuse_artifacts != '' }}
        env:
          REUSE_KINDS: ${{ inputs.browser_only && inputs.browser_only != 'none' && 'web' || (inputs.test_only || inputs.next_engine_only || inputs.teletext_only == '1.5-rust') && 'rust' || 'rust web' }}
          REQUIRE_FULL_WORKSPACE: ${{ !inputs.test_only && !inputs.next_engine_only && (!inputs.teletext_only || inputs.teletext_only == 'none') && (!inputs.browser_only || inputs.browser_only == 'none') }}
        run: |
          mkdir -p ci-artifacts
          for kind in $REUSE_KINDS; do
            coverage=()
            if [[ "$kind" == 'rust' && "$REQUIRE_FULL_WORKSPACE" == 'true' ]]; then
              coverage+=(--require-full-workspace)
            fi
            python3 scripts/ci-build-artifacts.py reuse --kind "$kind" --sha "$GITHUB_SHA" \
              --archive "ci-artifacts/$kind.tar.gz" --output-file "$GITHUB_OUTPUT" "${coverage[@]}"
          done
      - uses: dtolnay/rust-toolchain@1.97.1
        if: ${{ !inputs.reuse_artifacts }}
        with:
          targets: ${{ env.BUILD_WEB == 'true' && 'wasm32-unknown-unknown' || '' }}
      - name: Reset persistent target-dir (manual escape hatch)
        if: ${{ inputs.reset_target_dir == true && !inputs.reuse_artifacts }}
        run: rm -rf "$CARGO_TARGET_DIR"
      - uses: Swatinem/rust-cache@v2
        if: ${{ (inputs.runner == 'github-hosted' || needs.preflight.outputs.pool == 'github-hosted') && !inputs.reuse_artifacts }}
        with:
          key: ci-build
          cache-bin: "true"
      - name: Install LLVM linker
        if: ${{ (inputs.runner == 'github-hosted' || needs.preflight.outputs.pool == 'github-hosted') && !inputs.reuse_artifacts }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes lld
      - name: Install build tools
        if: ${{ !inputs.reuse_artifacts }}
        run: |
          if [[ "$BUILD_WEB" == 'true' ]] && { ! command -v stylance >/dev/null 2>&1 || [ "$(stylance --version)" != "stylance-cli 0.8.2" ]; }; then
            cargo install stylance-cli --version 0.8.2 --locked
          fi
          if [[ "$BUILD_RUST" == 'true' ]] && { ! command -v cargo-nextest >/dev/null 2>&1 || [[ "$(cargo nextest --version)" != cargo-nextest\ 0.9.140* ]]; }; then
            cargo install cargo-nextest --version 0.9.140 --locked
          fi
          if [[ "$BUILD_WEB" == 'true' ]] && { ! command -v cargo-leptos >/dev/null 2>&1 || [ "$(cargo leptos --version)" != "cargo-leptos 0.3.6" ]; }; then
            cargo install cargo-leptos --version 0.3.6 --locked
          fi
      - name: Build CI helper executables
        if: ${{ !inputs.reuse_artifacts }}
        run: |
          git diff --exit-code
          echo "Runner hardware: $(nproc) threads, CARGO_BUILD_JOBS=$CARGO_BUILD_JOBS"
          free -g || true
          df -h "$GITHUB_WORKSPACE/.." || true
          cargo build --locked -p xtask --bin xtask
          "$CARGO_TARGET_DIR/debug/xtask" target-size
          cargo build --locked -p ersatzrs-ffmpeg --example provision_runtime
          for kind in rust web; do
            flag="BUILD_${kind^^}"
            [[ "${!flag}" == 'true' ]] || continue
            mkdir -p "ci-artifacts/build-$kind/bin"
            cp "$CARGO_TARGET_DIR/debug/xtask" "ci-artifacts/build-$kind/bin/xtask"
            cp "$CARGO_TARGET_DIR/debug/examples/provision_runtime" "ci-artifacts/build-$kind/bin/provision_runtime"
          done
      - name: Validate progress and architecture without a Rust test job
        if: ${{ !inputs.reuse_artifacts && needs.preflight.outputs.run_test == 'false' }}
        run: |
          "$CARGO_TARGET_DIR/debug/xtask" progress check
          "$CARGO_TARGET_DIR/debug/xtask" architecture-lint
      - name: Archive selected Rust tests and required smoke server
        if: env.BUILD_RUST == 'true'
        run: |
          capabilities=(--capability rust-tests)
          if [[ "$BUILD_SMOKE" == 'true' ]]; then
            cargo build --locked --bin ersatzrs-web
            cp "$CARGO_TARGET_DIR/debug/ersatzrs-web" ci-artifacts/build-rust/bin/ersatzrs-web-smoke
            capabilities+=(--capability smoke-server)
          fi
          cp "$(command -v cargo-nextest)" ci-artifacts/build-rust/bin/cargo-nextest
          # A `pr` lane run archives only the selected crates and every crate
          # depending on them; every other run archives the whole workspace.
          scope=(--workspace)
          selected_packages=()
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/metadata.json"
          if [[ -n "$ARCHIVE_PACKAGES" ]]; then
            scope=()
            read -r -a selected_packages <<< "$ARCHIVE_PACKAGES"
            closed_packages="$(python3 scripts/ci-domains.py closure "$RUNNER_TEMP/metadata.json" "${selected_packages[@]}")"
            [[ -n "$closed_packages" ]]
            read -r -a selected_packages <<< "$closed_packages"
            for package in "${selected_packages[@]}"; do
              scope+=(--package "$package")
            done
          fi
          target_flags="$(python3 scripts/ci-domains.py archive-targets "$RUNNER_TEMP/metadata.json" "${selected_packages[@]}")"
          read -r -a archive_targets <<< "$target_flags"
          echo "nextest archive scope: ${scope[*]}"
          cargo nextest archive --locked "${scope[@]}" "${archive_targets[@]}" --archive-file ci-artifacts/build-rust/nextest.tar.zst
          python3 scripts/ci-build-artifacts.py pack --kind rust --directory ci-artifacts/build-rust \
            --archive ci-artifacts/rust.tar.gz --sha "$GITHUB_SHA" "${capabilities[@]}"
      - name: Build matched server and complete Leptos site
        if: env.BUILD_WEB == 'true'
        env:
          # Native lld flags must never reach the wasm32 linker.
          RUSTFLAGS: ""
          LEPTOS_SITE_ROOT: ${{ github.workspace }}/ci-artifacts/build-web/site
        run: |
          (cd crates/ersatzrs-web && stylance . --output-file public/bundle.css && cargo leptos build)
          cp "$CARGO_TARGET_DIR/debug/ersatzrs-web" ci-artifacts/build-web/bin/ersatzrs-web
          cp -R crates/ersatzrs-web/public/. ci-artifacts/build-web/site/
          python3 scripts/ci-build-artifacts.py pack --kind web --directory ci-artifacts/build-web \
            --archive ci-artifacts/web.tar.gz --sha "$GITHUB_SHA"
      - name: Record immutable artifact names
        id: identity
        if: ${{ !inputs.reuse_artifacts }}
        run: |
          echo "rust_artifact=ci-rust-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "web_artifact=ci-web-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          for artifact_kind in rust web; do
            if [[ -f "ci-artifacts/$artifact_kind.tar.gz" ]]; then
              artifact_digest=$(sha256sum "ci-artifacts/$artifact_kind.tar.gz")
              artifact_digest=${artifact_digest%% *}
              echo "${artifact_kind}_digest=$artifact_digest" >> "$GITHUB_OUTPUT"
              echo "${artifact_kind}_cache_key=$GITHUB_REPOSITORY_ID-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$artifact_kind" >> "$GITHUB_OUTPUT"
            fi
          done
      - name: Publish local Rust artifact
        if: ${{ (inputs.runner != 'github-hosted' && needs.preflight.outputs.pool != 'github-hosted') && env.BUILD_RUST == 'true' }}
        env:
          CI_ARTIFACT_KEY: ${{ steps.identity.outputs.rust_cache_key }}
        run: |
          python3 scripts/ci-build-artifacts.py publish-local --kind rust --archive ci-artifacts/rust.tar.gz \
            --sha "$GITHUB_SHA" --cache-key "$CI_ARTIFACT_KEY"
      - name: Publish local web artifact
        if: ${{ (inputs.runner != 'github-hosted' && needs.preflight.outputs.pool != 'github-hosted') && env.BUILD_WEB == 'true' }}
        env:
          CI_ARTIFACT_KEY: ${{ steps.identity.outputs.web_cache_key }}
        run: |
          python3 scripts/ci-build-artifacts.py publish-local --kind web --archive ci-artifacts/web.tar.gz \
            --sha "$GITHUB_SHA" --cache-key "$CI_ARTIFACT_KEY"
      - uses: actions/upload-artifact@v7
        if: env.BUILD_RUST == 'true'
        with:
          name: ${{ steps.identity.outputs.rust_artifact }}
          path: ci-artifacts/rust.tar.gz
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: env.BUILD_WEB == 'true'
        with:
          name: ${{ steps.identity.outputs.web_artifact }}
          path: ci-artifacts/web.tar.gz
          compression-level: 0
          retention-days: 7
      - name: Bound completed self-hosted build cache
        if: ${{ (inputs.runner != 'github-hosted' && needs.preflight.outputs.pool != 'github-hosted') && !inputs.reuse_artifacts }}
        run: |
          # All consumers use uploaded/local immutable copies, never this target.
          cache_kib=$(du -sk -- "$CARGO_TARGET_DIR" | awk '{print $1}')
          cache_limit_gib="${ERSATZRS_TARGET_CLEAN_THRESHOLD_GIB:-60}"
          [[ "$cache_limit_gib" =~ ^[0-9]+$ ]]
          # The second runner lives on a 100 GB disk: also clean when less than
          # 20 GiB stays free, whatever the cache size.
          free_kib=$(df -Pk -- "$CARGO_TARGET_DIR" | awk 'NR==2 {print $4}')
          if (( cache_kib >= cache_limit_gib * 1024 * 1024 || free_kib < 20 * 1024 * 1024 )); then
            echo "Completed build cache is ${cache_kib} KiB with ${free_kib} KiB free; freeing it before consumers restore artifacts."
            cargo clean
          fi

  test:
    name: Test
    needs: [preflight, build]
    if: ${{ always() && !cancelled() && needs.build.result == 'success' && needs.preflight.outputs.run_test != 'false' && !inputs.next_engine_only && (!inputs.teletext_only || inputs.teletext_only == 'none') && (!inputs.browser_only || inputs.browser_only == 'none') }}
    runs-on: ${{ fromJSON((inputs.runner == 'github-hosted' || needs.preflight.outputs.pool == 'github-hosted') && '"ubuntu-24.04"' || '["self-hosted","Linux","X64"]') }}
    env:
      NEXTEST_TEST_THREADS: "4"
      # Set only by a `pr` lane run: the touched crates and their dependents.
      NEXTEST_FILTER: ${{ needs.preflight.outputs.nextest_filter }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch local rust artifact
        id: local_artifact
        if: ${{ (inputs.runner != 'github-hosted' && needs.preflight.outputs.pool != 'github-hosted') }}
        env:
          CI_ARTIFACT_KEY: ${{ needs.build.outputs.rust_cache_key }}
          CI_ARTIFACT_DIGEST: ${{ needs.build.outputs.rust_digest }}
        run: |
          python3 scripts/ci-build-artifacts.py fetch-local --kind rust --archive ci-input/rust.tar.gz \
            --sha "$GITHUB_SHA" --cache-key "$CI_ARTIFACT_KEY" --expected-digest "$CI_ARTIFACT_DIGEST" \
            --output-file "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        if: ${{ !inputs.reuse_artifacts && steps.local_artifact.outputs.hit != 'true' }}
        with:
          name: ${{ needs.build.outputs.rust_artifact }}
          path: ci-input
      - name: Restore verified Rust build
        run: |
          python3 scripts/ci-build-artifacts.py restore --kind rust --archive ci-input/rust.tar.gz \
            --directory "$RUNNER_TEMP/ci-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB" \
            --sha "$GITHUB_SHA" --env-file "$GITHUB_ENV" --require-capability rust-tests
      - name: General Rust regressions
        run: |
          # A `pr` lane run narrows the selection to the touched crates and
          # every crate that depends on them; other lanes run it whole.
          "$CI_NEXTEST" nextest run --archive-file "$CI_NEXTEST_ARCHIVE" --workspace-remap "$GITHUB_WORKSPACE" \
            --profile ci --no-tests fail \
            -E "($(python3 scripts/ci-teletext-selection.py rust general)) & (${NEXTEST_FILTER:-all()})"
      - name: Collect test timings
        if: always()
        run: |
          mkdir -p ci-artifacts
          report="target/nextest/ci/junit.xml"
          if [ ! -f "$report" ]; then report="$CARGO_TARGET_DIR/nextest/ci/junit.xml"; fi
          if [ -f "$report" ]; then cp "$report" ci-artifacts/junit.xml; fi
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/junit.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Validate progress index and architecture boundaries
        run: |
          "$CI_XTASK" progress check
          "$CI_XTASK" architecture-lint

  next_engine:
    name: Next engine
    defaults:
      run:
        shell: bash
    runs-on: ${{ fromJSON((inputs.runner == 'github-hosted' || needs.preflight.outputs.pool == 'github-hosted') && '"ubuntu-24.04"' || '["self-hosted","Linux","X64"]') }}
    needs: [preflight, build]
    if: ${{ always() && !cancelled() && needs.build.result == 'success' && needs.preflight.outputs.lane != 'light' && needs.preflight.outputs.run_next != 'false' && !inputs.test_only && (!inputs.teletext_only || inputs.teletext_only == 'none') && (!inputs.browser_only || inputs.browser_only == 'none') }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: ${{ (inputs.runner == 'github-hosted' || needs.preflight.outputs.pool == 'github-hosted') && '8' || '2' }}
      # Runtime fixtures share channel1's report path in this owned app-data root.
      NEXTEST_TEST_THREADS: "1"
      ERSATZRS_FFMPEG_RELEASE_TAG: v2.0.10
    steps:
      - uses: actions/checkout@v7
      - name: Fetch local rust artifact
        id: local_artifact
        if: ${{ (inputs.runner != 'github-hosted' && needs.preflight.outputs.pool != 'github-hosted') }}
        env:
          CI_ARTIFACT_KEY: ${{ needs.build.outputs.rust_cache_key }}
          CI_ARTIFACT_DIGEST: ${{ needs.build.outputs.rust_digest }}
        run: |
          python3 scripts/ci-build-artifacts.py fetch-local --kind rust --archive ci-input/rust.tar.gz \
            --sha "$GITHUB_SHA" --cache-key "$CI_ARTIFACT_KEY" --expected-digest "$CI_ARTIFACT_DIGEST" \
            --output-file "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        if: ${{ !inputs.reuse_artifacts && steps.local_artifact.outputs.hit != 'true' }}
        with:
          name: ${{ needs.build.outputs.rust_artifact }}
          path: ci-input
      - name: Restore verified Rust build
        run: |
          python3 scripts/ci-build-artifacts.py restore --kind rust --archive ci-input/rust.tar.gz \
            --directory "$RUNNER_TEMP/ci-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB" \
            --sha "$GITHUB_SHA" --env-file "$GITHUB_ENV" --require-capability smoke-server
      - name: Prepare isolated runtime and diagnostics
        run: |
          mkdir -p ci-artifacts/next-engine
          runtime_tmp="$RUNNER_TEMP/next-engine-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$runtime_tmp/app-data"
          echo "TMPDIR=$runtime_tmp" >> "$GITHUB_ENV"
          echo "ERSATZRS_APP_DATA_DIR=$runtime_tmp/app-data" >> "$GITHUB_ENV"
          git rev-parse HEAD > ci-artifacts/next-engine/ersatzrs-sha.txt
          rm -f target/nextest/ci/junit.xml "$CARGO_TARGET_DIR/nextest/ci/junit.xml"
      - name: Stage Next and validated FFmpeg runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Retain every reviewed archive for inventory and real acquisition/health tests.
          python3 - <<'PYCODE' | tee ci-artifacts/next-engine/next-runtime.log
          import importlib.util, os, pathlib, shutil
          spec = importlib.util.spec_from_file_location('stage_next', 'scripts/release/stage-next.py')
          stage = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(stage)
          manifest = pathlib.Path(stage.__file__).resolve().parent / 'next-patches/manifest.json'
          packages = pathlib.Path(os.environ['TMPDIR']) / 'next-packages'
          packages.mkdir()
          shutil.copyfile(manifest, packages / 'manifest.json')
          for rid, package in sorted(stage.MANIFEST['runtime_packages'].items()):
              archive = packages / package['asset']
              archive.write_bytes(stage.download(stage.package_url(rid), stage.MAX_ARCHIVE))
              output = pathlib.Path(os.environ['TMPDIR']) / ('next' if rid == 'linux-x64' else f'next-verified-{rid}')
              stage.stage_patched_snapshot(rid, output, archive)
          asset = stage.MANIFEST['runtime_packages']['linux-x64']['asset']
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'ERSATZRS_NEXT_TEST_PACKAGE_ARCHIVE={packages / asset}\n')
              env.write(f'ERSATZRS_NEXT_TEST_PACKAGE_MANIFEST={manifest}\n')
              env.write(f'NEXT_CANDIDATE_PACKAGES={packages}\n')
          PYCODE
          cp "$TMPDIR/next/origin.json" ci-artifacts/next-engine/next-origin.json
          sha256sum "$TMPDIR/next/ersatztv-channel" > ci-artifacts/next-engine/next-sha256.txt
          echo "ETV_NEXT_FOLDER=$TMPDIR/next" >> "$GITHUB_ENV"
          echo "ERSATZRS_NEXT_TEST_BIN=$TMPDIR/next/ersatztv-channel" >> "$GITHUB_ENV"
          "$CI_PROVISION_RUNTIME" "$TMPDIR/ffmpeg" "$GITHUB_ENV" | tee ci-artifacts/next-engine/ffmpeg-runtime.log
          python3 scripts/e2e/stage-rtsp-test-server.py --output "$TMPDIR/rtsp-server" | tee ci-artifacts/next-engine/rtsp-test-server.log
          echo "ERSATZRS_NEXT_TEST_RTSP_SERVER=$TMPDIR/rtsp-server/mediamtx" >> "$GITHUB_ENV"
      - name: Install hosted runtime libraries
        # The self-hosted runners carry these system packages. Real-engine
        # tests need the oneVPL dispatcher (QSV fallback with no Intel device)
        # and CJK fonts (song title rendering); a stock hosted image has neither.
        if: ${{ (inputs.runner == 'github-hosted' || needs.preflight.outputs.pool == 'github-hosted') }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libvpl2 fonts-noto-cjk
      - name: Next components, real-engine decoding and HTTP EOF
        env:
          NEXT_CASE_SET: ${{ inputs.next_case_set || 'all' }}
        run: |
          filter="$(python3 scripts/ci-teletext-selection.py next-recovery "$NEXT_CASE_SET") & (package(=ersatzrs-infra) | package(=ersatzrs-web)) & kind(lib)"
          # CPU-bound real-time budgets run only on runners with more than four
          # CPUs; elsewhere they are reported as skipped, never relaxed.
          if ! python3 scripts/ci-capacity-proofs.py capable; then
            filter="($filter) & $(python3 scripts/ci-capacity-proofs.py nextest-exclude)"
            python3 scripts/ci-capacity-proofs.py report next | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Capacity proofs skipped::This runner has $(nproc) CPUs; the Next capacity proofs need more than four."
          fi
          # This fixture requires a nonexistent app-data root, unlike the
          # shared report directory used by the rest of this serial suite.
          filter="($filter) & not test(=next_engine::process::runtime_tests::text_subtitle_runtime_tests::fallback_runtime_tests::real_next_background_gap_is_silent_and_returns_to_scheduled_programme)"
          "$CI_NEXTEST" nextest run --archive-file "$CI_NEXTEST_ARCHIVE" --workspace-remap "$GITHUB_WORKSPACE" --profile ci --run-ignored all -E "$filter" 2>&1 | tee ci-artifacts/next-engine/tests.log
          report="target/nextest/ci/junit.xml"
          if [ ! -f "$report" ]; then report="$CARGO_TARGET_DIR/nextest/ci/junit.xml"; fi
          if [ -f "$report" ]; then cp "$report" ci-artifacts/next-engine/components-junit.xml; fi
      - name: Next background gap with fresh application data
        if: ${{ !inputs.next_case_set || inputs.next_case_set == 'all' }}
        run: |
          ERSATZRS_APP_DATA_DIR="$TMPDIR/background-app-data" "$CI_NEXTEST" nextest run --archive-file "$CI_NEXTEST_ARCHIVE" --workspace-remap "$GITHUB_WORKSPACE" --profile ci --run-ignored all --test-threads 1 -E 'package(=ersatzrs-infra) & test(=next_engine::process::runtime_tests::text_subtitle_runtime_tests::fallback_runtime_tests::real_next_background_gap_is_silent_and_returns_to_scheduled_programme)' 2>&1 | tee ci-artifacts/next-engine/background-tests.log
      - name: Next HTTP playback, burned subtitles and preview
        run: |
          smoke_port="$(python3 -c 'import socket; sock = socket.socket(); sock.bind(("127.0.0.1", 0)); print(sock.getsockname()[1]); sock.close()')"
          ERSATZRS_SMOKE_PORT="$smoke_port" "$CI_XTASK" smoke --server-bin "$CI_SMOKE_SERVER" --next --hls-lifecycle --keep-temp 2>&1 | tee ci-artifacts/next-engine/smoke.log
      - name: Next Hybrid playback with converted subtitles
        run: |
          smoke_port="$(python3 -c 'import socket; sock = socket.socket(); sock.bind(("127.0.0.1", 0)); print(sock.getsockname()[1]); sock.close()')"
          ERSATZRS_SMOKE_PORT="$smoke_port" "$CI_XTASK" smoke --server-bin "$CI_SMOKE_SERVER" --next-convert --keep-temp 2>&1 | tee ci-artifacts/next-engine/smoke-convert.log
      - name: Collect Next diagnostics
        if: always()
        run: |
          python3 - <<'PYCODE'
          import os, pathlib, shutil
          destination = pathlib.Path('ci-artifacts/next-engine')
          destination.mkdir(parents=True, exist_ok=True)
          for root in (pathlib.Path('target/nextest'), pathlib.Path(os.environ['CARGO_TARGET_DIR']) / 'nextest'):
              report = root / 'ci/junit.xml'
              if report.is_file():
                  shutil.copyfile(report, destination / 'junit.xml')
          runtime = pathlib.Path(os.environ.get('TMPDIR', os.environ['RUNNER_TEMP']))
          for index, log in enumerate(runtime.glob('ersatzrs-smoke-*/ersatzrs-web-smoke.log')):
              shutil.copyfile(log, destination / f'host-{index}.log')
          for index, log in enumerate(sorted(runtime.glob('.tmp*/session.log'))):
              shutil.copyfile(log, destination / f'runtime-session-{index}.log')
          if data := os.environ.get('ERSATZRS_APP_DATA_DIR'):
              reports = pathlib.Path(data) / 'ffmpeg-reports'
              if reports.is_dir():
                  shutil.copytree(reports, destination / 'ffmpeg-reports', dirs_exist_ok=True)
          background_reports = runtime / 'background-app-data/ffmpeg-reports'
          if background_reports.is_dir():
              shutil.copytree(background_reports, destination / 'background-ffmpeg-reports', dirs_exist_ok=True)
          PYCODE
      - name: Upload Next diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: next-engine-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/next-engine/
          if-no-files-found: warn
          retention-days: 14

  teletext:
    name: Teletext ${{ matrix.level }}
    defaults:
      run:
        shell: bash
    runs-on: ${{ fromJSON((inputs.runner == 'github-hosted' || needs.preflight.outputs.pool == 'github-hosted') && '"ubuntu-24.04"' || '["self-hosted","Linux","X64"]') }}
    needs: [preflight, build]
    if: ${{ always() && !cancelled() && needs.build.result == 'success' && needs.preflight.outputs.lane != 'light' && needs.preflight.outputs.run_teletext != 'false' && !inputs.test_only && !inputs.next_engine_only && (!inputs.browser_only || inputs.browser_only == 'none') }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        level: ${{ fromJSON(inputs.teletext_only == 'all' && '["1.5","2.5"]' || inputs.teletext_only == '2.5' && '["2.5"]' || '["1.5"]') }}
    env:
      CARGO_BUILD_JOBS: "1"
      TELETEXT_LEVEL: ${{ matrix.level }}
      NEXTEST_TEST_THREADS: "4"
      ERSATZRS_FFMPEG_RELEASE_TAG: v2.0.10
    steps:
      - uses: actions/checkout@v7
      - name: Fetch local rust artifact
        id: local_artifact
        if: ${{ (inputs.runner != 'github-hosted' && needs.preflight.outputs.pool != 'github-hosted') }}
        env:
          CI_ARTIFACT_KEY: ${{ needs.build.outputs.rust_cache_key }}
          CI_ARTIFACT_DIGEST: ${{ needs.build.outputs.rust_digest }}
        run: |
          python3 scripts/ci-build-artifacts.py fetch-local --kind rust --archive ci-input/rust.tar.gz \
            --sha "$GITHUB_SHA" --cache-key "$CI_ARTIFACT_KEY" --expected-digest "$CI_ARTIFACT_DIGEST" \
            --output-file "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        if: ${{ !inputs.reuse_artifacts && steps.local_artifact.outputs.hit != 'true' }}
        with:
          name: ${{ needs.build.outputs.rust_artifact }}
          path: ci-input
      - name: Restore verified Rust build
        run: |
          python3 scripts/ci-build-artifacts.py restore --kind rust --archive ci-input/rust.tar.gz \
            --directory "$RUNNER_TEMP/ci-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB" \
            --sha "$GITHUB_SHA" --env-file "$GITHUB_ENV" --require-capability rust-tests
      - name: Prepare isolated runtime and diagnostics
        run: |
          mkdir -p ci-artifacts/teletext-${{ matrix.level }}
          runtime_tmp="$RUNNER_TEMP/teletext-${{ matrix.level }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$runtime_tmp"
          echo "TMPDIR=$runtime_tmp" >> "$GITHUB_ENV"
          git rev-parse HEAD > ci-artifacts/teletext-${{ matrix.level }}/ersatzrs-sha.txt
          rm -f target/nextest/ci/junit.xml "$CARGO_TARGET_DIR/nextest/ci/junit.xml"
      - name: Stage Next and validated FFmpeg runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release/stage-next.py --rid linux-x64 --output "$TMPDIR/next" | tee ci-artifacts/teletext-${{ matrix.level }}/next-runtime.log
          cp "$TMPDIR/next/origin.json" ci-artifacts/teletext-${{ matrix.level }}/next-origin.json
          sha256sum "$TMPDIR/next/ersatztv-channel" > ci-artifacts/teletext-${{ matrix.level }}/next-sha256.txt
          echo "ETV_NEXT_FOLDER=$TMPDIR/next" >> "$GITHUB_ENV"
          echo "ERSATZRS_NEXT_TEST_BIN=$TMPDIR/next/ersatztv-channel" >> "$GITHUB_ENV"
          "$CI_PROVISION_RUNTIME" "$TMPDIR/ffmpeg" "$GITHUB_ENV" | tee ci-artifacts/teletext-${{ matrix.level }}/ffmpeg-runtime.log
          python3 scripts/e2e/stage-rtsp-test-server.py --output "$TMPDIR/rtsp-server" | tee ci-artifacts/teletext-${{ matrix.level }}/rtsp-test-server.log
          echo "ERSATZRS_NEXT_TEST_RTSP_SERVER=$TMPDIR/rtsp-server/mediamtx" >> "$GITHUB_ENV"
      - name: Teletext workspace regressions
        run: |
          "$CI_NEXTEST" nextest run --archive-file "$CI_NEXTEST_ARCHIVE" --workspace-remap "$GITHUB_WORKSPACE" --profile ci -E "$(python3 scripts/ci-teletext-selection.py rust "$TELETEXT_LEVEL")" 2>&1 | tee ci-artifacts/teletext-${{ matrix.level }}/tests.log
      - name: Preserve workspace test timings
        if: always()
        run: |
          report="target/nextest/ci/junit.xml"
          if [ ! -f "$report" ]; then report="$CARGO_TARGET_DIR/nextest/ci/junit.xml"; fi
          if [ -f "$report" ]; then cp "$report" ci-artifacts/teletext-${{ matrix.level }}/workspace-junit.xml; fi
          rm -f target/nextest/ci/junit.xml "$CARGO_TARGET_DIR/nextest/ci/junit.xml"
      - name: Teletext Next runtime regressions
        run: |
          proof_parent="$GITHUB_WORKSPACE/ci-artifacts/teletext-$TELETEXT_LEVEL/source-proofs"
          mkdir -p "$proof_parent"
          export ERSATZRS_NEXT_TELETEXT_PROOF_PARENT="$proof_parent"
          # These real-time fixtures must join before their early cue ends.
          # Concurrent fixture encoders delay that join and invalidate the
          # precondition, even when every delivered cue matches its exact clock.
          "$CI_NEXTEST" nextest run --archive-file "$CI_NEXTEST_ARCHIVE" --workspace-remap "$GITHUB_WORKSPACE" --profile ci --run-ignored all --test-threads 1 --no-tests pass -E "$(python3 scripts/ci-teletext-selection.py rust "$TELETEXT_LEVEL" --next-runtime) & (package(=ersatzrs-infra) | package(=ersatzrs-web)) & kind(lib)" 2>&1 | tee ci-artifacts/teletext-${{ matrix.level }}/next-tests.log
      - name: Collect teletext diagnostics
        if: always()
        run: |
          python3 - <<'PYCODE'
          import os, pathlib, shutil
          destination = pathlib.Path('ci-artifacts/teletext-${{ matrix.level }}')
          destination.mkdir(parents=True, exist_ok=True)
          for root in (pathlib.Path('target/nextest'), pathlib.Path(os.environ['CARGO_TARGET_DIR']) / 'nextest'):
              report = root / 'ci/junit.xml'
              if report.is_file():
                  shutil.copyfile(report, destination / 'junit.xml')
          for index, log in enumerate(pathlib.Path(os.environ.get('TMPDIR', os.environ['RUNNER_TEMP'])).glob('ersatzrs-smoke-*/ersatzrs-web-smoke.log')):
              shutil.copyfile(log, destination / f'host-{index}.log')
          PYCODE
      - name: Upload teletext diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: teletext-${{ matrix.level }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/teletext-${{ matrix.level }}/
          if-no-files-found: warn
          retention-days: 14

  hydration:
    name: Playwright E2E (${{ matrix.suite }}, ${{ matrix.project }})
    runs-on: ${{ fromJSON((inputs.runner == 'github-hosted' || needs.preflight.outputs.pool == 'github-hosted') && '"ubuntu-24.04"' || '["self-hosted","Linux","X64"]') }}
    # Every selected job executes the same verified SSR/WASM build. Browser
    # suites start only after Test passed (or was not selected), so a red
    # Rust run stops before hours of browser time.
    needs: [preflight, build, test]
    if: ${{ always() && !cancelled() && needs.build.result == 'success' && (needs.test.result == 'success' || (needs.test.result == 'skipped' && (needs.preflight.outputs.run_test == 'false' || (inputs.teletext_only && inputs.teletext_only != 'none') || (inputs.browser_only && inputs.browser_only != 'none')))) && needs.preflight.outputs.lane != 'light' && needs.preflight.outputs.run_browser != 'false' && !inputs.test_only && !inputs.next_engine_only && inputs.teletext_only != '1.5-rust' }}
    # Default: general and1.5; experimental2.5 requires teletext_only=2.5/all.
    # One job per selected suite/project. Each suite uses a single worker because
    # it mutates shared application state in its test database (TEST.md): each
    # job runs scripts/e2e/playwright-e2e.sh separately, and that script
    # creates its own temporary database and web host per invocation, so the
    # two projects cannot see each other's state. Splitting by project rather
    # than by `--shard` also keeps every `mode: 'serial'` group whole inside
    # one job.
    #
    # Pull requests (lane `pr`) run Chromium only, and only the suites and
    # specs of the domains they touch; Firefox and the rest run weekly on main
    # (lane `full`) and on manual dispatch.
    #
    # Selected suite/project combinations run serially within this workflow. Both self-hosted
    # runners share one machine, so simultaneous browser suites compete for
    # CPU and memory; an otherwise
    # unexplained Chromium hydration timeout occurred while both overlapped.
    # `max-parallel: 1` removes that contention; `fail-fast: false` still runs
    # the remaining combinations when one fails. It only serializes within one workflow run: a
    # second concurrent run can still overlap. Each project keeps its own port
    # so either runner can take either job.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.preflight.outputs.resume_matrix || inputs.browser_only == 'chromium' && '{"include":[{"suite":"recovery","project":"chromium","port":"18409"}]}' || inputs.browser_only == 'firefox' && '{"include":[{"suite":"recovery","project":"firefox","port":"18410"}]}' || inputs.browser_only == 'both' && '{"include":[{"suite":"recovery","project":"chromium","port":"18409"},{"suite":"recovery","project":"firefox","port":"18410"}]}' || inputs.teletext_only == 'all' && '{"include":[{"suite":"1.5","project":"chromium","port":"18411"},{"suite":"1.5","project":"firefox","port":"18412"},{"suite":"2.5","project":"chromium","port":"18413"},{"suite":"2.5","project":"firefox","port":"18414"}]}' || inputs.teletext_only == '1.5' && '{"include":[{"suite":"1.5","project":"chromium","port":"18411"},{"suite":"1.5","project":"firefox","port":"18412"}]}' || inputs.teletext_only == '2.5' && '{"include":[{"suite":"2.5","project":"chromium","port":"18413"},{"suite":"2.5","project":"firefox","port":"18414"}]}' || needs.preflight.outputs.lane == 'pr' && needs.preflight.outputs.pr_matrix || '{"include":[{"suite":"general","project":"chromium","port":"18409"},{"suite":"general","project":"firefox","port":"18410"},{"suite":"1.5","project":"chromium","port":"18411"},{"suite":"1.5","project":"firefox","port":"18412"}]}') }}
    env:
      # Keep CI independent from the maintainer's live admin server on 8409.
      ERSATZRS_E2E_PORT: ${{ matrix.port }}
      # Keep each project's result JSON and host log separate; both jobs upload
      # from test-results/.
      ERSATZRS_E2E_RESULT_DIR: test-results/${{ matrix.suite }}-${{ matrix.project }}
      ERSATZRS_FFMPEG_RELEASE_TAG: v2.0.10
      # Independently qualified Linux x64 2.0.10 payloads; never infer the
      # expected capability or identity from the Health result under test.
      ERSATZRS_TELETEXT_E2E_ORIGINAL_PTS: "true"
      ERSATZRS_TELETEXT_E2E_FFMPEG_SHA256: bb2f58a41e252d115f878e84340317a17caa440e801a4c54126b60b9dcff8cb4
      ERSATZRS_TELETEXT_E2E_FFPROBE_SHA256: 926fa9331508b8b8b20695fa749ea3fb70a0d17cf0877778420faf711719e403
    steps:
      - uses: actions/checkout@v7
      - name: Fetch local web artifact
        id: local_artifact
        if: ${{ (inputs.runner != 'github-hosted' && needs.preflight.outputs.pool != 'github-hosted') }}
        env:
          CI_ARTIFACT_KEY: ${{ needs.build.outputs.web_cache_key }}
          CI_ARTIFACT_DIGEST: ${{ needs.build.outputs.web_digest }}
        run: |
          python3 scripts/ci-build-artifacts.py fetch-local --kind web --archive ci-input/web.tar.gz \
            --sha "$GITHUB_SHA" --cache-key "$CI_ARTIFACT_KEY" --expected-digest "$CI_ARTIFACT_DIGEST" \
            --output-file "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        if: ${{ !inputs.reuse_artifacts && steps.local_artifact.outputs.hit != 'true' }}
        with:
          name: ${{ needs.build.outputs.web_artifact }}
          path: ci-input
      - name: Restore verified web build
        run: |
          python3 scripts/ci-build-artifacts.py restore --kind web --archive ci-input/web.tar.gz \
            --directory "$RUNNER_TEMP/ci-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB" \
            --sha "$GITHUB_SHA" --env-file "$GITHUB_ENV" --require-capability matched-web
      - name: Hydration lint
        run: '"$CI_XTASK" hydration-lint -p ersatzrs-web'
      - uses: actions/cache@v6
        if: ${{ (inputs.runner == 'github-hosted' || needs.preflight.outputs.pool == 'github-hosted') }}
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Install web E2E tools
        run: npm ci
      - name: Stage pinned playback runtimes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runtime_tmp="$RUNNER_TEMP/browser-runtime-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.suite }}-${{ matrix.project }}"
          mkdir -p "$runtime_tmp"
          python3 scripts/release/stage-next.py --rid linux-x64 --output "$runtime_tmp/next"
          "$CI_PROVISION_RUNTIME" "$runtime_tmp/ffmpeg" "$GITHUB_ENV"
          echo "ETV_NEXT_FOLDER=$runtime_tmp/next" >> "$GITHUB_ENV"
          echo "ERSATZRS_FFMPEG_DIR=$runtime_tmp/ffmpeg" >> "$GITHUB_ENV"
      - name: Playwright E2E suite or bounded fixture recovery
        env:
          BROWSER_ONLY: ${{ inputs.browser_only }}
          BROWSER_PROJECT: ${{ matrix.project }}
          BROWSER_SUITE: ${{ matrix.suite }}
          BROWSER_CASE_SET: ${{ inputs.browser_case_set || 'fixtures' }}
          PR_GENERAL_FILTER: ${{ needs.preflight.outputs.general_filter }}
          PR_TELETEXT_FILTER: ${{ needs.preflight.outputs.teletext_filter }}
          # RUST_LOG also reaches the pinned Next child; preserve its DEBUG diagnostics.
          RUST_LOG: warn,ersatzrs_web=info,ersatzrs_infra::next_engine::diagnostics=debug,ersatztv_channel=debug,ersatztv_core=debug,ersatztv_playout=debug,ffpipeline=debug,ffmpeg=debug
        run: |
          export ErsatzRS_FFMPEG__PATH="$FFMPEG_PATH"
          export ErsatzRS_FFPROBE__PATH="$FFPROBE_PATH"
          ffmpeg_bin_dir="$(dirname "$FFMPEG_PATH")"
          export PATH="$ffmpeg_bin_dir:$PATH"
          playwright_args=(--project="$BROWSER_PROJECT")
          if [[ -n "$BROWSER_ONLY" && "$BROWSER_ONLY" != 'none' ]]; then
            recovery_args="$(python3 scripts/ci-teletext-selection.py browser-recovery "$BROWSER_CASE_SET")"
            mapfile -t selected_cases <<< "$recovery_args"
            playwright_args+=("${selected_cases[@]}")
          elif [[ "$BROWSER_SUITE" == 'general' && -n "$PR_GENERAL_FILTER" ]]; then
            # A `pr` lane run: only the specs of the touched admin areas plus
            # the hydration smoke set (scripts/ci-domains.py).
            playwright_args+=("$PR_GENERAL_FILTER")
          elif [[ "$BROWSER_SUITE" == '1.5' && -n "$PR_TELETEXT_FILTER" ]]; then
            playwright_args+=("$PR_TELETEXT_FILTER")
          else
            playwright_args+=("$(python3 scripts/ci-teletext-selection.py browser "$BROWSER_SUITE")")
          fi
          # CPU-bound real-time budgets run only on runners with more than four
          # CPUs; elsewhere they are reported as skipped, never relaxed.
          if [[ -z "$BROWSER_ONLY" || "$BROWSER_ONLY" == 'none' ]] && ! python3 scripts/ci-capacity-proofs.py capable; then
            playwright_args+=(--grep-invert "$(python3 scripts/ci-capacity-proofs.py browser-grep)")
            python3 scripts/ci-capacity-proofs.py report browser | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Capacity proofs skipped::This runner has $(nproc) CPUs; the browser capacity proofs need more than four."
          fi
          # Both self-hosted runners share one machine: never run two browser
          # suites at once (it made results unreliable and their fixed ports
          # collide), also across workflow runs.
          python3 scripts/e2e/host-lock.py -- scripts/e2e/playwright-e2e.sh "${playwright_args[@]}"
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-${{ matrix.suite }}-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  deny:
    name: Cargo deny
    needs: [preflight, fmt]
    if: needs.fmt.result == 'success'
    runs-on: ${{ fromJSON((inputs.runner == 'github-hosted' || needs.preflight.outputs.pool == 'github-hosted') && '"ubuntu-24.04"' || '["self-hosted","Linux"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install cargo-deny
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1 || [ "$(cargo deny --version)" != "cargo-deny 0.19.6" ]; then
            cargo install cargo-deny --version 0.19.6 --locked
          fi
      - name: Cargo deny
        run: cargo deny check

  commitlint:
    name: Commit lint
    needs: [preflight, fmt]
    runs-on: ${{ fromJSON((needs.preflight.outputs.lane == 'light' || inputs.runner == 'github-hosted' || needs.preflight.outputs.pool == 'github-hosted') && '"ubuntu-24.04"' || '["self-hosted","Linux"]') }}
    if: ${{ !inputs.audit_only && github.event_name != 'schedule' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve commit lint range
        id: commit_range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "base_sha=$PULL_REQUEST_BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "head_sha=$PULL_REQUEST_HEAD_SHA" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "push" ]; then
            head_sha=$(git rev-parse HEAD)
            base_sha="$PUSH_BASE_SHA"
            if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
              git fetch --no-tags origin main
              base_sha=$(git merge-base origin/main HEAD)
            fi
            echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
            echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags origin main
            head_sha=$(git rev-parse HEAD)
            base_sha=$(git merge-base origin/main HEAD)
            if [ "$base_sha" = "$head_sha" ]; then
              base_sha=$(git rev-parse HEAD^)
            fi
            echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
            echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          fi
      # Only needed on the GitHub-hosted fallback path: self-hosted runs
      # already have a warm ~/.npm cache from the shared, persistent $HOME.
      - uses: actions/cache@v6
        if: ${{ (needs.preflight.outputs.lane == 'light' || inputs.runner == 'github-hosted' || needs.preflight.outputs.pool == 'github-hosted') }}
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Install commit lint dependencies
        run: npm ci
      - name: Lint pull request commits
        env:
          BASE_SHA: ${{ steps.commit_range.outputs.base_sha }}
          HEAD_SHA: ${{ steps.commit_range.outputs.head_sha }}
        run: ./node_modules/.bin/commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  docs:
    name: Documentation links
    needs: preflight
    if: ${{ !inputs.audit_only && needs.preflight.outputs.skip != 'true' }}
    runs-on: ${{ fromJSON((needs.preflight.outputs.lane == 'light' || inputs.runner == 'github-hosted' || needs.preflight.outputs.pool == 'github-hosted') && '"ubuntu-24.04"' || '["self-hosted","Linux"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Check Markdown files exist
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f STYLE.md
          test -f ARCHITECTURE.md
          test -f PORTING.md
          test -f docs/README.md
      - name: Check CI suite ownership and artifact integrity
        run: |
          python3 scripts/ci-teletext-selection_test.py
          python3 scripts/ci-domains_test.py
          python3 scripts/ci-browser-evidence_test.py
          python3 scripts/e2e/host-lock_test.py
          python3 scripts/ci-capacity-proofs_test.py
          python3 scripts/ci-build-artifacts_test.py
          python3 scripts/e2e/playwright-e2e_test.py
          python3 scripts/release/test-docker-recovery.py
      - name: Check CI trigger contract
        run: |
          if grep -Eq '^[[:space:]]*types:.*[[:space:],]labeled([][[:space:],]|$)' .github/workflows/ci.yml; then
            echo "Pull-request labels must not trigger full CI."
            exit 1
          fi
          if grep -Eq 'github\.event\.pull_request\.label[s]' .github/workflows/ci.yml; then
            echo "Pull-request labels must not select a CI runner."
            exit 1
          fi

  # The single required status check for `main` (branch protection). It
  # aggregates every gate job so the protection rule never has to track job or
  # matrix names. It runs even after a failure or cancellation (`always()`):
  # GitHub treats a skipped required check as passing, so this job must
  # report a real failure instead of being skipped. Focused manual recovery
  # modes do not establish full CI and therefore do not run it.
  ci_ok:
    name: CI ok
    needs: [preflight, fmt, clippy, build, test, next_engine, teletext, hydration, deny, commitlint, docs]
    if: ${{ always() && !inputs.audit_only && !inputs.test_only && !inputs.next_engine_only && (!inputs.teletext_only || inputs.teletext_only == 'none') && (!inputs.browser_only || inputs.browser_only == 'none') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every gate job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          DRAFT_PR: ${{ github.event.pull_request.draft }}
          RESUME_RUN_ID: ${{ inputs.resume_run }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys

          needs = json.loads(os.environ["NEEDS"])
          results = {job: data["result"] for job, data in needs.items()}
          for job, result in sorted(results.items()):
              print(f"{job}: {result}")
          if results.get("preflight") != "success":
              sys.exit("::error::Preflight did not succeed")
          bad = [job for job, result in results.items() if result not in ("success", "skipped")]
          if bad:
              sys.exit(f"::error::Gate jobs did not pass: {', '.join(sorted(bad))}")
          outputs = needs["preflight"]["outputs"]
          lane = outputs.get("lane")
          if lane not in ("skip", "light", "pr", "full"):
              sys.exit("::error::Preflight did not declare a valid lane")
          if (outputs.get("skip") == "true") != (lane == "skip"):
              sys.exit("::error::Preflight skip and lane disagree")
          if lane == "skip":
              print("Preflight reused qualified complete proof; no fresh behavioral execution.")
              sys.exit(0)
          # The weekly run has no new commit range to lint.
          optional = {"commitlint"} if os.environ["EVENT_NAME"] == "schedule" else set()
          raw_proof = outputs.get("resumed_checks", "")
          if os.environ.get("RESUME_RUN_ID") or raw_proof:
              proof = json.loads(raw_proof or "null")
              if (lane != "full" or os.environ["EVENT_NAME"] != "workflow_dispatch"
                      or not isinstance(proof, dict)
                      or str(proof.get("run_id")) != os.environ.get("RESUME_RUN_ID")
                      or proof.get("execution_sha") != os.environ.get("GITHUB_SHA")
                      or not re.fullmatch(r"[0-9a-f]{40}", proof.get("execution_sha", ""))
                      or not re.fullmatch(r"[0-9a-f]{40}", proof.get("source_sha", ""))):
                  sys.exit("::error::Invalid completed-check source binding")
              reused = proof.get("jobs", {})
              if not isinstance(reused, dict) or set(reused) - {"clippy", "test", "next_engine", "teletext", "hydration"}:
                  sys.exit("::error::Invalid completed-check scope")
              ids = []
              for job, values in reused.items():
                  if (not isinstance(values, list) or len(values) != (4 if job == "hydration" else 1)
                          or any(type(value) is not int or value <= 0 for value in values)):
                      sys.exit("::error::Missing successful-job provenance")
                  ids.extend(values)
              if len(ids) != len(set(ids)):
                  sys.exit("::error::Duplicate successful-job provenance")
              browser_passed, browser_pending = proof.get("browser_passed", []), proof.get("browser_pending", [])
              expected = [("general", "chromium", "18409"), ("general", "firefox", "18410"),
                          ("1.5", "chromium", "18411"), ("1.5", "firefox", "18412")]
              pending = [(row["suite"], row["project"], row["port"]) for row in browser_pending]
              selected = json.loads(outputs.get("resume_matrix", "null"))
              expected_matrix = browser_pending or [{"suite":"general","project":"chromium","port":"18409"}]
              if (len(browser_passed) + len(pending) != 4 or len(set(pending)) != len(pending)
                      or set(pending) - set(expected) or len(set(browser_passed)) != len(browser_passed)
                      or any(type(value) is not int or value <= 0 for value in browser_passed)
                      or (("hydration" in reused) != (not pending))
                      or selected != {"include": expected_matrix}
                      or ("hydration" in reused and set(reused["hydration"]) != set(browser_passed))):
                  sys.exit("::error::Incomplete browser recovery scope")
              replay_filter = proof.get('general_filter', '')
              if replay_filter:
                  cases = proof.get('browser_case_proof', [])
                  if (outputs.get('general_filter') != replay_filter or len(cases) != 2
                          or {case['project'] for case in cases} != {'chromium', 'firefox'}
                          or any(case['listed'] != case['passed'] + case['failed'] + case['skipped']
                                 or not re.fullmatch(r'[0-9a-f]{64}', case['log_sha256']) for case in cases)):
                      sys.exit('::error::Incomplete browser case provenance')
              optional |= set(reused)
              print("Verified reused check provenance: " + json.dumps(proof, sort_keys=True))
          # Jobs a lane leaves out on purpose (see Preflight).
          optional |= {
              "light": {"build", "test", "next_engine", "teletext", "hydration"},
          }.get(lane, set())
          if lane == "pr":
              flags = ("run_test", "run_next", "run_teletext", "run_browser", "build_rust", "build_web", "build_smoke")
              if any(outputs.get(key) not in ("true", "false") for key in flags):
                  sys.exit("::error::Missing or invalid PR selection flags")
              selected = {key: outputs[key] == "true" for key in flags}
              if (selected["build_rust"] != any(selected[key] for key in ("run_test", "run_next", "run_teletext"))
                  or selected["build_web"] != selected["run_browser"]
                  or selected["build_smoke"] != selected["run_next"]
                  or not (selected["build_rust"] or selected["build_web"])):
                  sys.exit("::error::PR consumers and build products disagree")
              omitted = {job for job, key in (("test", "run_test"), ("next_engine", "run_next"),
                         ("teletext", "run_teletext"), ("hydration", "run_browser")) if not selected[key]}
              # An explicit required set must account for every current gate.
              # Neither missing output nor a broad list of skips grants a pass.
              if (json.loads(outputs.get("deselected", "null")) != sorted(omitted)
                  or json.loads(outputs.get("required_jobs", "null")) != sorted(set(needs) - omitted)):
                  sys.exit("::error::PR required jobs disagree with selected consumers")
              optional |= omitted
          missing = [job for job, result in results.items()
                     if result != "success" and job not in optional]
          if missing:
              sys.exit(f"::error::Gate jobs were skipped: {', '.join(sorted(missing))}")
          if lane == "light" and os.environ.get("DRAFT_PR") == "true":
              # A passing check here would let the head SHA merge while the
              # full run after `ready_for_review` is still in progress.
              sys.exit("::error::Draft pull request: the fast lane passed. Mark it ready for review to run the full PR lane.")
          print(f"All gate jobs passed ({lane} lane).")
          PY
      - name: Record the tested tree
        if: ${{ github.event_name == 'pull_request' && needs.preflight.outputs.tree != '' }}
        env:
          TREE: ${{ needs.preflight.outputs.tree }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: printf '%s\n%s\n' "$TREE" "$RUN_URL" > ci-tree.txt
      # Read by Preflight on the push to main: the merged tree passed the PR
      # lane; main runs small checks and the weekly run covers the rest.
      - uses: actions/upload-artifact@v7
        if: ${{ github.event_name == 'pull_request' && needs.preflight.outputs.tree != '' }}
        with:
          name: ci-tree-${{ needs.preflight.outputs.tree }}
          path: ci-tree.txt
          retention-days: 14
      - name: Record the fully tested tree
        if: ${{ needs.preflight.outputs.lane == 'full' && needs.preflight.outputs.tree != '' }}
        env:
          TREE: ${{ needs.preflight.outputs.tree }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESUMED_CHECKS: ${{ needs.preflight.outputs.resumed_checks }}
        run: printf '%s\n%s\n%s\n' "$TREE" "$RUN_URL" "$RESUMED_CHECKS" > ci-full.txt
      # Read by Preflight on the weekly run: skip it when main's tree already
      # passed a full run.
      - uses: actions/upload-artifact@v7
        if: ${{ needs.preflight.outputs.lane == 'full' && needs.preflight.outputs.tree != '' }}
        with:
          name: ci-full-${{ needs.preflight.outputs.tree }}
          path: ci-full.txt
          retention-days: 14
