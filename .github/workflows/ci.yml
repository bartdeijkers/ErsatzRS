name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fmt:
    name: Format
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Stylance CLI
        run: cargo install stylance-cli --version 0.8.0 --locked
      - name: Clippy (default / SQLite)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (MySQL feature)
        run: cargo clippy --workspace --all-targets --features mysql -- -D warnings

  test:
    name: Test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Stylance CLI
        run: cargo install stylance-cli --version 0.8.0 --locked
      - name: Test (all features)
        run: cargo test --workspace --all-features

  platforms:
    # Build the workspace for every ErsatzTV-parity RID and run the test
    # suite on the natively-built cells. Cross cells skip tests because
    # qemu emulation is unreliable for sqlx/tokio workloads. Linux x64
    # is duplicated with the self-hosted `test` job above on purpose, so
    # this matrix is a single per-RID parity report.
    name: Build (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
            test: true
          - rid: linux-arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
            test: false
          - rid: linux-arm
            runner: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            cross: true
            test: false
          - rid: osx-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            cross: false
            test: true
          - rid: osx-x64
            runner: macos-13
            target: x86_64-apple-darwin
            cross: false
            test: true
          - rid: win-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
            test: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rid }}
      - name: Install stylance-cli
        if: ${{ !matrix.cross }}
        run: cargo install stylance-cli --version 0.8.0 --locked
      - name: Install cross
        if: ${{ matrix.cross }}
        run: cargo install cross --locked
      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        run: cargo build --workspace --target ${{ matrix.target }}
      - name: Build (cross)
        if: ${{ matrix.cross }}
        run: cross build --workspace --target ${{ matrix.target }}
      - name: Test
        if: ${{ matrix.test }}
        run: cargo test --workspace --all-features --target ${{ matrix.target }}

  deny:
    name: Cargo deny
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2

  commitlint:
    name: Commit lint
    runs-on: self-hosted
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  docs:
    name: Documentation links
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - name: Check Markdown files exist
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f STYLE.md
          test -f ARCHITECTURE.md
          test -f PORTING.md
          test -f docs/README.md

  docker:
    name: Docker image (amd64)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 image
        uses: docker/bake-action@v5
        with:
          files: docker-bake.hcl
          targets: docker-check
