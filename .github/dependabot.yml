version: 2
multi-ecosystem-groups:
  dependency-rollup:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: cargo
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependency-rollup
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependency-rollup
    ignore:
      - dependency-name: dtolnay/rust-toolchain
