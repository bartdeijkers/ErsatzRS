name: Porting task
description: Track porting work from ErsatzTV to ErsatzRS.
title: "feat: port "
labels: ["porting"]
body:
  - type: input
    id: ersatztv-source
    attributes:
      label: ErsatzTV source
      description: Path to the source file or directory under `$ERSATZTV_SRC`.
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: ErsatzRS target
      description: Planned crate and module.
    validations:
      required: true
  - type: dropdown
    id: adr
    attributes:
      label: ADR required?
      options:
        - "No"
        - "Yes"
        - "Unknown"
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Expected tests
      description: Include snapshot tests when generated output is involved.
