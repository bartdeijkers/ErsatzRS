[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints.rust]
unsafe_code = "forbid"

# xtask is a developer tool, not shipped code. Keep clippy expectations modest
# so we don't spend cycles polishing pedantic lints that don't ship.
[lints.clippy]
all = "warn"

[dependencies]
anyhow = "1"
# `clippy-ledger` subcommand: today's date for the regenerated ledger snapshot.
chrono = "0.4"
ersatzrs-addon-contract = { version = "0.2.0", path = "../crates/ersatzrs-addon-contract" }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
# `clippy-ledger` subcommand: scans #[allow(clippy::...)] attributes.
regex = "1"
# `progress` subcommand: derived SQLite index over docs/progress/. rusqlite
# `bundled` keeps SQLite self-contained (no system dep) on every dev platform.
# These are dev-only tooling deps and never ship in a release binary.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "3", features = ["full", "visit", "extra-traits"] }
toml = "1.1"
walkdir = "2"
